<!DOCTYPE html>
<!-- V28 -->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伊的台語號做啥？ (V28)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --bg-color: #f4f7f6;
            --panel-bg: #fdfdfd;
        }
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.6;
            color: #333;
            /* 修改為滿版，左右不留邊 */
            max-width: 100%;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            box-sizing: border-box;
            
            /* 禁止選取文字 (全域預設) */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* 允許輸入框與結果區域可以正常選取與輸入，並強制開啟選取功能 */
        input, select, textarea, #result {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 5px;
        }
        .author-subtitle {
            text-align: center;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .header-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .btn-toggle {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .btn-toggle:hover {
            background-color: #1a252f;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            /* 讓容器也能隨滿版寬度調整 */
            width: 100%;
            max-width: 1200px; /* 設定一個較大的上限，避免超寬螢幕時比例過扁 */
            margin: 0 auto;
            box-sizing: border-box;
        }
        
        /* 自訂設定視窗 (取代彈出視窗) */
        .settings-panel {
            display: none; /* 預設隱藏 */
            background-color: var(--panel-bg);
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ecf0f1;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .settings-header h3 {
            margin: 0;
            color: var(--primary-color);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #34495e;
            font-size: 14px;
        }
        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd1d9;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .settings-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
        }
        .settings-btns button {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-clear { background-color: var(--danger-color); color: white; margin-right: 10px; }
        .btn-clear:hover { background-color: #c0392b; }
        .btn-save { background-color: var(--secondary-color); color: white; }
        .btn-save:hover { background-color: #2980b9; }
        .btn-link {
            display: inline-block;
            background-color: #f39c12;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-link:hover { background-color: #d68910; }

        /* 主要搜尋區塊 */
        .search-area {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e6ed;
            margin-bottom: 20px;
        }
        .search-area label {
            font-size: 16px;
            color: #2c3e50;
        }
        .search-area input {
            border: 2px solid #bdc3c7;
            padding: 14px;
            font-size: 18px;
        }
        .search-area input:focus {
            border-color: var(--secondary-color);
            outline: none;
        }
        .btn-submit {
            background-color: var(--success-color);
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-submit:hover { background-color: #219653; }
        .btn-submit:disabled { background-color: #95a5a6; cursor: not-allowed; }

        .keyword-input-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }
        .keyword-input-row input {
            flex: 1;
            min-width: 0;
        }
        .mic-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.3s, transform 0.15s;
        }
        .mic-btn:hover { background-color: #2980b9; }
        .mic-btn:active { transform: scale(0.96); }
        .mic-btn.recording {
            background-color: var(--danger-color);
            animation: mic-pulse 1.1s infinite;
        }
        @keyframes mic-pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.6); }
            70% { box-shadow: 0 0 0 14px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        /* 直式螢幕（手機直拿等 portrait 顯示環境）版面修正：
           將語音輸入鈕移到文字輸入框與「開始篩選台語詞彙」鈕之間，
           讓文字輸入框可獨佔一整列寬度，避免輸入框過小。
           僅影響直式螢幕，橫式／桌機畫面不受影響。 */
        @media (orientation: portrait) {
            .keyword-input-row {
                flex-direction: column;
            }
            .keyword-input-row input {
                width: 100%;
            }
            .mic-btn {
                width: 100%;
                padding: 12px 18px;
                margin-top: 10px;
            }
        }
        
        .loading {
            text-align: center;
            color: #e67e22;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }

        /* 結果顯示區塊 */
        .result-wrapper {
            position: relative;
            margin-top: 30px;
            display: none;
        }
        #result {
            padding: 50px 25px 25px 20px; /* 將 top padding 增加到 50px，避免覆蓋文字 */
            background-color: #e8f6f3;
            border-left: 6px solid #1abc9c;
            white-space: pre-wrap;
            font-size: 16px;
            border-radius: 4px;
            line-height: 1.8;
            overflow-x: auto;
        }
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #ffffff;
            border: 1px solid #1abc9c;
            color: #1abc9c;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background-color: #1abc9c;
            color: white;
        }
        .error-msg {
            color: var(--danger-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <button class="btn-toggle" onclick="toggleSettings()">⚙️ API 系統設定</button>
    </div>

    <h1>伊的台語號做啥？ (V28)</h1>
    <p class="author-subtitle">台中明道中學 詹宗龍 製作</p>
    <p class="subtitle">輸入情境，由 AI 為你挑選 10 個精準詞彙並提供詳細補充解析</p>

    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h3>⚙️ API 系統設定</h3>
        </div>
        
        <div class="form-group">
            <label for="apiKey">Gemini API Key：</label>
            <input type="password" id="apiKey" placeholder="請輸入 AIzaSy...">
        </div>

        <div class="form-group">
            <label for="baseUrl">API 基底 URL (Base URL)：</label>
            <input type="text" id="baseUrl" placeholder="https://generativelanguage.googleapis.com/v1beta">
        </div>

        <div class="form-group">
            <label for="modelSelect">選擇 AI 模型：</label>
            <select id="modelSelect">
                <option value="gemini-3-flash">gemini-3-flash (推薦，最新版)</option>
                <option value="gemini-2.5-flash">gemini-2.5-flash</option>
                <option value="gemini-2.0-flash">gemini-2.0-flash</option>
                <option value="gemini-1.5-flash">gemini-1.5-flash</option>
                <option value="gemini-1.5-pro">gemini-1.5-pro</option>
            </select>
        </div>

        <div id="settingsStatus" style="display:none; text-align:center; font-weight:bold; margin-bottom:10px; font-size:14px;"></div>

        <div class="settings-footer">
            <a href="https://sites.google.com/ms.mingdao.edu.tw/tsiam/1/%E5%85%8D%E8%B2%BB%E7%94%B3%E8%AB%8Bapi" target="_blank" class="btn-link">💡 免費申請API</a>
            <div class="settings-btns">
                <button class="btn-clear" onclick="clearSettings()">清除設定</button>
                <button class="btn-save" onclick="saveSettings()">儲存並收合</button>
            </div>
        </div>
    </div>

    <div class="search-area">
        <div class="form-group" style="margin-bottom:0;">
            <label for="keyword">🔍 請輸入情境關鍵詞：</label>
            <div class="keyword-input-row">
                <input type="text" id="keyword" placeholder="例如：虛有其表、生氣、吝嗇、胡說八道...">
                <button type="button" id="micBtn" class="mic-btn" onclick="toggleVoiceInput()" title="語音輸入">🎤 語音輸入</button>
            </div>
        </div>
    </div>

    <button id="submitBtn" class="btn-submit" onclick="generateContent()">開始篩選台語詞彙</button>
    <div id="loading" class="loading">⏳ AI 正在分析比對，請稍候...</div>

    <div class="result-wrapper" id="resultWrapper">
        <button id="copyBtn" class="copy-btn" onclick="copyResult()">📋 複製</button>
        <div id="result"></div>
    </div>
</div>

<script>
    // --- 禁止右鍵選單（輸入框、文字框、篩選結果區除外）---
    document.addEventListener('contextmenu', function(e) {
        const target = e.target;
        const isInput = target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT';
        const isOutput = target.closest('#result') || target.closest('#resultWrapper');

        if (!isInput && !isOutput) {
            e.preventDefault();
        }
    });

    function _load(u) {
        return (async () => {
            const res = await fetch(u);
            if (!res.ok) throw new Error(u);
            const b64 = (await res.text()).trim();
            return new TextDecoder('utf-8').decode(
                Uint8Array.from(atob(b64), c => c.charCodeAt(0))
            );
        })();
    }
    let _r1 = null, _r2 = null;
    const _r1p = _load('res1.dat').then(v => _r1 = v);
    const _r2p = _load('res2.dat').then(v => _r2 = v);

    // 預設設定值
    const DEFAULT_BASE_URL = 'https://generativelanguage.googleapis.com/v1beta';
    const DEFAULT_MODEL = 'gemini-3-flash';
    // 自動搜尋可用模型時的優先順序
    const MODEL_PRIORITY = ['gemini-3-flash', 'gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash', 'gemini-1.5-pro'];

    // 查詢帳號目前可用的模型。優先使用「使用者手動選擇」的模型（若該帳號支援）；
    // 若使用者選的模型不可用，才依 MODEL_PRIORITY 順序挑一個可用的頂替。
    async function findBestAvailableModel(cleanBaseUrl, apiKey, preferredModel) {
        const response = await fetch(`${cleanBaseUrl}/models?key=${apiKey}`);
        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error?.message || '無法取得可用模型清單。');
        }
        const data = await response.json();
        const availableNames = (data.models || [])
            .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
            .map(m => (m.name || '').replace(/^models\//, ''));

        if (preferredModel && availableNames.includes(preferredModel)) return preferredModel;

        for (const preferred of MODEL_PRIORITY) {
            if (availableNames.includes(preferred)) return preferred;
        }
        if (availableNames.length > 0) return availableNames[0];
        throw new Error('此 API Key 目前沒有任何可用的模型。');
    }

    // --- 語音輸入（語音轉文字）邏輯 ---
    let voiceRecognition = null;
    let isVoiceRecording = false;

    function createSpeechRecognition() {
        const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognitionClass) return null;
        const r = new SpeechRecognitionClass();
        r.lang = 'zh-TW';
        r.continuous = true;
        r.interimResults = true;
        return r;
    }

    function setMicUIRecording(recording) {
        const micBtn = document.getElementById('micBtn');
        if (!micBtn) return;
        if (recording) {
            micBtn.classList.add('recording');
            micBtn.textContent = '🔴 錄音中（點擊結束）';
        } else {
            micBtn.classList.remove('recording');
            micBtn.textContent = '🎤 語音輸入';
        }
    }

    function toggleVoiceInput() {
        const keywordInput = document.getElementById('keyword');

        if (!isVoiceRecording) {
            // --- 開始語音輸入 ---
            voiceRecognition = createSpeechRecognition();
            if (!voiceRecognition) {
                alert('抱歉，您的瀏覽器不支援語音輸入功能，建議改用電腦版 Google Chrome 瀏覽器。');
                return;
            }

            isVoiceRecording = true;
            setMicUIRecording(true);
            keywordInput.value = '';
            keywordInput.focus();

            voiceRecognition.onresult = function(event) {
                let transcript = '';
                for (let i = 0; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                keywordInput.value = transcript;
            };

            voiceRecognition.onerror = function(event) {
                console.error('語音辨識發生錯誤：', event.error);
            };

            voiceRecognition.onend = function() {
                // 若瀏覽器自動中斷錄音（非使用者點擊結束），仍需還原按鈕外觀
                if (isVoiceRecording) {
                    isVoiceRecording = false;
                    setMicUIRecording(false);
                }
            };

            try {
                voiceRecognition.start();
            } catch (err) {
                console.error('無法啟動語音辨識：', err);
                isVoiceRecording = false;
                setMicUIRecording(false);
            }

        } else {
            // --- 使用者再次觸發，結束語音輸入 ---
            isVoiceRecording = false;
            setMicUIRecording(false);

            if (voiceRecognition) {
                voiceRecognition.stop();
            }

            // 稍微延遲，確保最後一段語音辨識結果已寫入文字框，
            // 再同步執行「開始篩選台語詞彙」功能
            setTimeout(function() {
                generateContent();
            }, 300);
        }
    }

    // 頁面載入時初始化設定
    window.onload = function() {
        loadSettingsToUI();
        
        // 綁定 Enter 鍵觸發搜尋
        const keywordInput = document.getElementById('keyword');
        keywordInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                generateContent();
            }
        });
    };

    // --- 設定區塊邏輯 ---
    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
        } else {
            loadSettingsToUI();
            panel.style.display = 'block';
        }
    }

    function loadSettingsToUI() {
        document.getElementById('apiKey').value = localStorage.getItem('taigi_apiKey') || '';
        document.getElementById('baseUrl').value = localStorage.getItem('taigi_baseUrl') || DEFAULT_BASE_URL;
        document.getElementById('modelSelect').value = localStorage.getItem('taigi_model') || DEFAULT_MODEL;
    }

    function saveSettings() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const baseUrl = document.getElementById('baseUrl').value.trim() || DEFAULT_BASE_URL;
        const model = document.getElementById('modelSelect').value;
        const statusDiv = document.getElementById('settingsStatus');

        localStorage.setItem('taigi_apiKey', apiKey);
        localStorage.setItem('taigi_baseUrl', baseUrl);
        localStorage.setItem('taigi_model', model);

        if (!apiKey) {
            statusDiv.textContent = '⚠️ 提醒：API Key 尚未輸入！需輸入才能進行查詢。';
            statusDiv.style.color = '#e74c3c';
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
                toggleSettings(); // 延遲收合
            }, 2500);
        } else {
            statusDiv.textContent = '✅ 設定已儲存！';
            statusDiv.style.color = '#27ae60';
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
                toggleSettings(); // 儲存後收合面板
            }, 1000);
        }
    }

    function clearSettings() {
        document.getElementById('apiKey').value = '';
        document.getElementById('baseUrl').value = DEFAULT_BASE_URL;
        document.getElementById('modelSelect').value = DEFAULT_MODEL;
        
        localStorage.removeItem('taigi_apiKey');
        localStorage.removeItem('taigi_baseUrl');
        localStorage.removeItem('taigi_model');

        const statusDiv = document.getElementById('settingsStatus');
        statusDiv.textContent = '🗑️ API Key 與設定已清除！';
        statusDiv.style.color = '#e74c3c';
        statusDiv.style.display = 'block';
        
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 2000);
    }

    // --- 複製結果邏輯 ---
    function copyResult() {
        const resultText = document.getElementById('result').innerText;
        if (!resultText) return;

        navigator.clipboard.writeText(resultText).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = '✅ 已複製！';
            copyBtn.style.backgroundColor = '#1abc9c';
            copyBtn.style.color = 'white';
            
            setTimeout(() => {
                copyBtn.innerHTML = originalText;
                copyBtn.style.backgroundColor = '#ffffff';
                copyBtn.style.color = '#1abc9c';
            }, 2000);
        }).catch(err => {
            // 如果無法使用 clipboard API，直接顯示在結果區塊的錯誤訊息中
            alert('複製失敗，請嘗試手動複製。');
        });
    }

    // --- AI 生成邏輯 ---
    async function generateContent() {
        // 先嘗試從 localStorage 抓取，如果沒有再看目前輸入框是否有值
        let apiKey = localStorage.getItem('taigi_apiKey') || document.getElementById('apiKey').value.trim();
        const baseUrl = localStorage.getItem('taigi_baseUrl') || document.getElementById('baseUrl').value.trim() || DEFAULT_BASE_URL;
        const fallbackModel = localStorage.getItem('taigi_model') || document.getElementById('modelSelect').value || DEFAULT_MODEL;
        const keyword = document.getElementById('keyword').value.trim();
        
        const resultWrapper = document.getElementById('resultWrapper');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');

        // UI 狀態更新預設
        resultWrapper.style.display = 'none';
        resultDiv.innerHTML = '';

        // 檢查防呆 (改為直接在結果區塊顯示，不使用 alert)
        if (!apiKey) {
            resultDiv.innerHTML = '<span class="error-msg">⚠️ 尚未設定 API Key！請點擊上方「⚙️ API 系統設定」輸入您的 Key。</span>';
            resultWrapper.style.display = 'block';
            document.getElementById('settingsPanel').style.display = 'block';
            return;
        }
        if (!keyword) {
            resultDiv.innerHTML = '<span class="error-msg">⚠️ 請輸入情境關鍵詞！</span>';
            resultWrapper.style.display = 'block';
            document.getElementById('keyword').focus();
            return;
        }
        if (!_r1 || !_r2) {
            loadingDiv.style.display = 'block';
            loadingDiv.textContent = '⏳ 系統初始化中，請稍候...';
            try {
                await Promise.all([_r1p, _r2p]);
            } catch (e) {
                loadingDiv.style.display = 'none';
                resultDiv.innerHTML = '<span class="error-msg">⚠️ 系統資源載入失敗，請重新整理頁面再試一次。</span>';
                resultWrapper.style.display = 'block';
                return;
            }
        }

        // 正式開始載入
        loadingDiv.style.display = 'block';
        loadingDiv.textContent = '🔍 正在搜尋可用模型...';
        submitBtn.disabled = true;

        // 組合 API 網址前綴
        const cleanBaseUrl = baseUrl.replace(/\/$/, "");

        // 自動搜尋帳號目前可用的模型，找不到就退回設定選單裡的模型
        let model = fallbackModel;
        try {
            model = await findBestAvailableModel(cleanBaseUrl, apiKey, fallbackModel);
        } catch (e) {
            model = fallbackModel;
        }

        loadingDiv.textContent = '⏳ AI 正在分析比對，請稍候...';

        const promptText = _r2
            .split('%%KEYWORD%%').join(keyword)
            .split('%%R1%%').join(_r1);

        // 組合 API 網址
        const apiUrl = `${cleanBaseUrl}/models/${model}:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: promptText }]
                    }]
                })
            });

            // 處理 API 回傳錯誤
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'API 請求失敗，請確認 API 設定。');
            }

            // 取得生成結果
            const data = await response.json();
            let generatedText = data.candidates[0].content.parts[0].text;
            
            // 簡易 Markdown 解析 (粗體與換行)
            generatedText = generatedText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            generatedText = generatedText.replace(/\*(.*?)\*/g, '<em>$1</em>');
            generatedText = generatedText.replace(/\n/g, '<br>');
            
            resultDiv.innerHTML = generatedText;
            resultWrapper.style.display = 'block';

        } catch (error) {
            resultDiv.innerHTML = `<span class="error-msg">發生錯誤：${error.message}<br><br>👉 解決建議：<br>1. 點擊上方「⚙️ API 系統設定」，確認 API Key 是否正確。<br>2. 嘗試切換其他 AI 模型。<br>3. 確認 API Base URL 格式是否正確。</span>`;
            resultWrapper.style.display = 'block';
        } finally {
            // 恢復 UI 狀態
            loadingDiv.style.display = 'none';
            submitBtn.disabled = false;
        }
    }
</script>
</body>
</html>
