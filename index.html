𓆜𓆝𓆞𓆟𓆞𓆜𓆝𓆞𓆟𓆝𓆞𓆜𓆝𓆟𓆜𓆝𓆞𓆟
【資料庫2：教育部新增詞條 202504】
序號	詞語	音讀	義項數	釋義與例句

1.	押尾後（ah-bué-āu/ah-bé-āu，義項數：1）
　　1.殿後。走在最後面。阮先行，你押尾後鬥顧一下。(我們走在前頭，你殿後幫忙看顧一下。)
2.	押名（ah-miâ，義項數：1）
　　1.簽名。簽上自己的名字，表示同意、認可或承擔責任。買賣田地的字紙，雙方攏愛親身押名，才有準算。(買賣田地的合約，都要雙方親自簽名，才有效力。)
3.	暗作期（àm-tsoh-kî，義項數：1）
　　1.潛伏期。流行性感冒病毒的暗作期大約是一工到三工。(流行性感冒病毒的潛伏期大約是一至三天。)
4.	頷珠（ām-tsu，義項數：1）
　　1. 喉結。指人咽喉部位的甲狀軟骨突起。一般來講，查埔囡仔轉大人的時會變聲，是因為頷珠開始發育矣。(一般來說，男孩子在青春期會變聲，是因為喉結開始發育了。)
5.	尪婆（ang-pô，義項數：2）
　　1. 女神。傳統道教祭拜奉祀的女性神明。聽講這間廟服侍的尪婆真靈聖。(聽說這間廟供奉的女神明很靈驗。) ｜ 2. 女性靈媒、巫婆。能夠通鬼神，以替人祈福消災、占卜等工作的女子。這層代誌你敢欲共尪婆問看覓？(這件事情你是否要向靈媒請示一下？)
6.	攔孤爿（ânn-koo-pîng，義項數：1）
　　1. 偏袒。袒護某一方。做公親愛公平，袂使攔孤爿。(當和事佬要公正，不可以偏袒某一方。)
7.	漚翕（àu-hip，義項數：1）
　　1. 天氣悶熱，空氣又不流通。天氣遐漚翕，覕佇房間吹冷氣上好啦。(天氣悶熱難耐，躲在房間吹冷氣最棒啦。)
8.	後半世人（āu-puànn-sì-lâng，義項數：1）
　　1. 下半生、下半輩子。退休了後，會用得用退休金來維持後半世人的生活。(退休以後，可以用退休金來維持下半輩子的生活。)
9.	目花（ba̍k-hue，義項數：2）
　　1. 老花眼。因水晶體彈性減弱，調度力減退所引起的視力不良。阮阿公講伊食到這號歲，今都目花矣，著愛用譀鏡看報紙才看有。(我爺爺說他活到這個歲數，現今早已老眼昏花，得要用放大鏡看報紙才看得清楚。) ｜ 2. 眼花。視力模糊，看不清楚。引申喻人觀察能力不靈敏。雄雄目花看袂明，毋才佇路裡認毋著人。(突然眼花看不清楚，才在路上認錯人。)
10.	目藥水（ba̍k-io̍h-tsuí，義項數：1）
　　1. 眼藥水。治療眼睛疾病或保養眼睛的藥水。最近電腦繩傷久，目睭誠澀，愛點寡目藥水，予目睭較爽快淡薄仔。(最近電腦看太久，眼睛很乾澀，要點些眼藥水，讓眼睛比較舒服些。)
11.	甭（bàng，義項數：1）
　　1. 不可以、不要。有委婉勸說的意思。為「毋通」(m̄-thang)二字的合音。甭閣啉矣啦，酒啉傷濟會醉呢！(不要再喝了啦，酒喝太多會醉呢！)
12.	欲哭欲𥍉（beh-khàu-beh-nih/bueh-khàu-bueh-nih，義項數：1）
　　1. 快哭出來的樣子。伊毋知拄著啥物代誌？規工按呢欲哭欲𥍉，看著實在足毋甘的。(不知道他究竟怎麼了？成天那種隨時要哭的樣子，讓人看了十分心疼。)
13.	米血（bí-hueh/bí-huih，義項數：1）
　　1. 米血糕。糯米加入雞、鴨、鵝、豬等動物的血液，蒸熟後做成的一種傳統米食小吃。「米血」為南部人的稱呼。我上愛食巷仔口阿婆咧賣的米血，食著芳閣𩚨。(我最喜歡吃巷子口婆婆在賣的豬血糕，吃起來香噴噴又有嚼勁。)
14.	米管（bí-kńg/ bí-kóng，義項數：1）
　　1. 量米杯。盛米的量具。我用米管量三管米囥落去電鍋煮。(我用量米杯量了三杯的米放進電鍋裡煮。)
15.	面馬（bīn-bé，義項數：1）
　　1. 臉形。小弟的面馬生做真四正，看著真古錐。(弟弟臉形長得很方正，看起來很可愛。)
16.	明其知（bîng-ki-tsai，義項數：1）
　　1. 明知、明明知道。明其知這毋是穩趁的生理，閣敢投資遐濟錢想欲做董事長。(明明知道這不是穩賺不賠的生意，還敢投資那麼多錢想當董事長。)
17.	無分無會（bô-hun-bô-huē/bô-hun-bô-hē，義項數：1）
　　1. 沒說理由，不分青紅皂白。伊一下入門無分無會就共我罵，實在袂堪得氣。(他一進門不分青紅皂白就罵我，實在是氣不過。)
18.	無時閒（bô-sî-îng，義項數：2）
　　1. 忙碌。一刻都閒不下來，指人很忙碌，無一刻停歇。阿明自透早無閒到暗，規工無時閒，實在真辛苦。(阿明從早忙到晚，整天無一刻停歇，實在很辛苦。) ｜ 2. 好動。指人很好動，無法安靜下來。彼个囡仔規工𬦰懸𬦰低無時閒，𪜶爸母著愛共伊顧前顧後，強欲接載伊袂牢。(那個孩子整天爬上爬下很好動，他的父母得替他觀前顧後，快要承受不了他。)
19.	無時定（bô-sî-tiānn，義項數：1）
　　1. 形容人活潑好動，一刻都閒不下來。這个囡仔誠無時定，一睏仔久就隨走甲無看著人影去。(這個小孩好動到閒不下來，一下子就跑得不見蹤影。)
20.	無事無白（bô-sū-bô-pe̍h，義項數：1）
　　1. 無緣無故。你按呢無事無白來共我罵，敢毋免共我會失禮？(你這樣無緣無故來罵我，難道不用跟我道歉？)
21.	無輸贏（bô-su-iânn，義項數：2）
　　1. 平手。這擺比賽兩人攏平𠢕無輸贏。(這次比賽雙方水平、技術相當，分不出誰勝誰負。) ｜ 2. 姑且一說。講一句無輸贏的，見擺跋筊若攏輸，啥人欲閣跋？(我說一句無關緊要的話，每次賭博都輸的話，誰還想賭博？)
22.	無沓無屑（bô-tap-bô-sap，義項數：1）
　　1. 形容食物份量少得可憐、無法滿足口慾的樣子。規陣遐濟人欲去人兜食飯，才攢這點仔等路，正經是無沓無屑，卸咱家己的體面。(我們那麼多人要去別人家吃飯，才準備這一點點禮物，份量真是微不足道，反而丟盡自己的顏面。)
23.	無臭無潲（bô-tshàu-bô-siâu，義項數：2）
　　1. 責人不像樣。罵人的粗鄙用語。我都共伊會失禮矣，閣毋放我煞，去四界投，實在是無臭無潲。(我都已經跟他道歉了，還不放過我，到處投訴，實在是不像樣。) ｜ 2. 沒道理。規公司干焦阿瑄伨伊，伊煞共阿瑄嫌甲無一地好，正港是無臭無潲。(整間公司只有阿瑄挺他，他卻把阿瑄嫌棄到一無是處，真的是沒道理。)
24.	微微（bui-bui，義項數：1）
　　1. 瞇眼。眼睛微微閉合。伊今仔精神爾爾，閣目睭微微咧。(他剛醒過來而已，一副睡眼惺忪的樣子。)
25.	會赴市（ē-hù-tshī，義項數：1）
　　1. 趕得上巿場交易的時間或時機。你這馬看著高麗菜的價數好，才欲攢落去種，敢會赴市？(你現在看到高麗菜的價格好，才想要準備去栽種，哪趕得上時機呢？)
26.	下日（ē-ji̍t/ē-li̍t，義項數：1）
　　1. 日後、改天、改日、來日。這層代誌僫處理，等下日才寬寬仔講予你知。 (這件事情不容易處理，改天再慢慢告訴你。)
27.	下半身（ē-puànn-sin，義項數：1）
　　1. 下半身。伊頂半身穿白衫，下半身配烏裙，看著誠大範。(他上半身穿白襯衫，下半身搭黑裙，看起來很大方。)
28.	夯硬篙（giâ-ngē-ko/giâ-ngī-ko，義項數：1）
　　1. 唱反調。堅持自己與他人不同的意見。你莫見擺攏欲佮人夯硬篙，較袂顧人怨。(你別每次都要和人唱反調，比較不會惹人討厭。)
29.	夯石碾（giâ-tsio̍h-lián，義項數：2）
　　1. 舉重，一種體育運動名稱。夯石碾是咱參加亞洲運動會捷著等的項目。(舉重是我們參加亞洲運動會常得獎的項目。) ｜ 2. 舉起槓鈴作為運動。有咧夯石碾的人手骨攏真粗勇。(平時練舉重的人手臂都很粗壯。)
30.	鋏仔（giap-á，義項數：1）
　　1. 夾子。夾物件的器具。樹仔跤的樹葉仔無偌濟，用鋏仔鋏鋏咧就會用得矣。(樹底下的樹葉沒有很多，拿夾子夾一夾就可以了。)
31.	囡仔古（gín-á-kóo，義項數：1）
　　1. 童話故事。為兒童編寫的故事。細漢的時陣，我上愛聽阿母講囡仔古。(小時候，我最喜歡聽媽媽講童話故事。)
32.	囡仔耍（gín-á-sńg，義項數：2）
　　1. 專為兒童設計的遊戲。蹌跤雞佮覕相揣攏是較早的囡仔上愛的囡仔耍。(跳房子和捉迷藏都是以前的孩子最喜愛的遊戲。) ｜ 2. 童玩。兒童的玩具。尪仔標、干樂佮樹奶攏是予人真數念的囡仔耍。(圓紙牌、陀螺和橡皮筋都是讓人懷念再三的童玩。)
33.	囡仔話（gín-á-uē，義項數：2）
　　1. 童言童語。囡仔人咧講的囡仔話，聽著真古錐。(小孩子講的童言童語，聽起來很可愛。) ｜ 2. 幼稚的話。看伊都大人大種矣，哪會串講攏囡仔話咧？(看他已經是個大人了，怎麼會開口盡講些幼稚的話？)
34.	牛犅𨂿（gû-káng-uainnh，義項數：1）
　　1. 天牛。牛犅𨂿會損蕩柑仔欉、柳丁欉、檸檬欉佮木瓜欉等果子欉。(天牛會危害橘子、柳丁、檸檬和木瓜樹等果樹。)
35.	外務（guā-bū，義項數：2）
　　1. 正式事務以外的工作。伊這站仔外務真濟，除去正職的頭路，閣有足濟社團的工課，較加嘛無閒𩑾𩑾。 (他這陣仔外務很多，除了正職的工作，還有許多社團的工作，難怪會忙得暈頭轉向。) ｜ 2. 以外出接洽客戶為主的工作。阮阿姊的工課是咧招保險的外務，定定著四界去走傱。(我姐姐的工作是拉保險的外務員，常常要四處去奔波。)
36.	外埕（guā-tiânn，義項數：2）
　　1. 大門進來的空地。你來阮兜，車愛會記得駛入來外埕，毋通擋佇路邊，警察不時都來開單。(你來我家，車得記得開進來外庭，不要停在路邊，警察時常來開罰單。) ｜ 2. 古厝四合院外面的空地。阿母講伊細漢的時，攏會佇庄跤舊厝的外埕，共𪜶阿舅鬥曝粟仔。(媽媽說他小時候，都會在鄉下古厝的外面的空地，幫他舅舅曬稻穀。)
37.	月底（gue̍h-té/ge̍h-tué，義項數：1）
　　1. 月底。每個月的最後幾天。月底通常是阮公司無閒咧出貨的日子。(月底通常是我們公司忙著出貨的日子。)
38.	海波（hái-pho，義項數：1）
　　1. 浪花。海浪衝擊岸邊激起的水花。透風的時，佇海邊會當看著海湧搧佇礁石頂面的海波。(颳風的時候，在海邊可以看到海浪打在礁石上面的浪花。)
39.	海豬仔泅（hái-ti-á-siû/hái-tu-á-siû，義項數：1）
　　1. 蝶泳。因游泳時的姿態仿若海豚打水，故又稱「海豚泳」。海豬仔泅足歹學的，毋過咧泅的姿勢真媠。(蝶泳很難學，不過游起來的姿勢很優美。)
40.	巷仔頭（hāng-á-thâu，義項數：1）
　　1. 巷道的出入口。巷仔頭的阿婆有飼一隻土狗仔，看著誠歹。(巷口的阿婆養了一隻土狗，看起來很兇的樣子。)
41.	後的（hāu--ê，義項數：1）
　　1. 兒子的暱稱，通常用來說自己的兒子。這是阮後的，這馬當咧做兵。(這是我兒子，現在在當兵。)
42.	下心神（hē-sim-sîn，義項數：1）
　　1. 費心思、下工夫。這跤揹仔誠媠款，一下看就知影是下心神做的。(這個背包很美，一看就知道是費心思做的。)
43.	唏嚇叫（hì-heh-kiò，義項數：2）
　　1. 人情緒失控大呼小叫的樣子。啉甲起酒痟的阿義，規暝佇巷仔口唏嚇叫，聽候警察來矣，人煞走甲無看見影。(到發酒瘋的阿義，整晚在巷口大呼小叫，等到警察來了，他卻一溜煙逃到沒看見人影。) ｜ 2. 聲響喧鬧嘈雜。啉甲起酒痟的阿義，規暝佇巷仔口唏嚇叫，聽候警察來矣，人煞走甲無看見影。(到發酒瘋的阿義，整晚在巷口大呼小叫，等到警察來了，他卻一溜煙逃到沒看見人影。)
44.	魚魚肉肉（hî-hî-bah-bah/hû-hû-bah-bah，義項數：1）
　　1. 大魚大肉。指主要以魚、肉為主的菜餚。三頓魚魚肉肉按呢咧食，對健康無一定真有幫贊。(三餐都大魚大肉吃得這麼豐盛，對健康不一定有助益。)
45.	險險仔（hiám-hiám-á，義項數：1）
　　1. 險些、差一點。伊那行那耍手機仔，無細膩踢著石頭，險險仔栽落去圳溝仔底。(他邊走邊玩手機，不小心踢到石頭，差一點掉進灌溉溝渠裡。)
46.	耳空吼（hīnn-khang-háu/hī-khang-háu，義項數：1）
　　1. 耳鳴。若耳空吼閣會頭眩，愛去揣醫生檢查看是有啥物問題。(要是耳鳴又會頭暈，得去找醫生檢查看看是有什麼問題。)
47.	好才（hó-tsâi，義項數：1）
　　1. 形容一個人有才能、多才多藝的樣子。揣翁婿上要緊的是愛彼个查埔的好才閣骨力，外表無遐爾重要。(選擇夫婿最重要的是男方要有才能又勤勞，外表不是那麼重要。)
48.	風颱天（hong-thai-thinn，義項數：1）
　　1. 颱風天。風颱天會落大雨，對欠水較有幫贊。(颱風天會下大雨，對缺水比較有幫助。)
49.	虎咬豬（hóo-kā-ti/hó，義項數：1）
　　1. 割包。民間常見的小吃。將兩片半o-kā-tu圓形相連成虎口狀的特製包子，於夾層中夾進滷肉、酸菜、花生粉等餡料而製成的食物。民間常在尾牙時食用，取其形似錢包，希望可以帶來財運。
50.	雨遮（hōo-jia/hōo-lia，義項數：2）
　　1. 蔽雨的用具，如雨衣、雨傘等。外口天色暗摸摸，凡勢會落雨，你雨遮著紮咧。(外面天色昏暗，可能會下雨，你雨具得帶著。) ｜ 2. 遮雨棚。二樓的雨遮害去矣，愛倩人來看覓咧。(二樓的遮雨棚壞掉了，要請人來看看。)
51.	符仔水（hû-á-tsuí，義項數：1）
　　1. 符水、淨符水。道教信仰中一種治療疾病的儀式。淨符燃燒後，將灰燼加入一半冷水、一半熱水的「陰陽水」中。破病著愛去揣醫生，毋通想講食符仔水就會好。(生病就要去看醫生，不要想說喝符水就會好。)
52.	喝價（huah-kè，義項數：3）
　　1. 喊價、叫價。對物品開出價格，通常用於拍賣物品的場所。拍賣會場的物件，攏是用喝價的。(拍賣會場的東西，都是用喊價的。) ｜ 2. 討價還價。買賣時，賣方索價，買方還價，以達到各自的理想價錢。阮阿母買菜的時，誠𠢕佮人喝價。(媽媽買菜時，很會跟人討價還價。) ｜ 3. 提高價錢。喝價閣有一種顛倒是價數愈喝愈懸，比論古董，價數定定喝甲會驚死人。(喊價還有一種反而是價格愈喊愈高，譬如古董，價格常常喊到嚇死人。)
53.	翻轉年（huan-tńg-nî，義項數：1）
　　1. 明年、隔年、翌年。伊畢業了後無去揣頭路，專心準備考試，翻轉年就高考及格，去做公務員矣。(他畢業之後沒有去找工作，專心準備考試，隔年就高考及格，去當公務員了。)
54.	發見（huat-kiàn，義項數：2）
　　1. 發覺、察覺。伊轉去到厝，才發見物件囥佇火車裡，煞袂記得提。(他回到家，才察覺東西放在火車上，卻忘了拿。) ｜ 2. 發現。原本就存在的事物、地方或道理被找出或看見。微生物是一位荷蘭的博物學家，用伊家己製作的顯微鏡發見的。(微生物是一位荷蘭的博物學家，用他自己製作的顯微鏡發現的。)
55.	活（hua̍t，義項數：2）
　　1. 培育、繁殖。養殖動物、培植植物。這窟魚池仔活足濟魚仔栽。 (這座魚池繁殖很多魚苗。)伊真𠢕活果子栽。(他很會培育果苗。) ｜ 2. 老練。伊這身工夫練甲真活。(他這身功夫練得很老練。)
56.	花嗄嗄（hue-sà-sà，義項數：1）
　　1. 混亂不清。比喻頭腦裡朦朧一片，無法明白。聽你講甲親像誠簡單，我是聽甲花嗄嗄。(聽你說的好像很簡單，我卻聽得一頭霧水。)
57.	火燒心（hué-sio-sim/hé-sio-sim，義項數：2）
　　1. 胸悶。心口有灼熱感。人講火燒心就敢若有石頭硩佇你的胸坎，真僫喘氣，著愛趕緊去予醫生看。(人家說胸悶有如石頭壓在胸口，呼吸很困難，得趕快去看醫生。) ｜ 2. 胃食道逆流。指人體中胃酸逆流的現象。人若咧火燒心，胸坎到頷頸攏會感覺燒燒，較食力的閣會疼。(胃食道逆流的時候，胸口到頸部都會感覺灼熱，比較嚴重的還會痛。)
58.	歲聲（huè-siann/hè-siann，義項數：1）
　　1. 年紀、年歲、歲數。指年齡的大小。目一下𥍉，咱歲聲都六十捅矣。(一眨眼，我們年紀都已經六十出頭了。)
59.	血角（hueh-，義項數：2）
　　1. 血塊。凝成塊狀的血。kak/huih-kak這擺車禍致使伊頭殼內有血角，愛手術共提出來。(這次車禍造成他頭顱裡面有血塊，得動手術把它拿出來。) ｜ 2. 血栓。發生在動脈或靜脈血管中的血塊。醫生當咧手術，欲共窒佇患者血管的血角清出來。(醫生正在動手術，要清除病患血管中的血栓。)
60.	血凍（hueh-tàng/huih-tàng，義項數：1）
　　1. 血塊。凝成塊狀的血。醫生當咧共患者開刀，欲共窒佇伊頭殼內的血凍提出來。(醫生正在替患者動手術，要清除他腦中的血塊。)
61.	分分仔（hun-hun-á/ hun-hun--á，義項數：1）
　　1. 一點兒。伊這擺比賽差分分仔就著等矣。 (他這次比賽差一點兒就得名了。)
62.	夭壽骨（iáu-siū-kut，義項數：2）
　　1. 短命鬼。罵人的粗俗話語。你這个夭壽骨，規工啉酒毋去作穡，欲哪會有通食。(你這個短命鬼，整天喝酒不去工作，怎麼會有得吃呢。) ｜ 2. 指人缺德。這箍人真夭壽骨，物件共我變害去煞做伊走。(這傢伙真缺德，弄壞我的東西竟一走了之。)
63.	要意（iàu-ì，義項數：1）
　　1. 在意、在乎、關心。這是四冬才有一擺的比賽，伊毋才會真要意，逐工拚勢練習。(這是四年才有一次的比賽，所以他很在意，每天拼命練習。)
64.	藥餅（io̍h-piánn，義項數：1）
　　1. 藥錠、藥片。泛指扁狀錠劑的藥物。這片藥餅歹吞，會使共研做藥粉袂？(這片藥錠不好吞，可以磨成藥粉嗎？)
65.	一般的（it-puann-ti̍k，義項數：1）
　　1. 一般而言。就通常的情況來說。一般的，文旦收成了後，愛閣囥一兩禮拜，聽候較消水咧就會加真好食。(一般而言，文旦採收以後，還得放上一兩個星期，等到水份減少後就會更好吃。)
66.	幼麵（iù-mī，義項數：1）
　　1. 細麵。寬度在1.4公厘到2公厘的麵條稱為細麵。老大人食麵的時愛食幼麵，按呢哺較有法。(老年人吃麵的時候得吃細麵，這樣比較嚼得動。)
67.	幼茈（iù-tsínn，義項數：2）
　　1. 年幼、稚嫩。年紀幼小。遐爾幼茈的囡仔，猶毋捌世事咧。(年紀那麼幼嫩的小孩，還不懂人情世故啦。) ｜ 2. 資淺。經驗不足、資歷淺的。伊這改想欲出來選立法委員，我感覺猶傷幼茈，等後擺啦。(他這次想要出來選立法委員，我覺得資歷太淺，等下次啦。)
68.	油耳（iû-hīnn/iû-hī，義項數：1）
　　1. 溼耳朵。易排出溼性耳垢的耳朵。你就是種著恁阿母的油耳，不時都生一寡澹澹溼溼的耳屎來共你凌治。(你就是遺傳到你媽媽的溼耳朵，時常滋生溼黏的耳屎讓你困擾不已。)
69.	日頭光（ji̍t-thâu-kng/li̍t-thâu-kng，義項數：1）
　　1. 日光。太陽的光線。今仔日天氣翕熱，日頭光真鑿目。(今天天氣悶熱，陽光刺眼。)
70.	日鬚（ji̍t-tshiu/li̍t-tshiu，義項數：1）
　　1. 太陽的光芒、光線。日鬚迵過樹葉仔縫掖佇塗跤。(陽光穿過樹葉縫隙灑落在地上。)
71.	韌鼻（jūn-phīnn/lūn-phīnn，義項數：1）
　　1. 不乾脆。有的代誌袂拖得，若傷過韌鼻，會做無工課。(有些事是拖延不得的，如果太不乾脆，工作會無法完成。)
72.	絞營（ká-iânn，義項數：1）
　　1. 群聚吵鬧。𪜶彼陣囡仔半暝猶毋睏，佇房間裡咧絞營，吵甲厝蓋強欲夯起來。(他們那群小孩半夜還不睡覺，在房間裡喧鬧，吵到屋頂快要掀開來。)
73.	絞群絞黨（ká-kûn-ká-tóng，義項數：1）
　　1. 成群結夥。眾多人物聚集在一起，通常指結黨不做正事。伊毋好好仔讀冊，煞走學綴人絞群絞黨四界去𨑨迌。(他不好好讀書，竟逃學跟人成群結夥到處去遊玩。)
74.	甲是（kah-sī，義項數：1）
　　1. 既然。咱敢毋是講欲隨人出寡來投資做生理，甲是攏無人欲出錢，規氣煞去莫閣講。(我們不是說要每人拿出一些錢投資做生意，既然沒有人要出錢，乾脆算了別再提。)
75.	干仔（kan-á，義項數：1）
　　1. 偏偏。表示故意違反別人的要求。叫伊落雨天莫出門，伊干仔欲，實在無伊法。(叫他下雨天不要出門，他偏偏要去，真拿他沒辦法。)
76.	敆爐（kap-lôo，義項數：1）
　　1. 指往生者週年忌日後，將其神主牌位火化，取部分的爐灰放進列祖列宗的香爐內，同時也自神主爐中抽取三枝燒過的餘香，移插至祖先之香爐，並將往生者的牌位列入祖先牌位內。今仔日是𪜶阿媽敆爐的日子，毋過伊煞為著防疫愛隔離，無法度轉去拜拜。(今天是他祖母合爐的日子，但是他卻為了防疫得隔離，不能回家拜拜。)
77.	厚事路（kāu-sū-lōo，義項數：2）
　　1. 事情進行中頗多阻撓或橫逆而不順遂。你都毋知咧，這棟遮挑俍的大樓，當初時欲動土進前是偌仔厚事路咧！(你都不知道，這棟聳立的大樓，當初要動土之前可是波折不斷啊！) ｜ 2. 形容人身體多病痛，病魔纏身。伊這站仔誠厚事路，定定咧走病院。(他這陣子身體多病痛，常常出入醫院。)
78.	家口（ke-kháu，義項數：2）
　　1. 家庭、家族。𪜶彼家口是大家族，仝祧仔內的攏蹛做伙。(他們家是大家族，親戚同宗族的全住在一起。) ｜ 2. 家中人口。這擺的物件，是按家口來分的。(這次分的東西，是按家中人口來發的。)
79.	扴話（ke̍h-uē，義項數：1）
　　1. 頂嘴、還嘴。老師若講你，你千萬毋通扴話。(老師如果責罵你，你千萬不能還嘴。)
80.	敲虎𡳞（khà-hóo-lān，義項數：1）
　　1. 胡扯、胡說。「虎𡳞」是老虎的陽具，鮮少人看過，更別提有機會敲打。指某人在閒扯一些無稽之談，想愚弄別人。伊講的彼件代誌傷過譀古，你莫聽伊佇遐咧敲虎𡳞。(他說的那件事太過荒謬，你別聽他在那裡胡說。)
81.	起貨（khí-huè/khí-hè，義項數：1）
　　1. 卸貨；搬貨。起厝欲用的紅毛塗運到位矣，咱做伙來去共𪜶鬥起貨。(蓋房屋要用的水泥已經到貨了，我們一起去幫他們卸貨。)
82.	起挐（khí-jû/khí-lû/khí-jî，義項數：1）
　　1. 鬧脾氣；使性子；胡鬧一通。囡仔人毋捌代誌，若無順伊的意，隨頓落去塗跤起挐。(小孩子不懂事，如果不能照他的意願，馬上就跌坐在地上鬧脾氣。)
83.	起基（khí-ki，義項數：2）
　　1. 創始。伊是阮公司起基的股東。(他是我們公司的創始股東。) ｜ 2. 當初。起基來到生份所在的時，事事項項攏無了解。(當初來到陌生地時，凡事都不了解。)
84.	起慼（khí-tsheh/khí-tshueh，義項數：1）
　　1. 動起氣來、惱怒起來。因為生氣、失望、受苦等而對人或事物生出厭惡感，甚至是怨恨心。我都照實講爾爾，欲哪會知影伊聽了煞起慼。(我就是實話實說而已，怎會曉得他聽完以後就心生怨恨。)
85.	欹（khia，義項數：1）
　　1. 刻意刁難或為難人家。我佇鐵工場學師仔的時陣，頭家娘定定揣空揣縫共我欹，實在真酷刑。(我在鐵工場當學徒的時候，老闆娘常常雞蛋裡挑骨頭刁難我，實在很惡劣。)
86.	見天（khiàn-thian，義項數：2）
　　1. 抬頭向天看。行路見天，莫怪會跋倒。(走路抬頭向天看，難怪會跌倒。) ｜ 2. 迷糊、漫不經心。彼箍見天見天，要緊的代誌毋通交予伊做。(那傢伙很迷糊，重要的事情不要交給他做。)
87.	抾起跤（khioh-khí-kha，義項數：2）
　　1. 馬上。伊是一个誠骨力的人，若有穡頭，免人交代，隨抾起跤做。(他是一位很勤勞的人，一有工作，不用人家交代，就馬上去做。) ｜ 2. 拔腿狂奔。一下看著警察來，彼陣𨑨迌囡仔隨就抾起跤，走甲無看見人。(一看到警察來，那群小混混隨即拔腿狂奔，跑得不見蹤影。)
88.	抾骨頭（khioh-kut-thâu，義項數：1）
　　1. 撿骨。土葬後到一定的年限，把骨頭撿出來曬乾再收入骨罈入葬。後個月過愛安排一下仔時間共阿公抾骨頭，紲落來才閣囥入去塔裡。(下個月過後要安排個時間來替爺爺撿骨，之後再放到靈骨塔。)
89.	考水披（khó-tsuí-phi，義項數：2）
　　1. 打水漂。在水邊投擲扁平小石子或瓦片，使其掠過水面，激起一串水花。阿華佮阿明佇埤仔邊咧考水披，看啥人考較遠。(阿華和阿明在池塘邊打水漂，看誰打得遠。) ｜ 2. 虛擲、浪費。伊手頭誠冗剩，猶算誠好額，毋過伊嘛袂提錢去考水披，四界匪類烏白開啊。(他手頭寬鬆，還算挺富有的，但他也不會拿錢去虛擲，到處糟蹋物資隨意花錢啊。)
90.	慷交（khóng-kau，義項數：1）
　　1. 慷慨好客，交遊廣闊。阿爸是一个足慷交的人，阮兜不時都有真濟人客來相揣。(爸爸個很慷慨好客的人，我家時常都有很多客人來訪。)
91.	昆蟲（khun-thiông，義項數：1）
　　1. 蟲類的總稱。今地球頂懸昆蟲的種類通講是百百種，咱攏捌袂了呢。(現今地球上昆蟲的種類可以說是百百種，我們都認識不完呢。)
92.	肌膚（ki-hu，義項數：2）
　　1. 皮膚與肌肉。伊的肌膚驚曝日，一下曝就烏趖趖。(他的皮膚很怕曬太陽，一曬就非常地黑。) ｜ 2. 引申為身體的氣色、體力。伊本底瘦枝落葉，經過調養，這馬已經較有肌膚矣。(他本來衰弱消瘦，經過調理，現在已經健壯起來了。)
93.	居財（ki-tsâi/ku-tsâi，義項數：1）
　　1. 命運註定有財產。留得住、守得住財富。看命仙講阿義仔有居財命，毋過看伊啉酒、跋筊、𨑨迌逐項會，敢誠實守會牢？(命相師說阿義有居財命，可是他喝酒、賭博、遊玩樣樣來，錢財有可能守得住嗎？)
94.	寄聲（kià-siann，義項數：2）
　　1. 傳話、轉告。伊昨昏無來上課，有請同學鬥寄聲，提醒伊後禮拜著交期尾作業。(他昨天沒來上課，有請同學協助轉告，提醒他下周得交期末作業。) ｜ 2. 放話、揚言。伊予人寄聲講，前數若無清，免數想欲閣佇遮做生理。(他被人放話說，之前的債如果沒還完，別妄想還要在這裡做生理。)
95.	噱噱叫（kia̍k-kia̍k-kiò，義項數：1）
　　1. 發出刺耳的噪音。你按呢噱噱叫會共人吵著。(你如此聒噪會吵到別人。)
96.	堅風（kian-hong，義項數：1）
　　1. 風乾。蔬菜、肉類等物品被風吹乾，水份因減少而變得乾硬。寒人的霜風誠透，致使肉砧的肉落尾攏堅風去矣。(冬天的冷風風勢很強，以至於豬肉店的肉最後都風乾變硬了。)
97.	堅血（kian-hueh/kian-huih，義項數：1）
　　1. 血液凝固。傷口不再流血。刀仔割著的空喙若較細空，就較快堅血。(刀子割到的傷口如果比較小，就比較容易止血。)
98.	結市（kiat-tshī，義項數：1）
　　1. 集結成市。臺灣傳統商業模式之一，許多同業聚集在同一條街或是地區，以匯集人潮而刺激買氣。佇這條街仔做食食的店頭，生理攏真交易，莫怪老一輩的講同業結市才有錢通趁。(在這條街道賣飲食的店面，生意都很熱絡，怪不得長輩會說同業結市好生財。)
99.	緊跤（kín-kha，義項數：2）
　　1. 趕緊、迅速、快速。行較緊跤咧，若無會袂赴。(走快一點，要不然會來不及。) ｜ 2. 腳勤。張議員服務選民緊跤袂拖沙，莫怪通人攏呵咾。(張議員服務選民勤快不拖泥帶水，怪不得人人都稱讚。)
100.	緊跤緊手（kín-kha-kín-tshiú，義項數：1）
　　1. 快手快腳。指做事情動作敏捷快速。伊寫功課緊跤緊手，逐擺攏是頭一个完成的。(他寫作業敏捷快速，每次都是第一個完成的。)
101.	見真（kìnn-tsin，義項數：1）
　　1. 其實、歸根究柢。講著偌𠢕拄偌𠢕的人，見真攏無影偌有才調。(誇口能力有多麼強大的人，實際上都不是真的多有本事。)
102.	叫電話（kiò tiān-uē，義項數：1）
　　1. 打電話。拄才是啥人叫電話來？(剛才是誰打電話過來？)
103.	光焱焱（kng-iānn-iānn，義項數：1）
　　1. 明晃晃、光亮。𪜶兜的電火點甲光焱焱，毋過佇咧外口叫門，煞攏無人應。(他們家燈火通明，但是在外頭敲門，卻都無人回應。)
104.	光爍爍（kng-sih-sih，義項數：2）
　　1. 光亮刺眼。倚晝的日頭光爍爍，照甲目睭強欲擘袂開。(接近中午的陽光光亮刺眼，照得眼睛快要睜不開了。) ｜ 2. 亮晶晶。比喻目光被某個東西吸引。阮囝上饞食，看著好食物目睭就光爍爍。(我兒子最貪吃，看到好吃的食物眼睛就亮晶晶。)
105.	貫耳（kǹg-hīnn/kǹg-hī，義項數：1）
　　1. 在耳朵上扎孔。因為我惜皮驚疼，閣煩惱空喙會患動孵膿，毋才袂愛烏白去外口貫耳。(因為我很怕疼，又擔憂傷口會發炎化膿，所以不喜歡隨意去外面穿耳洞。)
106.	講仙古（kóng-sian-kóo/káng-sian-kóo，義項數：1）
　　1. 胡說八道。沒有根據的亂說。我聽你咧講仙古，無你提證據出來予我看。(我聽你在胡說八道，不然你把證據拿出來給我看。)
107.	孤行獨市（koo-hâng-to̍k-tshī，義項數：1）
　　1. 獨占市場、獨門生意。伊咧做的生理孤行獨市，價數在伊喝，毋過若主顧客來交關，伊價數攏會放較軟。(他做的是獨門生意，價錢隨他訂，但如果老主顧來購買，他都會把價錢降低一些。)
108.	姑姨舅妗（koo-î-kū-kīm，義項數：2）
　　1. 姑姑、阿姨、舅舅與舅媽，泛指父親的姐妹及母親的兄弟姊妹構成的親戚。咱佮一寡仔姑姨舅妗，三不五時著愛相揣，感情才會峇。(我們跟親朋好友，偶爾要互有來往，這樣感情才會親近。) ｜ 2. 借指親戚們負面的事情。這馬咱是咧講這件代誌，你莫去牽拖一寡往過姑姨舅妗遐的有的無的。(現在我們是在討論這件事，你不要去牽扯一些過去親戚們那些不堪聞問的事情。)
109.	顧山（kòo-suann，義項數：1）
　　1. 指人去世死亡。啥物瘦啉顧肝？我看是顧山較緊啦！(什麼光喝酒不吃下酒菜可以養肝？我看是會早點成仙吧！)
110.	掛骨（kuà-kut，義項數：2）
　　1. （肉）連著骨頭。豬砧賣豬肉，若無先明品，袂使掛骨賣予人客。(肉攤賣豬肉，如果沒有事先講明，不能肉連骨頭賣給客人。) ｜ 2. 指人講話帶刺，用言外之意譏諷人。豬砧賣豬肉，若無先明品，袂使掛骨賣予人客。(肉攤賣豬肉，如果沒有事先講明，不能肉連骨頭賣給客人。)
111.	貫串（kuàn-tshuàn，義項數：3）
　　1. 接連貫通。這條新橋貫串兩个鄉鎮的交通要道，並往過加真利便。 (這座橋連貫這兩個鄉鎮的交通要道，比以前便利許多。) ｜ 2. 流暢、通暢無阻。這陣上衝，少年家仔上愛看的這齣新劇，自頭到尾演甲真貫串。(現在最流行，年輕人最喜愛看的這齣話劇，從頭到尾演得非常流暢。) ｜ 3. 擅長、精通。張老師貫串畫水彩畫，佇學校內底無人佮伊會比得。(張老師擅長畫水彩畫，在學校裡面無人能與他比擬。)
112.	棺柴本（kuann-tshâ-pún，義項數：1）
　　1. 棺材本、養老金。買棺材的錢，泛指養老的錢財或物資。𪜶彼个孫真可惡，竟然想欲騙老大人共棺柴本提出來予伊開。(他那個孫子很可惡，竟然想騙老人把棺材本拿出來給他花用。)
113.	過晝（kuè-tàu/kè-tàu，義項數：1）
　　1. 過午。中午、午餐時間過後。阮佇阿媽遮耍，過晝才會轉去，你免攢阮的中晝頓矣。(我們在奶奶這邊遊玩，中午過後才會回去，你不用張羅我們的午餐了。)
114.	過電（kuè-tiān/kè-tiān，義項數：2）
　　1. 導電。指物體能夠傳導、傳送電流。銅會過電，塑膠袂過電。(銅會導電，塑膠不會導電。) ｜ 2. 通電。使電流通過。吹風機無插插頭袂過電，當然嘛袂紡。(吹風機沒插插頭不會通電，當然就不會運轉。)
115.	舊厝（kū-tshù，義項數：1）
　　1. 舊家、老家。原來的家。阮舊厝的門口埕有種真濟佈田花。(我老家的前院種了很多杜鵑花。)
116.	滑溜（ku̍t-liu，義項數：2）
　　1. 光滑。彼尾鰗鰡誠滑溜，若無掛手橐仔，免數想欲掠伊會著。(那條泥鰍全身滑溜溜，沒戴手套，休想抓得住牠。) ｜ 2. 圓滑。做事或言談面面周到，不得罪人。王經理做人誠滑溜，攏袂得失人，彼是佇生理場練欲三十冬才有法度按呢。(王經理為人圓滑，都不會得罪人，那是在商業界練了將近三十年才有辦法如此。)
117.	滑溜（ku̍t-liū，義項數：1）
　　1. 說話流利順暢的樣子。彼个外國傳教士為著欲佇臺灣傳教，臺語學甲端的閣滑溜。(那個外國傳教士為了要在臺灣傳教，臺灣台語學得道地又流利。)
118.	襤襤褸褸（lâm-lâm-luì-lu，義項數：2）
　　1. 襤褸。衣服破爛的樣子。ì彼个乞食一身軀穿甲襤襤褸褸，予人看著真袂過心。(那個乞丐全身衣衫襤褸，讓人看了很過意不去。) ｜ 2. 艱苦、悲慘。𪜶兜這站仔真正是襤襤褸褸，毋但生理失敗，工場閣予火燒去。(他們家最近真悲慘，不只做生意失敗，工廠還失火。)
119.	弄花（lāng-hue，義項數：1）
　　1. 稻、麥等植物開花靠風力授粉的過程。稻仔開花、弄花頭尾才成禮拜，花閣細蕊，罕得有人會注意著。(水稻開花、授粉前後只有一個星期左右，花朵又小，很少有人會注意到。)
120.	人群狗黨（lâng-kûn-káu-tóng，義項數：1）
　　1. 狐群狗黨。結黨去不良場所鬼混的一夥人。你千萬毋通佮彼陣人群狗黨相交插。(你千萬別跟那些狐群狗黨相互來往。)
121.	塌窩（lap-o，義項數：2）
　　1. 塌陷。遠遠對遮看過去，山崁跤彼跡塌窩的所在，阮以早就是蹛佇遐。(遠遠從這裡看過去，山腳那處塌陷的地方，我們以前就是住在那裡。) ｜ 2. 凹地、小坑洞。彼條大路的打馬膠有足濟跡塌窩，駛車愛較慢咧，坐的人才袂趒甲艱苦罪過。(那條馬路的柏油有很多小坑洞，車子得開慢些，坐車的人比較不會顛簸得辛苦無比。)
122.	流血流滴（lâu-hueh-lâu-tih/lâu-huih-lâu-tih，義項數：1）
　　1. 頭破血流、鮮血淋漓。伊食酒閣騎oo-tóo-bái，摔一下流血流滴。(他喝酒還騎機車，摔得頭破血流。)
123.	鬧熱滾滾（lāu-jia̍t-kún-kún/lāu-lia̍t-kún-kún/nāu-jia̍t-kún-kún/nāu-lia̍t-kún-kún，義項數：1）
　　1. 場面非常熱鬧、人聲鼎沸的樣子。三月痟媽祖，一四界的媽祖宮攏鬧熱滾滾。(三月瘋媽祖，各地的媽祖廟都非常熱鬧。)
124.	老相（lāu-siùnn，義項數：2）
　　1. 老態。像老人的相貌。伊才二十捅歲，就規頭白頭毛，看著足老相的。(他才二十出頭就滿頭白髮，看起來很顯老。) ｜ 2. 老景、晚景。𪜶爸母煩惱伊無某無猴，老相會老孤𣮈，無人通佮伊做伴。(他爸媽擔心他無妻無兒，晚景會很孤單，沒人陪伴他。)
125.	你兄我弟（lí-hiann-guá-tī，義項數：1）
　　1. 稱兄道弟。特指拉幫結派，想仗勢欺人。囡仔人毋通佮人你兄我弟烏白牽。(小孩子不要跟人稱兄道弟亂攀關係。)
126.	理氣（lí-khì，義項數：1）
　　1. 合乎常理常規的行事作為。伊做代誌真有理氣，毋才逐家攏信任伊。(他做事都依照常理，所以大家都信任他。)
127.	利頭（lī-thâu，義項數：2）
　　1. 利潤。做進出口生理的利頭袂䆀，毋過本錢誠粗，嘛有風險，欲投資著愛較斟酌咧。(做進出口生意的利潤很高，毋過本錢要夠多，也有風險，要投資得要小心一點。) ｜ 2. 利益、好處。你開合喙攏咧講伊的話，伊到底有啥物利頭通予你食燒食冷咧？(你開口閉口都在幫他講話，究竟他有什麼利益可以讓你吃香喝辣呢？)
128.	掠跤掠手（lia̍h-kha-lia̍h-tshiú，義項數：1）
　　1. 綁手綁腳。引申為使用各種方式束縛或阻礙他人。囡仔考牢大學，欲揀佗一科系來讀，序大人仙都毋通共掠跤掠手，無顧伊本人的意願。(兒女考上大學，要選讀哪一科系，做父母親千萬不要束縛兒女，不理會他本身的意願。)
129.	掠車（lia̍h-tshia，義項數：1）
　　1. 超車。救護車沿路掠車佮爍紅火，誠緊就共病人送去病院的急診室。(救護車沿途超車和閃爍紅燈，很快就把病人送到醫院的急診室。)
130.	料身（liāu-sin，義項數：1）
　　1. 質料。布料的質地。這軀洋裝的料身袂䆀，色水閣真媠，價數應該無俗。(這件洋裝的質料不錯，色澤又很美，價格應該不便宜。)
131.	冷底（líng-té/líng-tué，義項數：1）
　　1. 指體質虛寒。阿母講我較冷底，袂堪得食冰水佮西瓜這款的物件。(媽媽說我體質較虛寒，禁不起喝冰水和吃西瓜這類的東西。)
132.	落工（lo̍h-kang，義項數：1）
　　1. 工作時間到，離開工作岡位。頭家有吩咐咱起工、落工攏愛照時間。(老闆有交代我們要準時上下班。)
133.	落妝（lo̍h-tsng，義項數：1）
　　1. 卸妝。洗除臉上的化妝。伊出門的時若有化妝，轉到厝就會隨落妝。(他出門的時候要是化了妝，回到家就會隨即卸妝。)
134.	馬鈴薯片（má-lîng-tsî-phìnn/má-lîng-tsû-phìnn，義項數：1）
　　1. 洋芋片。這馬鈴薯片烘甲酥酥閣芳芳，食著有夠紲喙。(這洋芋片烤得又脆又香，讓人一片接一片停不下來。)
135.	硬鼻（ngē-phīnn/ngī-phīnn，義項數：1）
　　1. 固執、硬脾氣。伊有夠硬鼻的，別人的意見伊攏聽袂入去。(他相當固執，別人的意見他都聽不進去。)
136.	硬喙（ngē-tshuì/ngī-tshuì，義項數：2）
　　1. 嘴硬、嘴強。說話強硬，不肯認輸或認錯。愛有本等佮實力才有法度予眾人服你，若干焦硬喙死諍，是上無路用的步數。(要有本領和實力才有辦法讓眾人服你，如果只是嘴硬爭論，是最無效的招式。) ｜ 2. 說話堅持己見。見擺開會若聽著別人有無仝的意見，伊就誠硬喙，攏無欲讓步，真正無伊法。(他遇到不同意見的事情卻那麼嘴硬，都不讓步，真是拿他沒辦法。)
137.	掩揜（ng-iap，義項數：2）
　　1. 遮掩。彼兩个人佇巷仔內相掩揜，毋知欲創啥物歹代。(那兩個人在巷子內互相遮掩，不知道要做什麼壞事情。) ｜ 2. 暗藏別人的東西，想據為己有。彼箍歹手爪，不時偷掩揜人的物件。(他手腳不乾淨，時常把人家的東西暗藏起來想據為己有。)
138.	懦懦（nōo-nōo，義項數：2）
　　1. 慢性子。性情遲緩。伊生成懦懦，看伊做代誌予人活欲急死。(他天生慢性子，看他做事真是急死人了。) ｜ 2. 軟弱、膽小、退縮。伊個性懦懦，拄著僫解決的代誌，就勼轉去矣。(他個性軟弱退縮，遇到難解決的事情就龜縮回去了。)
139.	爛朽朽（nuā-hiú-hiú，義項數：1）
　　1. 破破爛爛。彼間厝真久無人蹛矣，厝頂早就爛朽朽矣！(那間房子很久沒有住人了，屋頂早已破破爛爛了！)
140.	爛蜞（nuā-khî，義項數：1）
　　1. 蛞蝓。爛蜞會食青菜、果子的幼葉仔，是農業的害蟲。(蛞蝓會吃青菜、水果的嫩葉，是農業的害蟲。)
141.	瀾鬚（nuā-tshiu，義項數：1）
　　1. 口沫。流感的病毒會綴瀾鬚穢人，毋才講感著的人愛掛喙罨。(流感的病毒會隨著飛沫傳染給別人，才會建議染病的人要戴口罩。)
142.	烏肉底（oo-bah-té/oo-bah-tué，義項數：1）
　　1. 天生膚色黝黑。伊本成就烏肉底，毋是曝烏的。(他天生膚色黑，不是曬黑的。)
143.	烏白講（oo-pe̍h-kóng，義項數：1）
　　1. 胡說、胡說八道、亂講無證據的代誌毋通佇遐烏白講。(沒有證據的事不要在那裡亂講。)
144.	飽流（pá-lâu，義項數：1）
　　1. 漲潮。石滬利用飽流、洘流掠海產，予魚蝦會得入來，袂得出去。(石滬利用漲退潮捕獲海產，讓魚蝦進得來，出不去。)
145.	崩駁（pang-poh/pang-phoh，義項數：1）
　　1. 決堤、潰堤。堤防或河岸遇大水或洪流而遭沖毀。這改風颱做大水，彼條溪仔的駁岸就按呢崩駁去。(颱風造成水災，那條溪流的堤防因而潰堤了。)
146.	放尿（pàng-jiō/pàng-liō，義項數：1）
　　1. 撒尿、排尿。若欲睏愛先去放尿，半暝仔才袂泄尿。(如果要睡得先去尿尿，半夜才不會尿床。)
147.	八月半（Peh-gue̍h-puànn/Pueh-ge̍h-puànn，義項數：1）
　　1. 中秋。農曆八月十五日。今年的八月半，阮規陣人相招欲來去烘肉佮賞月。(今年的中秋節，我們一群人相約要一起去烤肉跟賞月。)
148.	白肉底（pe̍h-bah-té/pe̍h-bah-tué，義項數：1）
　　1. 膚色白。伊生本就白肉底，毋管按怎曝，都曝袂烏。(他天生皮膚就白，不論怎樣曬，都曬不黑。)
149.	平鼎仔（pênn-tiánn-á/pînn-tiánn-á，義項數：1）
　　1. 平底鍋。一種底部平坦，適用於煎、炒料理食物的鍋具。阿母當咧用伊新買來的平鼎仔炒菜。(媽媽正在用他新買的平底鍋炒菜。)
150.	拍撋（phah-nuá，義項數：2）
　　1. 對易損之物粗暴處理。這領衫料身遮爾仔好，毋通烏白拍撋。(這件衣服材質這麼的好，不要胡亂粗暴搓洗。) ｜ 2. 韌性、耐力這領拍鐵仔褲較有拍撋。(這件牛仔褲比較耐洗。)
151.	拍層（phah-tsân，義項數：1）
　　1. 打層次。伊這擺鉸頭鬃順紲拍層，規个人看著閣較有氣質矣。(他這次剪頭髮順便打層次，整個人看起來更有氣質了。)
152.	冇心（phànn-sim，義項數：1）
　　1. 質地鬆散不結實。原來這塊柴是冇心的，莫怪提著遮爾仔輕。(原來這塊木柴的內部質地疏鬆，難怪拿起來如此輕。)
153.	品捧（phín-phóng，義項數：1）
　　1. 誇耀、吹牛、誇大其詞。毋通提你的過去出來品捧，無人會相信你。(不要拿你的過去出來誇耀，沒有人會相信你的。)
154.	蓬蓬坱（phōng-phōng-ing，義項數：1）
　　1. 形容塵土飛揚的樣子。阮兜彼箍圍仔有黜塗機咧挖路，一四界蓬蓬坱，厝內外專塗沙。(我家附近有挖土機在挖馬路，到處塵土飛揚，屋子裡外都是灰塵。)
155.	浮頭（phû-thâu，義項數：3）
　　1. 頭浮起來、冒出頭。海翁若欲喘氣，愛先浮頭予鼻空離開水面。(鯨魚要呼吸的話，得先把頭浮起來讓鼻孔離開水面。) ｜ 2. 發達、繁榮。建築業若開始浮頭，其他的行業就會沓沓仔綴咧發展。(建築業如果開始繁榮，其他行業就會慢慢地跟著發展。) ｜ 3. 嶄露頭角。經過遐濟年注心練習，伊總算佇這改歌唱比賽浮頭矣！ (經過多年專心練習，他總算在這次歌唱比賽嶄露頭角了！)
156.	袚巾（phua̍h-kin/phua̍h-kun，義項數：1）
　　1. 披肩。披搭在肩上的服飾。今仔日並昨昏較生冷，你欲去公園散步，著共袚巾幔佇肩胛頭才出門。(今天比昨天更冷，你想去公園散步，得把披肩披在肩膀上再出門。)
157.	比手畫刀（pí-tshiú-uē-to，義項數：1）
　　1. 比手畫腳。以手腳比劃，表達意思。彼个外國人欲問路，那講那比手畫刀。(那個外國人要問路，一邊說話一邊比手畫腳。)
158.	拚硬仔（piànn-ngē-á/piànn-ngī-á，義項數：1）
　　1. 克服困難，完成艱辛的工作。聽講今仔日的穡頭真歹做，我看愛拚硬仔矣。(聽說今天的工作不好做，我看要硬拚了。)
159.	飯匙鵝（pn̄g-sî-gô，義項數：1）
　　1. 面琵鷺。每年九月至十月自臺灣北方的韓國或中國的東北地區飛到南方渡冬，一直待到隔年的三月至五月。抐桮的喙若像飯匙，規身軀白蔥蔥足成鵝，所以閣共伊號做飯匙鵝。(黑面琵鷺的鳥喙像飯匙，全身潔白很像鵝，所以又取名做飯匙鵝。)
160.	玻璃清（po-lê-tshing，義項數：1）
　　1. 玻璃體。指眼球內水晶體後方的無色透明黏稠液膠狀物質，和睫狀體及網膜連接，有支撐眼球內壁的作用。人到中年目睭的玻璃清有可能會退化，目睭前會有烏影。若有這種症頭，愛去揣醫生檢查。 (人到中年眼睛的玻璃體可能會退化，眼前會有黑影。要是有這種症狀，得去找醫生檢查。)
161.	薄本（po̍h-pún，義項數：1）
　　1. 資本額少的小生意。伊大學出業了後，就轉來故鄉做一个薄本的小生理。(他大學畢業後，就回來故鄉做一個小本生意。)
162.	布底（pòo-té/pòo-tué，義項數：1）
　　1. 布料的質地。這領衫的布底是誠幼膩的棉紗，穿著袂黏身軀閣會欶汗。(這件衣服的質料是細緻的棉紗質，穿起來不黏身又會吸汗。)
163.	半挨推（puànn-e-the/puànn-ue-the，義項數：1）
　　1. 半推半就。心中早已同意，表面上卻不答應，表現出假意推辭的姿態。同學選伊做班長，伊雖然半挨推，落尾猶是答應矣。(同學選他來當班長，他雖然半推半就，最後還是答應了。)
164.	拔骨（pue̍h-kut/pui̍h-kut，義項數：1）
　　1. 發育、成長。指人在發育期間明顯長高。伊這站當咧拔骨，大甲有看著。(他這陣子在發育，明顯長高了許多。)
165.	犀牛照角（sai-gû-tsiò-kak，義項數：2）
　　1. 大眼瞪小眼。如同兩隻犀牛以犄角互瞄對方，比喻兩人怒目相視互不退讓，或是兩人意見不合，一見面就爭吵。𪜶兩个袂輸犀牛照角，見面就觸，凡若看著的人攏幌頭。(那兩人宛如犀牛對峙，一見面就吵架，凡是看到的人都搖頭嘆息。) ｜ 2. 眉目傳情。用來調侃感情恩愛夫妻或情侶，眉目傳情、相看兩不厭的表情。彼對翁仔某出門毋但手牽手，目睭閣不時都咧犀牛照角，真正予人欣羨甲。(那對夫妻出門不但十指相扣，眼神又不時互送秋波，讓人羨慕得很。)
166.	使喙（sái-tshuì，義項數：1）
　　1. 出言指揮、發號施令。社會愛分工，𠢕的人使喙，普通人出力，運作才會順序。(社會需要分工，能力強的人指揮，普通人出力，運作才會順暢。)
167.	送山（sàng-suann，義項數：1）
　　1. 送葬、送殯。送死者到墓地安葬。這禮拜我欲去共許的送山，你敢是嘛欲去送伊？(這星期日我要去參加老許的葬禮，你是不是也要去送他？)
168.	三兩下手（sann-nn̄g-ē-tshiú，義項數：1）
　　1. 三兩下子。形容動作純熟迅速，毫不費工夫即可完成某件事情。這个畫家三兩下手就共人像畫好矣。 (這個畫家三兩下子就將人像畫好了。)
169.	死毋坐認（sí-m̄-tshē-jīn/sí-m̄-tshē-līn，義項數：1）
　　1. 執意不肯承認錯誤。這件代誌明明就是你毋著，你閣死毋坐認。(這件事明明就是你的錯，你還死不認錯。)
170.	時世（sî-sè，義項數：1）
　　1.時代。咱的想法佮做法，著愛綴會著時世，才袂予人講是老古董。(我們的想法與做法，得與時俱進，才不會被人說成老古董。)
171.	射筒（siā-tâng，義項數：1）
　　1. 針筒。西醫所用注射器裝藥液的地方。伊足驚注射，便若看著護士共射筒攑出來，就會驚甲咇咇掣。(他很怕打針，只要看到護士拿出針筒，就會嚇得直發抖。)
172.	鑠奅（siak-phānn，義項數：1）
　　1. 時髦、時尚。形容人的穿著打扮或是物品非常地時髦、時尚。你今仔日滿面春風，穿甲遮爾仔鑠奅，是欲去佗位風騷咧？(你今天滿臉笑容，又穿得這麼時髦，是要去哪裡遊玩啊？)
173.	搧腹肚邊（siàn-pak-tóo-pinn，義項數：1）
　　1. 敲竹槓、敲詐、趁火打劫。藉機強迫謀取利益。聽講彼个田僑仔賣地有趁幾若億，就隨有咧走路的兄弟倚來共搧腹肚邊，敲寡所費通用。(聽說那位大地主賣地賺了好幾億，馬上就有在逃亡的道上兄弟跑來敲竹槓，訛詐些錢財花用。)
174.	相挨推（sio-e-the/ sann-ue-the，義項數：2）
　　1. 事前彼此推拖，藉詞拒絕，不願承當。代誌都未曾做咧，就按呢相挨推，有影毋是款。 (事情都還未進行，就彼此互相推諉，實在不像話。) ｜ 2. 事後相互推卸責任。代誌一下煏空，逐家就相挨推，按呢啥人欲負責？(事情敗露之後，大家就相互卸責，這樣誰要負責？)
175.	相拄頭（sio-tú-thâu，義項數：2）
　　1. 碰頭、碰面、遇見、見面。路頭路尾佮人相拄頭，準講是無蓋熟似的厝邊，嘛愛開喙相借問一下。(在半路上遇到人，即使是不太熟稔的鄰居，還是要開口問候一下。) ｜ 2. 相連、相接、毗鄰、鄰接。嘉義市佮嘉義縣佇八掌溪相拄頭。 (嘉義市跟嘉義縣在八掌溪毗鄰。)
176.	小局（sió-kio̍k，義項數：2）
　　1. 小事一樁、小場面。麵擔仔衛生無好害人客食了落屎猶小局，上害的是濫會傷身體的化學添加物，害主顧客帶身命才是夭壽。(麵攤衛生不好害顧客拉肚子還算是小事一樁，最糟糕的是加進會傷身體的化學添加物，害老顧客染上慢性病才是缺德。) ｜ 2. 小氣、不大方。做人毋通傷小局，若無，會無人緣。(為人不可以太小氣，否則，會不討人喜歡。)
177.	泅水箍仔（siû-tsuí-khoo-á，義項數：1）
　　1. 泳圈。游泳時為增加浮力所使用的橡皮圈。熱人到矣，有真濟人紮泅水箍仔去海邊仔耍水。(夏天到了，有許多人帶游泳圈去海邊戲水。)
178.	酸甘（sng-kam/ sng-lam，義項數：1）
　　1. 味道酸酸甜甜。時計果食著酸甘酸甘。(百香果吃起來酸酸甜甜的。)
179.	所擺（sóo-pái，義項數：1）
　　1. 所以、以至於。用來連接前後句的因果關係，常與「因為」、「雖罔」連用。因為伊枵過飢閣生狂食，所擺胃腸袂堪得，這陣咧喝腹肚疼矣。(因為他餓過頭又吃太急，以至於腸胃受不了，正在喊肚子痛。)
180.	素色（sòo-sik，義項數：1）
　　1. 白色、素色、淡雅的顏色。烏肉底的阿雪穿素色的衫，看著誠蔭肉。(皮膚黝黑的阿雪穿起素色的衣服，看起來皮膚的明亮度提高了。)
181.	素常（sòo-siông，義項數：1）
　　1. 平常、平時。阿母素常佇食暗飽會去外口行行踅踅咧。(媽媽平常在晚飯後會出去外面走一走晃一晃。)
182.	事尾（sū-bué/sū-bé，義項數：1）
　　1. 餘波。事件結束後留下的影響。若有心欲和解，袂使干焦會失禮就準過，對方損失偌濟嘛愛賠人，較袂有事尾。(若有誠意想和解，不能只道歉就想息事寧人，對方損失多少也得賠償，才不會有後遺症。)
183.	沙肺（sua-hì，義項數：1）
　　1. 塵肺症、矽肺症。一種職業病，因長期吸入各種塵埃、微粒，所引起肺部病變的統稱。阿明長期佇炭空作穡，攏無照規定咧澍水、掛喙罨，年久月深就致著沙肺。(小明長期在煤礦坑裡工作，都不依照規定噴水霧、戴口罩，久而久之就罹患塵肺症。)
184.	紲攤（suà-thuann，義項數：1）
　　1. 續攤。聚會結束後，接著下一個應酬或活動。這攤啉煞，咱敢欲閣紲攤？(這場喝完之後，我們還要續攤嗎？)
185.	煞工（suah-kang，義項數：1）
　　1. 下班、工作結束。麻煩你佇今仔日煞工進前共計畫書交予我。(麻煩你在今天下班前將計畫書交給我。)
186.	散掖掖（suànn-iā-iā，義項數：1）
　　1. 散亂。物件用了愛囥轉去原位，才袂一四界散掖掖。(物品使用後要放回原位，才不會到處一片凌亂。)
187.	衰頹（sue-tuê，義項數：1）
　　1. 衰敗、式微。事業或運勢衰微頹廢。自從老頭家過身了後，這个家族就漸漸衰頹矣。(自從老當家過世後，這個家族就漸漸沒落了。)
188.	捽後炮（sut-āu-phàu，義項數：2）
　　1. 暗箭傷人。伊佮我是相黏蒂帶的好朋友，料袂到伊煞共我捽後炮。(他和我是很親密的好朋友，萬萬沒想到卻暗地裡傷害我。) ｜ 2. 放馬後炮。代誌過去矣才咧捽後炮。(事情過去了才放馬後炮。)
189.	擔帶（tam-tài，義項數：1）
　　1. 負責、承當。這款細項代誌閣著愛經理出面來擔帶，今公司遐的幹部敢攏無才調解決是毋？(這種小事情還要經理出面來負責，現在公司的那些幹部難道都沒辦法解決嗎？)
190.	銅鼎仔（tâng-tiánn-á，義項數：1）
　　1. 炊具。統稱烹飪用的鍋具。灶跤的銅鼎仔便若用過，一定愛洗予清氣，才通收起來囥。(廚房的炊具只要用過，絕對要把它洗乾淨，才能收起來。)
191.	重篤篤（tāng-tauh-tauh，義項數：1）
　　1. 非常重。黃金博物館彼塊金仔角重篤篤，到今猶無人搬會振動得。(黃金博物館裡的那塊金塊非常的重，至今還沒有人能搬得動。)
192.	通好（thang-hó，義項數：1）
　　1. 俾能、以便、便於。手面去洗洗咧，通好食飯。(手和臉去洗一洗，以便吃飯。)
193.	體剔（thé-thak/thué-thak，義項數：1）
　　1. 責備、責罵。伊開喙就欲共人體剔，莫怪無人愛佮伊來去。(他開口就責罵人，難怪沒人想跟他往來。)
194.	疼風（thiànn-hong，義項數：1）
　　1. 痛風。病名。是一種因嘌呤代謝障礙，尿酸的結晶沈積在關節內，進而產生嚴重的關節發炎反應。有疼風的人愛忌喙，腹內、蚶仔佮蚵仔較莫食咧。(患有痛風的人要忌口，內臟、蛤蜊、牡蠣盡量不要吃。)
195.	𤶃仔子（thiāu-á-tsí，義項數：1）
　　1. 青春痘。你發遐濟𤶃仔子，著較莫食傷燥的物件。(你長那麼多的青春痘，應該少吃過於燥熱的東西。)
196.	逞性（thíng-sìng，義項數：3）
　　1. 逞強。有偌濟力，就做偌濟代誌，千萬毋通逞性。(凡事量力而為，千萬不可逞強。) ｜ 2. 任性、隨便。逞性的人較歹鬥陣。(任性的人較難相處。) ｜ 3. 得寸進尺、貪得無厭。你甲得著好處著愛知足矣，莫傷逞性，閣欲要求遐濟。(你既然得到好處就要知足了，別再得寸進尺，貪求更多。)
197.	討衰（thó-sue，義項數：1）
　　1. 自己招惹來的霉運或別人不友善的對待。人曷無請你，你煞家己坐起去大位，你是咧討衰是無？(人家沒請你，你卻自己跑去坐主位，你是在自討沒趣嗎？)
198.	拖帆（thua-phâng，義項數：1）
　　1. 形容人做事拖泥帶水。伊做代誌誠𠢕拖帆，定定佇交貨期限彼工才咧趕工。(他做事情很會拖拖拉拉，常在交貨期限當日才加快工作速度。)
199.	炭工（thuànn-kang，義項數：1）
　　1. 礦工。本指採煤炭工人，後泛指採礦工人。伊捌佇礦業公司做炭工咧挖金仔礦。(他曾經在礦業公司當礦工開採金礦。)
200.	推排（thui-pâi，義項數：1）
　　1. 處置安排。代誌會遮爾順序，攏是你𠢕推排。(事情會這麼順利，都是你很懂得處置安排。)
201.	摘抄（tiah-tshau，義項數：1）
　　1. 摘錄。經過選擇後抄寫紀錄。伊當咧無閒摘抄通過檢定的名單。(他正忙著摘錄通過檢定的名單。)
202.	恬才（tiām-tsâi，義項數：1）
　　1. 誠實莊重，行事規矩。恬才的人才做有好頭路。(誠實莊重的人才能把工作做好。)
203.	恬喌喌（tiām-tsiuh-tsiuh，義項數：2）
　　1. 寂靜、鴉雀無聲。頭家若受氣起來，員工就攏恬喌喌出在伊罵。(老闆如果生氣，員工就靜靜地讓他罵。) ｜ 2. 個性靜默、非常安靜。恁囝真乖，規工恬喌喌坐佇膨椅看尪仔冊，攏袂吵人。(你兒子很乖，整天安安靜靜坐在沙發上看漫畫，都不會吵到別人。)
204.	中聽（tìng-thiann，義項數：1）
　　1. 中聽。好聽，聽來悅耳、讓人滿意。業務員講的話若中聽，業績一定會較好。(業務員說的話如果中聽，業績一定會比較好。)
205.	定規（tīng-kui，義項數：1）
　　1. 必定、必然、肯定。今仔日定規愛共這項代誌辦予好勢。(今天一定要把這件事情處理好。)
206.	中站（tiong-tsām，義項數：2）
　　1. 半途、半路。路程的一半。阮去公園散步，行到中站，看著人咧弄布袋戲尪仔，有影誠心適。(我們到公園散步，走到半路，看到有人在操弄布袋戲偶，非常有趣。) ｜ 2. 中途，中間。事情進行的中間。會開到中站的時，董事長宣佈明年薪水加五pha，逐家聽了攏誠歡喜。(會議開到中途時，董事長宣佈明年加薪百分之五，大家聽了都非常開心。)
207.	轉氣（tńg-khuì，義項數：2）
　　1. 呼吸換氣。久無運動，小可仔走一下就喘甲袂得轉氣。(太久沒運動，稍微跑一下就喘不過氣來。) ｜ 2. 手氣變好。進前的生理真䆀，這馬總算轉氣矣。(之前的生意很差，現在總算好轉了。)
208.	長尾山娘（tn̂g-bué-suann-niû/tn̂g-bé-suann-niû，義項數：1）
　　1. 臺灣藍鵲。阮去𬦰山的時，有看著幾若隻長尾山娘。(我們去爬山的時候，看到了好幾隻臺灣藍鵲。)
209.	斷站（tn̄g-tsām，義項數：1）
　　1. 指做某件事或工程，因故於進行中停止或擱置。這个工程因為疫情的關係煞斷站去，毋知當時才會閣再振動。(這個工程因為疫情的關係中斷掉了，不曉得何時才會再動工。)
210.	倒頭生（tò-thâu-senn/tò-thâu-sinn，義項數：1）
　　1. 逆產、臀位分娩。古早時代，若是倒頭生，母仔囝定定會無性命。(以前，若是足位分娩，母子常會失去生命。)
211.	同窗會（tông-tshong-huē，義項數：1）
　　1. 同學會。指畢業後同學們為維繫情誼舉辦的聚會。昨昏我轉去故鄉參加同窗會，拄著足久無聯絡的同窗的，足歡喜的！(昨天我回去故鄉參加同學會，遇到久未聯絡的同學，很開心！)
212.	纘（tsàn，義項數：1）
　　1. 承接。忍、撐。我看伊咧欲纘袂牢矣，你緊猛去共扶一下。(我看他快支撐不住了，你趕快去扶他一下。)
213.	贊喙（tsàn-tshuì，義項數：1）
　　1. 敲邊鼓、聲援。孤伊一个人唱聲，無人贊喙。(就他一個人撂狠話，沒人聲援。)
214.	實捅捅（tsa̍t-thóng-thóng，義項數：3）
　　1. 形容人或物塞得極滿，毫無空隙。下班時間，逐幫車攏櫼甲實捅捅。(下班時間，每班車都擠得水洩不通。) ｜ 2. 形容人愚鈍不知變通。伊的頭殼實捅捅，做代誌定定袂曉變通。(他頭腦愚鈍，做事常常不知變通。) ｜ 3. 指充滿心事，顧不得其他的事。伊想甲心肝實捅捅，毋知欲按怎才好。(他想得滿心憂慮，不知道怎麼辦才好。)
215.	插車（tshah-tshia，義項數：1）
　　1. 停車。找空位停放車子。阮老母足𠢕插車，閣較細的格仔位伊攏有才調共車停入去。(我媽媽很會停車，再小的停車格，他都有本事把車停進去。)
216.	臭生荒（tshàu-tshenn-hng/tshàu-tshinn-hng，義項數：1）
　　1. 荒置、廢棄任其荒涼。彼塊田地無人種作，放咧臭生荒，誠無彩。(那塊田地因為無人耕種，放著任其荒廢，真是可惜。)
217.	脆命（tshè-miā，義項數：1）
　　1. 短命。生命力弱。狗蟻足脆命，無細膩就予人踏死。(螞蟻很容易死掉，一不小心就會被踩死。)
218.	冊桌仔（tsheh-toh-á，義項數：1）
　　1. 書桌。讀書用的桌子。阮阿母買一塊新的冊桌仔，欲予我看冊佮寫宿題較利便。(我媽媽買了一張新的書桌，方便我看書跟寫功課。)
219.	生猴（tshenn-kâu/tshinn-kâu，義項數：2）
　　1. 急性子、冒失、慌張。形容人個性急躁、魯莽或做事粗率、不謹慎。做代誌毋通傷生猴，勻勻仔做較袂脫箠。(做事情不要慌慌張張，謹慎地做比較不容易出差錯。) ｜ 2. 生手、新手。指剛進職場，對某種事務的經驗或技術不純熟的人。頭家叫我牽彼个拄來上班的生猴，講著愛較有耐心咧。(老闆要我引導那個剛來上班的新手，說得要有耐心一些。)
220.	生凊風（tshenn-tshìn-hong/tshinn-tshìn-hong，義項數：1）
　　1. 陰風、寒風、冷風。寒流一下來，生凊風鑽入骨縫，予人強欲接載袂牢。(寒流一來，冷風刺入骨頭的縫隙，讓人快要支撐不住。)
221.	刺夯夯（tshì-giâ-giâ，義項數：1）
　　1. 形容咄咄逼人、張牙舞爪的樣子。咱佮人鬥陣，若是講著話就刺夯夯，定定會去得失人。(我們與人交際往來，倘若一說話就咄咄逼人，常會得罪人。)
222.	捙桶倒（tshia-tháng-tò，義項數：1）
　　1. 大雨傾盆而下。過晝無偌久，一陣西北雨捙桶倒，隨淹過較低的坑溝佮圳仔。(午後沒多久，一場雷陣雨傾盆而下，即刻淹過較低窪的山溝和水圳。)
223.	捙蛆（tshia-tshi，義項數：2）
　　1. 孑孓，蚊子的幼蟲。溝仔愛較捷清咧，才袂積水生捙蛆。(水溝要常清理，才不會積水長出孑孓。) ｜ 2. 形容小孩過動、躁動的樣子。有一寡囡仔上課攏坐袂牢，親像一尾蟲按呢蟯蟯趖，實在足捙蛆。(有一些孩子上課都坐不住，就像蟲一樣動個不停，實在很躁動。)
224.	唱注（tshiàng-tù，義項數：1）
　　1. 叫囂、揚言。對某人口出狂言，並帶有挑釁意味。對方共我唱注，講這擺比賽𪜶一定會著冠軍。(對方向我叫囂，說這次比賽他們一定會得冠軍。)
225.	晟持（tshiânn-tî，義項數：1）
　　1. 養育、撫養、扶養。伊一下出世就予人放捒，佳哉有牧師佮牧師娘共伊晟持大漢。(他一出生就被人拋棄，幸好有牧師夫妻將他扶養長大。)
226.	觸（tshik，義項數：3）
　　1. 違逆、辜負。違逆別人的想法或辜負他人。阿瑋共你招遐濟擺，你煞按呢直直挨推，無的確會去觸著人的好意。(阿瑋邀了你那麼多次，你卻這樣一再推辭，說不定會辜負人家的一片好意。) ｜ 2. 冒犯、觸犯。觸著鬼(冒犯到鬼) ｜ 3. 遇到凶兆、遭遇厄運及災難。這款歹吉兆的代誌，觸著的人攏會衰甲頭殼滴著鳥仔屎。(這種不吉利的事情，遇到的人都會倒霉到被鳥屎滴到頭頂。)
227.	凊面（tshìn-bīn，義項數：1）
　　1. 冷漠不親切的表情。凶惡、憤怒或難看的臉色。伊定定激一个凊面予人看，人緣呔會好？ (他常常臭臉待人，人緣怎麼會好？)
228.	清菜（tshing-tshài，義項數：1）
　　1. 素菜。素食菜餚。現代人講究健康佮環保，開始食清菜的人那來那濟。(現代人講求健康與環保，開始吃素的人口越來越多。)
229.	手門（tshiú-mn̂g，義項數：2）
　　1. 虎口。手部大拇指與食指相連的部位。頭殼若咧楞的時，共手門的穴道揤揤、掠掠咧，會當減輕無爽快的症頭。(頭暈的時候，把手掌虎口的穴道按一按、抓一抓，可以減輕不舒適的症狀。) ｜ 2. 虎口、手臂的力量。夯石碾會當練手骨的筋肉佮手門的力頭。(舉重可以鍛練手臂的肌肉和虎口的力道。)
230.	粗跤重蹄（tshoo-kha-tāng-tê/tshoo-kha-tāng-tuê，義項數：1）
　　1. 笨手笨腳。伊咧做代誌粗跤重蹄，較幼路的工課毋通交代予伊。(他做事情笨手笨腳的，別把精細的工作交代給他。)
231.	粗糠耳（tshoo-khng-hīnn/tshoo-khng-hī，義項數：1）
　　1. 乾耳朵。易排出乾性耳垢的耳朵。大多數的人攏是粗糠耳。(大多數的人都是乾耳朵。)
232.	粗耙耙（tshoo-pê-pê，義項數：1）
　　1. 粗糙、不平滑的。阿母的手做粗重，閣欠保養，皮膚變甲粗耙耙。(媽媽的手做粗重的事，又沒保養，皮膚變得粗糙不平滑。)
233.	粗本（tshoo-pún，義項數：1）
　　1. 資本雄厚。開建設公司是粗本的投資，你嘛真冇手，一下就共答應。(開建設公司是資本雄厚的投資，你手頭也真寬鬆，一下子就答應。)
234.	粗絲（tshoo-si，義項數：1）
　　1. 形容食用蔬果時，其纖維有粗糙的感覺。這盤芹菜柯柯，食著較粗絲。(這盤芹菜有點老，吃起來纖維比較粗糙。)
235.	揣食（tshuē-tsia̍h/tshē-tsia̍h，義項數：1）
　　1. 覓食。尋找食物。規陣粟鳥仔佇草埔跳來跳去咧揣食。(一群麻雀在草地上跳來跳去正在覓食。)
236.	喙扁（tshuì-pínn，義項數：1）
　　1. 啞口無言、無話可說。伊寢頭佇遐講大聲話，有夠臭屁，尾仔予人掠著伊講的毋是實在話才喙扁。(他一開始在那裡說大話，神氣得很，後來被人逮到說的不是實話才啞口無言。)
237.	出腳（tshut-kioh，義項數：1）
　　1. 出人頭地、出類拔萃。喻人才能出眾，高出一般人之上。伊大學出業了後，佇厝裡誠拚勢讀冊，無偌久就考牢司法官，這陣出腳矣。(他大學畢業後，在家很努力讀書，沒多久就考上司法官，現在可說是出人頭地了。)
238.	出人前（tshut-lâng-tsîng/ tshut-lâng-tsiân，義項數：2）
　　1. 才能特出，超越眾人。錢銀幾萬千，毋值囝孫出人前。(錢財幾千萬，都不如子孫才能出眾。) ｜ 2. 小孩子到公眾場合不怕陌生。這个囡仔上台演講真在，有影出人前。(這個孩子上台演講台風穩健，果然是不怕生。)
239.	支理（tsi-lí，義項數：2）
　　1. 支付、付款。負擔費用。有一寡風景區對超過六十五歲的老大人，門票會當優待免支理。(有一些風景區對超過六十五歲的長輩，有免收門票的優惠。) ｜ 2. 接手處理款項或事務。食老矣，厝裡的代誌攏放予少年的去支理矣。(年紀大了，家裡的事情都交給年輕人去處理了。)
240.	食老本（tsia̍h-lāu-pún，義項數：1）
　　1. 吃老本。比喻人憑恃昔日的儲蓄與本領來過日子。佳哉伊較早趁的錢有儉起來，這馬無囡仔欲共飼，猶會當食老本。(還好他之前賺的錢有存起來，現在沒有孩子要扶養他，還可以吃老本。)
241.	成款（tsiânn-khuán，義項數：1）
　　1. 像樣。達到令人滿意的樣子。爸母若有認真管教，囡仔一定會成款。(父母要是認真管教，小孩一定會像樣。)
242.	齊透（tsiâu-thàu，義項數：2）
　　1. 齊備、齊全。若欲招伴去𬦰懸山，物件佮裝備愛攢有齊透才通出門，較袂有代誌。(如果要找同伴去爬高山，物品和裝備要樣樣齊備才能出門，比較不會有事情。) ｜ 2. 透澈。欲做科技創新，理論愛先學予齊透才有可能達成目標。(想做科技創新，理論要先學透澈了才可能達成目標。)
243.	茈鳥仔（tsínn-tsiáu-á，義項數：2）
　　1. 指對事物或工作尚不熟悉、缺乏經驗的新人。伊是拄入來咱公司的茈鳥仔，逐項猶無啥捌，勞煩逐家費神共伊照顧囉。(他是剛進來我們公司的新人，凡事都還不太清楚，麻煩大家費神照顧他囉。) ｜ 2. 指無經驗的少年人。拄才出社會的茈鳥仔，著愛認真拍拚才有好前途。(剛出社會的新鮮人，要認真努力工作才有好前途。)
244.	錢額（tsînn-gia̍h，義項數：1）
　　1. 金額；錢的額度。你銀行口座內底的錢額無夠，毋才水電錢無法度對內底扣。(你銀行帳戶裡面的金額不夠，所以水電費沒辦法從裡面扣款。)
245.	執硬（tsip-ngē/tsip-ngī，義項數：1）
　　1. 頑固、固執。堅持己見不知變通，抵死也不改變。伊這款執硬的性癖若攏毋改，緊縒慢會食著鹼。(他這種固執不知變通的個性若不改變，早晚會吃到苦頭。)
246.	一下仔（tsi̍t-ē-á，義項數：1）
　　1. 一下子、一會兒。表示極短的時間。伊跤手真猛掠，遮爾濟工課一下仔就完成矣。(他手腳很伶俐，這麼多工作一下子就完成了。)
247.	一步取（tsi̍t-pōo-tshú，義項數：1）
　　1. 一個可取之處。伊是較貧惰讀冊爾爾，毋過猶有一步取，就是做工課真頂真。(他是比較懶得讀書而已，不過還有一個可取之處，就是工作很細心。)
248.	這氣（tsit-khuì，義項數：1）
　　1. 這次、這回、最近、這陣子。距離說話前後不久的日子。這氣的果子大豐收。(這次的水果大豐收。)
249.	咒死絕誓（tsiù-sí-tse̍h-tsuā，義項數：1）
　　1. 發誓、發毒誓。警察佇彼間茶行搜著提煉毒品的原料佮家私，頭家咒死絕誓講伊是予人冤枉的。(警方在那間茶行查獲製煉毒品的原料佮家私，老闆發毒誓說他是被冤枉的。)
250.	上範（tsiūnn-pān，義項數：2）
　　1. 像樣。𪜶兜遐濟囡仔內底，干焦伊較上範。(他們家眾多的小孩裡面，只有他比較像樣。) ｜ 2. 得體。達到令人滿意的水準。咱欲去大間公司允頭路，愛穿較成樣的西裝才會上範。(我們要去大的公司面試，要穿比較像樣的西裝穿才算得體。)
251.	上算（tsiūnn-sǹg，義項數：3）
　　1. 計算數量。常用於列入帳目或計入人數。𪜶兩个上算的人額無仝，愛閣重頭來算。 (他們兩位計算的人數不同，要再重算。) ｜ 2. 有用途的、值得肯定的或有價值的。佇臺南揣會著誠濟上算的景點，咱做伙來去遐𨑨迌。(在臺南可以找到很多值得探訪的景點，我們一起去那裡遊玩。) ｜ 3. 合算、划算。這本出版無偌久的辭典當咧喝俗賣，現此時來買真上算。(這本出版沒多久的辭典正在打折出賣，現在買很划算。)
252.	庄跤人（tsng-kha-lâng，義項數：1）
　　1. 鄉下人。指居住在鄉村的人。真濟庄跤人為著生活，來佇都市趁食。(很多鄉下人為了生計，來到都市賺錢過活。)
253.	做唯是（tsò-bî-sī/tsuè-bî-sī/ tsò-bī-sī/tsuè-bī-sī，義項數：1）
　　1. 索性、乾脆、只管…就是。四界攏咧窒車，做唯是用行的較緊。(到處都在塞車，乾脆用走的比較快。)
254.	做兵（tsò-ping/tsuè-ping，義項數：1）
　　1. 服兵役。伊今年若閣考袂牢大學，這聲無去做兵袂煞矣。(他今年如果又考不上大學，這下子必定要當兵了。)
255.	做體藝（tsò-thé-gē/tsuè-thé-guē，義項數：1）
　　1. 當成消遣在做，半做半玩來消磨時間。阿榮仔退休了後，逐工閒仙仙，共後生鬥顧店罔做體藝，順紲看頭看尾。(阿榮退休以後，成天閒著，幫兒子看店當做消遣，順便瞻前顧後有個照應。)
256.	做前（tsò-tsîng/tsuè-tsîng，義項數：2）
　　1. 領頭、帶領。予知路的人做前，咱綴尾後。(讓認得路的人帶頭，我們跟在後面。) ｜ 2. 當前鋒、趕在前頭。好空的伊攏搶做前，若歹空的伊就覕甲無看見影。(撈得到好處的事他都搶在前面，沒好處可撈的他就躲得不見蹤影。)
257.	皂烏漆白（tsō-oo-tshat-pe̍h，義項數：1）
　　1. 抹黑、造謠；不實的指控。選舉的時陣，電視、報紙共候選人皂烏漆白的事件不止仔濟，才予咱好歹人攏分袂清楚。(選舉期間，電視、報紙抹黑候選人的事件特別多，才讓我們好人壞人都分不清楚。)
258.	總根頭（tsóng-kin-thâu/tsóng-kun-thâu，義項數：1）
　　1. 要因。導致某種結果的最主要原因。欲解決問題，愛先揣著問題的總根頭。(要解決問題，得先找出問題的要因。)
259.	注血（tsù-hueh/tsù-huih，義項數：1）
　　1. 輸血。將血液注到人體內。伊出車禍傷甲真食力，醫生講流傷濟血著愛緊共伊注血，若無會無命去。(他出車禍受重傷，醫生說流太多血要緊急輸血，不然會沒命。)
260.	水洘（tsuí-khó，義項數：1）
　　1. 退潮。水洘了後，海埔頂四常看會著螺仔。(退潮之後，沙灘上經常看得到小海螺。)
261.	水帕（tsuí-phè，義項數：1）
　　1. 羊水、胎膜。聽講伊是佇火車頂生的，因由是𪜶母仔坐火車的時水帕雄雄破去，拄好有旅客是醫生，緊猛走來鬥相共，佳哉母仔囝攏平安無代誌。(聽說他是在火車上出生的，因為他媽媽搭火車的時候羊水突然破了，恰好有旅客是醫師，趕緊跑來幫忙，幸好母子都平安無事。)
262.	大木（tuā-ba̍k，義項數：1）
　　1. 建築房屋的木工。這馬起厝攏縛鐵仔，灌khōng-ku-lí，無人咧做大木矣。(現在蓋房子都綁鋼筋、灌混凝土，沒有人做蓋房子的木匠了。)
263.	大日虎（tuā-ji̍t-hóo/tuā-li̍t-hóo，義項數：1）
　　1. 烈日。這陣當咧出大日虎，咱上好莫出去，較袂著痧。(現在正值烈日當空，我們最好不要出門，以免中暑。)
264.	大細漢（tuā-sè-hàn/tuā-suè-hàn，義項數：2）
　　1. 一家大小。阿媽逐擺去廟裡拜拜，攏會祈求厝裡大細漢平安順序。(奶奶每次去廟裡拜拜，都會祈求一家大小平安順利。) ｜ 2. 童叟。小孩和老人。做生理愛老實，大細漢攏袂使共人偏。(做生意要老實，童叟無欺。)
265.	大厝起（tuā-tshù-khí，義項數：1）
　　1. 三合院。大厝起的埕斗是以早曝粟的所在。(三合院的內埕是以前曬稻子的地方。)
266.	大食（tuā-tsia̍h，義項數：1）
　　1. 指食量很大。較早作田人攏放伴割稻仔，人若來鬥相共，愛攢三頓佮點心予人食，閣袂使驚人大食。(從前農人都輪流協助割稻子，人家如果來幫忙，要準備三餐跟點心給人家吃，還不能怕人家食量大。)
267.	對面風（tuì-bīn-hong，義項數：1）
　　1. 逆風。迎面而來的風。雄雄一陣對面風搧來，害我強欲徛袂在。(猛然一陣迎面風吹過來，害我差點站不穩。)
268.	對路（tuì-lōo，義項數：3）
　　1. 對症、有效。藥仔若是有對路，一帖就會行氣。(如果能夠對症下藥，只需一帖就有功效。) ｜ 2. 面向馬路。大門對路，上適合開店做生理。(大門面向馬路，最適合開店做生意。) ｜ 3. 陸運。從陸路運貨。若對路運貨，會並水路加較緊。(如果從陸路運貨，會比海路運貨快多了。)
269.	對摵（tuì-tshi̍k，義項數：1）
　　1. 折衷。這件糾紛經過宗親序大對摵，兩爿攏有讓寡，代誌才煞去。(這項糾紛透過親族長輩折衷縱橫，雙方都有退讓一些，事情才得以解決。)
270.	鈍跤鈍手（tūn-kha-tūn-tshiú，義項數：1）
　　1. 笨手笨腳。形容動作或手腳不靈活。伊拄學電腦的時鈍跤鈍手，不而過這馬已經學甲真老矣。(他剛學電腦時笨手笨腳的，不過現在已經學得非常熟練了。)
271.	有局（ū-kio̍k，義項數：1）
　　1. 有意思、有趣。六月天講咧落大雪，實在誠有局。(六月的大熱天竟在下大雪，實在很有趣。)
272.	有紲（ū-suà，義項數：1）
　　1. 興致高昂、情緒熱烈。若講著選舉佮政治，伊就一支喙若機關銃，愈講愈有紲，真正無伊法。(一談到選舉跟政治，他的嘴就如機關槍，愈說愈起勁，真是拿他沒辦法。)
273.	有路來（ū-lōo-lâi，義項數：1）
　　1. 有辦法、做得來。修理電腦，伊是專門的，當然做有路來。(修理電腦，他是專業的，當然有辦法做。)
274.	緩期（uān-kî，義項數：1）
　　1. 延期。延後原本所預定的期程。受著疫情的影響，致使真濟活動緩期。(受到疫情的影響，導致很多活動延期。)
275.	換喙（uānn-tshuì，義項數：2）
　　1. 變換食物的口味。食魚食肉，嘛著菜佮，攏無換喙敢好？(吃魚吃肉，蔬菜也要配合著吃，都沒有變化口味好嗎？) ｜ 2. 改口、改稱，關係改變的時候改換稱呼。你今都嫁予志明矣，這馬愛換喙叫𪜶兄嫂「大嫂」毋才著。(你現今都嫁給志明了，現在該改口叫他的嫂嫂「大嫂」才對。)
276.	話仁（uē-jîn/uē-lîn，義項數：1）
　　1. 俏皮話、滑稽話。喙講話仁咧激話仁。(嘴裡說著俏皮話在插科打諢。)
277.	畫山畫水（uē-san-uē-suí，義項數：1）
　　1. 本指描繪山水風景，後用來比喻說話說得天花亂墜、不切實際。見若欲選舉，畫山畫水的候選人濟甲窒倒街，咱目睭愛擘予金，毋通予𪜶騙去。(每當要選舉，大吹法螺的候選人不勝枚舉，我們務必要睜大眼睛，不要被他們騙了。)
278.	畏羞人（uì-siáu-jîn/uì-siáu-lîn，義項數：1）
　　1. 害羞、靦腆。𪜶兜上細漢的囡仔看著生份人攏較畏羞人，毋敢主動佮人相借問。(他們家最小的孩子看到陌生人都比較害羞，不敢主動跟別人打招呼。)
279.	勻聊仔（ûn-liâu-á，義項數：1）
　　1. 慢慢地、謹慎小心地。山路坎坎坷坷真歹行，你著勻聊仔行。(山路崎嶇不平很難走，你要慢慢地走。)

𓆜𓆝𓆞𓆟𓆞𓆜𓆝𓆞𓆟𓆝𓆞𓆜𓆝𓆟𓆜𓆝𓆞𓆟
【資料庫3：教育部台語辭典俗諺】
序號	俗諺	羅馬拼音	華語釋義

1.	鴨仔聽雷。
　　Ah-á thiann luî.	指鴨子聽到雷聲，並不知道是怎麼回事。比喻一個人對所接收的訊息無法理解。 比喻一個人對所接收的訊息無法理解。
2.	愛拚才會贏。
　　Ài piànn tsiah ē iânn.	要努力才會贏。比喻唯有努力奮鬥，才能克服困難，成就一番事業。
3.	愛媠毋驚流鼻水。
　　Ài-suí m̄ kiann lâu phīnn-tsuí.	為了展示自己姣好的身材，天氣再冷，寧可挨寒受凍，也不願多穿衣服。常用以揶揄女性愛美，寧可付出代價，也在所不惜。
4.	暗頓減食一口，活甲九十九。
　　Àm-tǹg kiám tsia̍h tsi̍t kháu, ua̍h kah káu-tsa̍p-káu.	晚餐少吃一口，活到九十九。說明晚餐的食用量少一點，有益身體健康。
5.	翁仔某是相欠債。
　　Ang-á-bóo sī sio-khiàm-tsè.	今世有緣結為夫妻，乃因前世因果，互相欠債所致。夫妻意見不合相互爭吵時，常用這句話來勸雙方姻緣前定，應以和為貴。
6.	翁某若仝心，烏塗變成金。
　　Ang-bóo nā kāng-sim, oo-thôo piàn-sîng kim.	夫妻若同心協力，沒有價值的黑土都能變成高價值的東西。比喻夫妻和諧，一起努力，任何事都可成就。
7.	尪姨順話尾，假童害眾人。
　　Ang-î sūn uē-bué, ké tâng hāi tsìng-lâng.	靈媒會順著對方的心意說話，假冒之乩童故意裝神弄鬼來欺騙人。此指靈媒、乩童借揣摩情況來決定說話的內容，而人也因輕信巫術鬼神而身受其害。
8.	翁親某親，老婆仔拋捙輪。
　　Ang tshin bóo tshin, lāu-pô-á pha-tshia-lin.	夫妻恩愛，老婆婆翻筋斗也不管。「老婆仔」是指年邁的母親，「拋捙輪」是翻筋斗，這裡指老母親跌倒了在地上打滾，子女卻置之腦後、棄之不顧。整句比喻夫妻二人恩恩愛愛，置年邁雙親於不顧。
9.	紅媠，烏大範。
　　Âng suí, oo tuā-pān.	紅色美麗，黑色大方。形容人衣著色彩，紅色顯得鮮豔亮麗，黑色呈現高貴大方，有氣質、有風味。也可指衣服之外的東西。
10.	䆀猴𠢕欠數。
　　Bái-kâu gâu khiàm-siàu.	難纏的客人愛賒帳。形容人外型不佳又愛賒帳。
11.	目睭花花，匏仔看做菜瓜。
　　Ba̍k-tsiu hue-hue, pû-á khuànn-tsò tshài-kue.	眼睛看不清楚，瓠瓜看成絲瓜。嘲笑別人一時恍神，把形狀相近的物品看成別的東西。
12.	目睭看懸，無看低。
　　Ba̍k-tsiu khuànn-kuân, bô khuànn-kē.	眼睛長在頭頂上，看上不看下。形容人走路不看路。 引申為人勢利，看不起身分較低的人。
13.	目睭看佇粿，跤踏著火。
　　Ba̍k-tsiu khuànn tī kué, kha ta̍h-tio̍h hué.	眼睛看著糕品，腳踩到火。用來勸人做事不要只顧當前的好處，而忘了週遭的危險，以免身陷險境而不知。
14.	目睭金金人傷重。
　　Ba̍k-tsiu kim-kim lâng siong-tiōng.	眼睛睜大，病情嚴重。形容人病得很嚴重，只能張大眼睛，無法動彈；也用來比喻遇到事情束手無策，只能乾瞪眼而沒辦法處理。
15.	目睭掛斗概，看人物就愛。
　　Ba̍k-tsiu kuà táu-kài, khuànn lâng mi̍h tō ài.	眼睛掛著平斗的木概，看到別人的東西就想要。用來形容人過於貪心。以前用「斗」來測量穀物豆類等東西的份量，斗概是一長形木條，用來把斗口高出的部分撥平以得到準確的量。販售商人的習慣是只往內撥、不往外撥，有招財之意。所以用眼睛掛著斗概，來比喻想把別人的東西納為己有的貪婪心態。
16.	慢牛厚屎尿。
　　Bān gû kāu-sái-jiō.	行動遲緩的牛屎尿多。比喻懶惰的人做事不乾脆，常找藉口逃避或延遲該盡的責任。
17.	萬事起頭難。
　　Bān-sū khí-thâu lân.	一切事情開頭階段都很困難。意指事情剛開始的時候，都比較困難，只要不放棄，繼續做，久了就會順手、熟練。
18.	買賣算分，相請無論。
　　Bé-bē sǹg hun, sio-tshiánn bô lūn.	做生意就得把帳目算個清楚，至於請客吃飯，則無需計較。說明生意與交情的界線理應分明。
19.	買田愛揀好田底，娶某愛揀好娘嬭。
　　Bé tshân ài kíng hó tshân té, tshuā-bóo ài kíng hó niû-lé.	買田地，要慎選土質好的田地；娶老婆，要先觀察女方母親之行為舉止。意即有其母必有其女，用來說明選妻子時對方家教的重要。
20.	買厝，買厝邊。
　　Bé tshù, bé tshù-pinn.	買房子要慎選好鄰居。強調選擇住家時，鄰居的好壞至關重要。
21.	袂曉剃頭，拄著鬍鬚。
　　Bē-hiáu thì-thâu, tú-tio̍h hôo-tshiu.	不會理髮，遇到大鬍子。理髮師技術還不夠純熟，首次上場就遇到一個大鬍子的客人，以致於手忙腳亂，不知道該如何是好。比喻在經驗不足的情況下，偏偏碰上了棘手的難題。
22.	賣茶講茶芳，賣花講花紅。
　　Bē tê kóng tê phang, bē hue kóng hue âng.	賣茶葉的人強調自己賣的茶葉有多香；賣花的人強調自己賣的花顏色有多麼的鮮豔。比喻為了要把自己的產品推銷出去，生意人總會強調其產品具有什麼特色，藉此吸引顧客的目光。比喻老王賣瓜，自賣自誇。
23.	欲好額等後世，欲做官學做戲。
　　Beh hó-gia̍h tán āu-sì, beh tsò-kuann o̍h tsò-hì.	如果想發財就等下輩子，如果想當官，去戲班子演戲就能過乾癮。諷刺人此生再無致富與升官的機會，有時也用來自嘲。
24.	無米有舂臼，無囝抱新婦。
　　Bô bí ū tsing-khū, bô kiánn phō sin-pū.	沒有米卻有搗米的臼；沒有兒子領養一個童養媳。形容人只會做白日夢，不切實際。
25.	無牛駛馬。
　　Bô gû sái bé.	沒有牛只能用馬匹來替代。形容退而求其次，暫且代用的無奈。
26.	無魚，蝦嘛好。
　　Bô hî, hê mā hó.	捉不到魚，捉到蝦子也好。比喻退而求其次，聊勝於無。
27.	無彼號尻川，想欲食彼號瀉藥。
　　Bô hit-lō kha-tshng, siūnn-beh tsia̍h hit-lō sià-io̍h.	沒有那種屁股，想吃那種瀉藥。形容人沒有那種能耐，卻妄想做那種事。比喻一個人自不量力。
28.	無日毋知晝，無鬚毋知老。
　　Bô ji̍t m̄ tsai tàu, bô tshiu m̄ tsai lāu.	沒出太陽，不知已經到中午了；沒留鬍子，不易察覺人已老邁。比喻光陰易逝，很容易在不知不覺中荒廢。
29.	無枷夯交椅。
　　Bô kê giâ kau-í.	沒有枷鎖等刑具可披枷帶鎖，竟然將太師椅扛在身上。比喻自找麻煩，庸人自擾。
30.	無禁無忌，食百二。
　　Bô-kìm-bô-khī, tsia̍h pah-jī.	形容人百無禁忌，毫無忌諱，便能長壽活到一百二十歲。通常是觸碰禁忌者用來自我安慰的說法。
31.	無毛雞假大格。
　　Bô môo ke ké tuā-keh.	發育不良羽毛稀疏的雞假冒成體格高大。比喻一個人明明沒錢還裝闊；或指人明明沒有才能，還裝出很有本事的樣子。
32.	無通生食，哪有通曝乾。
　　Bô thang tshenn tsia̍h, ná ū thang pha̍k-kuann.	生吃都不夠，哪能晒成乾？比喻數量不足，不可能有多餘的留下來。也指個人或家計窘困，沒有餘錢作額外支出。
33.	罔趁較袂散。
　　Bóng thàn khah bē sàn.	多少賺一點，才不致於陷入窮困。說明即使利潤非常小，也應積極賺取。
34.	某大姊，坐金交椅。
　　Bóo-tuā-tsí, tsē kim kau-í.	娶年長的妻子就像坐上太師椅。形容少夫老妻，丈夫很受寵、頗享福。
35.	無三不成禮。
　　Bû sam put sîng lé.	送禮、致敬要一而再，再而三。比喻禮多人不怪。
36.	未食五日節粽，破裘毋甘放。
　　Buē tsia̍h Gōo-ji̍t-tseh tsàng, phuà hiû m̄ kam pàng.	還沒吃端午節粽子，破棉襖捨不得放。臺灣的氣候在端午節之前，都還可能有轉冷，所以還沒過端午節，冬衣不能收起來，是前人觀察天氣變化所得的經驗。
37.	未曾學行先學飛，未曾掖種想挽瓜。
　　Buē-tsîng o̍h kiânn sing o̍h pue, buē-tsîng iā-tsíng siūnn bán kue.	還不會走路就想學飛，尚未播種竟妄想收成瓜果。指人要循序漸進的學習與按步就班的耕作才會有所收穫，絕無一步登天或不勞而獲的道理。
38.	會曉偷食，袂曉拭喙。
　　Ē-hiáu thau tsia̍h, bē-hiáu tshit tshuì.	只知道要偷吃，卻不知道要把嘴巴擦乾淨。比喻做壞事後，不懂得湮滅證據，讓人發現。
39.	會咬人的狗袂吠。
　　Ē kā--lâng ê káu bē puī.	會咬人的狗不會叫。比喻城府甚深之人少言，不易流露其情緒。
40.	會跋才會大。
　　Ē pua̍h tsiah ē tuā.	小孩學習走路時，要跌倒過才能順利成長。比喻人要經歷過失敗、挫折，才能成就事業。
41.	會生得囝身，袂生得囝心。
　　Ē-senn-tit kiánn sin, bē-senn-tit kiánn sim.	能夠生出孩子的身體，卻不能生出孩子的心思。意為雖然兒女是父母所生，但也有自己的意志，父母不能任意左右；或指教育孩子很不容易，往往不能按照父母的期待。
42.	疑人，毋成賊。
　　Gî lâng, m̄ tsiânn tsha̍t.	光憑懷疑，並無法認定某人就是賊。謂凡事都要講求證據，不能只因內心懷疑，便將人入罪。
43.	攑頭三尺有神明。
　　Gia̍h-thâu sann tshioh ū sîn-bîng.	抬起頭三尺高處就有神明察看著。告誡人們做事前要三思，因為冥冥之中都有神在監督著我們的一言一行，千萬別做虧心事，否則將招致報應。
44.	嚴官府出厚賊；嚴爸母出阿里不達。
　　Giâm kuann-hú tshut kāu tsha̍t; giâm pē-bú tshut a-lí-put-ta̍t.	過於嚴苛的官府，小偷反而更加猖狂；父母管教過嚴，小孩越是不成材。喻適當的律法及教育更為重要。
45.	囡仔人尻川三斗火。
　　Gín-á-lâng kha-tshng sann táu hué.	小孩屁股有三盆火。比喻小孩子血氣方盛，屁股好似有火般的熱度，此處用來形容孩子不怕冷。
46.	囡仔人有耳無喙。
　　Gín-á-lâng ū-hīnn-bô-tshuì.	小孩子有耳朵沒嘴巴。指叫小孩聽話就好，不要多問。通常使用於大人說話時，若小孩插嘴或發問，便會以這句話來阻止小孩開口。
47.	戇的也有一項會。
　　Gōng--ê iā ū tsi̍t hāng ē.	笨的人也有一項他會的才能。比喻天生我才必有用。
48.	五肢指頭仔伸出來無平長。
　　Gōo ki tsíng-thâu-á tshun--tshut-lâi bô pênn tn̂g.	指五根手指頭伸出來不可能一樣長，必有所歧異。如同兄弟姊妹其聰明才智並非一致，仍舊有所不同。
49.	牛牢內觸牛母。
　　Gû-tiâu-lāi tak gû-bó.	牛圈裡鬥母牛。比喻兄弟或同志只善內鬥、欺負弱小，卻不能抵禦外侮、克服強敵，反而被人看扁了。
50.	牛就是牛，牽到北京也是牛。
　　Gû tō sī gû, khan kàu Pak-kiann iā sī gû.	把窮鄉僻壤的牛，牽到人文薈萃的京城，固執的牛脾氣還是依舊。形容人的個性不可能改變，縱使換了環境還是原來的樣子。
51.	外甥食母舅，親像食豆腐。
　　Guē-sing tsia̍h bú-kū, tshin-tshiūnn tsia̍h tāu-hū.	外甥佔舅父的便宜，像是吃豆腐那樣簡單。喻外甥要倚靠舅父幫忙或讓舅父請客較為容易。
52.	校長兼摃鐘。
　　Hāu-tiúnn kiam kòng tsing.	校長兼做敲鐘的工作。「摃鐘」指敲響學校上下課的鐘聲，以學校最高職務的校長，還需兼做敲鐘報時的工作，來形容一個人身兼數職，而且多半是指一手包攬整個單位、團體或專案的大小事。
53.	痚呴袂忍得嗽。
　　He-ku bē lún tit sàu.	氣喘忍不住要咳嗽。形容人忍無可忍，不吐不快。
54.	戲館邊的豬母，袂歕簫嘛會拍拍。
　　Hì-kuán pinn ê ti-bó, bē pûn siau mā ē phah-phik.	戲館邊的母豬，戲聽多了，不會吹簫，也會打拍子。比喻常見無難事；或指人易受周圍環境影響。
55.	戲棚跤徛久就是你的。
　　Hì-pênn-kha khiā kú tō sī lí ê.	戲臺下站久了就是你的。勸人做事要有耐性，如能持之以恆，成功必屬於你的。
56.	嫌貨才是買貨人。
　　Hiâm huè tsiah-sī bé huè lâng.	會挑貨物毛病的人，才是真正有意要買的人。意即客人會對貨物表示意見才是真正要購買的人。
57.	兄弟若仝心，烏塗變成金。

140.	舊囚食新囚。

145.	內神通外鬼。
　　Lāi sîn thong guā kuí.	指內部人員串通外面的人，做出不利內部的事。
146.	六月芥菜假有心。
　　La̍k-gue̍h kuà-tshài ké ū-sim.	芥菜產季在每年十一月到次年四月，大約是農曆十月到次年二月，六月既非芥菜產季，當然也不會有芥菜心，所以說有心必定是假的。指人的言語或行為虛情假意；或用來譏諷偽君子，表面仁慈關懷，其實不懷好意。

148.	人未到，聲先到。

152.	人兩跤，錢四跤。

　　Lo̍h-thôo-sî peh-jī miā.	出生的時辰就決定一個人的命運。從前的人迷信人的命運在呱呱墜地時，就已經註定好了。這句話常用來要人接受現狀，不要埋怨或強求。

166.	毛毛仔雨落久，塗嘛會澹。

169.	涼傘雖破，骨格原在。

170.	爛塗袂糊得壁。

171.	呵咾甲會觸舌。
　　O-ló kah ē tak-tsi̍h.	讚美得發出嘖嘖聲，可用來表示「讚美有加」。
172.	惡馬惡人騎。

173.	王梨頭，西瓜尾。

175.	烏矸仔貯豆油。

176.	飽穗的稻仔，頭犁犁。

179.	放屁安狗心。
　　Pàng-phuì an káu sim.	放屁給狗聞，讓牠以為有屎可吃。比喻敷衍的給予承諾。

　　Pa̍t-lâng ê kiánn sí bē liáu.	別人的小孩死不完。形容人非常自私，為了自己的利益，不顧別人的死活。
181.	爸母疼囝長流水，囝疼爸母樹尾風。

182.	白白布染甲烏。
　　Pe̍h-pe̍h pòo ní kah oo.	白布硬要染成黑色。比喻刻意汙衊抹黑，顛倒是非。
183.	棚頂做甲流汗，棚跤嫌甲流瀾。

185.	拍人喝救人。
　　Phah lâng huah-kiù-lâng.	打人的人反而喊救命。比喻為逃避責任或轉移焦點，做壞事的人反而誣告別人做壞事。
186.	拍斷手骨顛倒勇。
　　Phah-tn̄g tshiú-kut tian-tò ióng.	打斷手骨反而更健壯。意即愈挫愈勇。折斷的骨頭癒合後，新長成的骨節更為堅硬。用以鼓勵人不要畏懼困難與挫敗。
187.	歹瓜厚子，歹人厚言語。
　　Pháinn kue kāu tsí, pháinn-lâng kāu giân-gí.	壞瓜籽多，壞人話多。用來諷刺多話或是善於搬弄是非的人。
188.	歹竹出好筍。
　　Pháinn tik tshut hó sún.	壞竹子卻長出好筍子。比喻在惡劣的外在環境下仍能養成優秀的人。
189.	歹竹出好筍，好竹出痀崙。
　　Pháinn tik tshut hó sún, hó tik tshut ku-lún.	不好的竹子生出好的筍子，好的竹子生出奇形怪狀的竹子。比喻出身不好的人也能養成好的後代，富貴之人也會出不成才的子孫。
190.	歹船拄著好港路。
　　Pháinn tsûn tú-tio̍h hó káng-lōo.	破舊的船遇到好的航路。比喻外在環境大好，本身雖不濟，卻也能安然度過。
191.	皮皮食甲流糍。
　　Phî-phî tsia̍h kah lâu-tsî.	罵人忘記羞恥，不顧別人的批評，早已吃到下巴鬆弛下垂的樣子，還是照吃不誤。比喻人不知羞恥。
192.	膨風水雞刣無肉。
　　Phòng-hong tsuí-ke thâi bô bah.	青蛙腹部充氣鼓起，外表看起來好大，但宰殺後肉很少。譏諷言談誇大不實、常吹牛的人，喜歡說大話，一點本事也沒有。
193.	鋪面蟶，浸水蚵。
　　Phoo-bīn than, tsìm-tsuí ô.	鋪在表面的蟶及泡水膨脹後的牡蠣。小商販把好看的商品擺在表層來吸引人，比喻虛有其表或無心實踐。
194.	跋一倒，抾著一隻金雞母。
　　Pua̍h tsi̍t tó, khioh-tio̍h tsi̍t tsiah kim ke-bó.	跌了一跤，撿到一隻金母雞。比喻因禍得福，從失敗中汲取寶貴的經驗。
195.	杯底毋通飼金魚。
　　Pue-té m̄-thang tshī kim-hî.	杯裡不要留下可供放養金魚的酒。暗示人把杯裡的酒喝乾之意。
196.	分袂平，拍甲二九暝。
　　Pun bē pênn, phah kah Jī-káu-mê.	「二九暝」指除夕、大年夜。分配不平均，從年頭打到除夕夜。指事情分配不公，會引起長期的紛爭。
197.	西北雨，落袂過車路。
　　Sai-pak-hōo, lo̍h bē kuè tshia-lōo.	西北雨，下不過馬路。「西北雨」即夏日午後雷陣雨，下得非常短暫，且為小區域的天氣現象，有時還來不及下超過另一條馬路，雨就停了。
198.	瘦田𠢕欶水。
　　Sán tshân gâu suh tsuí.	貧瘠的農田在灌溉時，需要更多水分才夠飽滿。指瘦小的人食量很大。
199.	送伊魚，較輸教伊掠魚。
　　Sàng i hî, khah-su kà i lia̍h hî.	送他魚，不如教他捕魚。比喻與其救濟或幫助他人，不如教他謀生的能力。
200.	三分人，七分妝。
　　Sann hun lâng, tshit hun tsng.	人的外表三分是靠天生的長相，七分是靠適當的裝扮。提醒人要注意穿著打扮，更能增添個人的魅力。
201.	三日無餾，𬦰上樹。
　　Sann ji̍t bô liū, peh-tsiūnn tshiū.	三天不溫習，學過的東西就爬上了樹梢。說明學過的東西要勤加溫習，稍有怠惰，很快所學的東西就會忘得一乾二淨。
202.	三跤步一坎店。
　　Sann kha-pōo tsi̍t khám tiàm.	走三步就有一間店。形容市景繁榮，商店林立。 意指同類的店鋪多，同行之間的競爭很激烈。
203.	三講，四毋著。
　　Sann kóng, sì m̄-tio̍h.	說三句話，錯四個地方。指人說話頻頻出錯。
204.	三人共五目，日後無長短跤話。
　　Sann lâng kāng gōo ba̍k, ji̍t-āu bô tn̂g-té-kha-uē.	三個人總共五隻眼睛，以後不能再說長道短。原故事為媒人婆替兩腳一長一短的青年，與瞎了一隻眼的女子相親，媒人為促成婚事，故意隱藏雙方的缺陷，在結婚前以雙關語說在場三人總共五隻眼睛，決定的事情日後便不得再說長就短。比喻共同商議後所做的決定，事後不得反悔。
205.	三年一閏，好歹照輪。
　　Sann nî tsi̍t jūn, hó-pháinn tsiàu lûn.	三年一次閏月，好壞輪流來。農曆每二、三年會有一個閏月，多出來的這個月按曆法分派到不同月份，所以說「好歹照輪」。這句話指風水輪流轉，人生的際遇，不會永遠順利，也不會永遠困窘。
206.	三百六十行，行行出狀元。
　　Sann-pah la̍k-tsa̍p hâng, hâng-hâng tshut tsiōng-guân.	各行各業都有出類拔萃的人。狀元是指各行業的頂尖人物，比喻不論從事何種行業，都可出人頭地。
207.	三代粒積，一代窮空。
　　Sann tāi lia̍p-tsik, tsi̍t tāi khîng-khong.	三代累積，一代敗光。即三代人辛苦累積的財富，卻被後代一人揮霍殆盡。比喻創業艱辛，守成要謹慎。
208.	掃地掃壁角，洗面洗耳空。
　　Sàu-tè sàu piah-kak, sé-bīn sé hīnn-khang.	打掃房間，要注意清潔牆角周圍；洗臉時，要注意耳朵周圍或耳後容易藏污納垢的地方。指做事要澈底實在，不要馬虎隨便。
209.	細漢煩惱伊袂大，大漢煩惱伊未娶。
　　Sè-hàn huân-ló i bē tuā, tuā-hàn huân-ló i buē tshuā.	小時候煩惱他長不大，長大了煩惱他不結婚。表示父母親對兒女成長的各個階段，都有不同的操心與煩惱。
210.	細漢偷挽匏，大漢偷牽牛。
　　Sè-hàn thau bán pû, tuā-hàn thau khan gû.	小時候偷摘匏瓜，長大偷牽牛隻。指一味縱容小孩的錯誤行為，反而會使其積惡成習，長大後會變本加厲。
211.	細空毋補，大空叫苦。
　　Sè khang m̄ póo, tuā khang kiò-khóo.	破洞還小的時候不及時縫補，等破洞大到無法挽救時才在哀號。 勸人若發現小問題，應及時修正，不要等事情變大了才來後悔莫及。
212.	生的且一邊，養的恩情較大天。
　　Senn--ê tshiánn tsi̍t pinn, iúnn--ê un-tsîng khah tuā thinn.	親生的父母暫且擱在一邊，養育者的恩情比天還高。提醒被撫養人不要抹煞養育人的苦心與功勞；又指生身父母比養育者的地位還差一些。
213.	生雞卵的無，放雞屎的有。
　　Senn ke-nn̄g--ê bô, pàng ke-sái--ê ū.	沒有生雞蛋的，只有拉雞屎的。形容團體中沒有能帶來利益或好處的人，只有會惹事生非，帶來壞處或麻煩的人。
214.	生囝師仔，飼囝師傅。
　　Senn-kiánn sai-á, tshī kiánn sai-hū.	生孩子是學徒，養育孩子是師傅。比喻生小孩瓜熟蒂落算不上本事，要把孩子養育成有用的人才是真本領。
215.	西瓜倚大爿。
　　Si-kue uá tuā pîng.	西瓜哪邊比較大就靠向那邊。意指人看哪一邊得勢，就向那邊，形容人趨炎附勢。
216.	死目毋願瞌。
　　Sí ba̍k m̄ guān kheh.	過世的時候不願意合眼。指因還有未完成的心願或牽掛的事而死不瞑目。
217.	死皇帝毋值得活乞食。
　　Sí hông-tè m̄-ta̍t-tit ua̍h khit-tsia̍h.	去世的皇帝，比不上還活著的乞丐。勉勵人要珍惜生命，窮苦活著總比富貴死去還要強。
218.	死道友，無死貧道。
　　Sí tō-iú, bô sí pîn-tō.	要死別人死，不能犧牲自己。「道友」指同道友人，泛指別人；「貧道」是修行者自謙的說法，泛指自己。說明人不在乎別人的死活，只關心自己是否還安好。
219.	死蛇活尾溜。
　　Sí tsuâ ua̍h bué-liu.	蛇被打死了，尾巴還在蠕動。形容事情雖然已經結束，但還留下一個殘局未收拾。
220.	時到時擔當，無米才煮番薯湯。
　　Sî kàu sî tam-tng, bô bí tsiah tsú han-tsî-thng.	時候到了再看著辦，沒有米可以煮飯就拿地瓜煮湯。形容事情自然有因應之道，如果一事不成，也另有替代之道。
221.	是毋是，罵家己。
　　Sī m̄ sī, mē ka-kī.	對不對，先罵自己。人與人相處難免會有衝突，遇到事情先檢討自己。
222.	仙人拍鼓有時錯，跤步踏差啥人無？
　　Sian-jîn phah kóo iú sî tshò, kha-pōo ta̍h-tsha siánn-lâng bô?	神仙打鼓有時候也會出錯，人走路也難免跌跤會走偏。指再厲害的人難免也會出差錯。
223.	仙拚仙，害死猴齊天。
　　Sian piànn sian, hāi-sí Kâu Tsê-thian.	眾仙人互相爭鬥，反而害一旁的孫悟空受到牽連。比喻兩方拼鬥，卻禍延無辜的第三者，亦即殃及池魚。
224.	雙个旋，惡甲無人問。
　　Siang ê tsn̄g, ok kah bô lâng mn̄g.	頭上有兩個髮旋的人，兇狠到沒人聞問。傳統認為有兩個髮旋的人天性兇，但無相關研究根據。
225.	雙手抱孩兒，才知爸母時。
　　Siang-tshiú phō hâi-jî, tsiah tsai pē-bú sî.	只有在雙手抱自己小孩時，才能真正體會父母的辛勞。勸人要知道父母的養育之恩，從而孝順父母。
226.	痟狗舂墓壙。
　　Siáu-káu tsing bōng-khòng.	瘋狗撞墓穴。指行事莽撞，行為冒失，未經周全計畫就倉促行事。也引申爭名奪利，指人有利可圖，不顧一切巧取豪奪。
227.	痟貪軁雞籠。
　　Siáu-tham nǹg ke-lam.	貪得無厭的雞為了吃飼料而鑽進雞籠。昔時農家養雞都採放養的方式，當需宰殺或販售雞隻時，便會將飼料放在籠子內，以誘導雞上門並將其關在其中。勸人千萬不要貪得無厭。
228.	少年袂曉想，食老毋成樣。
　　Siàu-liân bē-hiáu siūnn, tsia̍h-lāu m̄-tsiânn-iūnn.	年輕時思慮不周，等到老了生活堪憂。年輕時沒有做好生涯規劃，年老時便會落魄潦倒。意即少壯不努力，老大徒傷悲。用來勉勵人年輕時要有遠見，努力為未來鋪路。
229.	少年若無一擺戇，路邊哪有有應公。
　　Siàu-liân nā bô tsi̍t pái gōng, lōo-pinn ná ū Iú-ìng-kong.	若非年少時傻過一次，路邊哪來有應公廟。「有應公」或稱無緣佛、萬善公，是對無主孤魂的尊稱，也指臺灣民間信仰中，收容孤魂的小祠廟，通常不知道主祀者、也沒有神像。引申為勸誡年輕人勿逞血氣之勇，需珍惜自身性命。
230.	心歹無人知，喙歹上厲害。
　　Sim pháinn bô lâng tsai, tshuì pháinn siōng lī-hāi.	心地不好沒人知道，口出惡言最嚴重。重點在後句，告誡人要謹言慎行。
231.	神明興，弟子窮。
　　Sîn-bîng hing, tē-tsú kîng.	神明香火興旺，信徒便窮困。勸人敬拜神明花費要節制，以免導致生活困窘。
232.	誠意食水甜。
　　Sîng-ì tsia̍h tsuí tinn.	只要有誠意光喝水也覺得甜。意思是說誠心誠意對待人，即使只請人喝白開水，喝起來都會是甜的。比喻人和人之間的相處，誠意是最重要的。
233.	倖豬夯灶，倖囝不孝。
　　Sīng ti giâ tsàu, sīng kiánn put-hàu.	寵豬頂灶，寵兒不孝。豬不關好，放任牠自由進出，可能連灶都被豬翻了；小孩子太受寵愛，就不懂得孝順父母。比喻子女要適度管教，不能一味溺愛，否則會不懂得孝順。
234.	燒瓷的食缺，織蓆的睏椅。
　　Sio-huî--ê tsia̍h khih, tsit-tshio̍h--ê khùn í.	燒製瓷器的人，自己用有缺口的碗吃飯；織草蓆的人，捨不得拿草蓆來睡，反而在椅子上睡覺。比喻人為了賺錢或節儉，捨不得用自己製造的好產品，或者故意使用較無市場價值的瑕疵品。
235.	相罵無揀喙，相拍無揀位。
　　Sio-mē bô kíng tshuì, sio-phah bô kíng uī.	吵架時不會選擇講什麼話才適合，打架時不會斟酌挑身體哪個部位打。指一般人在吵架或打架時容易喪失理智，因此任何事情都做得出來。
236.	相分食有賰，相搶食無份。
　　Sio-pun tsia̍h ū tshun, sio-tshiúnn tsia̍h bô hūn.	飲食互相分享，則綽綽有餘；互相爭搶，反而沒得吃。比喻禮讓則互蒙其利，爭奪則互受其害。
237.	惜花連盆，疼囝連孫。
　　Sioh hue liân phûn, thiànn kiánn liân sun.	愛惜花朵亦會連帶珍惜花盆；疼愛子女，也會連同孫輩一起疼惜。意指疼愛一個人時，也會連帶關愛與其相關的人事物。比喻愛屋及烏。
238.	俗物無好貨。
　　Sio̍k-mi̍h bô hó huè.	便宜沒好貨。指一般人常存有貪小便宜的心態，見到便宜貨，便受低價位誘惑而購買，卻忽略物品本身的品質，導致買到劣質品。
239.	俗物食破家。
　　Sio̍k-mi̍h tsia̍h phuà ke.	因東西便宜而毫無節制地去採購，容易導致過度消費，拖垮家庭經濟。比喻貪小便宜，反而會造成更大的損失。
240.	相命無褒，食水都無。
　　Siòng-miā bô po, tsia̍h tsuí to bô.	算命時如果不說些讚美客人的話，連水都沒得喝。說明江湖術士的話不可盡信，也勸人要多說好話。
241.	收瀾收予焦，予你生一个有𡳞脬。
　　Siu-nuā siu hōo ta, hōo lí senn tsi̍t ê ū lān-pha.	收涎收乾淨，讓你生一個男丁。「收瀾」是民間習俗，在嬰兒滿四個月時舉辦之儀式，目的是希望解決嬰兒流口水的毛病；「𡳞脬」是男性的生殖器，泛指男丁。此諺為嬰兒滿四個月時，長輩們替嬰兒收口水時所講的吉祥話，期望嬰兒的母親來年能添丁。
242.	收瀾收離離，明年招小弟。
　　Siu-nuā siu-lī-lī, mê-nî tsio sió-tī.	收口水收得乾乾淨淨，明年又可以招來一個小弟弟。臺灣民間習俗，嬰兒出生滿四個月的那一天，要舉行「收瀾」（收涎）的儀式，當天用紅線把12塊、24塊或48塊中間有圓孔的小餅乾串在嬰兒頸上，由母親抱著到親友鄰居處走動，親友掰下一塊口酥餅，在嬰兒嘴邊擦一、兩下，口中就一邊唸著這句吉祥話。過去農業社會重男輕女，故以「招小弟」祝福其家可再添男丁。
243.	輸人毋輸陣，輸陣歹看面。
　　Su lâng m̄ su tīn, su tīn pháinn-khuànn bīn.	個人與他人比賽可以輸，但團體比賽不能落在最後面；參加團體賽若輸了，大家面子也掛不住。一般用來提振團體士氣，鼓勵人奮勇向前，勿落人後。
244.	媠䆀無比止，愛著較慘死。
　　Suí-bái bô pí tsí, ài--tio̍h khah tshám sí.	漂亮與否無從比較起，一旦愛上了比死亡還要悽慘。只要兩情相悅，一旦愛上一個人，就會不計美醜，愛得死心塌地。
245.	臺灣錢，淹跤目。
　　Tâi-uân tsînn, im kha-ba̍k.	臺灣地上的錢多到蓋住腳踝。比喻臺灣遍地錢財、容易謀生。
246.	大甲溪放草魚──有準無。
　　Tāi-kah-khe pàng tsháu-hî──ū tsún bô.	在大甲溪邊流放魚苗，一旦放出去就不會回頭，形容東西離手了，就再也不會回來。比喻肉包子打狗，有去無回。
247.	等物僫到，等人快老。
　　Tán mi̍h oh kàu, tán lâng khuài lāu.	等東西很難等到，等人容易變老。比喻等待的時間很難熬；或指等待的東西往往落空。
248.	刣雞教猴。
　　Thâi ke kà kâu.	殺雞給猴子看。比喻用懲罰一個人的辦法來警告別的人。
249.	讀冊，讀佇尻脊骿。
　　Tha̍k-tsheh, tha̍k tī kha-tsiah-phiann.	讀書本應記在腦子裡，卻讀到背脊上。嘲諷人讀死書，食古不化。 或諷指人有學問卻不行正道，書都白讀了。
250.	趁也著趁，食也著食。
　　Thàn iā tio̍h thàn, tsia̍h iā tio̍h tsia̍h.	錢也得賺，飯也得吃。勸人不要只會賺錢，也要懂得花錢吃飯，照顧身體。
251.	趁錢有數，性命愛顧。
　　Thàn-tsînn iú sòo, sènn-miā ài kòo.	賺錢數量有限，生命要照顧。意思是賺錢要適可而止，身體健康更為重要，不可為了多賺錢而不顧生命。
252.	頭燒燒，尾冷冷。
　　Thâu sio-sio, bué líng-líng.	剛開始的時候興沖沖，到了後來卻提不起勁。指人做事情只有三分鐘熱度，沒辦法貫徹始終。
253.	頭大面四方，肚大居財王。
　　Thâu tuā bīn sù-hong, tóo tuā ki-tsâi ông.	指頭大大的、臉形良好又勻稱、肚子大的人，有大富之相。這是命相學的說法，未必可信。
254.	聽某喙，大富貴。
　　Thiann bóo tshuì, tuā hù-kuì.	聽老婆的話，可以大富大貴。期勉丈夫適時尊重、接納太太的意見，必可避免爭吵的發生。
255.	天公疼戇人。
　　Thinn-kong thiànn gōng-lâng.	老天爺疼惜憨厚的人。實事求是、按部就班者，往往得到上天的眷顧。
256.	天頂天公，地下母舅公。
　　Thinn-tíng Thinn-kong, tē-ē bú-kū-kong.	天上地位最崇高的就屬玉皇大帝，而人世間則是舅舅。這說明了在臺灣舅舅的地位崇高，故每逢子女婚嫁時或有舅舅會出席的場合，都要請他坐大位。
257.	豬毋大，大對狗去。
　　Ti m̄ tuā, tuā tuì káu khì.	用心飼養的豬養不肥，卻把不需要養肥的狗養肥了。比喻事情發展不符合自己的期許。以前重男輕女的社會裡，常用來描述兒子不上進，女兒卻力爭上游的情況。
258.	豬岫毋值狗岫穩。
　　Ti-siū m̄-ta̍t káu-siū ún.	豬舍不如狗窩安穩。意即金窩銀窩不如自己的狗窩。
259.	豬頭毋顧，顧鴨母卵。
　　Ti-thâu m̄ kòo, kòo ah-bó nn̄g.	祭拜鬼神時不顧豬頭，只守著鴨蛋。比喻放著重要的事不管，反而去管次要的。
260.	豬頭皮炸無油。
　　Ti-thâu-phuê tsuànn bô iû.	豬頭皮炸不出油來。用來比喻一個人不具真才實學，好吹牛，所言空洞，說不出大道理。
261.	恬恬食三碗公半。
　　Tiām-tiām tsia̍h sann uánn-kong puànn.	靜靜的吃掉三碗公半。形容悶聲不響、莫測高深的人，平時不動聲色，不為人所注意，但卻會做出令人意想不到的事情。
262.	得失土地公，飼無雞。
　　Tik-sit Thóo-tī-kong, tshī bô ke.	得罪土地公，則養不活雞。比喻做事若得罪有權勢或影響力的要角，恐將吃不完兜著走。
263.	頂港有名聲，下港上出名。
　　Tíng-káng ū miâ-siann, ē-káng siōng tshut-miâ.	在臺灣北部有名氣，在臺灣南部最出名。形容聲名遠播，遠近馳名。
264.	頂司管下司，鋤頭管畚箕。
　　Tíng-si kuán ē-si, tî-thâu kuán pùn-ki.	上司管束下屬，鋤頭牽制畚箕。形容社會有階層，一層管一層，分層管理，層層節制。
265.	張持無蝕本。
　　Tiunn-tî bô si̍h-pún.	凡事謹慎小心不會吃虧。形容遇事謹慎處理，有益無害。
266.	斷掌查埔做相公，斷掌查某守空房。
　　Tn̄g-tsiúnn tsa-poo tsò siùnn-kang, tn̄g-tsiúnn tsa-bóo tsiú khang-pâng.	斷掌的男子可以做大官，斷掌的女子會獨守空房。意為男子斷掌則個性比較果斷，所以適合當官；女子斷掌是剋夫命，會守寡。「斷掌」是指手掌有一條橫向貫穿手掌的掌紋，按命相言，斷掌者乃有決斷力、能幹之人，這種舊思維是以往命相師的無稽之談，不宜輕信。
267.	倒吊無墨水。
　　Tò-tiàu bô ba̍k-tsuí.	把人倒掛卻連一滴墨水都流不出來。形容人沒學問，胸無點墨。
268.	桌頂食飯，桌跤放屎。
　　Toh-tíng tsia̍h-pn̄g, toh-kha pàng-sái.	人家請你吃飯，卻在桌底下排泄糞便。引申為受人恩惠而不知報答，反而做出對不起恩人的事情。
269.	查埔也著疼，查某也著晟。
　　Tsa-poo iā tio̍h thiànn, tsa-bóo iā tio̍h tshiânn.	勸人養兒不可重男輕女，不管是男孩或女孩都要一樣疼惜扶養。
270.	查埔囝得田園，查某囝得嫁粧。
　　Tsa-poo-kiánn tit tshân-hn̂g, tsa-bóo-kiánn tit kè-tsng.	兒子分得家產，女兒得到嫁妝。早期臺灣家庭財產分配的傳統做法，在父母過世後，田宅等不動產由兒子繼承，女兒則是出嫁時給嫁妝。
271.	財子壽三字全。
　　Tsâi-tsú-siū sann jī tsuân.	錢財、子女、長壽三項都齊全。用來表示一個人樣樣俱足，幸福美滿。
272.	在生一粒豆，較贏死了拜豬頭。
　　Tsāi-senn tsi̍t lia̍p tāu, khah iânn sí-liáu pài ti-thâu.	父母健在的時候吃兒女孝敬的一顆豆子，勝過去世後兒女才以豬頭來祭拜。提醒人行孝要及時；又指死後子女以盛大喪禮祭拜，雖是風光，卻不如父母在生時略盡奉養之責，只有生前奉養才是真的孝順。傳統禮俗，父母去世時，要準備豬頭做祭拜的大牲禮。
273.	十二月食菜頭，六月才轉嗽。
　　Tsa̍p-jī--gue̍h tsia̍h tshài-thâu, la̍k--gue̍h tsiah tńg-sàu.	十二月時吃了蘿蔔，到了隔年六月才咳嗽。指人反應遲鈍，事過境遷才做出反應。
274.	十二生相變透透。
　　Tsa̍p-jī senn-siùnn pìnn-thàu-thàu.	各種不同的職業都嘗試遍了。形容一個人經常更換職業，沒有定性，難有成就。
275.	十囝十新婦，賰一个老寡婦。
　　Tsa̍p kiánn tsa̍p sin-pū, tshun tsi̍t ê lāu kuá-hū.	十個兒子娶了十個媳婦，卻留下一個年老守寡的媽媽沒人照料。形容兒子大了各自成家，年老守寡的母親卻無人願意照顧。
276.	雜唸大家出蠻皮新婦。
　　Tsa̍p-liām ta-ke tshut bân-phuê sin-pū.	婆婆嘮叨久了，媳婦就不在乎責罵。意即有嘮叨的長輩或上司，就會有頑固不化的晚輩或部屬。
277.	十指伸出，無平長。
　　Tsa̍p tsáinn tshun-tshut, bô pênn tn̂g.	十根手指頭伸出來，長短也不一樣。勸誡為人子女者，若是覺得父母有時對待子女厚此薄彼、有所不公，不要過於在意。因為這是很自然的現象，就像十根手指頭長在同一個身體上，但長度卻都不一樣。
278.	十喙九尻川。
　　Tsa̍p tshuì káu kha-tshng.	十張嘴九個屁股。「十喙」諧音「雜喙」，「九尻川」諧音「狗尻川」，比喻人多嘴雜，個個像在放狗屁。
279.	坐予正，得人疼。
　　Tsē hōo tsiànn, tit lâng thiànn.	坐姿端正，才會惹人疼愛。本為嫁娶儀式時，媒人、長輩常會說的吉祥話。 引申為勸誡人要端正儀容姿態，才能讓人留下好印象。
280.	菜蟲食菜，菜跤死。
　　Tshài thâng tsia̍h tshài, tshài-kha sí.	菜蟲吃菜葉，死於菜株下。勸人勿作奸犯科，否則最後終將玩火自焚。
281.	田螺含水過冬。
　　Tshân-lê kâm tsuí kuè tang.	田螺含些許水份度過寒冬。比喻窮人含辛度日，等待時機。
282.	草地親家坐大位。
　　Tsháu-tē tshin-ke tsē tuā-uī.	城裡人家辦喜宴時，來自鄉村的親家雖然衣著較寒酸，仍請他坐上位。即不因他人身世背景，而輕忽了待客之道。
283.	臭頭仔嘛會做皇帝，做總統你嘛有機會。
　　Tshàu-thâu-á mā ē tsò hông-tè, tsò tsóng-thóng lí mā ū ki-huē.	瘌痢頭也能當皇帝，當總統你也有機會。英雄不怕出身低，只要肯奮鬥，都可能有出頭天的機會。
284.	生狂狗食無屎。
　　Tshenn-kông káu tsia̍h bô sái.	狗若過於慌張、急促，就連屎都吃不到。誡人處事不可操之過急，過於急躁反而會失敗。
285.	青盲貓咬著死鳥鼠。
　　Tshenn-mê niau kā-tio̍h sí niáu-tshí.	瞎眼的貓咬到死老鼠。比喻誤打誤撞，通常用在表示運氣很好。
286.	生食都無夠，哪有通曝乾。
　　Tshenn tsia̍h to bô-kàu, ná ū thang pha̍k-kuann.	生吃都不夠了，哪有多餘的可以曬乾。「曝乾」通常是指食物過剩時曬乾儲存。比喻現實生活已捉襟見肘，對未來的日子更不敢奢望。
287.	飼囝無論飯，飼爸母算頓。
　　Tshī kiánn bô-lūn pn̄g, tshī pē-bú sǹg tǹg.	父母養育兒女，不會去計較孩子的飯量，兒女奉養父母時，卻會計算父母吃了幾頓飯。這句話說明有些人養育子女和奉養父母時心態上的差異，以及兄弟輪流奉養父母時常常斤斤計較的現象。
288.	飼鳥鼠，咬布袋。
　　Tshī niáu-tshí, kā pòo-tē.	餵養老鼠，老鼠卻咬破布袋偷吃米。比喻善待親信卻遭其背叛，亦即養虎貽患。
289.	千金買厝，萬金買厝邊。
　　Tshian-kim bé tshù, bān kim bé tshù-pinn.	千金買房子，萬金買好鄰居。形容敦親睦鄰之重要，或指擇鄰而處，好的鄰居對居住品質的影響很大。
290.	千算萬算，毋值天一劃。
　　Tshian sǹg bān sǹg, m̄-ta̍t thinn tsi̍t ue̍h.	形容人百般算計仍敵不過老天爺的輕輕一筆，把之前的努力都一筆勾銷。說明人再如何汲汲營營算計，遇見天災或意外，還是不敵自然的力量。也指人的經營算計不敵命運的捉弄。
291.	千途萬途，毋值得翻田塗。
　　Tshian tôo bān tôo, m̄ ta̍t-tit huan tshân thôo.	相較於各行各業，耕田才是最務實的行業。反映早期重農輕商的思想。
292.	清明無轉厝，無祖；過年無轉厝，無某。
　　Tshing-bîng bô tńg tshù, bô tsóo; kuè-nî bô tńg tshù, bô bóo.	清明節不回家祭祖掃墓，會背負背祖忘本之名，而過年不回家的出外人，可能是無家庭觀念或是沒妻小的人。說明逢年過節在人民心中的重要性，含有慎終追遠、重視家庭的意義存在。
293.	七仔較興八仔。
　　Tshit--á khah hìng peh--á.	一個比一個興趣高。形容兩人都有興致。
294.	七月半鴨仔，毋知死活。
　　Tshit-gue̍h-puànn ah-á, m̄ tsai sí-ua̍h.	七月半的鴨子，不知死活。七月半指農曆7月15日，也就是「中元普渡」，為臺灣民間信仰祭拜孤魂野鬼的日子。民間信仰中雞是祭神的供品，拜鬼只能用鴨子，故有此說。形容人沒有憂患意識，不知大難臨頭。
295.	七坐八爬九發牙。
　　Tshit tsē peh pê káu huat-gê.	七坐八爬九長牙。指嬰兒成長有一定的程序，通常是七個月大時學會坐、八個月大學會爬、九個月大時就長乳牙。
296.	手曲，屈入無屈出。
　　Tshiú-khiau, khut-ji̍p bô khut-tshut.	胳臂向內彎，不會向外彎。比喻人都比較會袒護自己人，不會幫外人。可用於表示袒護自己人是應該的，也可用於譴責幫外人的人。
297.	手抱孩兒，才知爸母時。
　　Tshiú phō hâi-jî, tsiah tsai pē-bú sî.	親手抱著自己的小孩時，才能夠真正體會為人父母養育兒女的不易與辛勞。勸人要感念父母的養育之恩，孝順父母。
298.	樹頭徛予在，毋驚樹尾做風颱。
　　Tshiū-thâu khiā hōo tsāi, m̄ kiann tshiū-bué tsò-hong-thai.	樹根要是穩固了，就不怕樹梢被颱風吹襲。比喻要固本。 指人行事正直無私、光明磊落，不怕任何的惡意中傷。
299.	喙飽目睭枵。
　　Tshuì pá ba̍k-tsiu iau.	已經吃得很飽了，但眼睛還是盯著餐桌上的美饌佳餚不放，一直想繼續再吃。比喻為一個人貪得無厭。
300.	喙食，予尻川坐數。
　　Tshuì tsia̍h, hōo kha-tshng tshē-siàu.	嘴巴吃進去，讓屁股承擔後果。意即貪圖味覺享受而亂吃，拉肚子時受苦的卻是屁股。比喻貪圖一時的好處，自己得承受後果。 引申為一人之誤，卻由他人代為受罪承擔。
301.	喙脣皮相款待。
　　Tshuì-tûn-phuê sio khuán-thāi.	光用嘴巴說些體面話互相招待。比喻人只是口頭上敷衍，並非真心幫助。
302.	春雺曝死鬼，夏雺做大水。
　　Tshun bông pha̍k-sí kuí, hā bông tsò-tuā-tsuí.	春天起霧曬死鬼，夏天起霧鬧水災。此為前人經過長期觀察、累積經驗而來的氣象諺語。春天早晨若大霧籠罩，濕氣很重，霧氣一旦散開後就會是大晴天甚至是大熱天；夏天早晨若大霧籠罩，白天時空氣對流旺盛下，暖空氣上升，容易形成大雷雨甚至造成水災。
303.	春天後母面，欲變一時間。
　　Tshun-thinn āu-bú-bīn, beh piàn tsi̍t-sî-kan.	春天繼母臉，要變一剎那。以人前人後表現截然不同的繼母形容春季的天氣多變。舊時代，繼母給人的形象都很差，對待繼子繼女，人前慈愛，人後虐待，因此被用來形容春天的天氣。
304.	食米毋知米價。
　　Tsia̍h bí m̄ tsai bí kè.	吃米飯不曉得米的價錢。形容只知享受，不知生活疾苦的人。
305.	食無三把蕹菜，就欲上西天。
　　Tsia̍h bô sann pé ìng-tshài, tō beh tsiūnn se-thian.	吃不到三把空心菜，就妄想可以上西天了。諷刺人不肯腳踏實地，妄想一步登天。
306.	食魚食肉，也著菜佮。
　　Tsia̍h hî tsia̍h bah, iā tio̍h tshài kah.	吃魚吃肉，也要兼吃蔬菜。表示飲食要均衡身體才會健康。
307.	食好鬥相報。
　　Tsia̍h hó tàu sio-pò.	吃到好東西，對外廣為介紹。引申為若有好東西，大家會口耳相傳。
308.	食雞，會起家；食鰇魚，生囡仔好育飼。
　　Tsia̍h ke, ē khí-ke; tsia̍h jiû-hî, senn gín-á hó io-tshī.	吃雞，會使家道興盛；吃魷魚，生下來的小孩容易養育。借諧音的吉祥話，說出心中的祝福。搬新家、結婚、生子、宴會時皆可以使用。
309.	食緊挵破碗。
　　Tsia̍h-kín lòng-phuà uánn.	吃得太快打破碗。用來比喻人做事情若只一心求快，反而容易造成反效果。
310.	食果子拜樹頭；食米飯拜田頭。
　　Tsia̍h kué-tsí pài tshiū-thâu; tsia̍h bí-pn̄g pài tshân-thâu.	吃水果，要拜謝樹根；吃米飯，要拜謝田地。指人要懂得感恩，飲水思源，不可忘本。通常僅單用「食果子拜樹頭」一句。
311.	食人頭鍾酒，講人頭句話。
　　Tsia̍h lâng thâu tsing tsiú, kóng lâng thâu kù uē.	喝第一杯酒，講第一句話。主人通常會請宴席上的長者或貴賓第一個講話，講話者常用此句作為開場白表示僭越、自謙之意。
312.	食人一口，報人一斗。
　　Tsia̍h lâng tsi̍t kháu, pò lâng tsi̍t táu.	吃人一口，要回報一斗。意為受人恩惠時要感恩圖報，並加倍奉還。
313.	食人一斤，也著還人四兩。
　　Tsia̍h lâng tsi̍t kin, iā tio̍h hîng lâng sì niú.	吃了他人一斤的糧食，最少得還人家四兩。指受人恩惠，縱然自己很困苦，多少總要擠一點出來報答別人。比喻知恩圖報。 進一步引申，告誡世人不要隨便收受他人饋贈，拿人家的都要奉還，天下沒有白吃的午餐。
314.	食飽換枵。
　　Tsia̍h-pá uānn iau.	先吃飽再把肚子搞餓。形容人徒勞無功，做沒有實質好處的事情；或用來謙稱自己所為只是消磨時間，微不足道。 引申為不該做的事卻去做、不該管的事卻去管，諷人自找麻煩，吃飽撐著沒事幹。
315.	食飯皇帝大。
　　Tsia̍h-pn̄g hông-tè tuā.	吃飯的時候跟皇帝一樣大。意為吃飯最重要，不管什麼事都不得干擾，等用餐完畢後，再行處理。
316.	食甜食鹹，臭跤鼻臁。
　　Tsia̍h tinn tsia̍h kiâm, tshàu kha-phīnn-liâm.	又吃甜的又吃鹹的，小腿前面會生瘡。用來勸誡人飲食要有節度，注意均衡的營養和衛生。「跤鼻臁」是小腿脛骨，與食物沒有直接關係，僅是順口的比喻。
317.	食著藥，青草一葉；食毋著藥，人參一石。
　　Tsia̍h tio̍h io̍h, tshenn-tsháu tsi̍t hio̍h; tsia̍h m̄-tio̍h io̍h, jîn-sim tsi̍t tsio̍h.	吃對藥，一葉的藥草就能見效；吃錯藥，吃再多高價珍貴的人參也無效。比喻做事要能切中要點、掌握關鍵，才不會徒勞無功，而能有事半功倍之效。
318.	食碗內，說碗外。
　　Tsia̍h uánn-lāi, sueh uánn-guā.	吃碗內的東西，卻說碗外的東西好。享受親近的人給予的好處，到最後卻為外人說話，暗諷人吃裡扒外，不知感恩。
319.	捷罵袂聽，捷拍袂疼。
　　Tsia̍p mē bē thiann, tsia̍p phah bē thiànn.	常罵不聽話，常打不怕痛。意為頻繁的打罵教育，其懲罰效果就會愈來愈低。
320.	盡人事，順天意。
　　Tsīn jîn-sū, sūn thinn-ì.	凡事盡力而為，結果就交給老天安排。意即盡人事，聽天命。
321.	錢四跤，人兩跤。
　　Tsînn sì kha, lâng nn̄g kha.	錢有四條腿，人只有兩條腿。以錢的腿比人腿多，跑得比人快，來比喻賺錢的辛苦與不易。
322.	這溪無魚，別溪釣。
　　Tsit khe bô hî, pa̍t khe tiò.	釣魚時，這條溪釣不到魚，不要氣餒，可到另一條溪釣釣看。比喻某處無法謀生時，可到別處另尋出路。
323.	一面抹壁雙面光。
　　Tsi̍t bīn buah-piah siang bīn kng.	用灰匙將水泥塗抹在牆面，壁面和灰匙都很平滑光亮。比喻為人處事圓融，兩方都不得罪。
324.	一某無人知，兩某相卸代。
　　Tsi̍t bóo bô lâng tsai, nn̄g bóo sio-sià-tāi.	只有一個妻子不會受人注意，要是有大小老婆就會爭吵不斷，家醜外揚。形容有妻有妾者家中常有爭執，受人嘲笑。
325.	一个某較好三个天公祖。
　　Tsi̍t ê bóo khah hó sann ê Thinn-kong-tsóo.	有個妻子勝過三尊天公的庇佑。引申為有一賢內助持家，勝過老天爺保佑。
326.	一个囡仔較鬧熱三个大人。
　　Tsi̍t ê gín-á khah lāu-jia̍t sann ê tuā-lâng.	一個小孩比三個大人在一起還熱鬧。小孩天真活潑，不時活蹦亂跳，大人也爭相哄他寵他，往往會逗得大人們笑呵呵。所以家裡有小孩子，氣氛會顯得熱鬧又活絡。
327.	一个人一款命。
　　Tsi̍t ê lâng tsi̍t khuán miā.	一個人一種命。每個人的命運、際遇各不相同，不用怨天尤人，要腳踏實地。
328.	一个錢拍二十四个結。
　　Tsi̍t ê tsînn phah jī-tsa̍p-sì ê kat.	一個錢打二十四個結。譏諷人吝於用錢，視財如命。
329.	一耳空入，一耳空出。
　　Tsi̍t hīnn-khang ji̍p, tsi̍t hīnn-khang tshut.	右耳進、左耳出。聽過的話記不住，或聽而不聞。比喻不用心或者善忘。
330.	一鄉一俗。
　　Tsi̍t hiong tsi̍t sio̍k.	一個鄉鎮一種風俗。指各地有不同的風俗習慣。
331.	一分錢，一分貨。
　　Tsi̍t hun tsînn, tsi̍t hun huè.	買東西時，所付的價錢跟貨物的品質直接相關。貨物以好壞論價，花多少錢，就得到價值相當的東西。
332.	一樣米飼百樣人。
　　Tsi̍t iūnn bí tshī pah iūnn lâng.	一種米養百種人。人的食物差異不大，但人的個性千差萬別。比喻這個社會上有著各式各樣、形形色色的人。
333.	一日徙栽，三日徛黃。
　　Tsi̍t ji̍t suá-tsai, sann ji̍t khiā-n̂g.	苗木移植一次得枯黃好幾天才會恢復生機。比喻經常變換工作難以累積實力，以致難有成效。勉勵做人做事要有定性，老是見異思遷則有害無利。 或指常常更換環境，以致難以適應。
334.	一日剃頭，三日緣投。
　　Tsi̍t ji̍t thì-thâu, sann ji̍t iân-tâu.	理一次髮，可以英俊個三天。理髮後會使人看起來清爽有神，自己順眼，別人也會有好印象。
335.	一日討海，三日曝網。
　　Tsi̍t ji̍t thó-hái, sann ji̍t pha̍k bāng.	捕一天魚，卻三天在曬魚網；引申為人懶惰，工作一天，休息三天。比喻一曝十寒。
336.	一日走拋拋，一暝點燈膋。
　　Tsi̍t ji̍t tsáu-pha-pha, tsi̍t mê tiám ting-lâ.	整天到處遊蕩，夜裡挑燈夜戰。形容人白天只顧著玩樂，夜裡才拚命趕工，比喻本末倒置。
337.	一枝草，一點露。
　　Tsi̍t ki tsháu, tsi̍t tiám lōo.	意為有草就有露水滋潤它。比喻天無絕人之路，只要努力，自有生路；也指天生我才必有用。
338.	一句話三角六尖。
　　Tsi̍t kù uē sann kak la̍k tsiam.	一句話尖銳帶角。形容講話的時候話中帶刺；也指言語銳利，出言不遜、容易傷人。「三」與「六」只是形容多，非實數。
339.	一人煩惱一樣，無人煩惱親像。
　　Tsi̍t lâng huân-ló tsi̍t iūnn, bô lâng huân-ló tshin-tshiūnn.	每個人都有各自的煩惱，而煩惱擔憂的事情也都不一樣。意謂家家有本難念的經。
340.	一人看出一家，新婦看出大家。
　　Tsi̍t lâng khuànn-tshut tsi̍t ke, sin-pū khuànn-tshut ta-ke.	由一個人的談吐舉止可看出其家庭的教養；由媳婦的行事作風可看出其婆婆的為人。亦即言教、身教對一個人有很大的影響。
341.	一人一家代，公媽隨人祀。
　　Tsi̍t lâng tsi̍t ke tāi, kong-má suî-lâng tshāi.	每一個人有自家的事，祖先牌位也由各人祭祀。意謂自家管自家的事，祖先牌位也隨自家的方式祭祀。用於勸人管好自己的事就好，不要管別人家的閒事。
342.	一粒米，百粒汗。
　　Tsi̍t lia̍p bí, pah lia̍p kuānn.	每一粒米都是農夫流下許多汗水，辛苦栽種出來的。指農夫種田辛勞，糧食得來不易，勸人不要任意浪費。
343.	一粒田螺煮九碗公湯。
　　Tsi̍t lia̍p tshân-lê tsú káu uánn-kong thng.	一隻田螺煮九海碗湯。形容生活貧苦，或比喻沒有真材實料，只是灌水充數。
344.	一暝全頭路，天光無半步。
　　Tsi̍t mê tsuân thâu-lōo, thinn-kng bô-puànn-pōo.  pōo.	整個晚上計畫很多事情，天亮後卻沒有半點方法。形容人光說不練，只會紙上談兵。
345.	一年換二十四个頭家。
　　Tsi̍t nî uānn jī-tsa̍p-sì ê thâu-ke.	一年換了二十四個雇主。形容人做事沒有定性，無法專心學習，時常換工作，最後一事無成。
346.	一遍賊，百世賊。
　　Tsi̍t piàn tsha̍t, pah sì tsha̍t.	僅僅偷了一次，就終生遭質疑或被認定就是小偷。引申為做了見不得人的事而殃及後代子孫。
347.	一步棋，一步著。
　　Tsi̍t pōo kî, tsi̍t pōo tio̍h.	下棋時，每一步都須謹慎小心，步步為營，才能贏得勝利。意謂做事情要有計畫，深思熟慮，按部就班，才不會出錯，這樣離成功就不遠了。
348.	一斗較贏九石。
　　Tsi̍t táu khah iânn káu tsio̍h.	一斗的量雖比九石的量少，但品質高，勝過大量的劣質品。喻重質不重量。
349.	一丈差九尺。
　　Tsi̍t tn̄g tsha káu tshioh.	一丈還差了九尺長。即一丈與一尺還差了九尺。形容差得很遠或指完全相反。
350.	一千賒毋值八百現。
　　Tsi̍t-tshing sia m̄-ta̍t peh-pah hiān.	一千元的賒帳不如八百元的現金。意即與其讓人賒帳，不如賣得便宜一點直接取得現金來得實際。
351.	一喙掛雙舌。
　　Tsi̍t tshuì kuà siang tsi̍h.	一張嘴長兩個舌頭。比喻人口齒伶俐且多話；也指人信口開河，言而無信。
352.	一隻牛剝雙領皮。
　　Tsi̍t tsiah gû pak siang niá phuê.	一頭牛剝兩張皮，比喻雙重剝削。一頭牛只有一張皮，剝兩張皮，表示剝削嚴重，已經超過能力可以負擔的程度。通常指沉重的賦稅或金錢的需索太重，讓人無法負擔。
353.	一隻蝨母嗙甲水牛大。
　　Tsi̍t tsiah sat-bó pòng kah tsuí-gû tuā.	一隻小蝨子誇大成大水牛。意指小小的東西或事情，誇大其辭，說得天花亂墜。比喻言過其實。
354.	上轎才欲放尿。
　　Tsiūnn kiō tsiah beh pàng-jiō.	新娘上花轎前才說要去小便，耽誤了時辰。比喻做事未能預先準備，事到臨頭才趕緊設法處理。
355.	上山看山勢，入門看人意。
　　Tsiūnn-suann khuànn suann-sì, ji̍p-mn̂g khuànn lâng ì.	上山要觀察山勢，進門要觀察主人心意。指做人要隨時注意環境的變化，懂得察顏觀色，行事才能合宜。
356.	上踏枋，上眠床，無洗跤睏中央。
　　Tsiūnn ta̍h-pang, tsiūnn bîn-tshn̂g, bô sé kha khùn tiong-ng.	踩上床前的踏板，接著上了床，不但沒洗腳還睡在床中央。比喻得寸進尺，欺人太甚。
357.	做牛著拖，做人著磨。
　　Tsò gû tio̍h thua, tsò lâng tio̍h buâ.	當牛就要拖犁，當人就要承受磨難。比喻人生本來就要歷經許多勞苦與磨難，就像牛得要辛苦犁田、拖車一樣。
358.	做戲的欲煞，看戲的毋煞。
　　Tsò-hì--ê beh suah, khuànn-hì--ê m̄ suah.	演戲的想收場休息了，台下的觀眾卻意猶未盡、不願離席，希望戲班繼續演下去。比喻當事人都要收手和解了，但旁觀者或看熱鬧的卻不願收場。
359.	做公親，貼本。
　　Tsò kong-tshin, thiap pún.	為別人做仲裁，還賠上自己的老本。比喻賠了夫人又折兵。
360.	做官若清廉，食飯著攪鹽。
　　Tsò-kuann nā tshing-liâm, tsia̍h-pn̄g tio̍h kiáu iâm.	當官若清廉，吃飯得拌鹽。意為當官如果只靠基本官俸而不貪污，生活就會過得清苦，連吃飯都只能加點鹽巴下飯。表示清官無法過富裕奢華的生活；又指清官難為或指無官不貪。
361.	做官騙厝內，做生理騙熟似。
　　Tsò-kuann phiàn tshù-lāi, tsò-sing-lí phiàn si̍k-sāi.	當官的矇騙家人，做生意的欺騙熟人。意謂為官無不詐，經商無不奸。
362.	做著歹田望下冬，娶著歹某一世人。
　　Tsò-tio̍h pháinn tshân bāng ē tang, tshuā-tio̍h pháinn bóo tsi̍t-sì-lâng.	種到收成不佳的田，可以期待下一個採收季；娶到惡妻可要受苦一輩子。勸人婚姻大事非兒戲，擇偶要非常謹慎。
363.	船過水無痕。
　　Tsûn kuè tsuí bô hûn.	意為船駛過不久，漣漪回歸平靜，一點痕跡也沒有。用來指人忘恩負義；也指事情發生過後，沒留下一點痕跡。
364.	大紅花毋知䆀，圓仔花䆀毋知。
　　Tuā-âng-hue m̄ tsai bái, înn-á-hue bái m̄ tsai.	朱槿不知自己醜，千日紅醜不自知。嘲諷人沒有察覺自己醜陋，還四處炫耀。 比喻不知藏拙或不知羞恥。
365.	大目新娘無看見灶。
　　Tuā-ba̍k sin-niû bô khuànn-kìnn tsàu.	大眼睛的新娘沒看到灶。通常用於揶揄人眼睛雖大，但卻看不到顯而易見的物品。
366.	大狗盤牆，細狗看樣。
　　Tuā káu puânn tshiûnn, sè káu khuànn-iūnn.	大狗翻牆，小狗學樣。形容父母、長輩的所作所為，皆為子女、晚輩的學習對象，小孩會模仿大人做壞事。多用於負面意涵，強調身教的重要。
367.	大格雞慢啼。
　　Tuā-keh ke bān thî.	大骨架的公雞比較慢啼叫。「格」指體格、骨架，骨架較大的公雞需要較長的時間成長，所以開始啼叫的時間也比較遲。比喻大器晚成。當人表現不盡人意，或一時不得志，尤其是小孩表現欠佳之時，常用此話鼓勵。
368.	大人愛趁錢，囡仔愛過年。
　　Tuā-lâng ài thàn-tsînn, gín-á ài kuè-nî.	大人喜歡賺錢，小孩喜歡過年。於昔日農業社會，家家戶戶普遍貧窮，父母為了生活所需，只要有錢賺，就不遺餘力去做；反而是小孩子最喜歡過年，有壓歲錢可花、有新衣可穿、有糖果可吃，整日樂不可支。比喻大人、小孩各有所好。
369.	大人儉一喙，囡仔食甲飫。
　　Tuā-lâng khiām tsi̍t tshuì, gín-á tsia̍h kah uì.	大人省一口，小孩吃到膩。意即大人少吃一口食物，就能讓食量較小的小孩子吃得飽，甚至吃到膩了。這是老人家疼愛小孩子的用語。
370.	大人生日食肉，囡仔生日食拍。
　　Tuā-lâng senn-ji̍t tsia̍h bah, gín-á senn-ji̍t tsia̍h phah.	大人生日吃肉，小孩生日挨打。孩子的生日是母親的受難日，打孩子是提醒他母親受的苦難。小孩生日時常會藉機要求一些東西，大人就用這句押韻的話，戲謔地告訴孩子不能要求太多。
371.	大細目，懸低耳。
　　Tuā-sè-ba̍k, kuân-kē-hīnn.	大小眼，高低耳。眼睛一大一小為偏心的比喻，耳朵一高一低為偏聽的比喻。用來形容人處事不公正。
372.	大鼎未滾，細鼎沖沖滾。
　　Tuā tiánn buē kún, sè tiánn tshiâng-tshiâng-kún.	大鍋裡的湯還沒滾，小鍋裡的湯就滾得要掀開鍋蓋了。也就是滿瓶水不響，半瓶水響叮噹，形容有才學的人話少，一知半解的人說個不停。
373.	大腸告小腸。
　　Tuā-tn̂g kò sió-tn̂g.	大腸裡沒有東西，控告小腸沒有把食物送過來。形容飢腸轆轆，肚子非常餓。
374.	大舌閣興喋。
　　Tuā-tsi̍h koh hìng thi̍h.	口吃又愛說話。「喋」本指人說話結結巴巴，「興喋」在這裡指喜歡說話或插嘴。通常不指稱真正口吃的人，而是用來形容人話說不清楚，偏偏又很愛表示意見。
375.	大碗閣滿墘。
　　Tuā uánn koh buán kînn.	盛得已經滿到碗的上緣來了。比喻東西量多質好，物超所值。 有時引申為人心不足，貪得無厭，要得很多。
376.	有樣看樣，無樣家己想。
　　Ū iūnn khuànn iūnn, bô iūnn ka-kī siūnn.	有樣學樣，沒樣自己想。意為有榜樣可學就依樣畫葫蘆，否則就自己想辦法；或指除了模仿他人，也應自行創作。
377.	有囝有囝命，無囝天註定。
　　Ū kiánn ū kiánn miā, bô kiánn thinn tsù-tiānn.	有孩子是命運的安排，沒孩子是天註定的。用來安慰膝下無子的人不要過於強求。
378.	有量就有福。
　　Ū-liōng tō ū hok.	有度量就有福氣。指有度量的人自然會受到上天眷顧，得到賜福。
379.	有燒香有保庇，有食藥有行氣。
　　Ū sio-hiunn ū pó-pì, ū tsia̍h io̍h ū kiânn-khì.	燒香拜佛就會得到神佛保佑，吃藥就會有療效。比喻只要努力或是付出，就會有所收穫或是助益。亦即一分耕耘，一分收穫。
380.	有唐山公，無唐山媽。
　　Ū Tn̂g-suann kong, bô Tn̂g-suann má.	有來自唐山的父系祖先，沒有來自唐山的母系祖先。清初在渡臺禁令下，來臺開墾者多為單身的男性，往往與當時母系社會的平埔族女性通婚，而產生此現象。
381.	有喙講甲無瀾。
　　Ū tshuì kóng kah bô nuā.	嘴巴說得口水都乾了。比喻費盡唇舌，還是沒辦法說服別人。
382.	有食閣有掠。
　　Ū tsia̍h koh ū lia̍h.	有得吃還有得拿。比喻一件好事還另有其他附加價值。
383.	有狀元學生，無狀元先生。
　　Ū tsiōng-guân ha̍k-sing, bô tsiōng-guân sian-sinn.	有狀元學生，沒有狀元老師。學生學成，可能考上狀元，卻沒有狀元回頭來當老師。比喻學生常比老師傑出。
384.	有一好，無兩好。
　　Ū tsi̍t hó, bô nn̄g hó.	世界上的事情有利必有弊，很難兩全其美，意即魚與熊掌不可兼得。
385.	畫虎畫皮難畫骨，知人知面不知心。
　　Uā hóo uā phî lân uā kut, ti jîn ti biān put ti sim.	人只能畫出老虎外表的皮相，卻無法畫出老虎內在的骨相，光憑外表，無法真實了解人內心的想法。比喻人心難測。
386.	歪喙雞食好米。
　　Uai-tshuì ke tsia̍h hó bí.	歪嘴雞吃好米。「歪喙雞」比喻不健全、不健康的人或物，好米指完好無缺的米粒。比喻人有不符自己身份或能力的過度慾望；也指人條件不好，卻又愛挑剔。
387.	冤家變親家。
　　Uan-ke piàn tshin-ke.	由仇人變成姻親。 原本互不相容的人，爭吵到後來反而發現對方的優點而成為好友。
388.	怨生無怨死。
　　Uàn senn bô uàn sí.	人死了，一了百了，前債恩怨都應一筆勾銷。勸人解除對往生之人的懷恨。
