1. 合乎常理常規的行事作為。
伊做代誌真有理氣，毋才逐家攏信任伊。(他做事都依照常理，所以大家都信任他。)
利頭
lī-thâu
⚫
1. 利潤。
做進出口生理的利頭袂䆀，毋過本錢誠粗，嘛有風險，欲投資著愛較斟酌咧。(做進出口生意的利潤很高，毋過本錢要夠多，也有風險，要投資得要小心一點。)
⚫
2. 利益、好處。
你開合喙攏咧講伊的話，伊到底有啥物利頭通予你食燒食冷咧？(你開口閉口都在幫他講話，究竟他有什麼利益可以讓你吃香喝辣呢？)
掠跤掠手
lia̍h-kha-lia̍h-tshiú
⚫
1. 綁手綁腳。引申為使用各種方式束縛或阻礙他人。
囡仔考牢大學，欲揀佗一科系來讀，序大人仙都毋通共掠跤掠手，無顧伊本人的意願。(兒女考上大學，要選讀哪一科系，做父母親千萬不要束縛兒女，不理會他本身的意願。)
掠車
lia̍h-tshia
⚫
1. 超車。
救護車沿路掠車佮爍紅火，誠緊就共病人送去病院的急診室。(救護車沿途超車和閃爍紅燈，很快就把病人送到醫院的急診室。)
料身
liāu-sin
⚫
1. 質料。布料的質地。
這軀洋裝的料身袂䆀，色水閣真媠，價數應該無俗。(這件洋裝的質料不錯，色澤又
很美，價格應該不便宜。)
冷底
líng-té/líng-tué
⚫
1. 指體質虛寒。
阿母講我較冷底，袂堪得食冰水佮西瓜這款的物件。(媽媽說我體質較虛寒，禁不起喝冰水和吃西瓜這類的東西。)
落工
lo̍h-kang
⚫
1. 工作時間到，離開工作岡位。
頭家有吩咐咱起工、落工攏愛照時間。(老闆有交代我們要準時上下班。)
落妝
lo̍h-tsng
⚫
1. 卸妝。洗除臉上的化妝。
伊出門的時若有化妝，轉到厝就會隨落妝。(他出門的時候要是化了妝，回到家就會隨即卸妝。)
馬鈴薯片
má-lîng-tsî-phìnn/má-lîng-tsû-phìnn
⚫
1. 洋芋片。
這馬鈴薯片烘甲酥酥閣芳芳，食著有夠紲喙。(這洋芋片烤得又脆又香，讓人一片接一片停不下來。)
硬鼻
ngē-phīnn/ngī-phīnn
⚫
1. 固執、硬脾氣。
伊有夠硬鼻的，別人的意見伊攏聽袂入去。(他相當固執，別人的意見他都聽不進去。)
硬喙
ngē-tshuì/ngī-tshuì
⚫
1. 嘴硬、嘴強。說話強硬，不肯認輸或認錯。
愛有本等佮實力才有法度予眾人服你，若干焦硬喙死諍，是上無路用的步數。(要有本領和實力才有辦法讓眾人服你，如果只是嘴硬爭論，是最無效的招式。)
⚫
2. 說話堅持己見。
見擺開會若聽著別人有無仝的意見，伊就誠硬喙，攏無欲讓步，真正無伊法。
(他遇到不同意見的事情卻那麼嘴硬，都不讓步，真是拿他沒辦法。)
掩揜
ng-iap
⚫
1. 遮掩。
彼兩个人佇巷仔內相掩揜，毋知欲創啥物歹代。(那兩個人在巷子內互相遮掩，不知道要做什麼壞事情。)
⚫
2. 暗藏別人的東西，想據為己有。
彼箍歹手爪，不時偷掩揜人的物件。(他手腳不乾淨，時常把人家的東西暗藏起來想
據為己有。)
懦懦
nōo-nōo
⚫
1. 慢性子。性情遲緩。
伊生成懦懦，看伊做代誌予人活欲急死。(他天生慢性子，看他做事真是急死人了。)
⚫
2. 軟弱、膽小、退縮。
伊個性懦懦，拄著僫解決的代誌，就勼轉去矣。(他個性軟弱退縮，遇到難解決的事情就龜縮回去了。)
爛朽朽
nuā-hiú-hiú
⚫
1. 破破爛爛。
彼間厝真久無人蹛矣，厝頂早就爛朽朽矣！(那間房子很久沒有住人了，屋頂早已破破爛爛了！)
爛蜞
nuā-khî
⚫
1. 蛞蝓。
爛蜞會食青菜、果子的幼葉仔，是農業的害蟲。(蛞蝓會吃青菜、水果的嫩葉，是農業的害蟲。)
瀾鬚
nuā-tshiu
⚫
1. 口沫。
流感的病毒會綴瀾鬚穢人，毋才講感著的人愛掛喙罨。(流感的病毒會隨著飛沫傳染給別人，才會建議染病的人要戴口罩。)
烏肉底
oo-bah-té/oo-bah-tué
⚫
1. 天生膚色黝黑。
伊本成就烏肉底，毋是曝烏的。(他天生膚色黑，不是曬黑的。)
烏白講
oo-pe̍h-kóng
⚫
1. 胡說、胡說八道、亂講
無證據的代誌毋通佇遐烏白講。(沒有證據的事不要在那裡亂講。)
飽流
pá-lâu
⚫
1. 漲潮。
石滬利用飽流、洘流掠海產，予魚蝦會得入來，袂得出去。(石滬利用漲退潮捕獲海產，讓魚蝦進得來，出不去。)
崩駁
pang-poh/pang-phoh
⚫
1. 決堤、潰堤。堤防或河岸遇大水或洪流而遭沖毀。
這改風颱做大水，彼條溪仔的駁岸就按呢崩駁去。(颱風造成水災，那條溪流的堤防因而潰堤了。)
放尿
pàng-jiō/pàng-liō
⚫
1. 撒尿、排尿。
若欲睏愛先去放尿，半暝仔才袂泄尿。(如果要睡得先去尿尿，半夜才不會尿床。)
八月半
Peh-gue̍h-puànn/Pueh-ge̍h-puànn
⚫
1. 中秋。農曆八月十五日。
今年的八月半，阮規陣人相招欲來去烘肉佮賞月。(今年的中秋節，我們一群人相約要一起去烤肉跟賞月。)
白肉底
pe̍h-bah-té/pe̍h-bah-tué
⚫
1. 膚色白。
伊生本就白肉底，毋管按怎曝，都曝袂烏。(他天生皮膚就白，不論怎樣曬，都曬不黑。)
平鼎仔
pênn-tiánn-á/pînn-tiánn-á
⚫
1. 平底鍋。一種底部平坦，適用於煎、炒料理食物的鍋具。
阿母當咧用伊新買來的平鼎仔炒菜。(媽媽正在用他新買的平底鍋炒菜。)
拍撋
phah-nuá
⚫
1. 對易損之物粗暴處理。
這領衫料身遮爾仔好，毋通烏白拍撋。(這件衣服材質這麼的好，不要胡亂粗暴搓洗。)
⚫
2. 韌性、耐力
這領拍鐵仔褲較有拍撋。(這件牛仔褲比較耐洗。)
拍層
phah-tsân
⚫
1. 打層次。
伊這擺鉸頭鬃順紲拍層，規个人看著閣較有氣質矣。(他這次剪頭髮順便打層次，整個人看起來更有氣質了。)
冇心
phànn-sim
⚫
1. 質地鬆散不結實。
原來這塊柴是冇心的，莫怪提著遮爾仔輕。(原來這塊木柴的內部質地疏鬆，難怪拿起來如此輕。)
品捧
phín-phóng
⚫
1. 誇耀、吹牛、誇大其詞。
毋通提你的過去出來品捧，無人會相信你。(不要拿你的過去出來誇耀，沒有人會相信你的。)
蓬蓬坱
phōng-phōng-ing
⚫
1. 形容塵土飛揚的樣子。
阮兜彼箍圍仔有黜塗機咧挖路，一四界蓬蓬坱，厝內外專塗沙。(我家附近有挖土機在挖馬路，到處塵土飛揚，屋子裡外都是灰塵。)
浮頭
phû-thâu
⚫
1. 頭浮起來、冒出頭。
海翁若欲喘氣，愛先浮頭予鼻空離開水
面。(鯨魚要呼吸的話，得先把頭浮起來讓鼻孔離開水面。)
⚫
2. 發達、繁榮。
建築業若開始浮頭，其他的行業就會沓沓仔綴咧發展。(建築業如果開始繁榮，其他行業就會慢慢地跟著發展。)
⚫
3. 嶄露頭角。
經過遐濟年注心練習，伊總算佇這改歌唱比賽浮頭矣！ (經過多年專心練習，他總算在這次歌唱比賽嶄露頭角了！)
袚巾
phua̍h-kin/phua̍h-kun
⚫
1. 披肩。披搭在肩上的服飾。
今仔日並昨昏較生冷，你欲去公園散步，著共袚巾幔佇肩胛頭才出門。(今天比昨天更冷，你想去公園散步，得把披肩披在肩膀上再出門。)
比手畫刀
pí-tshiú-uē-to
⚫
1. 比手畫腳。以手腳比劃，表達意思。
彼个外國人欲問路，那講那比手畫刀。(那個外國人要問路，一邊說話一邊比手畫腳。)
拚硬仔
piànn-ngē-á/piànn-ngī-á
⚫
1. 克服困難，完成艱辛的工作。
聽講今仔日的穡頭真歹做，我看愛拚硬仔矣。(聽說今天的工作不好做，我看要硬拚了。)
飯匙鵝
pn̄g-sî-gô
⚫
1. 面琵鷺。每年九月至十月自臺灣北方的韓國或中國的東北地區飛到南方渡冬，一直待到隔年的三月至五月。
抐桮的喙若像飯匙，規身軀白蔥蔥足成鵝，所以閣共伊號做飯匙鵝。(黑面琵鷺的鳥喙像飯匙，全身潔白很像鵝，所以又取名做飯匙鵝。)
玻璃清
po-lê-tshing
⚫
1. 玻璃體。指眼球內水晶體後方的無色透明黏稠液膠狀物質，和睫狀體及網膜連接，有支撐眼球內壁的作用。
人到中年目睭的玻璃清有可能會退化，目睭前會有烏影。若有這種症頭，愛去揣醫生檢查。 (人到中年眼睛的玻璃體可能會退化，眼前會有黑影。要是有這種症狀，
得去找醫生檢查。)
薄本
po̍h-pún
⚫
1. 資本額少的小生意。
伊大學出業了後，就轉來故鄉做一个薄本的小生理。(他大學畢業後，就回來故鄉做一個小本生意。)
布底
pòo-té/pòo-tué
⚫
1. 布料的質地。
這領衫的布底是誠幼膩的棉紗，穿著袂黏身軀閣會欶汗。(這件衣服的質料是細緻的棉紗質，穿起來不黏身又會吸汗。)
半挨推
puànn-e-the/puànn-ue-the
⚫
1. 半推半就。心中早已同意，表面上卻不答應，表現出假意推辭的姿態。
同學選伊做班長，伊雖然半挨推，落尾猶是答應矣。(同學選他來當班長，他雖然半推半就，最後還是答應了。)
拔骨
pue̍h-kut/pui̍h-kut
⚫
1. 發育、成長。指人在發育期間明顯長高。
伊這站當咧拔骨，大甲有看著。(他這陣子在發育，明顯長高了許多。)
犀牛照角
sai-gû-tsiò-kak
⚫
1. 大眼瞪小眼。如同兩隻犀牛以犄角互瞄對方，比喻兩人怒目相視互不退讓，或是兩人意見不合，一見面就爭吵。
𪜶兩个袂輸犀牛照角，見面就觸，凡若看著的人攏幌頭。(那兩人宛如犀牛對峙，一見面就吵架，凡是看到的人都搖頭嘆息。)
⚫
2. 眉目傳情。用來調侃感情恩愛夫妻或情侶，眉目傳情、相看兩不厭的表情。
彼對翁仔某出門毋但手牽手，目睭閣不時都咧犀牛照角，真正予人欣羨甲。(那對夫妻出門不但十指相扣，眼神又不時互送秋波，讓人羨慕得很。)
使喙
sái-tshuì
⚫
1. 出言指揮、發號施令。
社會愛分工，𠢕的人使喙，普通人出力，運作才會順序。(社會需要分工，能力強的人指揮，普通人出力，運作才會順暢。)
送山
sàng-suann
⚫
1. 送葬、送殯。送死者到墓地安葬。
這禮拜我欲去共許的送山，你敢是嘛欲去
送伊？(這星期日我要去參加老許的葬禮，你是不是也要去送他？)
三兩下手
sann-nn̄g-ē-tshiú
⚫
1. 三兩下子。形容動作純熟迅速，毫不費工夫即可完成某件事情。
這个畫家三兩下手就共人像畫好矣。 (這個畫家三兩下子就將人像畫好了。)
死毋坐認
sí-m̄-tshē-jīn/sí-m̄-tshē-līn
⚫
1. 執意不肯承認錯誤。
這件代誌明明就是你毋著，你閣死毋坐認。(這件事明明就是你的錯，你還死不認錯。)
時世
sî-sè
⚫
1.時代。
咱的想法佮做法，著愛綴會著時世，才袂予人講是老古董。(我們的想法與做法，得與時俱進，才不會被人說成老古董。)
射筒
siā-tâng
⚫
1. 針筒。西醫所用注射器裝藥液的地方。
伊足驚注射，便若看著護士共射筒攑出來，就會驚甲咇咇掣。(他很怕打針，只要看到護士拿出針筒，就會嚇得直發抖。)
鑠奅
siak-phānn
⚫
1. 時髦、時尚。形容人的穿著打扮或是物品非常地時髦、時尚。
你今仔日滿面春風，穿甲遮爾仔鑠奅，是欲去佗位風騷咧？(你今天滿臉笑容，又穿得這麼時髦，是要去哪裡遊玩啊？)
搧腹肚邊
siàn-pak-tóo-pinn
⚫
1. 敲竹槓、敲詐、趁火打劫。藉機強迫謀取利益。
聽講彼个田僑仔賣地有趁幾若億，就隨有咧走路的兄弟倚來共搧腹肚邊，敲寡所費通用。(聽說那位大地主賣地賺了好幾億，馬上就有在逃亡的道上兄弟跑來敲竹槓，訛詐些錢財花用。)
相挨推
sio-e-the/ sann-ue-the
⚫
1. 事前彼此推拖，藉詞拒絕，不願承當。
代誌都未曾做咧，就按呢相挨推，有影毋是款。 (事情都還未進行，就彼此互相推諉，實在不像話。)
⚫
2. 事後相互推卸責任。
代誌一下煏空，逐家就相挨推，按呢啥人
欲負責？(事情敗露之後，大家就相互卸責，這樣誰要負責？)
相拄頭
sio-tú-thâu
⚫
1. 碰頭、碰面、遇見、見面。
路頭路尾佮人相拄頭，準講是無蓋熟似的厝邊，嘛愛開喙相借問一下。(在半路上遇到人，即使是不太熟稔的鄰居，還是要開口問候一下。)
⚫
2. 相連、相接、毗鄰、鄰接。
嘉義市佮嘉義縣佇八掌溪相拄頭。 (嘉義市跟嘉義縣在八掌溪毗鄰。)
小局
sió-kio̍k
⚫
1. 小事一樁、小場面。
麵擔仔衛生無好害人客食了落屎猶小局，上害的是濫會傷身體的化學添加物，害主顧客帶身命才是夭壽。(麵攤衛生不好害顧客拉肚子還算是小事一樁，最糟糕的是加進會傷身體的化學添加物，害老顧客染上慢性病才是缺德。)
⚫
2. 小氣、不大方。
做人毋通傷小局，若無，會無人緣。(為人不可以太小氣，否則，會不討人喜歡。)
泅水箍仔
siû-tsuí-khoo-á
⚫
1. 泳圈。游泳時為增加浮力所使用的橡皮圈。
熱人到矣，有真濟人紮泅水箍仔去海邊仔耍水。(夏天到了，有許多人帶游泳圈去海邊戲水。)
酸甘
sng-kam/ sng-lam
⚫
1. 味道酸酸甜甜。
時計果食著酸甘酸甘。(百香果吃起來酸酸甜甜的。)
所擺
sóo-pái
⚫
1. 所以、以至於。用來連接前後句的因果關係，常與「因為」、「雖罔」連用。
因為伊枵過飢閣生狂食，所擺胃腸袂堪得，這陣咧喝腹肚疼矣。(因為他餓過頭又吃太急，以至於腸胃受不了，正在喊肚子痛。)
素色
sòo-sik
⚫
1. 白色、素色、淡雅的顏色。
烏肉底的阿雪穿素色的衫，看著誠蔭肉。(皮膚黝黑的阿雪穿起素色的衣服，看起來
皮膚的明亮度提高了。)
素常
sòo-siông
⚫
1. 平常、平時。
阿母素常佇食暗飽會去外口行行踅踅咧。(媽媽平常在晚飯後會出去外面走一走晃一晃。)
事尾
sū-bué/sū-bé
⚫
1. 餘波。事件結束後留下的影響。
若有心欲和解，袂使干焦會失禮就準過，對方損失偌濟嘛愛賠人，較袂有事尾。(若有誠意想和解，不能只道歉就想息事寧人，對方損失多少也得賠償，才不會有後遺症。)
沙肺
sua-hì
⚫
1. 塵肺症、矽肺症。一種職業病，因長期吸入各種塵埃、微粒，所引起肺部病變的統稱。
阿明長期佇炭空作穡，攏無照規定咧澍水、掛喙罨，年久月深就致著沙肺。(小明長期在煤礦坑裡工作，都不依照規定噴水霧、戴口罩，久而久之就罹患塵肺症。)
紲攤
suà-thuann
⚫
1. 續攤。聚會結束後，接著下一個應酬或活動。
這攤啉煞，咱敢欲閣紲攤？(這場喝完之後，我們還要續攤嗎？)
煞工
suah-kang
⚫
1. 下班、工作結束。
麻煩你佇今仔日煞工進前共計畫書交予我。(麻煩你在今天下班前將計畫書交給我。)
散掖掖
suànn-iā-iā
⚫
1. 散亂。
物件用了愛囥轉去原位，才袂一四界散掖掖。(物品使用後要放回原位，才不會到處一片凌亂。)
衰頹
sue-tuê
⚫
1. 衰敗、式微。事業或運勢衰微頹廢。
自從老頭家過身了後，這个家族就漸漸衰頹矣。(自從老當家過世後，這個家族就漸漸沒落了。)
捽後炮
sut-āu-phàu
⚫
1. 暗箭傷人。
伊佮我是相黏蒂帶的好朋友，料袂到伊煞共我捽後炮。(他和我是很親密的好朋友，
萬萬沒想到卻暗地裡傷害我。)
⚫
2. 放馬後炮。
代誌過去矣才咧捽後炮。(事情過去了才放馬後炮。)
擔帶
tam-tài
⚫
1. 負責、承當。
這款細項代誌閣著愛經理出面來擔帶，今公司遐的幹部敢攏無才調解決是毋？(這種小事情還要經理出面來負責，現在公司的那些幹部難道都沒辦法解決嗎？)
銅鼎仔
tâng-tiánn-á
⚫
1. 炊具。統稱烹飪用的鍋具。
灶跤的銅鼎仔便若用過，一定愛洗予清氣，才通收起來囥。(廚房的炊具只要用過，絕對要把它洗乾淨，才能收起來。)
重篤篤
tāng-tauh-tauh
⚫
1. 非常重。
黃金博物館彼塊金仔角重篤篤，到今猶無人搬會振動得。(黃金博物館裡的那塊金塊非常的重，至今還沒有人能搬得動。)
通好
thang-hó
⚫
1. 俾能、以便、便於。
手面去洗洗咧，通好食飯。(手和臉去洗一洗，以便吃飯。)
體剔
thé-thak/thué-thak
⚫
1. 責備、責罵。
伊開喙就欲共人體剔，莫怪無人愛佮伊來去。(他開口就責罵人，難怪沒人想跟他往來。)
疼風
thiànn-hong
⚫
1. 痛風。病名。是一種因嘌呤代謝障礙，尿酸的結晶沈積在關節內，進而產生嚴重的關節發炎反應。
有疼風的人愛忌喙，腹內、蚶仔佮蚵仔較莫食咧。(患有痛風的人要忌口，內臟、蛤蜊、牡蠣盡量不要吃。)
𤶃仔子
thiāu-á-tsí
⚫
1. 青春痘。
你發遐濟𤶃仔子，著較莫食傷燥的物件。(你長那麼多的青春痘，應該少吃過於燥熱的東西。)
逞性
thíng-sìng
⚫
1. 逞強。
有偌濟力，就做偌濟代誌，千萬毋通逞性。(凡事量力而為，千萬不可逞強。)
⚫
2. 任性、隨便。
逞性的人較歹鬥陣。(任性的人較難相處。)
⚫
3. 得寸進尺、貪得無厭。
你甲得著好處著愛知足矣，莫傷逞性，閣欲要求遐濟。(你既然得到好處就要知足了，別再得寸進尺，貪求更多。)
討衰
thó-sue
⚫
1. 自己招惹來的霉運或別人不友善的對待。
人曷無請你，你煞家己坐起去大位，你是咧討衰是無？(人家沒請你，你卻自己跑去坐主位，你是在自討沒趣嗎？)
拖帆
thua-phâng
⚫
1. 形容人做事拖泥帶水。
伊做代誌誠𠢕拖帆，定定佇交貨期限彼工才咧趕工。(他做事情很會拖拖拉拉，常在交貨期限當日才加快工作速度。)
炭工
thuànn-kang
⚫
1. 礦工。本指採煤炭工人，後泛指採礦工人。
伊捌佇礦業公司做炭工咧挖金仔礦。(他曾經在礦業公司當礦工開採金礦。)
推排
thui-pâi
⚫
1. 處置安排。
代誌會遮爾順序，攏是你𠢕推排。(事情會這麼順利，都是你很懂得處置安排。)
摘抄
tiah-tshau
⚫
1. 摘錄。經過選擇後抄寫紀錄。
伊當咧無閒摘抄通過檢定的名單。(他正忙著摘錄通過檢定的名單。)
恬才
tiām-tsâi
⚫
1. 誠實莊重，行事規矩。
恬才的人才做有好頭路。(誠實莊重的人才能把工作做好。)
恬喌喌
tiām-tsiuh-tsiuh
⚫
1. 寂靜、鴉雀無聲。
頭家若受氣起來，員工就攏恬喌喌出在伊罵。(老闆如果生氣，員工就靜靜地讓他罵。)
⚫
2. 個性靜默、非常安靜。
恁囝真乖，規工恬喌喌坐佇膨椅看尪仔冊，攏袂吵人。(你兒子很乖，整天安安靜靜坐在沙發上看漫畫，都不會吵到別人。)
中聽
tìng-thiann
⚫
1. 中聽。好聽，聽來悅耳、讓人滿意。
業務員講的話若中聽，業績一定會較好。
(業務員說的話如果中聽，業績一定會比較好。)
定規
tīng-kui
⚫
1. 必定、必然、肯定。
今仔日定規愛共這項代誌辦予好勢。(今天一定要把這件事情處理好。)
中站
tiong-tsām
⚫
1. 半途、半路。路程的一半。
阮去公園散步，行到中站，看著人咧弄布袋戲尪仔，有影誠心適。(我們到公園散步，走到半路，看到有人在操弄布袋戲偶，非常有趣。)
⚫
2. 中途，中間。事情進行的中間。
會開到中站的時，董事長宣佈明年薪水加五pha，逐家聽了攏誠歡喜。(會議開到中途時，董事長宣佈明年加薪百分之五，大家聽了都非常開心。)
轉氣
tńg-khuì
⚫
1. 呼吸換氣。
久無運動，小可仔走一下就喘甲袂得轉氣。(太久沒運動，稍微跑一下就喘不過氣來。)
⚫
2. 手氣變好。
進前的生理真䆀，這馬總算轉氣矣。(之前的生意很差，現在總算好轉了。)
長尾山娘
tn̂g-bué-suann-niû/tn̂g-bé-suann-niû
⚫
1. 臺灣藍鵲。
阮去𬦰山的時，有看著幾若隻長尾山娘。(我們去爬山的時候，看到了好幾隻臺灣藍鵲。)
斷站
tn̄g-tsām
⚫
1. 指做某件事或工程，因故於進行中停止或擱置。
這个工程因為疫情的關係煞斷站去，毋知當時才會閣再振動。(這個工程因為疫情的關係中斷掉了，不曉得何時才會再動工。)
倒頭生
tò-thâu-senn/tò-thâu-sinn
⚫
1. 逆產、臀位分娩。
古早時代，若是倒頭生，母仔囝定定會無性命。(以前，若是足位分娩，母子常會失去生命。)
同窗會
tông-tshong-huē
⚫
1. 同學會。指畢業後同學們為維繫情誼舉辦的聚會。
昨昏我轉去故鄉參加同窗會，拄著足久無
聯絡的同窗的，足歡喜的！(昨天我回去故鄉參加同學會，遇到久未聯絡的同學，很開心！)
纘
tsàn
⚫
1. 承接。忍、撐。
我看伊咧欲纘袂牢矣，你緊猛去共扶一下。(我看他快支撐不住了，你趕快去扶他一下。)
贊喙
tsàn-tshuì
⚫
1. 敲邊鼓、聲援。
孤伊一个人唱聲，無人贊喙。(就他一個人撂狠話，沒人聲援。)
實捅捅
tsa̍t-thóng-thóng
⚫
1. 形容人或物塞得極滿，毫無空隙。
下班時間，逐幫車攏櫼甲實捅捅。(下班時間，每班車都擠得水洩不通。)
⚫
2. 形容人愚鈍不知變通。
伊的頭殼實捅捅，做代誌定定袂曉變通。(他頭腦愚鈍，做事常常不知變通。)
⚫
3. 指充滿心事，顧不得其他的事。
伊想甲心肝實捅捅，毋知欲按怎才好。(他想得滿心憂慮，不知道怎麼辦才好。)
插車
tshah-tshia
⚫
1. 停車。找空位停放車子。
阮老母足𠢕插車，閣較細的格仔位伊攏有才調共車停入去。(我媽媽很會停車，再小的停車格，他都有本事把車停進去。)
臭生荒
tshàu-tshenn-hng/tshàu-tshinn-hng
⚫
1. 荒置、廢棄任其荒涼。
彼塊田地無人種作，放咧臭生荒，誠無彩。(那塊田地因為無人耕種，放著任其荒廢，真是可惜。)
脆命
tshè-miā
⚫
1. 短命。生命力弱。
狗蟻足脆命，無細膩就予人踏死。(螞蟻很容易死掉，一不小心就會被踩死。)
冊桌仔
tsheh-toh-á
⚫
1. 書桌。讀書用的桌子。
阮阿母買一塊新的冊桌仔，欲予我看冊佮寫宿題較利便。(我媽媽買了一張新的書桌，方便我看書跟寫功課。)
生猴
tshenn-kâu/tshinn-kâu
⚫
1. 急性子、冒失、慌張。形容人個性急躁、魯莽或做事粗率、不謹慎。
做代誌毋通傷生猴，勻勻仔做較袂脫箠。(做事情不要慌慌張張，謹慎地做比較不容
易出差錯。)
⚫
2. 生手、新手。指剛進職場，對某種事務的經驗或技術不純熟的人。
頭家叫我牽彼个拄來上班的生猴，講著愛較有耐心咧。(老闆要我引導那個剛來上班的新手，說得要有耐心一些。)
生凊風
tshenn-tshìn-hong/tshinn-tshìn-hong
⚫
1. 陰風、寒風、冷風。
寒流一下來，生凊風鑽入骨縫，予人強欲接載袂牢。(寒流一來，冷風刺入骨頭的縫隙，讓人快要支撐不住。)
刺夯夯
tshì-giâ-giâ
⚫
1. 形容咄咄逼人、張牙舞爪的樣子。
咱佮人鬥陣，若是講著話就刺夯夯，定定會去得失人。(我們與人交際往來，倘若一說話就咄咄逼人，常會得罪人。)
捙桶倒
tshia-tháng-tò
⚫
1. 大雨傾盆而下。
過晝無偌久，一陣西北雨捙桶倒，隨淹過較低的坑溝佮圳仔。(午後沒多久，一場雷陣雨傾盆而下，即刻淹過較低窪的山溝和水圳。)
捙蛆
tshia-tshi
⚫
1. 孑孓，蚊子的幼蟲。
溝仔愛較捷清咧，才袂積水生捙蛆。(水溝要常清理，才不會積水長出孑孓。)
⚫
2. 形容小孩過動、躁動的樣子。
有一寡囡仔上課攏坐袂牢，親像一尾蟲按呢蟯蟯趖，實在足捙蛆。(有一些孩子上課都坐不住，就像蟲一樣動個不停，實在很躁動。)
唱注
tshiàng-tù
⚫
1. 叫囂、揚言。對某人口出狂言，並帶有挑釁意味。
對方共我唱注，講這擺比賽𪜶一定會著冠軍。(對方向我叫囂，說這次比賽他們一定會得冠軍。)
晟持
tshiânn-tî
⚫
1. 養育、撫養、扶養。
伊一下出世就予人放捒，佳哉有牧師佮牧師娘共伊晟持大漢。(他一出生就被人拋棄，幸好有牧師夫妻將他扶養長大。)
觸
tshik
⚫
1. 違逆、辜負。違逆別人的想法或辜負他人。
阿瑋共你招遐濟擺，你煞按呢直直挨推，無的確會去觸著人的好意。(阿瑋邀了你那麼多次，你卻這樣一再推辭，說不定會辜負人家的一片好意。)
⚫
2. 冒犯、觸犯。
觸著鬼(冒犯到鬼)
⚫
3. 遇到凶兆、遭遇厄運及災難。
這款歹吉兆的代誌，觸著的人攏會衰甲頭殼滴著鳥仔屎。(這種不吉利的事情，遇到的人都會倒霉到被鳥屎滴到頭頂。)
凊面
tshìn-bīn
⚫
1. 冷漠不親切的表情。凶惡、憤怒或難看的臉色。
伊定定激一个凊面予人看，人緣呔會好？ (他常常臭臉待人，人緣怎麼會好？)
清菜
tshing-tshài
⚫
1. 素菜。素食菜餚。
現代人講究健康佮環保，開始食清菜的人那來那濟。(現代人講求健康與環保，開始吃素的人口越來越多。)
手門
tshiú-mn̂g
⚫
1. 虎口。手部大拇指與食指相連的部位。
頭殼若咧楞的時，共手門的穴道揤揤、掠掠咧，會當減輕無爽快的症頭。(頭暈的時候，把手掌虎口的穴道按一按、抓一抓，可以減輕不舒適的症狀。)
⚫
2. 虎口、手臂的力量。
夯石碾會當練手骨的筋肉佮手門的力頭。(舉重可以鍛練手臂的肌肉和虎口的力道。)
粗跤重蹄
tshoo-kha-tāng-tê/tshoo-kha-tāng-tuê
⚫
1. 笨手笨腳。
伊咧做代誌粗跤重蹄，較幼路的工課毋通交代予伊。(他做事情笨手笨腳的，別把精細的工作交代給他。)
粗糠耳
tshoo-khng-hīnn/tshoo-khng-hī
⚫
1. 乾耳朵。易排出乾性耳垢的耳朵。
大多數的人攏是粗糠耳。(大多數的人都是乾耳朵。)
粗耙耙
tshoo-pê-pê
⚫
1. 粗糙、不平滑的。
阿母的手做粗重，閣欠保養，皮膚變甲粗耙耙。(媽媽的手做粗重的事，又沒保養，皮膚變得粗糙不平滑。)
粗本
tshoo-pún
⚫
1. 資本雄厚。
開建設公司是粗本的投資，你嘛真冇手，一下就共答應。(開建設公司是資本雄厚的投資，你手頭也真寬鬆，一下子就答應。)
粗絲
tshoo-si
⚫
1. 形容食用蔬果時，其纖維有粗糙的感覺。
這盤芹菜柯柯，食著較粗絲。(這盤芹菜有點老，吃起來纖維比較粗糙。)
揣食
tshuē-tsia̍h/tshē-tsia̍h
⚫
1. 覓食。尋找食物。
規陣粟鳥仔佇草埔跳來跳去咧揣食。(一群麻雀在草地上跳來跳去正在覓食。)
喙扁
tshuì-pínn
⚫
1. 啞口無言、無話可說。
伊寢頭佇遐講大聲話，有夠臭屁，尾仔予人掠著伊講的毋是實在話才喙扁。(他一開始在那裡說大話，神氣得很，後來被人逮到說的不是實話才啞口無言。)
出腳
tshut-kioh
⚫
1. 出人頭地、出類拔萃。喻人才能出眾，高出一般人之上。
伊大學出業了後，佇厝裡誠拚勢讀冊，無偌久就考牢司法官，這陣出腳矣。(他大學畢業後，在家很努力讀書，沒多久就考上司法官，現在可說是出人頭地了。)
出人前
tshut-lâng-tsîng/ tshut-lâng-tsiân
⚫
1. 才能特出，超越眾人。
錢銀幾萬千，毋值囝孫出人前。(錢財幾千萬，都不如子孫才能出眾。)
⚫
2. 小孩子到公眾場合不怕陌生。
這个囡仔上台演講真在，有影出人前。(這個孩子上台演講台風穩健，果然是不怕生。)
支理
tsi-lí
⚫
1. 支付、付款。負擔費用。
有一寡風景區對超過六十五歲的老大人，門票會當優待免支理。(有一些風景區對超過六十五歲的長輩，有免收門票的優惠。)
⚫
2. 接手處理款項或事務。
食老矣，厝裡的代誌攏放予少年的去支理矣。(年紀大了，家裡的事情都交給年輕人去處理了。)
食老本
tsia̍h-lāu-pún
⚫
1. 吃老本。比喻人憑恃昔日的儲蓄與
本領來過日子。
佳哉伊較早趁的錢有儉起來，這馬無囡仔欲共飼，猶會當食老本。(還好他之前賺的錢有存起來，現在沒有孩子要扶養他，還可以吃老本。)
成款
tsiânn-khuán
⚫
1. 像樣。達到令人滿意的樣子。
爸母若有認真管教，囡仔一定會成款。(父母要是認真管教，小孩一定會像樣。)
齊透
tsiâu-thàu
⚫
1. 齊備、齊全。
若欲招伴去𬦰懸山，物件佮裝備愛攢有齊透才通出門，較袂有代誌。(如果要找同伴去爬高山，物品和裝備要樣樣齊備才能出門，比較不會有事情。)
⚫
2. 透澈。
欲做科技創新，理論愛先學予齊透才有可能達成目標。(想做科技創新，理論要先學透澈了才可能達成目標。)
茈鳥仔
tsínn-tsiáu-á
⚫
1. 指對事物或工作尚不熟悉、缺乏經驗的新人。
伊是拄入來咱公司的茈鳥仔，逐項猶無啥捌，勞煩逐家費神共伊照顧囉。(他是剛進來我們公司的新人，凡事都還不太清楚，麻煩大家費神照顧他囉。)
⚫
2. 指無經驗的少年人。
拄才出社會的茈鳥仔，著愛認真拍拚才有好前途。(剛出社會的新鮮人，要認真努力工作才有好前途。)
錢額
tsînn-gia̍h
⚫
1. 金額；錢的額度。
你銀行口座內底的錢額無夠，毋才水電錢無法度對內底扣。(你銀行帳戶裡面的金額不夠，所以水電費沒辦法從裡面扣款。)
執硬
tsip-ngē/tsip-ngī
⚫
1. 頑固、固執。堅持己見不知變通，抵死也不改變。
伊這款執硬的性癖若攏毋改，緊縒慢會食著鹼。(他這種固執不知變通的個性若不改變，早晚會吃到苦頭。)
一下仔
tsi̍t-ē-á
⚫
1. 一下子、一會兒。表示極短的時間。
伊跤手真猛掠，遮爾濟工課一下仔就完成矣。(他手腳很伶俐，這麼多工作一下子就完成了。)
一步取
tsi̍t-pōo-tshú
⚫
1. 一個可取之處。
伊是較貧惰讀冊爾爾，毋過猶有一步取，就是做工課真頂真。(他是比較懶得讀書而已，不過還有一個可取之處，就是工作很細心。)
這氣
tsit-khuì
⚫
1. 這次、這回、最近、這陣子。距離說話前後不久的日子。
這氣的果子大豐收。(這次的水果大豐收。)
咒死絕誓
tsiù-sí-tse̍h-tsuā
⚫
1. 發誓、發毒誓。
警察佇彼間茶行搜著提煉毒品的原料佮家私，頭家咒死絕誓講伊是予人冤枉的。(警方在那間茶行查獲製煉毒品的原料佮家私，老闆發毒誓說他是被冤枉的。)
上範
tsiūnn-pān
⚫
1. 像樣。
𪜶兜遐濟囡仔內底，干焦伊較上範。(他們家眾多的小孩裡面，只有他比較像樣。)
⚫
2. 得體。達到令人滿意的水準。
咱欲去大間公司允頭路，愛穿較成樣的西裝才會上範。(我們要去大的公司面試，要穿比較像樣的西裝穿才算得體。)
上算
tsiūnn-sǹg
⚫
1. 計算數量。常用於列入帳目或計入人數。
𪜶兩个上算的人額無仝，愛閣重頭來算。 (他們兩位計算的人數不同，要再重算。)
⚫
2. 有用途的、值得肯定的或有價值的。
佇臺南揣會著誠濟上算的景點，咱做伙來去遐𨑨迌。(在臺南可以找到很多值得探訪的景點，我們一起去那裡遊玩。)
⚫
3. 合算、划算。
這本出版無偌久的辭典當咧喝俗賣，現此時來買真上算。(這本出版沒多久的辭典正在打折出賣，現在買很划算。)
庄跤人
tsng-kha-lâng
⚫
1. 鄉下人。指居住在鄉村的人。
真濟庄跤人為著生活，來佇都市趁食。(很
多鄉下人為了生計，來到都市賺錢過活。)
做唯是
tsò-bî-sī/tsuè-bî-sī/ tsò-bī-sī/tsuè-bī-sī
⚫
1. 索性、乾脆、只管…就是。
四界攏咧窒車，做唯是用行的較緊。(到處都在塞車，乾脆用走的比較快。)
做兵
tsò-ping/tsuè-ping
⚫
1. 服兵役。
伊今年若閣考袂牢大學，這聲無去做兵袂煞矣。(他今年如果又考不上大學，這下子必定要當兵了。)
做體藝
tsò-thé-gē/tsuè-thé-guē
⚫
1. 當成消遣在做，半做半玩來消磨時間。
阿榮仔退休了後，逐工閒仙仙，共後生鬥顧店罔做體藝，順紲看頭看尾。(阿榮退休以後，成天閒著，幫兒子看店當做消遣，順便瞻前顧後有個照應。)
做前
tsò-tsîng/tsuè-tsîng
⚫
1. 領頭、帶領。
予知路的人做前，咱綴尾後。(讓認得路的人帶頭，我們跟在後面。)
⚫
2. 當前鋒、趕在前頭。
好空的伊攏搶做前，若歹空的伊就覕甲無看見影。(撈得到好處的事他都搶在前面，沒好處可撈的他就躲得不見蹤影。)
皂烏漆白
tsō-oo-tshat-pe̍h
⚫
1. 抹黑、造謠；不實的指控。
選舉的時陣，電視、報紙共候選人皂烏漆白的事件不止仔濟，才予咱好歹人攏分袂清楚。(選舉期間，電視、報紙抹黑候選人的事件特別多，才讓我們好人壞人都分不清楚。)
總根頭
tsóng-kin-thâu/tsóng-kun-thâu
⚫
1. 要因。導致某種結果的最主要原因。
欲解決問題，愛先揣著問題的總根頭。(要解決問題，得先找出問題的要因。)
注血
tsù-hueh/tsù-huih
⚫
1. 輸血。將血液注到人體內。
伊出車禍傷甲真食力，醫生講流傷濟血著愛緊共伊注血，若無會無命去。(他出車禍受重傷，醫生說流太多血要緊急輸血，不然會沒命。)
水洘
tsuí-khó
⚫
1. 退潮。
水洘了後，海埔頂四常看會著螺仔。(退潮
之後，沙灘上經常看得到小海螺。)
水帕
tsuí-phè
⚫
1. 羊水、胎膜。
聽講伊是佇火車頂生的，因由是𪜶母仔坐火車的時水帕雄雄破去，拄好有旅客是醫生，緊猛走來鬥相共，佳哉母仔囝攏平安無代誌。(聽說他是在火車上出生的，因為他媽媽搭火車的時候羊水突然破了，恰好有旅客是醫師，趕緊跑來幫忙，幸好母子都平安無事。)
大木
tuā-ba̍k
⚫
1. 建築房屋的木工。
這馬起厝攏縛鐵仔，灌khōng-ku-lí，無人咧做大木矣。(現在蓋房子都綁鋼筋、灌混凝土，沒有人做蓋房子的木匠了。)
大日虎
tuā-ji̍t-hóo/tuā-li̍t-hóo
⚫
1. 烈日。
這陣當咧出大日虎，咱上好莫出去，較袂著痧。(現在正值烈日當空，我們最好不要出門，以免中暑。)
大細漢
tuā-sè-hàn/tuā-suè-hàn
⚫
1. 一家大小。
阿媽逐擺去廟裡拜拜，攏會祈求厝裡大細漢平安順序。(奶奶每次去廟裡拜拜，都會祈求一家大小平安順利。)
⚫
2. 童叟。小孩和老人。
做生理愛老實，大細漢攏袂使共人偏。(做生意要老實，童叟無欺。)
大厝起
tuā-tshù-khí
⚫
1. 三合院。
大厝起的埕斗是以早曝粟的所在。(三合院的內埕是以前曬稻子的地方。)
大食
tuā-tsia̍h
⚫
1. 指食量很大。
較早作田人攏放伴割稻仔，人若來鬥相共，愛攢三頓佮點心予人食，閣袂使驚人大食。(從前農人都輪流協助割稻子，人家如果來幫忙，要準備三餐跟點心給人家吃，還不能怕人家食量大。)
對面風
tuì-bīn-hong
⚫
1. 逆風。迎面而來的風。
雄雄一陣對面風搧來，害我強欲徛袂在。(猛然一陣迎面風吹過來，害我差點站不穩。)
對路
tuì-lōo
⚫
1. 對症、有效。
藥仔若是有對路，一帖就會行氣。(如果能夠對症下藥，只需一帖就有功效。)
⚫
2. 面向馬路。
大門對路，上適合開店做生理。(大門面向馬路，最適合開店做生意。)
⚫
3. 陸運。從陸路運貨。
若對路運貨，會並水路加較緊。(如果從陸路運貨，會比海路運貨快多了。)
對摵
tuì-tshi̍k
⚫
1. 折衷。
這件糾紛經過宗親序大對摵，兩爿攏有讓寡，代誌才煞去。(這項糾紛透過親族長輩折衷縱橫，雙方都有退讓一些，事情才得以解決。)
鈍跤鈍手
tūn-kha-tūn-tshiú
⚫
1. 笨手笨腳。形容動作或手腳不靈活。
伊拄學電腦的時鈍跤鈍手，不而過這馬已經學甲真老矣。(他剛學電腦時笨手笨腳的，不過現在已經學得非常熟練了。)
有局
ū-kio̍k
⚫
1. 有意思、有趣。
六月天講咧落大雪，實在誠有局。(六月的大熱天竟在下大雪，實在很有趣。)
有紲
ū-suà
⚫
1. 興致高昂、情緒熱烈。
若講著選舉佮政治，伊就一支喙若機關銃，愈講愈有紲，真正無伊法。(一談到選舉跟政治，他的嘴就如機關槍，愈說愈起勁，真是拿他沒辦法。)
有路來
ū-lōo-lâi
⚫
1. 有辦法、做得來。
修理電腦，伊是專門的，當然做有路來。(修理電腦，他是專業的，當然有辦法做。)
緩期
uān-kî
⚫
1. 延期。延後原本所預定的期程。
受著疫情的影響，致使真濟活動緩期。(受到疫情的影響，導致很多活動延期。)
換喙
uānn-tshuì
⚫
1. 變換食物的口味。
食魚食肉，嘛著菜佮，攏無換喙敢好？(吃魚吃肉，蔬菜也要配合著吃，都沒有變化口味好嗎？)
⚫
2. 改口、改稱，關係改變的時候改換稱呼。
你今都嫁予志明矣，這馬愛換喙叫𪜶兄嫂「大嫂」毋才著。(你現今都嫁給志明了，現在該改口叫他的嫂嫂「大嫂」才對。)
話仁
uē-jîn/uē-lîn
⚫
1. 俏皮話、滑稽話。
喙講話仁咧激話仁。(嘴裡說著俏皮話在插科打諢。)
畫山畫水
uē-san-uē-suí
⚫
1. 本指描繪山水風景，後用來比喻說話說得天花亂墜、不切實際。
見若欲選舉，畫山畫水的候選人濟甲窒倒街，咱目睭愛擘予金，毋通予𪜶騙去。(每當要選舉，大吹法螺的候選人不勝枚舉，我們務必要睜大眼睛，不要被他們騙了。)
畏羞人
uì-siáu-jîn/uì-siáu-lîn
⚫
1. 害羞、靦腆。
𪜶兜上細漢的囡仔看著生份人攏較畏羞人，毋敢主動佮人相借問。(他們家最小的孩子看到陌生人都比較害羞，不敢主動跟別人打招呼。)
勻聊仔
ûn-liâu-á
⚫
1. 慢慢地、謹慎小心地。
山路坎坎坷坷真歹行，你著勻聊仔行。(山路崎嶇不平很難走，你要慢慢地走。)

序號	俗諺語詞目	讀音	華語釋義
1	鴨仔聽雷。
Ah-á thiann luî. 	指鴨子聽到雷聲，並不知道是怎麼回事。比喻一個人對所接收的訊息無法理解。 比喻一個人對所接收的訊息無法理解。
2	愛拚才會贏。
Ài piànn tsiah ē iânn. 	要努力才會贏。比喻唯有努力奮鬥，才能克服困難，成就一番事業。
3	愛媠毋驚流鼻水。
Ài-suí m̄ kiann lâu phīnn-tsuí. 	為了展示自己姣好的身材，天氣再冷，寧可挨寒受凍，也不願多穿衣服。常用以揶揄女性愛美，寧可付出代價，也在所不惜。
4	暗頓減食一口，活甲九十九。
Àm-tǹg kiám tsia̍h tsi̍t kháu, ua̍h kah káu-tsa̍p-káu. 	晚餐少吃一口，活到九十九。說明晚餐的食用量少一點，有益身體健康。
5	翁仔某是相欠債。
Ang-á-bóo sī sio-khiàm-tsè. 	今世有緣結為夫妻，乃因前世因果，互相欠債所致。夫妻意見不合相互爭吵時，常用這句話來勸雙方姻緣前定，應以和為貴。
6	翁某若仝心，烏塗變成金。
Ang-bóo nā kāng-sim, oo-thôo piàn-sîng kim.	夫妻若同心協力，沒有價值的黑土都能變成高價值的東西。比喻夫妻和諧，一起努力，任何事都可成就。
7	尪姨順話尾，假童害眾人。
Ang-î sūn uē-bué, ké tâng hāi tsìng-lâng. 	靈媒會順著對方的心意說話，假冒之乩童故意裝神弄鬼來欺騙人。此指靈媒、乩童借揣摩情況來決定說話的內容，而人也因輕信巫術鬼神而身受其害。
8	翁親某親，老婆仔拋捙輪。
Ang tshin bóo tshin, lāu-pô-á pha-tshia-lin. 	夫妻恩愛，老婆婆翻筋斗也不管。「老婆仔」是指年邁的母親，「拋捙輪」是翻筋斗，這裡指老母親跌倒了在地上打滾，子女卻置之腦後、棄之不顧。整句比喻夫妻二人恩恩愛愛，置年邁雙親於不顧。
9	紅媠，烏大範。
Âng suí, oo tuā-pān. 	紅色美麗，黑色大方。形容人衣著色彩，紅色顯得鮮豔亮麗，黑色呈現高貴大方，有氣質、有風味。也可指衣服之外的東西。
10	䆀猴𠢕欠數。
Bái-kâu gâu khiàm-siàu.	難纏的客人愛賒帳。形容人外型不佳又愛賒帳。
11	目睭花花，匏仔看做菜瓜。
Ba̍k-tsiu hue-hue, pû-á khuànn-tsò tshài-kue. 	眼睛看不清楚，瓠瓜看成絲瓜。嘲笑別人一時恍神，把形狀相近的物品看成別的東西。
12	目睭看懸，無看低。
Ba̍k-tsiu khuànn-kuân, bô khuànn-kē. 	眼睛長在頭頂上，看上不看下。形容人走路不看路。 引申為人勢利，看不起身分較低的人。
13	目睭看佇粿，跤踏著火。
Ba̍k-tsiu khuànn tī kué, kha ta̍h-tio̍h hué. 	眼睛看著糕品，腳踩到火。用來勸人做事不要只顧當前的好處，而忘了週遭的危險，以免身陷險境而不知。
14	目睭金金人傷重。
Ba̍k-tsiu kim-kim lâng siong-tiōng. 	眼睛睜大，病情嚴重。形容人病得很嚴重，只能張大眼睛，無法動彈；也用來比喻遇到事情束手無策，只能乾瞪眼而沒辦法處理。
15	目睭掛斗概，看人物就愛。
Ba̍k-tsiu kuà táu-kài, khuànn lâng mi̍h tō ài. 	眼睛掛著平斗的木概，看到別人的東西就想要。用來形容人過於貪心。以前用「斗」來測量穀物豆類等東西的份量，斗概是一長形木條，用來把斗口高出的部分撥平以得到準確的量。販售商人的習慣是只往內撥、不往外撥，有招財之意。所以用眼睛掛著斗概，來比喻想把別人的東西納為己有的貪婪心態。
16	慢牛厚屎尿。
Bān gû kāu-sái-jiō. 	行動遲緩的牛屎尿多。比喻懶惰的人做事不乾脆，常找藉口逃避或延遲該盡的責任。
17	萬事起頭難。
Bān-sū khí-thâu lân. 	一切事情開頭階段都很困難。意指事情剛開始的時候，都比較困難，只要不放棄，繼續做，久了就會順手、熟練。
18	買賣算分，相請無論。
Bé-bē sǹg hun, sio-tshiánn bô lūn. 	做生意就得把帳目算個清楚，至於請客吃飯，則無需計較。說明生意與交情的界線理應分明。
19	買田愛揀好田底，娶某愛揀好娘嬭。
Bé tshân ài kíng hó tshân té, tshuā-bóo ài kíng hó niû-lé. 	買田地，要慎選土質好的田地；娶老婆，要先觀察女方母親之行為舉止。意即有其母必有其女，用來說明選妻子時對方家教的重要。
20	買厝，買厝邊。
Bé tshù, bé tshù-pinn. 	買房子要慎選好鄰居。強調選擇住家時，鄰居的好壞至關重要。
21	袂曉剃頭，拄著鬍鬚。
Bē-hiáu thì-thâu, tú-tio̍h hôo-tshiu. 	不會理髮，遇到大鬍子。理髮師技術還不夠純熟，首次上場就遇到一個大鬍子的客人，以致於手忙腳亂，不知道該如何是好。比喻在經驗不足的情況下，偏偏碰上了棘手的難題。
22	賣茶講茶芳，賣花講花紅。
Bē tê kóng tê phang, bē hue kóng hue âng. 	賣茶葉的人強調自己賣的茶葉有多香；賣花的人強調自己賣的花顏色有多麼的鮮豔。比喻為了要把自己的產品推銷出去，生意人總會強調其產品具有什麼特色，藉此吸引顧客的目光。比喻老王賣瓜，自賣自誇。
23	欲好額等後世，欲做官學做戲。
Beh hó-gia̍h tán āu-sì, beh tsò-kuann o̍h tsò-hì. 	如果想發財就等下輩子，如果想當官，去戲班子演戲就能過乾癮。諷刺人此生再無致富與升官的機會，有時也用來自嘲。
24	無米有舂臼，無囝抱新婦。
Bô bí ū tsing-khū, bô kiánn phō sin-pū. 	沒有米卻有搗米的臼；沒有兒子領養一個童養媳。形容人只會做白日夢，不切實際。
25	無牛駛馬。
Bô gû sái bé. 	沒有牛只能用馬匹來替代。形容退而求其次，暫且代用的無奈。
26	無魚，蝦嘛好。
Bô hî, hê mā hó. 	捉不到魚，捉到蝦子也好。比喻退而求其次，聊勝於無。
27	無彼號尻川，想欲食彼號瀉藥。
Bô hit-lō kha-tshng, siūnn-beh tsia̍h hit-lō sià-io̍h. 	沒有那種屁股，想吃那種瀉藥。形容人沒有那種能耐，卻妄想做那種事。比喻一個人自不量力。
28	無日毋知晝，無鬚毋知老。
Bô ji̍t m̄ tsai tàu, bô tshiu m̄ tsai lāu. 	沒出太陽，不知已經到中午了；沒留鬍子，不易察覺人已老邁。比喻光陰易逝，很容易在不知不覺中荒廢。
29	無枷夯交椅。
Bô kê giâ kau-í. 	沒有枷鎖等刑具可披枷帶鎖，竟然將太師椅扛在身上。比喻自找麻煩，庸人自擾。
30	無禁無忌，食百二。
Bô-kìm-bô-khī, tsia̍h pah-jī. 	形容人百無禁忌，毫無忌諱，便能長壽活到一百二十歲。通常是觸碰禁忌者用來自我安慰的說法。
31	無毛雞假大格。
Bô môo ke ké tuā-keh. 	發育不良羽毛稀疏的雞假冒成體格高大。比喻一個人明明沒錢還裝闊；或指人明明沒有才能，還裝出很有本事的樣子。
32	無通生食，哪有通曝乾。
Bô thang tshenn tsia̍h, ná ū thang pha̍k-kuann. 	生吃都不夠，哪能晒成乾？比喻數量不足，不可能有多餘的留下來。也指個人或家計窘困，沒有餘錢作額外支出。
33	罔趁較袂散。
Bóng thàn khah bē sàn. 	多少賺一點，才不致於陷入窮困。說明即使利潤非常小，也應積極賺取。
34	某大姊，坐金交椅。
Bóo-tuā-tsí, tsē kim kau-í. 	娶年長的妻子就像坐上太師椅。形容少夫老妻，丈夫很受寵、頗享福。
35	無三不成禮。
Bû sam put sîng lé. 	送禮、致敬要一而再，再而三。比喻禮多人不怪。
36	未食五日節粽，破裘毋甘放。
Buē tsia̍h Gōo-ji̍t-tseh tsàng, phuà hiû m̄ kam pàng. 	還沒吃端午節粽子，破棉襖捨不得放。臺灣的氣候在端午節之前，都還可能有轉冷，所以還沒過端午節，冬衣不能收起來，是前人觀察天氣變化所得的經驗。
37	未曾學行先學飛，未曾掖種想挽瓜。
Buē-tsîng o̍h kiânn sing o̍h pue, buē-tsîng iā-tsíng siūnn bán kue. 	還不會走路就想學飛，尚未播種竟妄想收成瓜果。指人要循序漸進的學習與按步就班的耕作才會有所收穫，絕無一步登天或不勞而獲的道理。
38	會曉偷食，袂曉拭喙。
Ē-hiáu thau tsia̍h, bē-hiáu tshit tshuì. 	只知道要偷吃，卻不知道要把嘴巴擦乾淨。比喻做壞事後，不懂得湮滅證據，讓人發現。
39	會咬人的狗袂吠。
Ē kā--lâng ê káu bē puī.	會咬人的狗不會叫。比喻城府甚深之人少言，不易流露其情緒。
40	會跋才會大。
Ē pua̍h tsiah ē tuā. 	小孩學習走路時，要跌倒過才能順利成長。比喻人要經歷過失敗、挫折，才能成就事業。
41	會生得囝身，袂生得囝心。
Ē-senn-tit kiánn sin, bē-senn-tit kiánn sim. 	能夠生出孩子的身體，卻不能生出孩子的心思。意為雖然兒女是父母所生，但也有自己的意志，父母不能任意左右；或指教育孩子很不容易，往往不能按照父母的期待。
42	疑人，毋成賊。
Gî lâng, m̄ tsiânn tsha̍t. 	光憑懷疑，並無法認定某人就是賊。謂凡事都要講求證據，不能只因內心懷疑，便將人入罪。
43	攑頭三尺有神明。
Gia̍h-thâu sann tshioh ū sîn-bîng. 	抬起頭三尺高處就有神明察看著。告誡人們做事前要三思，因為冥冥之中都有神在監督著我們的一言一行，千萬別做虧心事，否則將招致報應。
44	嚴官府出厚賊；嚴爸母出阿里不達。
Giâm kuann-hú tshut kāu tsha̍t; giâm pē-bú tshut a-lí-put-ta̍t. 	過於嚴苛的官府，小偷反而更加猖狂；父母管教過嚴，小孩越是不成材。喻適當的律法及教育更為重要。
45	囡仔人尻川三斗火。
Gín-á-lâng kha-tshng sann táu hué. 	小孩屁股有三盆火。比喻小孩子血氣方盛，屁股好似有火般的熱度，此處用來形容孩子不怕冷。
46	囡仔人有耳無喙。
Gín-á-lâng ū-hīnn-bô-tshuì. 	小孩子有耳朵沒嘴巴。指叫小孩聽話就好，不要多問。通常使用於大人說話時，若小孩插嘴或發問，便會以這句話來阻止小孩開口。
47	戇的也有一項會。
Gōng--ê iā ū tsi̍t hāng ē. 	笨的人也有一項他會的才能。比喻天生我才必有用。
48	五肢指頭仔伸出來無平長。
Gōo ki tsíng-thâu-á tshun--tshut-lâi bô pênn tn̂g. 	指五根手指頭伸出來不可能一樣長，必有所歧異。如同兄弟姊妹其聰明才智並非一致，仍舊有所不同。
49	牛牢內觸牛母。
Gû-tiâu-lāi tak gû-bó. 	牛圈裡鬥母牛。比喻兄弟或同志只善內鬥、欺負弱小，卻不能抵禦外侮、克服強敵，反而被人看扁了。
50	牛就是牛，牽到北京也是牛。
Gû tō sī gû, khan kàu Pak-kiann iā sī gû. 	把窮鄉僻壤的牛，牽到人文薈萃的京城，固執的牛脾氣還是依舊。形容人的個性不可能改變，縱使換了環境還是原來的樣子。
51	外甥食母舅，親像食豆腐。
Guē-sing tsia̍h bú-kū, tshin-tshiūnn tsia̍h tāu-hū. 	外甥佔舅父的便宜，像是吃豆腐那樣簡單。喻外甥要倚靠舅父幫忙或讓舅父請客較為容易。
52	校長兼摃鐘。
Hāu-tiúnn kiam kòng tsing. 	校長兼做敲鐘的工作。「摃鐘」指敲響學校上下課的鐘聲，以學校最高職務的校長，還需兼做敲鐘報時的工作，來形容一個人身兼數職，而且多半是指一手包攬整個單位、團體或專案的大小事。
53	痚呴袂忍得嗽。
He-ku bē lún tit sàu. 	氣喘忍不住要咳嗽。形容人忍無可忍，不吐不快。
54	戲館邊的豬母，袂歕簫嘛會拍拍。
Hì-kuán pinn ê ti-bó, bē pûn siau mā ē phah-phik. 	戲館邊的母豬，戲聽多了，不會吹簫，也會打拍子。比喻常見無難事；或指人易受周圍環境影響。
55	戲棚跤徛久就是你的。
Hì-pênn-kha khiā kú tō sī lí ê. 	戲臺下站久了就是你的。勸人做事要有耐性，如能持之以恆，成功必屬於你的。
56	嫌貨才是買貨人。
Hiâm huè tsiah-sī bé huè lâng. 	會挑貨物毛病的人，才是真正有意要買的人。意即客人會對貨物表示意見才是真正要購買的人。
57	兄弟若仝心，烏塗變成金。
Hiann-tī nā kāng sim, oo-thôo piàn-sîng kim. 	兄弟若能同心，黑土也能變黃金。意謂兄弟同心耕作，可種出大量作物，賺足金錢，就像是把田裡烏黑的泥土變成黃金一樣。鼓勵手足之間應通力合作，便能得到耀眼的成果。
58	僥倖錢，失德了；冤枉錢，跋輸筊。
Hiau-hīng-tsînn, sit-tik liáu; uan-óng-tsînn, pua̍h-su kiáu. 	不義之財，會因為做不道德的事而花光；冤屈人家所得到的橫財，也會賭博全輸光。誡人勿貪非分及不義之財，不義之財，怎麼來就怎麼去。
59	耳仔生兩葉，家己看袂著。
Hīnn-á senn nn̄g hio̍h, ka-kī khuànn bē tio̍h. 	耳朵雖然有兩片，但自己卻無法看見自己的耳朵。意指人看不見自己的缺點。或指人不會反省自己的缺點，卻偏要談論別人的缺失。
60	好額毋值著會食，好命毋值著勇健。
Hó-gia̍h m̄-ta̍t-tio̍h ē tsia̍h, hó-miā m̄-ta̍t-tio̍h ióng-kiānn. 	富有不如能享口福，命好不如身體健康。說明有食欲、身體健康比起財富或運勢都還更重要。
61	好好鱟刣甲屎那流。
Hó-hó hāu thâi kah sái ná lâu. 	好好的鱟，竟然被宰殺得一團糟。「鱟」是海中的節肢動物，為古代的活化石，個性溫和，被宰殺時也不會掙扎抵抗；「屎那流」指屎尿都流出來了。譏諷人做事不得要領，將簡單之事弄得一團糟。
62	好也一句，歹也一句。
Hó iā tsi̍t kù, pháinn iā tsi̍t kù. 	好聽的也是一句話，難聽的也是一句話。一句話的好壞會影響聽者日後的行為，所以與人交談不可不慎。
63	好囝毋免濟，濟囝餓死爸。
Hó-kiánn m̄-bián tsē, tsē kiánn gō-sí pē. 	好兒子不必多，兒子多了徒增父母的負擔。比喻出色的孩子不必多，能孝順父母者最為重要。
64	好歹在心內，喙脣皮相款待。
Hó-pháinn tsāi sim-lāi, tshuì-tûn-phuê sio khuán-thāi.	不管好壞都放在心裡，見面三分情，口頭上還是要客客氣氣，以禮相待。
65	好心予雷唚。
Hó-sim hōo luî tsim. 	一番好意卻慘遭雷吻。比喻好心沒好報。
66	好田地不如好子弟。
Hó tshân-tē put-jû hó tsú-tē. 	擁有良田，不如栽培良好的子孫。意即土地、財富固然重要，但子孫的人品與才學，比財富更有價值。
67	好酒沉甕底。
Hó-tsiú tîm àng-té. 	好酒會沉到酒甕的底部，愈陳愈香。比喻好的、精彩的事物，總是留在最後面才出現。
68	胡蠅舞屎桮。
Hôo-sîn bú sái-pue. 	蒼蠅想舞動用來擦拭屁股的竹片。恥笑人做事不自量力，妄想改變無法改變的事實，非但徒勞無功反而淪為笑柄。
69	互相落氣，求進步。
Hōo-siong làu-khuì, kiû tsìn-pōo. 	相互挑出對方之短處，來追求進步。意思是一來一往檢討雙方各自的缺點，是一種求取進步的方法。
70	歡歡喜喜一工，煩煩惱惱也一工。
Huann-huann-hí-hí tsi̍t kang, huân-huân-ló-ló iā tsi̍t kang. 	快樂也是過一天，憂愁也是過一天。意為不管是快樂還是煩惱，日子還是要過，不如保持快樂的心情來面對困難。勸人樂觀進取，不要太過悲觀。
71	花無百日紅，人無千日好。
Hue bô pah ji̍t âng, lâng bô tshian ji̍t hó. 	花不會延續百日的鮮紅，人不會維持千日的順遂。花開得美，總會有凋謝的時候，人生際遇也不會永遠處於順境。比喻人生是起起伏伏的，本來就無法永遠順利。
72	和尚頭掠蝨母。
Huê-siūnn thâu lia̍h sat-bó. 	在理光頭的和尚頭上找蝨子。形容人緣木求魚，注定失敗。
73	也著箠，也著糜。
Iā tio̍h tshuê, iā tio̍h muê.	也要竹鞭，也要稀飯。「箠」是用來當作體罰用具的竹鞭。這句話表示教養小孩也得責打、也得疼愛。比喻父母教導子女要寬嚴得宜、慈威並施、賞罰並重、教養兼顧，要撫育也要矯正，方有效果。
74	閹雞趁鳳飛。
Iam-ke thàn hōng pue. 	去勢的公雞因體型較為肥大，拙於飛行，卻想模仿鳳凰飛翔。比喻如同東施效顰一樣想模仿別人。
75	枵鬼假細膩。
Iau-kuí ké sè-jī. 	明明嘴饞想吃卻又客氣推辭。諷刺人表裡不一，惺惺作態。
76	陰鴆陰鴆，咬人三寸深。
Im-thim-im-thim, kā lâng sann tshùn tshim. 	性格陰險的人工於心計，平時不動聲色，一旦發狠咬人，就會咬得很深，毫不留情。勸戒人要謹防陰險狠毒之徒。
77	圓人會扁，扁人會圓。
Înn--lâng ē pínn, pínn--lâng ē înn. 	世事本無常，旺氣之人亦會有落衰之時；反之，衰微之人如能奮發向上亦會有出人頭地之日。「圓」應指旺氣，「扁」為衰微。形容人的機運有起有落。
78	搖人無才，搖豬無刣。
Iô lâng bô-tsâi, iô ti bô thâi. 	身體搖擺不穩重的人，多無才氣；走路搖動不穩的豬，多為病豬不能宰殺。勉勵人應穩重自持。
79	勇勇馬縛佇將軍柱。
Ióng-ióng bé pa̍k tī tsiong-kun-thiāu. 	「將軍柱」指官府堂前兩旁的大石柱。健壯的馬被綁在將軍柱上，任憑有多大的力氣或多麼善跑也派不上用場。引申為懷才不遇、英雄無用武之地，或指不能知人善任。
80	用別人的拳頭拇舂石獅。
Iōng pa̍t-lâng ê kûn-thâu-bú tsing tsio̍h-sai. 	用別人的拳頭去揍石獅子。利用別人去做自己不願意做的事情，比喻犧牲他人來成就自己。
81	一兼二顧，摸蜊仔兼洗褲。
It kiam jī kòo, bong lâ-á kiam sé khòo. 	兩者兼顧，摸蜆兼洗褲子。「摸蜊仔」是從前常見的副業，在溪裡摸拾蜆貝，可作為佐菜，也可賣錢，因在水中蹲著工作，褲子常浸水，好像順便洗了褲子一樣。意謂一舉兩得。
82	一代親，二代表，三代毋捌了了。
It tāi tshin, jī tāi piáu, sann tāi m̄ bat liáu-liáu. 	一代至親，二代表親，三代全都不認識。第一代是骨肉至親的兄弟姐妹，第二代子孫彼此以姑表、姨表來相互稱呼，到了第三代就彼此不認識了，意為親戚間的往來，一代比一代疏遠。
83	一錢，二緣，三媠，四少年。
It tshiân, jī iân, sann suí, sì siàu-liân. 	首先有錢，其次人見人愛，再來英俊，接著是年輕。相傳舊時男性追求女性的基本條件。 另有一說是現代人選女婿的四要件。
84	幼秀跤，好命底。
Iù-siù kha, hó-miā té. 	腳纖細的人命比較好。古時候有錢人家的女兒，有婢女、傭人服侍，不須參與農忙勞務，因此手腳纖細、秀氣好看，進而產生「幼秀跤」的女性為富貴人家的刻板印象。
85	惹熊惹虎，毋通惹著刺查某。
Jiá hîm jiá hóo, m̄-thang jiá-tio̍h tshiah-tsa-bóo. 	招惹熊招惹虎，別招惹凶悍的女人。比喻悍婦得罪不得。
86	人情留一線，日後好相看。
Jîn-tsîng lâu tsi̍t suànn, ji̍t-āu hó sio-khuànn. 	對別人留個情面，以後見面才好相處。意謂與人為善，凡事多留餘地，未來相處才不至於難堪。
87	人情世事陪到到，無鼎閣無灶。
Jîn-tsîng-sè-sū puê kàu-kàu, bô tiánn koh bô tsàu. 	人情世故樣樣奉陪，沒鍋又沒灶。意即所有的人情世故都要應對得體面，所費不貲，可能會窮到斷炊。形容人為了應付各種交際應酬而產生的經濟問題，並勸導人應酬要節制，適可而止，對社會上的繁文縟節要量力而行。
88	入虎口，無死也烏漚。
Ji̍p hóo kháu, bô sí iā oo-áu. 	進入老虎的嘴裡，沒死也體無完膚、半死不活。意謂掉入危險環境，沒死也剩下半條命。
89	入人門，順人意。
Ji̍p lâng mn̂g, sūn lâng ì. 	指進入別人的家門，順從別人的意見。原指女子出嫁後，應當順從丈夫、公婆之意，後延伸到別的地域或單位機構，應順從該地之風俗規定。
90	日頭赤焱焱，隨人顧性命。
Ji̍t-thâu tshiah-iānn-iānn, suî-lâng kòo sènn-miā. 	在熾熱的陽光底下，每個人以保全自己的性命為要，已無暇顧及他人。形容人遇到患難或在艱困的環境裡，以顧全自己為先。
91	家和萬事興，家亂萬世窮。
Ka hô bān-sū hing, ka luān bān-sè kîng. 	家庭和樂則事事興旺，家庭不睦則代代窮困。強調家庭和樂與否對家道的發展影響深遠。
92	家己捧屎抹面。
Ka-kī phóng-sái buah-bīn. 	自己捧起糞來抹臉。比喻自己給自己難看，自取其辱。
93	家己栽一欉，較贏看別人。
Ka-kī tsai tsi̍t tsâng, khah iânn khuànn pa̍t-lâng. 	自己栽種一棵果樹，到時結果就有得吃，勝過看別人的臉色。比喻凡事得靠自己，不要靠別人。求人不如求己。
94	教豬教狗，不如家己走。
Kà ti kà káu, put-jû ka-kī tsáu. 	支使豬支使狗，不如自己跑。比喻與其依靠別人不如靠自己，亦即求人不如求己。
95	共天公借膽。
Kā Thinn-kong tsioh tánn.	向老天爺借膽。用於形容人突然膽大包天，做出平常不敢做的事。
96	甘願做牛，毋驚無犁通拖。
Kam-guān tsò gû, m̄ kiann bô lê thang thua. 	情願當牛，就不怕沒犁可拉。意即為謀求一餐溫飽，只要願意放下身段，努力工作，不怕沒有機會。也常說成反話，用來告誡子女，不努力讀書，將來只能靠體力工作謀生。
97	甘蔗無雙頭甜。
Kam-tsià bô siang-thâu tinn. 	甘蔗沒有頭尾都是甜的。比喻世事無法兩全其美，凡事有利就有弊，人不可能佔盡所有好處。
98	艱苦頭，快活尾。
Kan-khóo thâu, khuìnn-ua̍h bué. 	做任何事都要先耐得住辛苦，苦盡才得以享受甘甜的成果。 勸勉人先苦後甘，終將逐步進入佳境。
99	敢做匏桸，就毋通驚水燙。
Kánn tsò pû-hia, tō m̄-thang kiann tsuí thǹg. 	既然做了瓠瓜勺子，就不能怕被滾水燙。意指既然承擔了責任就要敢做敢當，不要畏首畏尾，也用來自我表示負責到底的意思。
100	狗無嫌主人散。
Káu bô hiâm tsú-lâng sàn. 	狗不會嫌棄主人貧窮。以狗對主人的忠誠，來勸人不要因家境貧苦而怪責父母，或引申為不要怪責所屬的團體。
101	九月颱，無人知。
Káu-gue̍h thai, bô lâng tsai. 	農曆九月的颱風，沒人料想得到。通常農曆九月以後已經過了颱風季節，故突如其來的颱風常讓人措手不及。 比喻天有不測風雲，人有旦夕禍福。
102	猴也會跋落樹跤。
Kâu iā ē pua̍h-lo̍h tshiū-kha. 	猴子也會跌落樹下。說明經驗再豐富，動作再熟練的人，也有失手的時候，喻人不可大意。
103	加減趁，較袂散。
Ke-kiám thàn, khah bē sàn. 	不論工資高低都去賺，才不至於窮困。形容不要計較所得多寡，努力工作才不會陷入窮困。
104	雞卵密密也有縫。
Ke-nn̄g ba̍t-ba̍t iā ū phāng. 	雞蛋的蛋殼再怎麼密合也有縫隙。比喻事情總會有破綻，不可能天衣無縫。
105	雞屎落塗，也有三寸煙。
Ke sái lo̍h thôo, iā ū sann tshùn ian. 	雞屎落地，也有三寸煙。意為即便是微小不堪的雞屎，剛剛掉落地上時也會揚起一陣熱熱的煙氣，何況是做人，更要有志氣。
106	嫁雞綴雞飛，嫁狗綴狗走。
Kè ke tuè ke pue, kè káu tuè káu tsáu. 	嫁雞隨雞，嫁狗隨狗。說明傳統社會要求女子結婚之後，不論丈夫是什麼樣的人，都要終身跟隨，從一而終。
107	隔壁親家，禮數原在。
Keh-piah tshin-ke, lé-sòo guân-tsāi. 	隔壁親家，來往依然要遵照禮數。意即親家住得再近，應有的禮節還是不可疏忽怠慢，仍須行禮如儀。
108	牽尪姨，順話尾。
Khan ang-î, sūn uē-bué. 	靈媒答問，會順人心意說話。意思是說靈媒配合詢問者的心意做為回答的內容。比喻交談時揣摩對方的心思來應答。
109	氣死驗無傷。
Khì-sí giām bô siong. 	生氣而死也驗不出傷痕。用來告誡人勿逞血氣，以免傷身。
110	徛懸山，看馬相踢。
Khiā kuân suann, khuànn bé sio-that. 	站在高岡上，看著山腳下的馬互踢。比喻置身事外，袖手旁觀，有幸災樂禍看好戲之意。
111	欠錢怨債主，不孝怨爸母。
Khiàm tsînn uàn tsè-tsú, put-hàu uàn pē-bú. 	欠錢怨債主，不孝怨父母。意即自己欠別人錢，還反過來埋怨債主來討債；自己不孝順，還反過來抱怨父母對自己不好。比喻不知反省，只會把責任推到他人身上。
112	缺喙的食米粉──看現現。
Khih-tshuì--ê tsia̍h bí-hún──khuànn-hiān-hiān. 	兔脣的人吃米粉，被看得清清楚楚。引申為虛偽或技拙者的所作所為，無所遁形讓人一目了然。
113	乞食下大願。
Khit-tsia̍h hē tuā guān. 	乞丐的能力有限，卻許下超過自己力所能及的大願望。比喻夢想也要衡量現實，不宜不自量力。
114	乞食也有三年好運。
Khit-tsia̍h iā ū sann nî hó-ūn. 	乞丐也有三年的好運。說明人不會一生都是落魄的，勉勵人毋須因一時的挫折、低潮而灰心喪志，即使潦倒如乞丐，也會有運氣好轉的時候。比喻風水輪流轉。
115	乞食趕廟公。
Khit-tsia̍h kuánn biō-kong. 	寺廟的廟祝收容乞丐，提供他們吃住，沒想到乞丐非但不知感激，甚至還得寸進尺、忘恩負義，將廟祝趕走霸占寺廟。比喻喧賓奪主。
116	乞食身，皇帝喙。
Khit-tsia̍h sin, hông-tè tshuì. 	乞丐身分，皇帝口吻。意為身為乞丐，口氣卻大如皇帝。比喻人說話大言不慚，與自己實際身份不相稱。
117	勸人做好代，較贏食早齋。
Khǹg lâng tsò hó tāi, khah iânn tsia̍h tsá-tsai. 	勸人為善勝過早上吃素。說明行善比獨善其身重要。
118	勸恁有孝千萬句，袂曉有孝豬狗牛。
Khǹg lín iú-hàu tshian-bān kù, bē-hiáu iú-hàu ti káu gû. 	千言萬語奉勸人孝順父母，不懂得孝順就像豬狗牛。勸人要懂得孝順，否則連畜牲都不如。
119	靠山山會崩，靠水水會焦。
Khò suann suann ē pang, khò tsuí tsuí ē ta. 	依靠山，山會有崩塌的時候；依靠河流，河流會有乾涸的時候。比喻無論有多穩當的後臺或再多的財產，總有失勢的一天，勸人凡事要自立自強，不可太依賴別人。
120	看人食肉，毋通看人相拍。
Khuànn lâng tsia̍h bah, m̄-thang khuànn lâng sio-phah. 	寧可看人吃肉，也不要看人打架。誡人遠離是非之地，以免遭受池魚之殃。
121	見笑轉受氣。
Kiàn-siàu tńg siū-khì. 	羞愧轉變為生氣。因羞愧難當，以發怒來轉移焦點。即惱羞成怒。
122	驚某大丈夫，拍某豬狗牛。
Kiann bóo tāi-tiōng-hu, phah bóo ti káu gû. 	會怕妻子的丈夫是男子漢，會打妻子的連畜生都不如。主要是規勸丈夫要好好疼惜自己的妻子，不可動粗。
123	驚驚袂著等。
Kiann-kiann bē tio̍h-tíng. 	光是恐懼擔憂不會獲得優勝。勸人做事要果決，不要畏畏縮縮，才有成功的機會。
124	囝婿是半子。
Kiánn-sài sī puàn-tsú. 	女婿是半個兒子。女兒出嫁，娘家這邊有了女婿，雖然不是自家的男丁，但也將之視如己出，等同於半個兒子。
125	行船走馬三分命。
Kiânn-tsûn tsáu-bé sann hun miā. 	航海、騎馬很危險，做這一行的只有三分的存活機會。意謂從事交通運輸行業的人，喪失生命的風險很高。
126	緊行無好步。
Kín kiânn bô hó pōo. 	走得太匆促，腳步容易出差錯。喻遇事不宜急躁，應冷靜沉穩面對，才能應付危難。
127	緊紡無好紗，緊嫁無好大家。
Kín pháng bô hó se, kín kè bô hó ta-ke. 	匆忙紡紗就織不出好棉紗；急於嫁人就遇不上好婆家。比喻欲速則不達。
128	近廟欺神。
Kīn biō khi sîn. 	指住在廟旁的百姓，對神的敬意反而不如遠地的人。比喻貴遠賤近。
129	近山剉無柴，近溪擔無水。
Kīn suann tshò bô tshâ, kīn khe tann bô tsuí. 	靠近山卻砍不到柴，靠近溪邊卻挑不到水。反諷人往往捨近求遠，忽略了身邊隨手可得的資源，去追求遙不可及的事物。 或指人往往輕忽有把握的事，反而坐失良機，以致失敗。
130	近水知魚性，近山識鳥音。
Kīn suí ti gû sìng, kīn san sik niáu im.	經常出入水域，久而久之，便熟諳魚的習性；經常出入山林，久而久之，便熟諳鳥兒的鳴叫聲。比喻在怎樣的環境中生活，就容易學習到和該環境相關的才能。
131	弓蕉吐囝為囝死。
King-tsio thòo kiánn uī kiánn sí. 	香蕉吐子為子死。香蕉發新芽以後，本株就會而死去，比喻父母為了子女，總是無盡的犧牲奉獻。
132	揀啊揀，揀著一个賣龍眼。
Kíng--ah kíng, kíng-tio̍h tsi̍t ê bē lîng-gíng. 	挑來選去，最後選了個賣龍眼的小商販。形容找對象或合作夥伴時東挑西揀，最後還是挑了一個不理想的人。勸人有人可選時不要過份挑剔，以免到最後別無選擇，只能找個最不盡理想的人。
133	公親變事主。
Kong-tshin piàn sū-tsú. 	仲裁者變成當事人。意指和事佬難當，調解不成還被拖下水，捲入紛爭。
134	講著食，舂破額。
Kóng-tio̍h tsia̍h, tsing-phuà hia̍h. 	一聽到有什麼東西可吃就爭先恐後，把額頭都撞破了。 比喻人們為了爭權奪利而不顧形象的模樣。
135	講一个影，生一个囝。
Kóng tsi̍t ê iánn, senn tsi̍t ê kiánn. 	說一個影子，生一個孩子。意即有人說看到一個影子，就有人傳話說成有人生了一個孩子。比喻把沒聽清楚的話，轉述成毫不相關的事。
136	龜跤龜內肉。
Ku-kha ku-lāi bah. 	龜腳也是龜本身的肉。比喻手心手背都是肉。 比喻所獲得的利益，實際上是來自本身。羊毛出在羊身上。
137	龜跤趖出來。
Ku-kha sô--tshut-lâi. 	烏龜伸出腳來。比喻人隱藏自己的圖謀或詭計，在他要遂行陰謀或行動時，陰謀暴露出來。即露出馬腳。
138	龜笑鱉無尾，鱉笑龜粗皮。
Ku tshiò pih bô bué, pih tshiò ku tshoo phuê. 	龜笑鱉沒有尾巴，鱉笑龜皮膚粗。指人只會批評別人的缺點，卻不知自己的缺點也不少。
139	久長病，無孝子。
Kú-tn̂g pēnn, bô hàu-tsú. 	父母長年臥病在床，子女往往無法隨侍在側，因而陷入身不由己的窘境，致使最終得背負不孝子之罵名。比喻久病床前無孝子。
140	舊囚食新囚。
Kū siû tsia̍h sin siû. 	老囚犯欺負新囚犯。比喻資歷老的成員欺凌新進人員。
141	關門著閂，講話著看。
Kuainn-mn̂g tio̍h tshuànn, kóng-uē tio̍h khuànn. 	關門時要插上門閂，說話要看場合與時機。勸人說話要看時機，不要因一時大意而造成難以收拾的局面。
142	過橋較濟你行路，食鹽較濟你食米。
Kuè kiô khah tsē lí kiânn-lōo, tsia̍h iâm khah tsē lí tsia̍h bí. 	走過的橋比你走過的路還多，吃過的鹽比你吃過的米還多。年長者常以此來自誇經驗豐富，倚老賣老。
143	過時賣曆日。
Kuè-sî bē la̍h-ji̍t. 	過了適當的時機賣日曆。用來指事物已經失去時效。
144	骨力食栗，貧惰吞瀾。
Kut-la̍t tsia̍h-la̍t, pîn-tuānn thun nuā. 	勤勞的人，有栗子可吃，懶惰的人只有吞口水的份。喻只要辛勤付出，就會有好的食物；而不事生產者，只能眼巴巴看著人家享用收穫。比喻一分耕耘，一分收穫。
145	內神通外鬼。
Lāi sîn thong guā kuí. 	指內部人員串通外面的人，做出不利內部的事。
146	六月芥菜假有心。
La̍k-gue̍h kuà-tshài ké ū-sim. 	芥菜產季在每年十一月到次年四月，大約是農曆十月到次年二月，六月既非芥菜產季，當然也不會有芥菜心，所以說有心必定是假的。指人的言語或行為虛情假意；或用來譏諷偽君子，表面仁慈關懷，其實不懷好意。
147	人無照天理，天無照甲子。
Lâng bô tsiàu thinn-lí, thinn bô tsiàu kah-tsí. 	人不照天理行事，天不照甲子運行。古人以天干、地支搭配紀年，取天干第一位「甲」與地支第一位「子」搭配成的「甲子」，來指稱自然運行的法則。比喻人若不按天理行事，老天爺也不會依照時序運行；或指對於違反常理之事的感慨。
148	人未到，聲先到。
Lâng buē kàu, siann sing kàu. 	人尚未出現，就先聽到聲音。形容大嗓門的人。 未見其人，先聞其聲。形容人的排場很大。
149	人的喙，掩袂密。
Lâng ê tshuì, am bē ba̍t.	人們通常無法管住別人的嘴巴。亦即難杜悠悠之口。
150	人牽毋行，鬼牽溜溜行。
Lâng khan m̄ kiânn, kuí khan liù-liù-kiânn. 	對於好人的指引置之不理，反而在壞人的引誘下亦步亦趨。形容人是非不分，正事不做，偏要做壞事。
151	人若衰，種匏仔生菜瓜。
Lâng nā sue, tsìng pû-á senn tshài-kue. 	人若倒楣，種匏瓜也會長出絲瓜。比喻人的運氣不佳，老是事與願違。
152	人兩跤，錢四跤。
Lâng nn̄g kha, tsînn sì kha. 	人只有兩條腿，錢有四條腿，兩條腿跑得慢，四條腿跑得快，兩條腿的人永遠追不上四條腿的錢。比喻賺錢不易。
153	人心肝，牛腹肚。
Lâng sim-kuann, gû pak-tóo. 	人的心肝，牛的肚子。意為人心就像牛的肚子一樣大。「人心肝」指人的慾望，用來比喻人心不足蛇吞象。
154	人咧做，天咧看。
Lâng teh tsò, thinn teh khuànn. 	人在做，天在看。做事情應憑著自己的良心，不管好事壞事，上天都在看著。比喻天理昭昭，報應不爽。
155	人濟話就濟，三色人講五色話。
Lâng tsē uē tō tsē, sam sik lâng kóng ngóo sik uē. 	人多話就多，各種人說各種意見。比喻人多意見多，莫衷一是。
156	人飼人，一支骨；天飼人，肥朒朒。
Lâng tshī lâng, tsi̍t ki kut; thinn tshī lâng, puî-tsut-tsut. 	人養人，瘦巴巴；天養人，胖嘟嘟。意即成事在天，有上天的庇蔭，人才有好日子可以過；如果風不調雨不順，光是靠人的努力，成效也不彰。
157	老的老步定，少年的較懂嚇。
Lāu--ê lāu-pōo-tiānn, siàu-liân--ê khah táng-hiannh.	年長的人老成穩重；年輕的人冒失莽撞。這句話是說：老人家做事較沉穩持重，年輕人做事則比較輕浮莽撞。
158	老人毋講古，少年毋捌寶。
Lāu-lâng m̄ kóng-kóo, siàu-liân m̄ bat pó. 	老年人不說故事，年輕人得不到寶貴經驗。形容老年人有很多值得年輕人學習的經驗。
159	離鄉，無離腔。
Lī hiunn, bô lī khiunn. 	雖然離開故鄉，卻很難改變故鄉的口音腔調。
160	了錢生理無人做，刣頭生理有人做。
Liáu-tsînn sing-lí bô lâng tsò, thâi-thâu sing-lí ū lâng tsò. 	賠錢的生意沒有人要做，但利益當前，即使是犯法會被判處死刑的生意也有人會做。形容無良商人為了賺錢而不擇手段。
161	龍交龍，鳳交鳳，隱痀的交侗戇。
Lîng kau lîng, hōng kau hōng, ún-ku--ê kau tòng-gōng. 	龍與龍交往，鳳與鳳交往，駝背的人和愚昧的人交往。亦即成材的人和成材的人交往，不成材的人和不成材的人交往，比喻朋友是物以類聚的。可用在正面的意義，也可用在負面的意義。「隱痀」指駝背，「侗戇」指頭腦不靈光。此句的類比方式帶有歧視意味，應注意僅為一種比喻而已。
162	溜溜瞅瞅，食兩蕊目睭。
Liu-liu-tshiu-tshiu, tsia̍h nn̄g luí ba̍k-tsiu. 	人靠靈活的雙眼觀察外界，以求存活。說明人在社會上要會察言觀色，審時度勢，隨機應變，才能立足。
163	落塗時八字命。
Lo̍h-thôo-sî peh-jī miā. 	出生的時辰就決定一個人的命運。從前的人迷信人的命運在呱呱墜地時，就已經註定好了。這句話常用來要人接受現狀，不要埋怨或強求。
164	落水平平沉，全無重頭輕。
Lo̍h tsuí pênn-pênn tîm, tsuân bô tāng-thâu-khin.	一旦落入水中，同樣都會往下沉，沒有輕重的差別。說明大難來時大家的命運相同，沒有任何差別。
165	忍氣求財，激氣相刣。
Lún-khì kiû tsâi, kik-khì sio-thâi. 	忍一時之氣可以求得財利，意氣用事可能招致糾紛，甚至互相殺伐。比喻和氣生財。
166	毛毛仔雨落久，塗嘛會澹。
Mn̂g-mn̂g-á hōo lo̍h-kú, thôo mā ē tâm. 	濛濛細雨下久了，土地也會潮濕。比喻積少成多；或指做事只要能持之以恆、堅持到底，猶如滴水穿石，再大的困難都能克服。
167	毛呼龜粿粽，紅包在你送。
Môo-honn ku kué tsàng, âng-pau tsāi lí sàng.	毛呼、紅龜粿、粽子，紅包隨便你包多少都可以。譏諷道士誦經時不專心，看著祭品隨口亂念，心中只有紅包。
168	媒人保入房，無保一世人。
Muê-lâng pó ji̍p pâng, bô pó tsi̍t-sì-lâng.	媒人只保證雙方完婚入洞房，不能負責婚後雙方一輩子平順。 說明他人的幫助或保證都是有限度的，凡事還是得靠自己努力。
169	涼傘雖破，骨格原在。
Niû-suànn sui phuà, kut-keh guân-tsāi. 	神明出巡所用的傘雖然破損，但支架還在。傘的支架代表人的骨氣，比喻一個人以前功成名就，現在雖然落魄失意，卻仍保有骨氣；或指出身名門世家，即使家道中衰，家風猶存。
170	爛塗袂糊得壁。
Nuā-thôo bē kôo tit piah. 	爛泥敷不上牆。指人或東西沒有用，派不上用場。
171	呵咾甲會觸舌。
O-ló kah ē tak-tsi̍h. 	讚美得發出嘖嘖聲，可用來表示「讚美有加」。
172	惡馬惡人騎。
Ok bé ok lâng khiâ. 	意為很難馴服的馬，總會有比牠更凶惡的騎士來馴服。比喻壞人自有比他更凶惡的人來懲治他，即一物剋一物。
173	王梨頭，西瓜尾。
Ông-lâi thâu, si-kue bué. 	鳳梨蒂頭的一端比較甜，西瓜是離蒂頭最遠的一端最甜。教導人家如何吃水果及觀察蔬果的自然生態。
174	烏仔魚搢水。
Oo-á-hî tsìnn tsuí. 	烏魚逆水向前游。比喻不畏困難，積極向上。
175	烏矸仔貯豆油。
Oo kan-á té tāu-iû. 	黑色罐子裝醬油。這是歇後語，帶出「看袂出」三個字，黑色醬油裝在黑色罐子裡難以分辨，以「看不出來」的雙關語，比喻看走眼或人不可貌相。
176	飽穗的稻仔，頭犁犁。
Pá-suī ê tiū-á, thâu lê-lê. 	飽滿而成熟的稻穗，頭向下。比喻有真實才學的人，反倒謙沖為懷。
177	腹肚若水櫃，胸坎若樓梯。
Pak-tóo ná tsuí-kuī, hing-khám ná lâu-thui. 	肚子像水箱一樣凸起，胸前的肋骨像樓梯一根根突現。形容人營養不良，骨瘦如柴，卻又挺個大肚子的模樣。
178	腹肚做藥櫥。
Pak-tóo tsò io̍h-tû. 	把肚子當做藥櫥。比喻人體弱多病，長期服藥。
179	放屁安狗心。
Pàng-phuì an káu sim. 	放屁給狗聞，讓牠以為有屎可吃。比喻敷衍的給予承諾。
180	別人的囝死袂了。
Pa̍t-lâng ê kiánn sí bē liáu. 	別人的小孩死不完。形容人非常自私，為了自己的利益，不顧別人的死活。
181	爸母疼囝長流水，囝疼爸母樹尾風。
Pē-bú thiànn kiánn tn̂g lâu-tsuí, kiánn thiànn pē-bú tshiū-bué hong. 	父母疼愛子女，就像日夜不停的流水，兒女會想到父母，卻像樹梢上的風時有時無。形容父母愛護子女的心無窮無盡、無止無休，兒女孝順父母卻是偶一為之、難以長久。除了告誡人們要時時刻刻記得孝順父母之外，也表現了兩種付出的落差。
182	白白布染甲烏。
Pe̍h-pe̍h pòo ní kah oo. 	白布硬要染成黑色。比喻刻意汙衊抹黑，顛倒是非。
183	棚頂做甲流汗，棚跤嫌甲流瀾。
Pênn-tíng tsò kah lâu-kuānn, pênn-kha hiâm kah lâu-nuā. 	戲台上的演員演得汗流浹背，戲台下的觀眾批評得口沫橫飛。意指做事的人做得滿頭大汗，卻被批評得一無是處。比喻開口批評容易，實際去做卻很困難；或指用心盡力地做事情，得不到讚美，反而遭到別人的批評與指責。
184	拍虎掠賊也著親兄弟。
Phah hóo lia̍h tsha̍t iā tio̍h tshin hiann-tī. 	打老虎和捉賊都是危及性命的事情，只有親兄弟才能齊力同心，一同出生入死。喻手足之情最為可靠。
185	拍人喝救人。
Phah lâng huah-kiù-lâng. 	打人的人反而喊救命。比喻為逃避責任或轉移焦點，做壞事的人反而誣告別人做壞事。
186	拍斷手骨顛倒勇。
Phah-tn̄g tshiú-kut tian-tò ióng. 	打斷手骨反而更健壯。意即愈挫愈勇。折斷的骨頭癒合後，新長成的骨節更為堅硬。用以鼓勵人不要畏懼困難與挫敗。
187	歹瓜厚子，歹人厚言語。
Pháinn kue kāu tsí, pháinn-lâng kāu giân-gí. 	壞瓜籽多，壞人話多。用來諷刺多話或是善於搬弄是非的人。
188	歹竹出好筍。
Pháinn tik tshut hó sún. 	壞竹子卻長出好筍子。比喻在惡劣的外在環境下仍能養成優秀的人。
189	歹竹出好筍，好竹出痀崙。
Pháinn tik tshut hó sún, hó tik tshut ku-lún. 	不好的竹子生出好的筍子，好的竹子生出奇形怪狀的竹子。比喻出身不好的人也能養成好的後代，富貴之人也會出不成才的子孫。
190	歹船拄著好港路。
Pháinn tsûn tú-tio̍h hó káng-lōo. 	破舊的船遇到好的航路。比喻外在環境大好，本身雖不濟，卻也能安然度過。
191	皮皮食甲流糍。
Phî-phî tsia̍h kah lâu-tsî. 	罵人忘記羞恥，不顧別人的批評，早已吃到下巴鬆弛下垂的樣子，還是照吃不誤。比喻人不知羞恥。
192	膨風水雞刣無肉。
Phòng-hong tsuí-ke thâi bô bah. 	青蛙腹部充氣鼓起，外表看起來好大，但宰殺後肉很少。譏諷言談誇大不實、常吹牛的人，喜歡說大話，一點本事也沒有。
193	鋪面蟶，浸水蚵。
Phoo-bīn than, tsìm-tsuí ô. 	鋪在表面的蟶及泡水膨脹後的牡蠣。小商販把好看的商品擺在表層來吸引人，比喻虛有其表或無心實踐。
194	跋一倒，抾著一隻金雞母。
Pua̍h tsi̍t tó, khioh-tio̍h tsi̍t tsiah kim ke-bó. 	跌了一跤，撿到一隻金母雞。比喻因禍得福，從失敗中汲取寶貴的經驗。
195	杯底毋通飼金魚。
Pue-té m̄-thang tshī kim-hî. 	杯裡不要留下可供放養金魚的酒。暗示人把杯裡的酒喝乾之意。
196	分袂平，拍甲二九暝。
Pun bē pênn, phah kah Jī-káu-mê. 	「二九暝」指除夕、大年夜。分配不平均，從年頭打到除夕夜。指事情分配不公，會引起長期的紛爭。
197	西北雨，落袂過車路。
Sai-pak-hōo, lo̍h bē kuè tshia-lōo. 	西北雨，下不過馬路。「西北雨」即夏日午後雷陣雨，下得非常短暫，且為小區域的天氣現象，有時還來不及下超過另一條馬路，雨就停了。
198	瘦田𠢕欶水。
Sán tshân gâu suh tsuí. 	貧瘠的農田在灌溉時，需要更多水分才夠飽滿。指瘦小的人食量很大。
199	送伊魚，較輸教伊掠魚。
Sàng i hî, khah-su kà i lia̍h hî. 	送他魚，不如教他捕魚。比喻與其救濟或幫助他人，不如教他謀生的能力。
200	三分人，七分妝。
Sann hun lâng, tshit hun tsng. 	人的外表三分是靠天生的長相，七分是靠適當的裝扮。提醒人要注意穿著打扮，更能增添個人的魅力。
201	三日無餾，𬦰上樹。
Sann ji̍t bô liū, peh-tsiūnn tshiū. 	三天不溫習，學過的東西就爬上了樹梢。說明學過的東西要勤加溫習，稍有怠惰，很快所學的東西就會忘得一乾二淨。
202	三跤步一坎店。
Sann kha-pōo tsi̍t khám tiàm. 	走三步就有一間店。形容市景繁榮，商店林立。 意指同類的店鋪多，同行之間的競爭很激烈。
203	三講，四毋著。
Sann kóng, sì m̄-tio̍h. 	說三句話，錯四個地方。指人說話頻頻出錯。
204	三人共五目，日後無長短跤話。
Sann lâng kāng gōo ba̍k, ji̍t-āu bô tn̂g-té-kha-uē. 	三個人總共五隻眼睛，以後不能再說長道短。原故事為媒人婆替兩腳一長一短的青年，與瞎了一隻眼的女子相親，媒人為促成婚事，故意隱藏雙方的缺陷，在結婚前以雙關語說在場三人總共五隻眼睛，決定的事情日後便不得再說長就短。比喻共同商議後所做的決定，事後不得反悔。
205	三年一閏，好歹照輪。
Sann nî tsi̍t jūn, hó-pháinn tsiàu lûn. 	三年一次閏月，好壞輪流來。農曆每二、三年會有一個閏月，多出來的這個月按曆法分派到不同月份，所以說「好歹照輪」。這句話指風水輪流轉，人生的際遇，不會永遠順利，也不會永遠困窘。
206	三百六十行，行行出狀元。
Sann-pah la̍k-tsa̍p hâng, hâng-hâng tshut tsiōng-guân. 	各行各業都有出類拔萃的人。狀元是指各行業的頂尖人物，比喻不論從事何種行業，都可出人頭地。
207	三代粒積，一代窮空。
Sann tāi lia̍p-tsik, tsi̍t tāi khîng-khong. 	三代累積，一代敗光。即三代人辛苦累積的財富，卻被後代一人揮霍殆盡。比喻創業艱辛，守成要謹慎。
208	掃地掃壁角，洗面洗耳空。
Sàu-tè sàu piah-kak, sé-bīn sé hīnn-khang. 	打掃房間，要注意清潔牆角周圍；洗臉時，要注意耳朵周圍或耳後容易藏污納垢的地方。指做事要澈底實在，不要馬虎隨便。
209	細漢煩惱伊袂大，大漢煩惱伊未娶。
Sè-hàn huân-ló i bē tuā, tuā-hàn huân-ló i buē tshuā. 	小時候煩惱他長不大，長大了煩惱他不結婚。表示父母親對兒女成長的各個階段，都有不同的操心與煩惱。
210	細漢偷挽匏，大漢偷牽牛。
Sè-hàn thau bán pû, tuā-hàn thau khan gû. 	小時候偷摘匏瓜，長大偷牽牛隻。指一味縱容小孩的錯誤行為，反而會使其積惡成習，長大後會變本加厲。
211	細空毋補，大空叫苦。
Sè khang m̄ póo, tuā khang kiò-khóo. 	破洞還小的時候不及時縫補，等破洞大到無法挽救時才在哀號。 勸人若發現小問題，應及時修正，不要等事情變大了才來後悔莫及。
212	生的且一邊，養的恩情較大天。
Senn--ê tshiánn tsi̍t pinn, iúnn--ê un-tsîng khah tuā thinn. 	親生的父母暫且擱在一邊，養育者的恩情比天還高。提醒被撫養人不要抹煞養育人的苦心與功勞；又指生身父母比養育者的地位還差一些。
213	生雞卵的無，放雞屎的有。
Senn ke-nn̄g--ê bô, pàng ke-sái--ê ū. 	沒有生雞蛋的，只有拉雞屎的。形容團體中沒有能帶來利益或好處的人，只有會惹事生非，帶來壞處或麻煩的人。
214	生囝師仔，飼囝師傅。
Senn-kiánn sai-á, tshī kiánn sai-hū. 	生孩子是學徒，養育孩子是師傅。比喻生小孩瓜熟蒂落算不上本事，要把孩子養育成有用的人才是真本領。
215	西瓜倚大爿。
Si-kue uá tuā pîng. 	西瓜哪邊比較大就靠向那邊。意指人看哪一邊得勢，就向那邊，形容人趨炎附勢。
216	死目毋願瞌。
Sí ba̍k m̄ guān kheh. 	過世的時候不願意合眼。指因還有未完成的心願或牽掛的事而死不瞑目。
217	死皇帝毋值得活乞食。
Sí hông-tè m̄-ta̍t-tit ua̍h khit-tsia̍h. 	去世的皇帝，比不上還活著的乞丐。勉勵人要珍惜生命，窮苦活著總比富貴死去還要強。
218	死道友，無死貧道。
Sí tō-iú, bô sí pîn-tō. 	要死別人死，不能犧牲自己。「道友」指同道友人，泛指別人；「貧道」是修行者自謙的說法，泛指自己。說明人不在乎別人的死活，只關心自己是否還安好。
219	死蛇活尾溜。
Sí tsuâ ua̍h bué-liu. 	蛇被打死了，尾巴還在蠕動。形容事情雖然已經結束，但還留下一個殘局未收拾。
220	時到時擔當，無米才煮番薯湯。
Sî kàu sî tam-tng, bô bí tsiah tsú han-tsî-thng. 	時候到了再看著辦，沒有米可以煮飯就拿地瓜煮湯。形容事情自然有因應之道，如果一事不成，也另有替代之道。
221	是毋是，罵家己。
Sī m̄ sī, mē ka-kī. 	對不對，先罵自己。人與人相處難免會有衝突，遇到事情先檢討自己。
222	仙人拍鼓有時錯，跤步踏差啥人無？
Sian-jîn phah kóo iú sî tshò, kha-pōo ta̍h-tsha siánn-lâng bô? 	神仙打鼓有時候也會出錯，人走路也難免跌跤會走偏。指再厲害的人難免也會出差錯。
223	仙拚仙，害死猴齊天。
Sian piànn sian, hāi-sí Kâu Tsê-thian. 	眾仙人互相爭鬥，反而害一旁的孫悟空受到牽連。比喻兩方拼鬥，卻禍延無辜的第三者，亦即殃及池魚。
224	雙个旋，惡甲無人問。
Siang ê tsn̄g, ok kah bô lâng mn̄g. 	頭上有兩個髮旋的人，兇狠到沒人聞問。傳統認為有兩個髮旋的人天性兇，但無相關研究根據。
225	雙手抱孩兒，才知爸母時。
Siang-tshiú phō hâi-jî, tsiah tsai pē-bú sî. 	只有在雙手抱自己小孩時，才能真正體會父母的辛勞。勸人要知道父母的養育之恩，從而孝順父母。
226	痟狗舂墓壙。
Siáu-káu tsing bōng-khòng. 	瘋狗撞墓穴。指行事莽撞，行為冒失，未經周全計畫就倉促行事。也引申爭名奪利，指人有利可圖，不顧一切巧取豪奪。
227	痟貪軁雞籠。
Siáu-tham nǹg ke-lam. 	貪得無厭的雞為了吃飼料而鑽進雞籠。昔時農家養雞都採放養的方式，當需宰殺或販售雞隻時，便會將飼料放在籠子內，以誘導雞上門並將其關在其中。勸人千萬不要貪得無厭。
228	少年袂曉想，食老毋成樣。
Siàu-liân bē-hiáu siūnn, tsia̍h-lāu m̄-tsiânn-iūnn. 	年輕時思慮不周，等到老了生活堪憂。年輕時沒有做好生涯規劃，年老時便會落魄潦倒。意即少壯不努力，老大徒傷悲。用來勉勵人年輕時要有遠見，努力為未來鋪路。
229	少年若無一擺戇，路邊哪有有應公。
Siàu-liân nā bô tsi̍t pái gōng, lōo-pinn ná ū Iú-ìng-kong.	若非年少時傻過一次，路邊哪來有應公廟。「有應公」或稱無緣佛、萬善公，是對無主孤魂的尊稱，也指臺灣民間信仰中，收容孤魂的小祠廟，通常不知道主祀者、也沒有神像。引申為勸誡年輕人勿逞血氣之勇，需珍惜自身性命。
230	心歹無人知，喙歹上厲害。
Sim pháinn bô lâng tsai, tshuì pháinn siōng lī-hāi. 	心地不好沒人知道，口出惡言最嚴重。重點在後句，告誡人要謹言慎行。
231	神明興，弟子窮。
Sîn-bîng hing, tē-tsú kîng. 	神明香火興旺，信徒便窮困。勸人敬拜神明花費要節制，以免導致生活困窘。
232	誠意食水甜。
Sîng-ì tsia̍h tsuí tinn. 	只要有誠意光喝水也覺得甜。意思是說誠心誠意對待人，即使只請人喝白開水，喝起來都會是甜的。比喻人和人之間的相處，誠意是最重要的。
233	倖豬夯灶，倖囝不孝。
Sīng ti giâ tsàu, sīng kiánn put-hàu. 	寵豬頂灶，寵兒不孝。豬不關好，放任牠自由進出，可能連灶都被豬翻了；小孩子太受寵愛，就不懂得孝順父母。比喻子女要適度管教，不能一味溺愛，否則會不懂得孝順。
234	燒瓷的食缺，織蓆的睏椅。
Sio-huî--ê tsia̍h khih, tsit-tshio̍h--ê khùn í. 	燒製瓷器的人，自己用有缺口的碗吃飯；織草蓆的人，捨不得拿草蓆來睡，反而在椅子上睡覺。比喻人為了賺錢或節儉，捨不得用自己製造的好產品，或者故意使用較無市場價值的瑕疵品。
235	相罵無揀喙，相拍無揀位。
Sio-mē bô kíng tshuì, sio-phah bô kíng uī. 	吵架時不會選擇講什麼話才適合，打架時不會斟酌挑身體哪個部位打。指一般人在吵架或打架時容易喪失理智，因此任何事情都做得出來。
236	相分食有賰，相搶食無份。
Sio-pun tsia̍h ū tshun, sio-tshiúnn tsia̍h bô hūn. 	飲食互相分享，則綽綽有餘；互相爭搶，反而沒得吃。比喻禮讓則互蒙其利，爭奪則互受其害。
237	惜花連盆，疼囝連孫。
Sioh hue liân phûn, thiànn kiánn liân sun. 	愛惜花朵亦會連帶珍惜花盆；疼愛子女，也會連同孫輩一起疼惜。意指疼愛一個人時，也會連帶關愛與其相關的人事物。比喻愛屋及烏。
238	俗物無好貨。
Sio̍k-mi̍h bô hó huè. 	便宜沒好貨。指一般人常存有貪小便宜的心態，見到便宜貨，便受低價位誘惑而購買，卻忽略物品本身的品質，導致買到劣質品。
239	俗物食破家。
Sio̍k-mi̍h tsia̍h phuà ke. 	因東西便宜而毫無節制地去採購，容易導致過度消費，拖垮家庭經濟。比喻貪小便宜，反而會造成更大的損失。
240	相命無褒，食水都無。
Siòng-miā bô po, tsia̍h tsuí to bô. 	算命時如果不說些讚美客人的話，連水都沒得喝。說明江湖術士的話不可盡信，也勸人要多說好話。
241	收瀾收予焦，予你生一个有𡳞脬。
Siu-nuā siu hōo ta, hōo lí senn tsi̍t ê ū lān-pha. 	收涎收乾淨，讓你生一個男丁。「收瀾」是民間習俗，在嬰兒滿四個月時舉辦之儀式，目的是希望解決嬰兒流口水的毛病；「𡳞脬」是男性的生殖器，泛指男丁。此諺為嬰兒滿四個月時，長輩們替嬰兒收口水時所講的吉祥話，期望嬰兒的母親來年能添丁。
242	收瀾收離離，明年招小弟。
Siu-nuā siu-lī-lī, mê-nî tsio sió-tī. 	收口水收得乾乾淨淨，明年又可以招來一個小弟弟。臺灣民間習俗，嬰兒出生滿四個月的那一天，要舉行「收瀾」（收涎）的儀式，當天用紅線把12塊、24塊或48塊中間有圓孔的小餅乾串在嬰兒頸上，由母親抱著到親友鄰居處走動，親友掰下一塊口酥餅，在嬰兒嘴邊擦一、兩下，口中就一邊唸著這句吉祥話。過去農業社會重男輕女，故以「招小弟」祝福其家可再添男丁。
243	輸人毋輸陣，輸陣歹看面。
Su lâng m̄ su tīn, su tīn pháinn-khuànn bīn. 	個人與他人比賽可以輸，但團體比賽不能落在最後面；參加團體賽若輸了，大家面子也掛不住。一般用來提振團體士氣，鼓勵人奮勇向前，勿落人後。
244	媠䆀無比止，愛著較慘死。
Suí-bái bô pí tsí, ài--tio̍h khah tshám sí. 	漂亮與否無從比較起，一旦愛上了比死亡還要悽慘。只要兩情相悅，一旦愛上一個人，就會不計美醜，愛得死心塌地。
245	臺灣錢，淹跤目。
Tâi-uân tsînn, im kha-ba̍k. 	臺灣地上的錢多到蓋住腳踝。比喻臺灣遍地錢財、容易謀生。
246	大甲溪放草魚──有準無。
Tāi-kah-khe pàng tsháu-hî──ū tsún bô. 	在大甲溪邊流放魚苗，一旦放出去就不會回頭，形容東西離手了，就再也不會回來。比喻肉包子打狗，有去無回。
247	等物僫到，等人快老。
Tán mi̍h oh kàu, tán lâng khuài lāu. 	等東西很難等到，等人容易變老。比喻等待的時間很難熬；或指等待的東西往往落空。
248	刣雞教猴。
Thâi ke kà kâu. 	殺雞給猴子看。比喻用懲罰一個人的辦法來警告別的人。
249	讀冊，讀佇尻脊骿。
Tha̍k-tsheh, tha̍k tī kha-tsiah-phiann. 	讀書本應記在腦子裡，卻讀到背脊上。嘲諷人讀死書，食古不化。 或諷指人有學問卻不行正道，書都白讀了。
250	趁也著趁，食也著食。
Thàn iā tio̍h thàn, tsia̍h iā tio̍h tsia̍h. 	錢也得賺，飯也得吃。勸人不要只會賺錢，也要懂得花錢吃飯，照顧身體。
251	趁錢有數，性命愛顧。
Thàn-tsînn iú sòo, sènn-miā ài kòo. 	賺錢數量有限，生命要照顧。意思是賺錢要適可而止，身體健康更為重要，不可為了多賺錢而不顧生命。
252	頭燒燒，尾冷冷。
Thâu sio-sio, bué líng-líng. 	剛開始的時候興沖沖，到了後來卻提不起勁。指人做事情只有三分鐘熱度，沒辦法貫徹始終。
253	頭大面四方，肚大居財王。
Thâu tuā bīn sù-hong, tóo tuā ki-tsâi ông. 	指頭大大的、臉形良好又勻稱、肚子大的人，有大富之相。這是命相學的說法，未必可信。
254	聽某喙，大富貴。
Thiann bóo tshuì, tuā hù-kuì. 	聽老婆的話，可以大富大貴。期勉丈夫適時尊重、接納太太的意見，必可避免爭吵的發生。
255	天公疼戇人。
Thinn-kong thiànn gōng-lâng. 	老天爺疼惜憨厚的人。實事求是、按部就班者，往往得到上天的眷顧。
256	天頂天公，地下母舅公。
Thinn-tíng Thinn-kong, tē-ē bú-kū-kong. 	天上地位最崇高的就屬玉皇大帝，而人世間則是舅舅。這說明了在臺灣舅舅的地位崇高，故每逢子女婚嫁時或有舅舅會出席的場合，都要請他坐大位。
257	豬毋大，大對狗去。
Ti m̄ tuā, tuā tuì káu khì. 	用心飼養的豬養不肥，卻把不需要養肥的狗養肥了。比喻事情發展不符合自己的期許。以前重男輕女的社會裡，常用來描述兒子不上進，女兒卻力爭上游的情況。
258	豬岫毋值狗岫穩。
Ti-siū m̄-ta̍t káu-siū ún. 	豬舍不如狗窩安穩。意即金窩銀窩不如自己的狗窩。
259	豬頭毋顧，顧鴨母卵。
Ti-thâu m̄ kòo, kòo ah-bó nn̄g. 	祭拜鬼神時不顧豬頭，只守著鴨蛋。比喻放著重要的事不管，反而去管次要的。
260	豬頭皮炸無油。
Ti-thâu-phuê tsuànn bô iû. 	豬頭皮炸不出油來。用來比喻一個人不具真才實學，好吹牛，所言空洞，說不出大道理。
261	恬恬食三碗公半。
Tiām-tiām tsia̍h sann uánn-kong puànn. 	靜靜的吃掉三碗公半。形容悶聲不響、莫測高深的人，平時不動聲色，不為人所注意，但卻會做出令人意想不到的事情。
262	得失土地公，飼無雞。
Tik-sit Thóo-tī-kong, tshī bô ke. 	得罪土地公，則養不活雞。比喻做事若得罪有權勢或影響力的要角，恐將吃不完兜著走。
263	頂港有名聲，下港上出名。
Tíng-káng ū miâ-siann, ē-káng siōng tshut-miâ. 	在臺灣北部有名氣，在臺灣南部最出名。形容聲名遠播，遠近馳名。
264	頂司管下司，鋤頭管畚箕。
Tíng-si kuán ē-si, tî-thâu kuán pùn-ki.	上司管束下屬，鋤頭牽制畚箕。形容社會有階層，一層管一層，分層管理，層層節制。
265	張持無蝕本。
Tiunn-tî bô si̍h-pún. 	凡事謹慎小心不會吃虧。形容遇事謹慎處理，有益無害。
266	斷掌查埔做相公，斷掌查某守空房。
Tn̄g-tsiúnn tsa-poo tsò siùnn-kang, tn̄g-tsiúnn tsa-bóo tsiú khang-pâng. 	斷掌的男子可以做大官，斷掌的女子會獨守空房。意為男子斷掌則個性比較果斷，所以適合當官；女子斷掌是剋夫命，會守寡。「斷掌」是指手掌有一條橫向貫穿手掌的掌紋，按命相言，斷掌者乃有決斷力、能幹之人，這種舊思維是以往命相師的無稽之談，不宜輕信。
267	倒吊無墨水。
Tò-tiàu bô ba̍k-tsuí. 	把人倒掛卻連一滴墨水都流不出來。形容人沒學問，胸無點墨。
268	桌頂食飯，桌跤放屎。
Toh-tíng tsia̍h-pn̄g, toh-kha pàng-sái. 	人家請你吃飯，卻在桌底下排泄糞便。引申為受人恩惠而不知報答，反而做出對不起恩人的事情。
269	查埔也著疼，查某也著晟。
Tsa-poo iā tio̍h thiànn, tsa-bóo iā tio̍h tshiânn. 	勸人養兒不可重男輕女，不管是男孩或女孩都要一樣疼惜扶養。
270	查埔囝得田園，查某囝得嫁粧。
Tsa-poo-kiánn tit tshân-hn̂g, tsa-bóo-kiánn tit kè-tsng. 	兒子分得家產，女兒得到嫁妝。早期臺灣家庭財產分配的傳統做法，在父母過世後，田宅等不動產由兒子繼承，女兒則是出嫁時給嫁妝。
271	財子壽三字全。
Tsâi-tsú-siū sann jī tsuân.	錢財、子女、長壽三項都齊全。用來表示一個人樣樣俱足，幸福美滿。
272	在生一粒豆，較贏死了拜豬頭。
Tsāi-senn tsi̍t lia̍p tāu, khah iânn sí-liáu pài ti-thâu. 	父母健在的時候吃兒女孝敬的一顆豆子，勝過去世後兒女才以豬頭來祭拜。提醒人行孝要及時；又指死後子女以盛大喪禮祭拜，雖是風光，卻不如父母在生時略盡奉養之責，只有生前奉養才是真的孝順。傳統禮俗，父母去世時，要準備豬頭做祭拜的大牲禮。
273	十二月食菜頭，六月才轉嗽。
Tsa̍p-jī--gue̍h tsia̍h tshài-thâu, la̍k--gue̍h tsiah tńg-sàu. 	十二月時吃了蘿蔔，到了隔年六月才咳嗽。指人反應遲鈍，事過境遷才做出反應。
274	十二生相變透透。
Tsa̍p-jī senn-siùnn pìnn-thàu-thàu. 	各種不同的職業都嘗試遍了。形容一個人經常更換職業，沒有定性，難有成就。
275	十囝十新婦，賰一个老寡婦。
Tsa̍p kiánn tsa̍p sin-pū, tshun tsi̍t ê lāu kuá-hū. 	十個兒子娶了十個媳婦，卻留下一個年老守寡的媽媽沒人照料。形容兒子大了各自成家，年老守寡的母親卻無人願意照顧。
276	雜唸大家出蠻皮新婦。
Tsa̍p-liām ta-ke tshut bân-phuê sin-pū. 	婆婆嘮叨久了，媳婦就不在乎責罵。意即有嘮叨的長輩或上司，就會有頑固不化的晚輩或部屬。
277	十指伸出，無平長。
Tsa̍p tsáinn tshun-tshut, bô pênn tn̂g. 	十根手指頭伸出來，長短也不一樣。勸誡為人子女者，若是覺得父母有時對待子女厚此薄彼、有所不公，不要過於在意。因為這是很自然的現象，就像十根手指頭長在同一個身體上，但長度卻都不一樣。
278	十喙九尻川。
Tsa̍p tshuì káu kha-tshng. 	十張嘴九個屁股。「十喙」諧音「雜喙」，「九尻川」諧音「狗尻川」，比喻人多嘴雜，個個像在放狗屁。
279	坐予正，得人疼。
Tsē hōo tsiànn, tit lâng thiànn. 	坐姿端正，才會惹人疼愛。本為嫁娶儀式時，媒人、長輩常會說的吉祥話。 引申為勸誡人要端正儀容姿態，才能讓人留下好印象。
280	菜蟲食菜，菜跤死。
Tshài thâng tsia̍h tshài, tshài-kha sí. 	菜蟲吃菜葉，死於菜株下。勸人勿作奸犯科，否則最後終將玩火自焚。
281	田螺含水過冬。
Tshân-lê kâm tsuí kuè tang.	田螺含些許水份度過寒冬。比喻窮人含辛度日，等待時機。
282	草地親家坐大位。
Tsháu-tē tshin-ke tsē tuā-uī. 	城裡人家辦喜宴時，來自鄉村的親家雖然衣著較寒酸，仍請他坐上位。即不因他人身世背景，而輕忽了待客之道。
283	臭頭仔嘛會做皇帝，做總統你嘛有機會。
Tshàu-thâu-á mā ē tsò hông-tè, tsò tsóng-thóng lí mā ū ki-huē. 	瘌痢頭也能當皇帝，當總統你也有機會。英雄不怕出身低，只要肯奮鬥，都可能有出頭天的機會。
284	生狂狗食無屎。
Tshenn-kông káu tsia̍h bô sái. 	狗若過於慌張、急促，就連屎都吃不到。誡人處事不可操之過急，過於急躁反而會失敗。
285	青盲貓咬著死鳥鼠。
Tshenn-mê niau kā-tio̍h sí niáu-tshí. 	瞎眼的貓咬到死老鼠。比喻誤打誤撞，通常用在表示運氣很好。
286	生食都無夠，哪有通曝乾。
Tshenn tsia̍h to bô-kàu, ná ū thang pha̍k-kuann. 	生吃都不夠了，哪有多餘的可以曬乾。「曝乾」通常是指食物過剩時曬乾儲存。比喻現實生活已捉襟見肘，對未來的日子更不敢奢望。
287	飼囝無論飯，飼爸母算頓。
Tshī kiánn bô-lūn pn̄g, tshī pē-bú sǹg tǹg. 	父母養育兒女，不會去計較孩子的飯量，兒女奉養父母時，卻會計算父母吃了幾頓飯。這句話說明有些人養育子女和奉養父母時心態上的差異，以及兄弟輪流奉養父母時常常斤斤計較的現象。
288	飼鳥鼠，咬布袋。
Tshī niáu-tshí, kā pòo-tē.	餵養老鼠，老鼠卻咬破布袋偷吃米。比喻善待親信卻遭其背叛，亦即養虎貽患。
289	千金買厝，萬金買厝邊。
Tshian-kim bé tshù, bān kim bé tshù-pinn. 	千金買房子，萬金買好鄰居。形容敦親睦鄰之重要，或指擇鄰而處，好的鄰居對居住品質的影響很大。
290	千算萬算，毋值天一劃。
Tshian sǹg bān sǹg, m̄-ta̍t thinn tsi̍t ue̍h. 	形容人百般算計仍敵不過老天爺的輕輕一筆，把之前的努力都一筆勾銷。說明人再如何汲汲營營算計，遇見天災或意外，還是不敵自然的力量。也指人的經營算計不敵命運的捉弄。
291	千途萬途，毋值得翻田塗。
Tshian tôo bān tôo, m̄ ta̍t-tit huan tshân thôo. 	相較於各行各業，耕田才是最務實的行業。反映早期重農輕商的思想。
292	清明無轉厝，無祖；過年無轉厝，無某。
Tshing-bîng bô tńg tshù, bô tsóo; kuè-nî bô tńg tshù, bô bóo. 	清明節不回家祭祖掃墓，會背負背祖忘本之名，而過年不回家的出外人，可能是無家庭觀念或是沒妻小的人。說明逢年過節在人民心中的重要性，含有慎終追遠、重視家庭的意義存在。
293	七仔較興八仔。
Tshit--á khah hìng peh--á. 	一個比一個興趣高。形容兩人都有興致。
294	七月半鴨仔，毋知死活。
Tshit-gue̍h-puànn ah-á, m̄ tsai sí-ua̍h. 	七月半的鴨子，不知死活。七月半指農曆7月15日，也就是「中元普渡」，為臺灣民間信仰祭拜孤魂野鬼的日子。民間信仰中雞是祭神的供品，拜鬼只能用鴨子，故有此說。形容人沒有憂患意識，不知大難臨頭。
295	七坐八爬九發牙。
Tshit tsē peh pê káu huat-gê. 	七坐八爬九長牙。指嬰兒成長有一定的程序，通常是七個月大時學會坐、八個月大學會爬、九個月大時就長乳牙。
296	手曲，屈入無屈出。
Tshiú-khiau, khut-ji̍p bô khut-tshut. 	胳臂向內彎，不會向外彎。比喻人都比較會袒護自己人，不會幫外人。可用於表示袒護自己人是應該的，也可用於譴責幫外人的人。
297	手抱孩兒，才知爸母時。
Tshiú phō hâi-jî, tsiah tsai pē-bú sî. 	親手抱著自己的小孩時，才能夠真正體會為人父母養育兒女的不易與辛勞。勸人要感念父母的養育之恩，孝順父母。
298	樹頭徛予在，毋驚樹尾做風颱。
Tshiū-thâu khiā hōo tsāi, m̄ kiann tshiū-bué tsò-hong-thai. 	樹根要是穩固了，就不怕樹梢被颱風吹襲。比喻要固本。 指人行事正直無私、光明磊落，不怕任何的惡意中傷。
299	喙飽目睭枵。
Tshuì pá ba̍k-tsiu iau. 	已經吃得很飽了，但眼睛還是盯著餐桌上的美饌佳餚不放，一直想繼續再吃。比喻為一個人貪得無厭。
300	喙食，予尻川坐數。
Tshuì tsia̍h, hōo kha-tshng tshē-siàu. 	嘴巴吃進去，讓屁股承擔後果。意即貪圖味覺享受而亂吃，拉肚子時受苦的卻是屁股。比喻貪圖一時的好處，自己得承受後果。 引申為一人之誤，卻由他人代為受罪承擔。
301	喙脣皮相款待。
Tshuì-tûn-phuê sio khuán-thāi. 	光用嘴巴說些體面話互相招待。比喻人只是口頭上敷衍，並非真心幫助。
302	春雺曝死鬼，夏雺做大水。
Tshun bông pha̍k-sí kuí, hā bông tsò-tuā-tsuí. 	春天起霧曬死鬼，夏天起霧鬧水災。此為前人經過長期觀察、累積經驗而來的氣象諺語。春天早晨若大霧籠罩，濕氣很重，霧氣一旦散開後就會是大晴天甚至是大熱天；夏天早晨若大霧籠罩，白天時空氣對流旺盛下，暖空氣上升，容易形成大雷雨甚至造成水災。
303	春天後母面，欲變一時間。
Tshun-thinn āu-bú-bīn, beh piàn tsi̍t-sî-kan. 	春天繼母臉，要變一剎那。以人前人後表現截然不同的繼母形容春季的天氣多變。舊時代，繼母給人的形象都很差，對待繼子繼女，人前慈愛，人後虐待，因此被用來形容春天的天氣。
304	食米毋知米價。
Tsia̍h bí m̄ tsai bí kè. 	吃米飯不曉得米的價錢。形容只知享受，不知生活疾苦的人。
305	食無三把蕹菜，就欲上西天。
Tsia̍h bô sann pé ìng-tshài, tō beh tsiūnn se-thian. 	吃不到三把空心菜，就妄想可以上西天了。諷刺人不肯腳踏實地，妄想一步登天。
306	食魚食肉，也著菜佮。
Tsia̍h hî tsia̍h bah, iā tio̍h tshài kah. 	吃魚吃肉，也要兼吃蔬菜。表示飲食要均衡身體才會健康。
307	食好鬥相報。
Tsia̍h hó tàu sio-pò. 	吃到好東西，對外廣為介紹。引申為若有好東西，大家會口耳相傳。
308	食雞，會起家；食鰇魚，生囡仔好育飼。
Tsia̍h ke, ē khí-ke; tsia̍h jiû-hî, senn gín-á hó io-tshī. 	吃雞，會使家道興盛；吃魷魚，生下來的小孩容易養育。借諧音的吉祥話，說出心中的祝福。搬新家、結婚、生子、宴會時皆可以使用。
309	食緊挵破碗。
Tsia̍h-kín lòng-phuà uánn.	吃得太快打破碗。用來比喻人做事情若只一心求快，反而容易造成反效果。
310	食果子拜樹頭；食米飯拜田頭。
Tsia̍h kué-tsí pài tshiū-thâu; tsia̍h bí-pn̄g pài tshân-thâu. 	吃水果，要拜謝樹根；吃米飯，要拜謝田地。指人要懂得感恩，飲水思源，不可忘本。通常僅單用「食果子拜樹頭」一句。
311	食人頭鍾酒，講人頭句話。
Tsia̍h lâng thâu tsing tsiú, kóng lâng thâu kù uē. 	喝第一杯酒，講第一句話。主人通常會請宴席上的長者或貴賓第一個講話，講話者常用此句作為開場白表示僭越、自謙之意。
312	食人一口，報人一斗。
Tsia̍h lâng tsi̍t kháu, pò lâng tsi̍t táu. 	吃人一口，要回報一斗。意為受人恩惠時要感恩圖報，並加倍奉還。
313	食人一斤，也著還人四兩。
Tsia̍h lâng tsi̍t kin, iā tio̍h hîng lâng sì niú. 	吃了他人一斤的糧食，最少得還人家四兩。指受人恩惠，縱然自己很困苦，多少總要擠一點出來報答別人。比喻知恩圖報。 進一步引申，告誡世人不要隨便收受他人饋贈，拿人家的都要奉還，天下沒有白吃的午餐。
314	食飽換枵。
Tsia̍h-pá uānn iau. 	先吃飽再把肚子搞餓。形容人徒勞無功，做沒有實質好處的事情；或用來謙稱自己所為只是消磨時間，微不足道。 引申為不該做的事卻去做、不該管的事卻去管，諷人自找麻煩，吃飽撐著沒事幹。
315	食飯皇帝大。
Tsia̍h-pn̄g hông-tè tuā. 	吃飯的時候跟皇帝一樣大。意為吃飯最重要，不管什麼事都不得干擾，等用餐完畢後，再行處理。
316	食甜食鹹，臭跤鼻臁。
Tsia̍h tinn tsia̍h kiâm, tshàu kha-phīnn-liâm. 	又吃甜的又吃鹹的，小腿前面會生瘡。用來勸誡人飲食要有節度，注意均衡的營養和衛生。「跤鼻臁」是小腿脛骨，與食物沒有直接關係，僅是順口的比喻。
317	食著藥，青草一葉；食毋著藥，人參一石。
Tsia̍h tio̍h io̍h, tshenn-tsháu tsi̍t hio̍h; tsia̍h m̄-tio̍h io̍h, jîn-sim tsi̍t tsio̍h. 	吃對藥，一葉的藥草就能見效；吃錯藥，吃再多高價珍貴的人參也無效。比喻做事要能切中要點、掌握關鍵，才不會徒勞無功，而能有事半功倍之效。
318	食碗內，說碗外。
Tsia̍h uánn-lāi, sueh uánn-guā. 	吃碗內的東西，卻說碗外的東西好。享受親近的人給予的好處，到最後卻為外人說話，暗諷人吃裡扒外，不知感恩。
319	捷罵袂聽，捷拍袂疼。
Tsia̍p mē bē thiann, tsia̍p phah bē thiànn. 	常罵不聽話，常打不怕痛。意為頻繁的打罵教育，其懲罰效果就會愈來愈低。
320	盡人事，順天意。
Tsīn jîn-sū, sūn thinn-ì. 	凡事盡力而為，結果就交給老天安排。意即盡人事，聽天命。
321	錢四跤，人兩跤。
Tsînn sì kha, lâng nn̄g kha. 	錢有四條腿，人只有兩條腿。以錢的腿比人腿多，跑得比人快，來比喻賺錢的辛苦與不易。
322	這溪無魚，別溪釣。
Tsit khe bô hî, pa̍t khe tiò. 	釣魚時，這條溪釣不到魚，不要氣餒，可到另一條溪釣釣看。比喻某處無法謀生時，可到別處另尋出路。
323	一面抹壁雙面光。
Tsi̍t bīn buah-piah siang bīn kng. 	用灰匙將水泥塗抹在牆面，壁面和灰匙都很平滑光亮。比喻為人處事圓融，兩方都不得罪。
324	一某無人知，兩某相卸代。
Tsi̍t bóo bô lâng tsai, nn̄g bóo sio-sià-tāi. 	只有一個妻子不會受人注意，要是有大小老婆就會爭吵不斷，家醜外揚。形容有妻有妾者家中常有爭執，受人嘲笑。
325	一个某較好三个天公祖。
Tsi̍t ê bóo khah hó sann ê Thinn-kong-tsóo. 	有個妻子勝過三尊天公的庇佑。引申為有一賢內助持家，勝過老天爺保佑。
326	一个囡仔較鬧熱三个大人。
Tsi̍t ê gín-á khah lāu-jia̍t sann ê tuā-lâng. 	一個小孩比三個大人在一起還熱鬧。小孩天真活潑，不時活蹦亂跳，大人也爭相哄他寵他，往往會逗得大人們笑呵呵。所以家裡有小孩子，氣氛會顯得熱鬧又活絡。
327	一个人一款命。
Tsi̍t ê lâng tsi̍t khuán miā. 	一個人一種命。每個人的命運、際遇各不相同，不用怨天尤人，要腳踏實地。
328	一个錢拍二十四个結。
Tsi̍t ê tsînn phah jī-tsa̍p-sì ê kat. 	一個錢打二十四個結。譏諷人吝於用錢，視財如命。
329	一耳空入，一耳空出。
Tsi̍t hīnn-khang ji̍p, tsi̍t hīnn-khang tshut. 	右耳進、左耳出。聽過的話記不住，或聽而不聞。比喻不用心或者善忘。
330	一鄉一俗。
Tsi̍t hiong tsi̍t sio̍k. 	一個鄉鎮一種風俗。指各地有不同的風俗習慣。
331	一分錢，一分貨。
Tsi̍t hun tsînn, tsi̍t hun huè. 	買東西時，所付的價錢跟貨物的品質直接相關。貨物以好壞論價，花多少錢，就得到價值相當的東西。
332	一樣米飼百樣人。
Tsi̍t iūnn bí tshī pah iūnn lâng. 	一種米養百種人。人的食物差異不大，但人的個性千差萬別。比喻這個社會上有著各式各樣、形形色色的人。
333	一日徙栽，三日徛黃。
Tsi̍t ji̍t suá-tsai, sann ji̍t khiā-n̂g. 	苗木移植一次得枯黃好幾天才會恢復生機。比喻經常變換工作難以累積實力，以致難有成效。勉勵做人做事要有定性，老是見異思遷則有害無利。 或指常常更換環境，以致難以適應。
334	一日剃頭，三日緣投。
Tsi̍t ji̍t thì-thâu, sann ji̍t iân-tâu. 	理一次髮，可以英俊個三天。理髮後會使人看起來清爽有神，自己順眼，別人也會有好印象。
335	一日討海，三日曝網。
Tsi̍t ji̍t thó-hái, sann ji̍t pha̍k bāng. 	捕一天魚，卻三天在曬魚網；引申為人懶惰，工作一天，休息三天。比喻一曝十寒。
336	一日走拋拋，一暝點燈膋。
Tsi̍t ji̍t tsáu-pha-pha, tsi̍t mê tiám ting-lâ. 	整天到處遊蕩，夜裡挑燈夜戰。形容人白天只顧著玩樂，夜裡才拚命趕工，比喻本末倒置。
337	一枝草，一點露。
Tsi̍t ki tsháu, tsi̍t tiám lōo. 	意為有草就有露水滋潤它。比喻天無絕人之路，只要努力，自有生路；也指天生我才必有用。
338	一句話三角六尖。
Tsi̍t kù uē sann kak la̍k tsiam. 	一句話尖銳帶角。形容講話的時候話中帶刺；也指言語銳利，出言不遜、容易傷人。「三」與「六」只是形容多，非實數。
339	一人煩惱一樣，無人煩惱親像。
Tsi̍t lâng huân-ló tsi̍t iūnn, bô lâng huân-ló tshin-tshiūnn. 	每個人都有各自的煩惱，而煩惱擔憂的事情也都不一樣。意謂家家有本難念的經。
340	一人看出一家，新婦看出大家。
Tsi̍t lâng khuànn-tshut tsi̍t ke, sin-pū khuànn-tshut ta-ke. 	由一個人的談吐舉止可看出其家庭的教養；由媳婦的行事作風可看出其婆婆的為人。亦即言教、身教對一個人有很大的影響。
341	一人一家代，公媽隨人祀。
Tsi̍t lâng tsi̍t ke tāi, kong-má suî-lâng tshāi. 	每一個人有自家的事，祖先牌位也由各人祭祀。意謂自家管自家的事，祖先牌位也隨自家的方式祭祀。用於勸人管好自己的事就好，不要管別人家的閒事。
342	一粒米，百粒汗。
Tsi̍t lia̍p bí, pah lia̍p kuānn. 	每一粒米都是農夫流下許多汗水，辛苦栽種出來的。指農夫種田辛勞，糧食得來不易，勸人不要任意浪費。
343	一粒田螺煮九碗公湯。
Tsi̍t lia̍p tshân-lê tsú káu uánn-kong thng. 	一隻田螺煮九海碗湯。形容生活貧苦，或比喻沒有真材實料，只是灌水充數。
344	一暝全頭路，天光無半步。
Tsi̍t mê tsuân thâu-lōo, thinn-kng bô-puànn-pōo.  pōo.	整個晚上計畫很多事情，天亮後卻沒有半點方法。形容人光說不練，只會紙上談兵。
345	一年換二十四个頭家。
Tsi̍t nî uānn jī-tsa̍p-sì ê thâu-ke. 	一年換了二十四個雇主。形容人做事沒有定性，無法專心學習，時常換工作，最後一事無成。
346	一遍賊，百世賊。
Tsi̍t piàn tsha̍t, pah sì tsha̍t. 	僅僅偷了一次，就終生遭質疑或被認定就是小偷。引申為做了見不得人的事而殃及後代子孫。
347	一步棋，一步著。
Tsi̍t pōo kî, tsi̍t pōo tio̍h. 	下棋時，每一步都須謹慎小心，步步為營，才能贏得勝利。意謂做事情要有計畫，深思熟慮，按部就班，才不會出錯，這樣離成功就不遠了。
348	一斗較贏九石。
Tsi̍t táu khah iânn káu tsio̍h. 	一斗的量雖比九石的量少，但品質高，勝過大量的劣質品。喻重質不重量。
349	一丈差九尺。
Tsi̍t tn̄g tsha káu tshioh.	一丈還差了九尺長。即一丈與一尺還差了九尺。形容差得很遠或指完全相反。
350	一千賒毋值八百現。
Tsi̍t-tshing sia m̄-ta̍t peh-pah hiān. 	一千元的賒帳不如八百元的現金。意即與其讓人賒帳，不如賣得便宜一點直接取得現金來得實際。
351	一喙掛雙舌。
Tsi̍t tshuì kuà siang tsi̍h. 	一張嘴長兩個舌頭。比喻人口齒伶俐且多話；也指人信口開河，言而無信。
352	一隻牛剝雙領皮。
Tsi̍t tsiah gû pak siang niá phuê. 	一頭牛剝兩張皮，比喻雙重剝削。一頭牛只有一張皮，剝兩張皮，表示剝削嚴重，已經超過能力可以負擔的程度。通常指沉重的賦稅或金錢的需索太重，讓人無法負擔。
353	一隻蝨母嗙甲水牛大。
Tsi̍t tsiah sat-bó pòng kah tsuí-gû tuā. 	一隻小蝨子誇大成大水牛。意指小小的東西或事情，誇大其辭，說得天花亂墜。比喻言過其實。
354	上轎才欲放尿。
Tsiūnn kiō tsiah beh pàng-jiō. 	新娘上花轎前才說要去小便，耽誤了時辰。比喻做事未能預先準備，事到臨頭才趕緊設法處理。
355	上山看山勢，入門看人意。
Tsiūnn-suann khuànn suann-sì, ji̍p-mn̂g khuànn lâng ì. 	上山要觀察山勢，進門要觀察主人心意。指做人要隨時注意環境的變化，懂得察顏觀色，行事才能合宜。
356	上踏枋，上眠床，無洗跤睏中央。
Tsiūnn ta̍h-pang, tsiūnn bîn-tshn̂g, bô sé kha khùn tiong-ng. 	踩上床前的踏板，接著上了床，不但沒洗腳還睡在床中央。比喻得寸進尺，欺人太甚。
357	做牛著拖，做人著磨。
Tsò gû tio̍h thua, tsò lâng tio̍h buâ. 	當牛就要拖犁，當人就要承受磨難。比喻人生本來就要歷經許多勞苦與磨難，就像牛得要辛苦犁田、拖車一樣。
358	做戲的欲煞，看戲的毋煞。
Tsò-hì--ê beh suah, khuànn-hì--ê m̄ suah. 	演戲的想收場休息了，台下的觀眾卻意猶未盡、不願離席，希望戲班繼續演下去。比喻當事人都要收手和解了，但旁觀者或看熱鬧的卻不願收場。
359	做公親，貼本。
Tsò kong-tshin, thiap pún. 	為別人做仲裁，還賠上自己的老本。比喻賠了夫人又折兵。
360	做官若清廉，食飯著攪鹽。
Tsò-kuann nā tshing-liâm, tsia̍h-pn̄g tio̍h kiáu iâm. 	當官若清廉，吃飯得拌鹽。意為當官如果只靠基本官俸而不貪污，生活就會過得清苦，連吃飯都只能加點鹽巴下飯。表示清官無法過富裕奢華的生活；又指清官難為或指無官不貪。
361	做官騙厝內，做生理騙熟似。
Tsò-kuann phiàn tshù-lāi, tsò-sing-lí phiàn si̍k-sāi. 	當官的矇騙家人，做生意的欺騙熟人。意謂為官無不詐，經商無不奸。
362	做著歹田望下冬，娶著歹某一世人。
Tsò-tio̍h pháinn tshân bāng ē tang, tshuā-tio̍h pháinn bóo tsi̍t-sì-lâng. 	種到收成不佳的田，可以期待下一個採收季；娶到惡妻可要受苦一輩子。勸人婚姻大事非兒戲，擇偶要非常謹慎。
363	船過水無痕。
Tsûn kuè tsuí bô hûn. 	意為船駛過不久，漣漪回歸平靜，一點痕跡也沒有。用來指人忘恩負義；也指事情發生過後，沒留下一點痕跡。
364	大紅花毋知䆀，圓仔花䆀毋知。
Tuā-âng-hue m̄ tsai bái, înn-á-hue bái m̄ tsai. 	朱槿不知自己醜，千日紅醜不自知。嘲諷人沒有察覺自己醜陋，還四處炫耀。 比喻不知藏拙或不知羞恥。
365	大目新娘無看見灶。
Tuā-ba̍k sin-niû bô khuànn-kìnn tsàu. 	大眼睛的新娘沒看到灶。通常用於揶揄人眼睛雖大，但卻看不到顯而易見的物品。
366	大狗盤牆，細狗看樣。
Tuā káu puânn tshiûnn, sè káu khuànn-iūnn. 	大狗翻牆，小狗學樣。形容父母、長輩的所作所為，皆為子女、晚輩的學習對象，小孩會模仿大人做壞事。多用於負面意涵，強調身教的重要。
367	大格雞慢啼。
Tuā-keh ke bān thî. 	大骨架的公雞比較慢啼叫。「格」指體格、骨架，骨架較大的公雞需要較長的時間成長，所以開始啼叫的時間也比較遲。比喻大器晚成。當人表現不盡人意，或一時不得志，尤其是小孩表現欠佳之時，常用此話鼓勵。
368	大人愛趁錢，囡仔愛過年。
Tuā-lâng ài thàn-tsînn, gín-á ài kuè-nî.	大人喜歡賺錢，小孩喜歡過年。於昔日農業社會，家家戶戶普遍貧窮，父母為了生活所需，只要有錢賺，就不遺餘力去做；反而是小孩子最喜歡過年，有壓歲錢可花、有新衣可穿、有糖果可吃，整日樂不可支。比喻大人、小孩各有所好。
369	大人儉一喙，囡仔食甲飫。
Tuā-lâng khiām tsi̍t tshuì, gín-á tsia̍h kah uì. 	大人省一口，小孩吃到膩。意即大人少吃一口食物，就能讓食量較小的小孩子吃得飽，甚至吃到膩了。這是老人家疼愛小孩子的用語。
370	大人生日食肉，囡仔生日食拍。
Tuā-lâng senn-ji̍t tsia̍h bah, gín-á senn-ji̍t tsia̍h phah. 	大人生日吃肉，小孩生日挨打。孩子的生日是母親的受難日，打孩子是提醒他母親受的苦難。小孩生日時常會藉機要求一些東西，大人就用這句押韻的話，戲謔地告訴孩子不能要求太多。
371	大細目，懸低耳。
Tuā-sè-ba̍k, kuân-kē-hīnn. 	大小眼，高低耳。眼睛一大一小為偏心的比喻，耳朵一高一低為偏聽的比喻。用來形容人處事不公正。
372	大鼎未滾，細鼎沖沖滾。
Tuā tiánn buē kún, sè tiánn tshiâng-tshiâng-kún. 	大鍋裡的湯還沒滾，小鍋裡的湯就滾得要掀開鍋蓋了。也就是滿瓶水不響，半瓶水響叮噹，形容有才學的人話少，一知半解的人說個不停。
373	大腸告小腸。
Tuā-tn̂g kò sió-tn̂g. 	大腸裡沒有東西，控告小腸沒有把食物送過來。形容飢腸轆轆，肚子非常餓。
374	大舌閣興喋。
Tuā-tsi̍h koh hìng thi̍h. 	口吃又愛說話。「喋」本指人說話結結巴巴，「興喋」在這裡指喜歡說話或插嘴。通常不指稱真正口吃的人，而是用來形容人話說不清楚，偏偏又很愛表示意見。
375	大碗閣滿墘。
Tuā uánn koh buán kînn. 	盛得已經滿到碗的上緣來了。比喻東西量多質好，物超所值。 有時引申為人心不足，貪得無厭，要得很多。
376	有樣看樣，無樣家己想。
Ū iūnn khuànn iūnn, bô iūnn ka-kī siūnn. 	有樣學樣，沒樣自己想。意為有榜樣可學就依樣畫葫蘆，否則就自己想辦法；或指除了模仿他人，也應自行創作。
377	有囝有囝命，無囝天註定。
Ū kiánn ū kiánn miā, bô kiánn thinn tsù-tiānn. 	有孩子是命運的安排，沒孩子是天註定的。用來安慰膝下無子的人不要過於強求。
378	有量就有福。
Ū-liōng tō ū hok. 	有度量就有福氣。指有度量的人自然會受到上天眷顧，得到賜福。
379	有燒香有保庇，有食藥有行氣。
Ū sio-hiunn ū pó-pì, ū tsia̍h io̍h ū kiânn-khì. 	燒香拜佛就會得到神佛保佑，吃藥就會有療效。比喻只要努力或是付出，就會有所收穫或是助益。亦即一分耕耘，一分收穫。
380	有唐山公，無唐山媽。
Ū Tn̂g-suann kong, bô Tn̂g-suann má. 	有來自唐山的父系祖先，沒有來自唐山的母系祖先。清初在渡臺禁令下，來臺開墾者多為單身的男性，往往與當時母系社會的平埔族女性通婚，而產生此現象。
381	有喙講甲無瀾。
Ū tshuì kóng kah bô nuā. 	嘴巴說得口水都乾了。比喻費盡唇舌，還是沒辦法說服別人。
382	有食閣有掠。
Ū tsia̍h koh ū lia̍h. 	有得吃還有得拿。比喻一件好事還另有其他附加價值。
383	有狀元學生，無狀元先生。
Ū tsiōng-guân ha̍k-sing, bô tsiōng-guân sian-sinn. 	有狀元學生，沒有狀元老師。學生學成，可能考上狀元，卻沒有狀元回頭來當老師。比喻學生常比老師傑出。
384	有一好，無兩好。
Ū tsi̍t hó, bô nn̄g hó. 	世界上的事情有利必有弊，很難兩全其美，意即魚與熊掌不可兼得。
385	畫虎畫皮難畫骨，知人知面不知心。
Uā hóo uā phî lân uā kut, ti jîn ti biān put ti sim. 	人只能畫出老虎外表的皮相，卻無法畫出老虎內在的骨相，光憑外表，無法真實了解人內心的想法。比喻人心難測。
386	歪喙雞食好米。
Uai-tshuì ke tsia̍h hó bí. 	歪嘴雞吃好米。「歪喙雞」比喻不健全、不健康的人或物，好米指完好無缺的米粒。比喻人有不符自己身份或能力的過度慾望；也指人條件不好，卻又愛挑剔。
387	冤家變親家。
Uan-ke piàn tshin-ke. 	由仇人變成姻親。 原本互不相容的人，爭吵到後來反而發現對方的優點而成為好友。
388	怨生無怨死。
Uàn senn bô uàn sí. 	人死了，一了百了，前債恩怨都應一筆勾銷。勸人解除對往生之人的懷恨。

    // 預設設定值
    const DEFAULT_BASE_URL = 'https://generativelanguage.googleapis.com/v1beta';
    const DEFAULT_MODEL = 'gemini-2.5-flash';

    // 頁面載入時初始化設定
    window.onload = function() {
        loadSettingsToUI();
        
        // 綁定 Enter 鍵觸發搜尋
        const keywordInput = document.getElementById('keyword');
        keywordInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                generateContent();
            }
        });
    };

    // --- 設定區塊邏輯 ---
    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
        } else {
            loadSettingsToUI();
            panel.style.display = 'block';
        }
    }

    function loadSettingsToUI() {
        document.getElementById('apiKey').value = localStorage.getItem('taigi_apiKey') || '';
        document.getElementById('baseUrl').value = localStorage.getItem('taigi_baseUrl') || DEFAULT_BASE_URL;
        document.getElementById('modelSelect').value = localStorage.getItem('taigi_model') || DEFAULT_MODEL;
    }

    function saveSettings() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const baseUrl = document.getElementById('baseUrl').value.trim() || DEFAULT_BASE_URL;
        const model = document.getElementById('modelSelect').value;
        const statusDiv = document.getElementById('settingsStatus');

        localStorage.setItem('taigi_apiKey', apiKey);
        localStorage.setItem('taigi_baseUrl', baseUrl);
        localStorage.setItem('taigi_model', model);

        if (!apiKey) {
            statusDiv.textContent = '⚠️ 提醒：API Key 尚未輸入！需輸入才能進行查詢。';
            statusDiv.style.color = '#e74c3c';
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
                toggleSettings(); // 延遲收合
            }, 2500);
        } else {
            statusDiv.textContent = '✅ 設定已儲存！';
            statusDiv.style.color = '#27ae60';
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
                toggleSettings(); // 儲存後收合面板
            }, 1000);
        }
    }

    function clearSettings() {
        document.getElementById('apiKey').value = '';
        document.getElementById('baseUrl').value = DEFAULT_BASE_URL;
        document.getElementById('modelSelect').value = DEFAULT_MODEL;
        
        localStorage.removeItem('taigi_apiKey');
        localStorage.removeItem('taigi_baseUrl');
        localStorage.removeItem('taigi_model');

        const statusDiv = document.getElementById('settingsStatus');
        statusDiv.textContent = '🗑️ API Key 與設定已清除！';
        statusDiv.style.color = '#e74c3c';
        statusDiv.style.display = 'block';
        
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 2000);
    }

    // --- 複製結果邏輯 ---
    function copyResult() {
        const resultText = document.getElementById('result').innerText;
        if (!resultText) return;

        navigator.clipboard.writeText(resultText).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = '✅ 已複製！';
            copyBtn.style.backgroundColor = '#1abc9c';
            copyBtn.style.color = 'white';
            
            setTimeout(() => {
                copyBtn.innerHTML = originalText;
                copyBtn.style.backgroundColor = '#ffffff';
                copyBtn.style.color = '#1abc9c';
            }, 2000);
        }).catch(err => {
            // 如果無法使用 clipboard API，直接顯示在結果區塊的錯誤訊息中
            alert('複製失敗，請嘗試手動複製。');
        });
    }

        if (documentText.trim().length < 50) {
            resultDiv.innerHTML = '<span class="error-msg">⚠️ 資料庫似乎是空的！請用文字編輯器打開 HTML 檔案，將台語資料庫貼入指定的原始碼常數位置。</span>';
            resultWrapper.style.display = 'block';
            return;
        }

        // 正式開始載入
        loadingDiv.style.display = 'block';
        submitBtn.disabled = true;

        // 系統提示詞設計 (Prompt) 包含強制補充說明格式
        const promptText = `
你是一個專業的台語學者。請根據以下提供的台語詞彙文本檔案內容，篩選出 5 個與華語概念「${keyword}」相關的台語詞，並造句。

嚴格條件：
1. 必須使用「台語正字」書寫。
2. 篩選出的詞彙，其華語解說必須與「${keyword}」有相關聯（可以稍微延伸或比喻）。
3. 針對列出的 5 個詞，請逐一提供：
   - 詞彙詳細解說，以及適合使用的「情境」。
   - 使用該台語詞造句（並附華文翻譯）。
   - 明確標示引用該詞彙在檔案內面的「佗一个頁（PAGE）」（請查看資料內的 --- PAGE X --- 標記）。

4. 最後，請務必加上一段「補充說明」對這 5 個詞進行綜合分析比較。請嚴格模仿以下範例的結構與寫作風格來撰寫：

[補充說明範例格式開始]
補充說明：
遮5个詞攏體現「${keyword}」的核心概念：
1. (針對此概念的特質分析，列出各詞特點，如：外表佮內在的落差。空殼：外表有形體，內底是空的 / 料小：看起來有...)
2. 使用對象：(分類列出，如：物品：料小、空殼... / 人：膨風...等)
3. 程度或特徵排列：(按輕重或其他邏輯排列，如：按輕到重排列：白汫無味 < 料小 < 兩光 < 空殼 < 膨風)
4. 實際應用例句補充：
(為這5個詞各自再造一個生活化的例句，並附華語翻譯，例如：料小：彼个老闆看起來誠有錢... / 空殼：這間百貨...)
總結：(總結這幾個詞在台語表達上的豐富層次，例如：每一個詞攏有伊適合使用的情境佮對象，這就是台語詞彙豐富的所在。)
[補充說明範例格式結束]

檔案內容如下：
${documentText}
        `;

        // 組合 API 網址
        const cleanBaseUrl = baseUrl.replace(/\/$/, "");
        const apiUrl = `${cleanBaseUrl}/models/${model}:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: promptText }]
                    }]
                })
            });

            // 處理 API 回傳錯誤
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'API 請求失敗，請確認 API 設定。');
            }

            // 取得生成結果
            const data = await response.json();
            let generatedText = data.candidates[0].content.parts[0].text;
            
            // 簡易 Markdown 解析 (粗體與換行)
            generatedText = generatedText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            generatedText = generatedText.replace(/\*(.*?)\*/g, '<em>$1</em>');
            generatedText = generatedText.replace(/\n/g, '<br>');
            
            resultDiv.innerHTML = generatedText;
            resultWrapper.style.display = 'block';

        } catch (error) {
            resultDiv.innerHTML = `<span class="error-msg">發生錯誤：${error.message}<br><br>👉 解決建議：<br>1. 點擊上方「⚙️ API 系統設定」，確認 API Key 是否正確。<br>2. 嘗試切換其他 AI 模型。<br>3. 確認 API Base URL 格式是否正確。</span>`;
            resultWrapper.style.display = 'block';
        } finally {
            // 恢復 UI 狀態
            loadingDiv.style.display = 'none';
            submitBtn.disabled = false;
        }
    }
</script>

</html>
