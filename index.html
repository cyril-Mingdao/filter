【資料庫6：教育部新增俗諺 202604】
序號	俗諺	羅馬拼音	華語釋義

1.	目睭看佇雙糕潤。
　　Ba̍k-tsiu khuànn tī siang-ko-jūn.	雙眼盯著雙糕潤看。雙糕潤是祭神的供品，在祭拜神明時，雙眼卻直直盯著供品，表示心不虔誠，另有所圖。引申人在做某件事時另有企圖。
2.	目睭生佇頭殼頂。
　　Ba̍k-tsiu senn tī thâu-khak-tíng.	眼睛長在頭頂上。形容人驕傲自大，瞧不起比自己地位低下的人。
3.	目睭大細蕊。
　　Ba̍k-tsiu tuā-sè luí.	眼睛一大一小。形容人勢利眼，處事不公。
4.	無米兼閏月。
　　Bô bí kiam jūn-gue̍h.	家裡米糧已吃完，又逢閏月，要撐十二個月已經很拮据了，現在得撐十三個月，那更是辛苦了。形容不如意的事情接連發生。
5.	未想贏，著先想輸。
　　Buē siūnn iânn, tio̍h sing siūnn su.	想到贏的種種美好之前，要先考慮輸的後果及應該如何處理。指凡事要做最壞的打算，並有所準備。
6.	夯石頭硩心肝。
　　Giâ tsio̍h-thâu teh sim-kuann.	搬石頭壓在心上。比喻對某種想望或執念死心。
7.	囡仔會走，大人逐甲嘛嘛吼。
　　Gín-á ē tsáu, tuā-lâng jiok kah mà-mà-háu.	小孩會跑，大人追得哇哇叫。初為父母者，皆期待孩子早日學會走路；當小孩學會走路後，大人反而更辛苦，得天天緊隨在後，常追得氣喘噓噓，就因深恐其發生危險。形容父母育兒的艱辛。
8.	囡仔三歲牢皮，五歲牢骨。
　　Gín-á sann huè tiâu phuê, gōo huè tiâu kut.	孩子三歲時的習性尚未根深柢固，仍有改變的可能，但若放任不管，到五歲時所習得的行為習慣便已定型，難以改變。指少成若天性，習慣成自然。
9.	囡仔人跳過溝，食三甌。
　　Gín-á-lâng thiàu-kuè kau, tsia̍h sann au.	小孩跳過水溝，就能吃下三碗飯。指小孩子活力十足，新陳代謝好，餓得也快。
10.	囡仔人，大人心肝。
　　Gín-á-lâng, tuā-lâng sim-kuann.	小孩子，大人的心胸。指年紀雖小，但志氣高遠。
11.	牛毋通𠢕行，人毋通出名。
　　Gû m̄-thang gâu kiânn, lâng m̄-thang tshut-miâ.	牛的腳力好，善於行走，便須常常出去工作；人一旦出名，便會引來諸多困擾。比喻樹大招風，勸人不要出風頭。
12.	牛鼻毋拎，拎牛尾。
　　Gû phīnn m̄ lîng, lîng gû bué.	牽牛時不去拉牛鼻上控制牛的圈環，反而去拉牛尾。形容做事不得要領。
13.	牛屎龜牚石枋。
　　Gû-sái-ku thènn tsio̍h-pang.	小小的糞金龜，也妄想撐起大石板。形容人不自量力。
14.	喝水會堅凍。
　　Huah tsuí ē kian-tàng.	吆喝一聲，水就凝結成冰。比喻一個人的權勢極具影響力，得以掌控大局。
15.	火過矣，才咧炰芋。
　　Hué kuè--ah, tsiah teh pû ōo.	火快熄滅了，才要烤芋頭。指人錯失良機，為時已晚。
16.	火燒跤，隨人掰。
　　Hué sio kha, suî-lâng pué.	火燒到腳，各自撥掉火。意即大難臨頭時，人人自顧不暇。
17.	火燒跤後蹬。
　　Hué sio kha-āu-tenn.	火燒到腳後跟。比喻事態急迫，火燒屁股。
18.	火車過了，才歕觱仔。
　　Hué-tshia kuè-liáu, tsiah pûn pi-á.	火車過了，才吹哨示警。比喻事情過了，才做些於事無補的措施。
19.	教囝學泅，毋通教囝樹。
　　Kà kiánn o̍h siû, m̄-thang kà kiánn peh tshiū.	教孩子學游泳，不要教孩子爬樹。小孩學會游泳，懂得水性，以後遇到有水的環境或水災才不會害怕，還能救人救己；倒是爬樹其實是危險的，有些樹的質地很容易斷，一失神從樹上掉下來，容易受傷，摔殘、摔死的很多。比喻大人教導小孩時，要教實用的技能，同時要避免危險的行為。
20.	江湖一點訣，講破毋值三仙錢。
　　Kang-ôo tsi̍t tiám kuat, kóng-phuà m̄-ta̍t sann sián tsînn.	江湖祕訣全憑那一點技巧，說白了便不值錢。引申某些事在不懂的人眼裡覺得很困難，一旦將其要領說穿，其實也就只是一點點小訣竅而已。
21.	巧的食戇，戇的食天公。
　　Khiáu--ê tsia̍h gōng, gōng--ê tsia̍h Thinn-kong.	慧黠者常會占憨直者的便宜，而憨厚的人往往仰賴上天的眷顧。比喻傻人有傻福。
22.	乞食望普渡，做兵望落雨。
　　Khit-tsia̍h bāng phóo-tōo, tsò-ping bāng lo̍h-hōo.	乞丐渴望在中元普渡時，能夠大快朵頤飽餐一頓；當兵的人希望下雨能在室內休息，免得在烈日下辛苦操練。各行各業各有所求。
23.	囥酒會芳，囥柑仔爛規籠。
　　Khǹg tsiú ē phang, khǹg kam-á nuā kui láng.	酒越陳越香，橘子放久則會全部爛光。比喻有些人是可以終身交往的，有些卻是可一而不可再的。或指擇物須熟知物性，用人須知性善任。
24.	看田面，毋通看人面。
　　Khuànn tshân-bīn, m̄-thang khuànn lâng-bīn.	自己努力耕種較為可靠，不可一直冀望他人。比喻人應自食其力、自力更生，不倚靠他人。
25.	筊精，生理虎。
　　Kiáu tsinn, sing-lí-hóo.	通常會賭博的人都非常精明；而會做生意的人，為了賺取利潤，貪得無厭，好似凶狠的老虎一般。
26.	功德做佇草仔埔。
　　Kong-tik tsò tī tsháu-á-poo.	在荒煙漫草中為先人做法事祈求功德，對已逝的先人毫無實際助益。比喻徒勞無功，白費力氣。
27.	內行看布底，外行綴人買。
　　Lāi-hâng khuànn pòo-té, guā-hâng tuè lâng bé.	內行人買布會看布的質料好不好，外行的人只能盲目地跟著人家買。內行人做事情看重點，外行的人只能跟著仿效。
28.	六月賣火熥。
　　La̍k--gue̍h bē hué-thang.	六月賣暖爐。火熥是冬天時用來取暖的火爐，中間內裝陶罐，可放碳火。六月天氣非常熱，賣暖爐根本沒人會買。比喻做事不合時宜。
29.	六月棉被，揀人蓋。
　　La̍k-gue̍h mî-phuē, kíng lâng kah.	六月天的棉被挑人蓋。六月天氣熱，一般人不會蓋棉被，但是也有人要蓋棉被，表示有些事做不做因人而異。
30.	人比人，氣死人。
　　Lâng pí lâng, khì-sí lâng.	人生在世各有境遇，各有得失，不需要凡事都跟別人比較。畢竟一一相比，最終也只是徒增煩惱而心生怨懟。
31.	五虎下西山。
　　Ngóo hóo hā se-san.	五虎下山嶺。形容聲勢浩大，來勢兇猛。
32.	五色人，講十色話。
　　Ngóo sik lâng, kóng tsa̍p sik uē.	指不同成長背景的人有不同的見解，人一多意見就多。
33.	年頭食鹹菜，年尾才轉嗽。
　　Nî-thâu tsia̍h kiâm-tshài, nî-bué tsiah tńg-sàu.	年初吃了鹹菜，到了年底才咳嗽。指事情過了很久，才出現狀況，形容人對事情反應遲鈍。
34.	先顧腹肚，才顧佛祖。
　　Sing kòo pak-tóo, tsiah kòo Pu̍t-tsóo.	先求肚子溫飽，再求能祭奉佛祖。意指人的生存以食為要，先致力民生所需後，再有餘力才顧及精神需求。
35.	算命仔喙糊瘰瘰。
　　Sǹg-miā-á tshuì hôo-luì-luì.	命相為業的人常常為了取信於人，說話會投人所好，所以他說的話不可盡信。
36.	天地無餓死人。
　　Thinn-tē bô gō-sí lâng.	天地之間沒有餓死人的事。意指大自然就如同生養我們的父母，養育著我們，只要願意努力，就有辦法生存下去。比喻天無絕人之路。
37.	出去若拍毋見，轉來若抾著。
　　Tshut--khì ná phah-m̄-kìnn, tńg--lâi ná khioh--tio̍h.	出外就斷了音訊，宛如走失一般；回來就好像撿到的一樣。比喻人對家庭欠缺責任感，我行我素。通常用於父母對兒女的叨唸。
38.	出門看天色，入門看目色。
　　Tshut-mn̂g khuànn thinn-sik, ji̍p-mn̂g khuànn ba̍k-sik.	出門要看天氣，進門要看主人的臉色表情。喻處世當察言觀色，方不致於吃眼前虧。
39.	食偌濟，做偌濟，註好好。
　　Tsia̍h guā-tsē, tsò guā-tsē, tsù-hó-hó.	吃多少，做多少，是註定好的。人的歲數，人的成就，都是老天註定好的。亦即生死有命，富貴在天。
40.	水鬼騙城隍。
　　Tsuí-kuí phiàn Sîng-hông.	水鬼欺騙城隍爺。城隍就是城隍爺，傳說中是由水鬼升格，成為守護地方的神明，城隍的手下，有許多水鬼供差使。意指下司意欲欺瞞上司，當然成功機會不大。通常用以責備人小鬼大，想欺騙長者的人。

◆◆◆ 分類：經濟法律稅務 ◆◆◆
1.	[第21輯 總體經濟與市場模型／問答題] 形容貨幣流通速度極快，追趕通膨極為困難？
　　解答／說明：錢四跤，人兩跤。 (錢有四隻腳，人只有兩隻腳)（來源：21-30.docx）
2.	[第21輯 總體經濟與市場模型／問答題] 描述市場價格機能（Price Mechanism）失衡，穀物價格對生產者與消費者的雙面刃？
　　解答／說明：穀貴傷民，穀賤傷農。（來源：21-30.docx）
3.	[第21輯 總體經濟與市場模型／問答題] 對應總體經濟中「預防性儲蓄動機」，強調景氣好時需為蕭條做準備？
　　解答／說明：好天著存雨來糧。（來源：21-30.docx）
4.	[第21輯 總體經濟與市場模型／問答題] 形容資產流動性危機，只能靠借新還舊來勉強維持運作？
　　解答／說明：拆東牆，補西牆。（來源：21-30.docx）
5.	[第21輯 總體經濟與市場模型／問答題] 描述財富累積（儲蓄）極其緩慢，但消費與折舊卻極為迅速？
　　解答／說明：趁錢若起塗跤，開錢若水沖沙。（來源：21-30.docx）
6.	[第21輯 總體經濟與市場模型／問答題] 形容市場出現「劣幣驅逐良幣」或小人得志的混亂狀態？
　　解答／說明：鐘鼓無彈，陳（響）草螟。（來源：21-30.docx）
7.	[第21輯 總體經濟與市場模型／問答題] 比喻投資市場的外部性風險，無端受到大環境波動波及？
　　解答／說明：城門失火，殃及池魚。（來源：21-30.docx）
8.	[第21輯 總體經濟與市場模型／問答題] 描述因資本過度集中，導致底層勞動者連生存資源都被剝奪？
　　解答／說明：大魚食小魚，小魚食蝦米，蝦米食塗（泥巴）。（來源：21-30.docx）
9.	[第21輯 總體經濟與市場模型／問答題] 形容市場需求萎縮時，商品再便宜也無人問津？
　　解答／說明：糴米無錢，糶米無價。（來源：21-30.docx）
10.	[第21輯 總體經濟與市場模型／問答題] 對應經濟學中的「邊際效益遞減」，警告過度擴張將導致崩盤？
　　解答／說明：食濟弄破腹肚。（來源：21-30.docx）
11.	[第22輯 民法物權與契約精神／問答題] 對應民法中「買賣不破租賃」精神，保障承租人居住權益的俗語？
　　解答／說明：買賣無破稅厝。（來源：21-30.docx）
12.	[第22輯 民法物權與契約精神／問答題] 強調兄弟分家後，產權與祭祀責任各自獨立、互不干涉？
　　解答／說明：一人一家代，公媽隨人祀。（來源：21-30.docx）
13.	[第22輯 民法物權與契約精神／問答題] 形容債權人與債務人地位不對等，催討欠款極為困難？
　　解答／說明：借錢滑溜溜，討錢面憂憂。（來源：21-30.docx）
14.	[第22輯 民法物權與契約精神／問答題] 警告擔任「連帶保證人」將面臨傾家蕩產的極大風險？
　　解答／說明：做保，家己倒。（來源：21-30.docx）
15.	[第22輯 民法物權與契約精神／問答題] 描述侵犯他人不動產與居住權、態度極度囂張的行為？
　　解答／說明：侵門踏戶。（來源：21-30.docx）
16.	[第22輯 民法物權與契約精神／問答題] 說明商業合約精神：交易時錙銖必較，私下交情另外計算？
　　解答／說明：買賣算分金，相請無論心。（來源：21-30.docx）
17.	[第22輯 民法物權與契約精神／問答題] 對應民事損害賠償中的「回復原狀」或等價賠償原則？
　　解答／說明：扑破人家的碗，著賠人家的碟。（來源：21-30.docx）
18.	[第22輯 民法物權與契約精神／問答題] 形容無權占有他人資產，喧賓奪主的行為？
　　解答／說明：乞食趕廟公。（來源：21-30.docx）
19.	[第22輯 民法物權與契約精神／問答題] 對應「共有財產」往往因責任分散而無人管理的悲劇？
　　解答／說明：公家物，無人顧。（來源：21-30.docx）
20.	[第22輯 民法物權與契約精神／問答題] 說明契約條款需白紙黑字，口頭承諾無法作為法理依據？
　　解答／說明：空口無憑，立字為證。（來源：21-30.docx）
21.	[第23輯 稅務、成本會計與審計查核／問答題] 形容成本會計管控極度嚴格，隨時都在精打細算？
　　解答／說明：算盤帶佇頷頸（算盤掛在脖子上）。（來源：21-30.docx）
22.	[第23輯 稅務、成本會計與審計查核／問答題] 強調實地查核（Physical Observation）的重要性，不能只看帳面？
　　解答／說明：買豬先看椆（豬圈）。（來源：21-30.docx）
23.	[第23輯 稅務、成本會計與審計查核／問答題] 警告逃漏稅或違反查核規範，最終將付出不成比例的鉅額罰鍰？
　　解答／說明：偷挽蔥，賠割韭。（來源：21-30.docx）
24.	[第23輯 稅務、成本會計與審計查核／問答題] 說明審計精神：任何掩飾與假帳，在嚴密查核下必定會露出破綻？
　　解答／說明：雞卵密密也有縫。（來源：21-30.docx）
25.	[第23輯 稅務、成本會計與審計查核／問答題] 形容財務報表上數字虛增（灌水），清算時卻毫無實質價值？
　　解答／說明：膨風水雞刣無肉。（來源：21-30.docx）
26.	[第23輯 稅務、成本會計與審計查核／問答題] 描述內部控制失效，遭到親信或員工掏空公司資產？
　　解答／說明：飼老鼠咬布袋。（來源：21-30.docx）
27.	[第23輯 稅務、成本會計與審計查核／問答題] 說明對於勞動收入與資本利得的課稅差異，強調實體勞動的長久性？
　　解答／說明：生理錢三十年，流汗錢萬萬年。（來源：21-30.docx）
28.	[第23輯 稅務、成本會計與審計查核／問答題] 形容帳務混亂，對帳時發生嚴重落差的窘境？
　　解答／說明：九算十不合。（來源：21-30.docx）
29.	[第23輯 稅務、成本會計與審計查核／問答題] 形容查帳時顧此失彼，抓小放大，漏掉重大舞弊？
　　解答／說明：掠龜走鱉。（來源：21-30.docx）
30.	[第23輯 稅務、成本會計與審計查核／問答題] 形容企業組織龐大，但現金流嚴重短缺的虛胖狀態？
　　解答／說明：闊喙無瀾（嘴巴大卻沒口水）。（來源：21-30.docx）

◆◆◆ 分類：數字動物與生活雜學 ◆◆◆
31.	[第26輯 邏輯標準化與執行力／問答題] 形容做事有條理、完全依照標準作業流程（SOP）執行的俗語？
　　解答／說明：照起工（或：照步來）。（來源：21-30.docx）
32.	[第26輯 邏輯標準化與執行力／問答題] 描述利用工具並依照既定框架與步驟，系統化完成任務？
　　解答／說明：鉸刀、尺、布，家己照步來。（來源：21-30.docx）
33.	[第26輯 邏輯標準化與執行力／問答題] 形容組織管理中層層節制、模組化分工明確的架構？
　　解答／說明：頂司管下司，鋤頭管畚箕。（來源：21-30.docx）
34.	[第26輯 邏輯標準化與執行力／問答題] 比喻不貪快，每執行一個步驟都確實留下紀錄與進度？
　　解答／說明：一步一跤印。（來源：21-30.docx）
35.	[第26輯 邏輯標準化與執行力／問答題] 形容遇到突發狀況時，仍依照既定的邏輯與演算法（算盤）進行處理？
　　解答／說明：照算盤打。（來源：21-30.docx）
36.	[第26輯 邏輯標準化與執行力／問答題] 警告若基礎設定（源頭）錯誤，後續產出的結果必定全部歪斜？
　　解答／說明：上樑不正下樑歪。（來源：21-30.docx）

𓆜𓆝𓆞𓆟𓆞𓆜𓆝𓆞𓆟𓆝𓆞𓆜𓆝𓆟𓆜𓆝𓆞𓆟

    `;
    // =========================================================================
    // ↑↑↑ 資料庫黏貼區域結束 ↑↑↑
    // =========================================================================

    // 預設設定值
    const DEFAULT_BASE_URL = 'https://generativelanguage.googleapis.com/v1beta';
    const DEFAULT_MODEL = 'gemini-3-flash';
    // 自動搜尋可用模型時的優先順序
    const MODEL_PRIORITY = ['gemini-3-flash', 'gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash', 'gemini-1.5-pro'];

    // 查詢帳號目前可用的模型。優先使用「使用者手動選擇」的模型（若該帳號支援）；
    // 若使用者選的模型不可用，才依 MODEL_PRIORITY 順序挑一個可用的頂替。
    async function findBestAvailableModel(cleanBaseUrl, apiKey, preferredModel) {
        const response = await fetch(`${cleanBaseUrl}/models?key=${apiKey}`);
        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error?.message || '無法取得可用模型清單。');
        }
        const data = await response.json();
        const availableNames = (data.models || [])
            .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
            .map(m => (m.name || '').replace(/^models\//, ''));

        if (preferredModel && availableNames.includes(preferredModel)) return preferredModel;

        for (const preferred of MODEL_PRIORITY) {
            if (availableNames.includes(preferred)) return preferred;
        }
        if (availableNames.length > 0) return availableNames[0];
        throw new Error('此 API Key 目前沒有任何可用的模型。');
    }

    // 頁面載入時初始化設定
    window.onload = function() {
        loadSettingsToUI();
        
        // 綁定 Enter 鍵觸發搜尋
        const keywordInput = document.getElementById('keyword');
        keywordInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                generateContent();
            }
        });
    };

    // --- 設定區塊邏輯 ---
    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
        } else {
            loadSettingsToUI();
            panel.style.display = 'block';
        }
    }

    function loadSettingsToUI() {
        document.getElementById('apiKey').value = localStorage.getItem('taigi_apiKey') || '';
        document.getElementById('baseUrl').value = localStorage.getItem('taigi_baseUrl') || DEFAULT_BASE_URL;
        document.getElementById('modelSelect').value = localStorage.getItem('taigi_model') || DEFAULT_MODEL;
    }

    function saveSettings() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const baseUrl = document.getElementById('baseUrl').value.trim() || DEFAULT_BASE_URL;
        const model = document.getElementById('modelSelect').value;
        const statusDiv = document.getElementById('settingsStatus');

        localStorage.setItem('taigi_apiKey', apiKey);
        localStorage.setItem('taigi_baseUrl', baseUrl);
        localStorage.setItem('taigi_model', model);

        if (!apiKey) {
            statusDiv.textContent = '⚠️ 提醒：API Key 尚未輸入！需輸入才能進行查詢。';
            statusDiv.style.color = '#e74c3c';
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
                toggleSettings(); // 延遲收合
            }, 2500);
        } else {
            statusDiv.textContent = '✅ 設定已儲存！';
            statusDiv.style.color = '#27ae60';
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
                toggleSettings(); // 儲存後收合面板
            }, 1000);
        }
    }

    function clearSettings() {
        document.getElementById('apiKey').value = '';
        document.getElementById('baseUrl').value = DEFAULT_BASE_URL;
        document.getElementById('modelSelect').value = DEFAULT_MODEL;
        
        localStorage.removeItem('taigi_apiKey');
        localStorage.removeItem('taigi_baseUrl');
        localStorage.removeItem('taigi_model');

        const statusDiv = document.getElementById('settingsStatus');
        statusDiv.textContent = '🗑️ API Key 與設定已清除！';
        statusDiv.style.color = '#e74c3c';
        statusDiv.style.display = 'block';
        
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 2000);
    }

    // --- 複製結果邏輯 ---
    function copyResult() {
        const resultText = document.getElementById('result').innerText;
        if (!resultText) return;

        navigator.clipboard.writeText(resultText).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = '✅ 已複製！';
            copyBtn.style.backgroundColor = '#1abc9c';
            copyBtn.style.color = 'white';
            
            setTimeout(() => {
                copyBtn.innerHTML = originalText;
                copyBtn.style.backgroundColor = '#ffffff';
                copyBtn.style.color = '#1abc9c';
            }, 2000);
        }).catch(err => {
            // 如果無法使用 clipboard API，直接顯示在結果區塊的錯誤訊息中
            alert('複製失敗，請嘗試手動複製。');
        });
    }

    // --- AI 生成邏輯 ---
    async function generateContent() {
        // 先嘗試從 localStorage 抓取，如果沒有再看目前輸入框是否有值
        let apiKey = localStorage.getItem('taigi_apiKey') || document.getElementById('apiKey').value.trim();
        const baseUrl = localStorage.getItem('taigi_baseUrl') || document.getElementById('baseUrl').value.trim() || DEFAULT_BASE_URL;
        const fallbackModel = localStorage.getItem('taigi_model') || document.getElementById('modelSelect').value || DEFAULT_MODEL;
        const keyword = document.getElementById('keyword').value.trim();
        
        const resultWrapper = document.getElementById('resultWrapper');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');

        // UI 狀態更新預設
        resultWrapper.style.display = 'none';
        resultDiv.innerHTML = '';

        // 檢查防呆 (改為直接在結果區塊顯示，不使用 alert)
        if (!apiKey) {
            resultDiv.innerHTML = '<span class="error-msg">⚠️ 尚未設定 API Key！請點擊上方「⚙️ API 系統設定」輸入您的 Key。</span>';
            resultWrapper.style.display = 'block';
            document.getElementById('settingsPanel').style.display = 'block';
            return;
        }
        if (!keyword) {
            resultDiv.innerHTML = '<span class="error-msg">⚠️ 請輸入情境關鍵詞！</span>';
            resultWrapper.style.display = 'block';
            document.getElementById('keyword').focus();
            return;
        }
        if (documentText.trim().length < 50) {
            resultDiv.innerHTML = '<span class="error-msg">⚠️ 資料庫似乎是空的！請用文字編輯器打開 HTML 檔案，將台語資料庫貼入指定的原始碼常數位置。</span>';
            resultWrapper.style.display = 'block';
            return;
        }

        // 正式開始載入
        loadingDiv.style.display = 'block';
        loadingDiv.textContent = '🔍 正在搜尋可用模型...';
        submitBtn.disabled = true;

        // 組合 API 網址前綴
        const cleanBaseUrl = baseUrl.replace(/\/$/, "");

        // 自動搜尋帳號目前可用的模型，找不到就退回設定選單裡的模型
        let model = fallbackModel;
        try {
            model = await findBestAvailableModel(cleanBaseUrl, apiKey, fallbackModel);
        } catch (e) {
            model = fallbackModel;
        }

        loadingDiv.textContent = '⏳ AI 正在研讀台語資料庫並進行分析，請稍候...';

        // 系統提示詞設計 (Prompt) 包含強制補充說明格式
        const promptText = `
你是一個專業的台語學者。請根據以下提供的台語詞彙文本檔案內容，篩選出 10 個與華語概念「${keyword}」相關的台語詞，並造句。

嚴格條件：
1. 必須使用「台語正字」書寫。
2. 篩選出的詞彙，其華語解說必須與「${keyword}」有相關聯（可以稍微延伸或比喻）。
3. 針對列出的 10 個詞，請逐一提供：
   - 詞彙詳細解說，以及適合使用的「情境」。
   - 使用該台語詞造句（並附華文翻譯）。
   - 明確標示引用該詞彙在檔案內面的「佗一个頁（PAGE）」（請查看資料內的 --- PAGE X --- 標記）。

4. 最後，請務必加上一段「補充說明」對這 10 個詞進行綜合分析比較。請嚴格模仿以下範例的結構與寫作風格來撰寫：

[補充說明範例格式開始]
補充說明：
遮10个詞攏體現「${keyword}」的核心概念：
1. (針對此概念的特質分析，列出各詞特點，如：外表佮內在的落差。空殼：外表有形體，內底是空的 / 料小：看起來有...)
2. 使用對象：(分類列出，如：物品：料小、空殼... / 人：膨風...等)
3. 程度或特徵排列：(按輕重或其他邏輯排列，如：按輕到重排列：白汫無味 < 料小 < 兩光 < 空殼 < 膨風)
4. 實際應用例句補充：
(為這10個詞各自再造一個生活化的例句，並附華語翻譯，例如：料小：彼个老闆看起來誠有錢... / 空殼：這間百貨...)
總結：(總結這幾個詞在台語表達上的豐富層次，例如：每一個詞攏有伊適合使用的情境佮對象，這就是台語詞彙豐富的所在。)
[補充說明範例格式結束]

檔案內容如下：
${documentText}
        `;

        // 組合 API 網址
        const apiUrl = `${cleanBaseUrl}/models/${model}:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: promptText }]
                    }]
                })
            });

            // 處理 API 回傳錯誤
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'API 請求失敗，請確認 API 設定。');
            }

            // 取得生成結果
            const data = await response.json();
            let generatedText = data.candidates[0].content.parts[0].text;
            
            // 簡易 Markdown 解析 (粗體與換行)
            generatedText = generatedText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            generatedText = generatedText.replace(/\*(.*?)\*/g, '<em>$1</em>');
            generatedText = generatedText.replace(/\n/g, '<br>');
            
            resultDiv.innerHTML = generatedText;
            resultWrapper.style.display = 'block';

        } catch (error) {
            resultDiv.innerHTML = `<span class="error-msg">發生錯誤：${error.message}<br><br>👉 解決建議：<br>1. 點擊上方「⚙️ API 系統設定」，確認 API Key 是否正確。<br>2. 嘗試切換其他 AI 模型。<br>3. 確認 API Base URL 格式是否正確。</span>`;
            resultWrapper.style.display = 'block';
        } finally {
            // 恢復 UI 狀態
            loadingDiv.style.display = 'none';
            submitBtn.disabled = false;
        }
    }
</script>
