1.	沃田（ak-tshân）(動詞) 灌溉。
　　例句：最近洘旱，致使無水通沃田。Tsuè-kīn khó-huānn, tì-sú bô tsuí thang ak-tshân. (最近旱災，以致於沒有水可灌溉農田。)
2.	目今（ba̍k-kim）(時間詞) 現在、現今、當今、當世。
　　例句：感冒病毒一直咧進化，目今通佮𪜶對抗的法度，就是食食佮睏眠愛正常，較捷運動咧。Kám-mōo pēnn-to̍k it-ti̍t teh tsìn- huà, ba̍k-kim thang kah in tuì-khòng ê huat-tōo, tō sī tsia̍h-si̍t kah khùn-bîn ài tsìng-siông, khah tsia̍p ūn-tōng--leh. (感冒病毒持續在進化，現今能跟它們對抗的方法，就是飲食和睡眠要正常，常運動。)
3.	目墘（ba̍k-kînn）(名詞) 眼眶。
　　例句：透早洗手面的時，愛會記得提面巾共牢佇目墘的目屎膏拭拭咧。Thàu-tsá sé tshiú-bīn ê sî, ài ē-kì-tit the̍h bīn-kin kā tiâu tī ba̍k-kînn ê ba̍k-sái-ko tshit-tshit--leh. (早晨盥洗的時候，要記得拿毛巾將黏在眼眶的眼屎擦一擦。)
4.	目識（ba̍k-sik）(名詞) 眼力、觀察力。
　　例句：伊的目識真好，物件看過就知好䆀。I ê ba̍k-sik tsin hó, mi̍h-kiānn khuànn--kuè tō tsai hó bái. (他的鑑別力很好，東西看過 就知好壞。)
5.	欲無（beh-bô）(副詞) 否則、要不然。
　　例句：欠我的錢愛緊還我，欲無，我這個月的厝稅就無錢通納矣。Khiàm--guá ê tsînn ài kín hîng--guá, beh-bô, guá tsit kò gue̍h ê tshù-suè tō bô tsînn thang la̍p--ah. (欠我的錢要趕快還給我，否則，我這個月的房租就無法繳了。)
6.	米心（bí-sim）(名詞) 米心。米粒的中心。
　　例句：水摻傷少，米心煮無透，恐驚食了會歹消化。Tsuí tsham siunn tsió, bí-sim tsú bô thàu, khióng-kiann tsia̍h-liáu ē pháinn siau-huà. (水加太少，米心沒煮熟，吃了恐怕不好消化。)
7.	面慄色（bīn-lik-sik）(動詞) 形容受到驚嚇而變了臉色，因恐懼而臉色大變。
　　例句：雄雄有一陣猴山仔對樹林內傱出來，伊驚甲面慄色，險仔跋跋倒。Hiông-hiông ū tsi̍t tīn kâu-san--á uì tshiū-nâ-lāi tsông- -tshut-lâi, i kiann kah bīn-lik-sik, hiám-á pua̍h-pua̍h--tó. (突然有一群猴子從樹林裡跑出來，他嚇得臉色大變，差點摔倒。)
8.	武腯（bú-tún）(形容詞) 身材矮壯結實。
　　例句：伊生做武腯武腯。I senn-tsò bú-tún-bú-tún. (他長得矮壯結實。)
9.	罕得幾時（hán-tit-kuí-sî）(副詞) 偶然、難得。
　　例句：阿媽罕得幾時來咱兜，咱規家伙仔做伙陪伊來去四界𨑨迌。A-má hán-tit-kuí-sî lâi lán tau, lán kui-ke-hué-á tsò-hué puê i lâi-khì sì-kè tshit-thô. (奶奶難得來我們家，我們全家人一起陪他四處去遊玩。)
10.	僥雄（hiau-hiông）(形容詞) 無情，薄情。
　　例句：原底叫是伊是古意人，料袂到心肝真僥雄，無講無呾就共某囝放咧做伊去。Guân-té kiò-sī i sī kóo-ì-lâng, liāu-bē-kàu sim- kuann tsin hiau-hiông, bô-kóng-bô-tànn tō kā bóo-kiánn pàng--leh tsò i khì. (原先以為他是老實人，想不到心狠無情，一聲不響就拋妻別子逕自離開。)
11.	好氣（hó-khuì）(形容詞) 時機好，賺的錢多，手頭變得寬裕。
　　例句：這站仔加真好氣，進前欠人的數攏清了矣。Tsit-tsām-á ke tsin hó-khuì, tsìn-tsîng khiàm--lâng ê siàu lóng tshing-liáu--ah. (這陣子景況好賺了錢，之前欠別人的帳都還清了。)
12.	風絲仔（hong-si-á）(名詞) 微風。輕輕吹的風。
　　例句：今仔日中晝足熱的，連一屑仔風絲仔都無。Kin-á-ji̍t tiong-tàu tsiok jua̍h--ê, liân tsi̍t-sut-á hong-si-á to bô. (今天中午非常 熱，連一點微風都沒有。)
13.	橫肉生（huâinn-bah-senn/huînn-bah-sinn）1.(形容詞) 滿臉橫肉、長相兇惡的樣子。	2.(形容詞) 言行惡形惡狀。
　　例句：1. 阿文仔雖然看著是橫肉生橫肉生，毋過做人真古意。A-bûn--á sui-jiân khuànn tio̍h sī huâinn-bah-senn huâinn-bah-senn, m̄-koh tsò-lâng tsin kóo-ì. (阿文雖然看起來滿臉橫肉的樣子，但是為人忠厚老實。) 2. 生理歹做，閣拄著橫肉生的𨑨迌仔來收保護費，排擔仔的人只好目屎吞腹內。Sing-lí pháinn-tsò, koh tú-tio̍h huâinn- bah-senn ê tshit-thô-á lâi siu pó-hōo-huì, pâi tànn-á ê lâng tsí-hó ba̍k-sái thun pak-lāi. (生意難做，又遇到惡形惡狀的小 流氓來收保護費，攤商只好把眼淚往肚子裡吞。)
14.	犯人欹（huān-lâng-khia）(熟語) 落人口實。
　　例句：做人若是無原則，往往會犯人欹。Tsò-lâng nā-sī bô guân-tsik, íng-íng ē huān-lâng-khia. (做人如果沒有原則，往往會受人批 評。)
15.	歲數（huè-sòo/hè-sòo）(名詞) 歲數、年齡。指年齡的大小。
　　例句：咱歲數有矣，食食就愛較注意咧。Lán huè-sòo ū--ah, tsia̍h-si̍t tō ài khah tsù-ì--leh. (咱們歲數大了，飲食就要多注意些。)
16.	會齊（huē-tsê/huē-tsuê）(動詞) 會合、到齊。
　　例句：聽候人攏會齊了後，咱就隨通起行囉！Thìng-hāu lâng lóng huē-tsê liáu-āu, lán tō suî thang khí-kiânn--looh! (等人都到齊 後，我們就可以出發囉！)
17.	應伨（ìn-thīn）(形容詞) 相稱。
　　例句：你的穿插和這改活動的主題有應伨。Lí ê tshīng-tshah hām tsit kái ua̍h-tāng ê tsú-tê ū ìn-thīn. (你的穿著與這次的活動主題 很合適。)
18.	幼膩（iù-jī/iù-lī）(形容詞) 瓜果肉類或是絹布類等物質質地柔軟細緻。
　　例句：這尾魚有影好食，肉質幼膩，攏袂粗絲。Tsit bué hî ū-iánn hó-tsia̍h, bah-tsit iù-jī, lóng bē tshoo-si. (這條魚非常好吃，肉 質細嫩，都不粗糙。)
19.	樣相（iūnn-siùnn）(名詞) 樣子、模樣。
　　例句：伊無洗手就欲拈物件來食，有夠歹樣相。I bô sé tshiú tō beh ni mi̍h-kiānn lâi tsia̍h, ū-kàu pháinn iūnn-siùnn. (他不洗手 就要拿東西吃，樣子真難看。)
20.	字骨（jī-kut/lī-kut）(名詞) 筆勢。寫、畫運筆的風格。
　　例句：伊寫大字的字骨，誠成顏真卿。I siá tuā-jī ê jī-kut, tsiânn sîng Gân Tsin-khing. (他寫書法的字體，很像顏真卿。)
21.	甲若（kah-nā）1.(連詞) 既然。	2.(連詞) 假使、如果。
　　例句：1. 伊甲若無想欲讀電機，你就莫共逼矣。I kah-nā bô siūnn-beh tha̍k tiān-ki, lí tō mài kā pik--ah. (他既然不想讀電機，你 就別逼他了。) 2. 你共伊講，伊甲若毋聽，也無路用。Lí kā i kóng, i kah-nā m̄ thiann, iā bô-lōo-īng.(你跟他說，他如果不聽，也沒有用。)
22.	干礙（kan-gāi）1.(名詞) 相干、關係。	2.(動詞) 影響、阻礙。
　　例句：1. 這層代誌佮你無干礙，你上好恬恬，莫表示意見。Tsit tsân tāi-tsì kah lí bô kan-gāi, lí siōng-hó tiām-tiām, mài piáu- sī ì-kiàn. (這件事跟你毫不相干，你最好不作聲，別表示意見。) 2. 囡仔的食食著愛較斟酌咧，若無，會干礙著伊轉大人。Gín-á ê tsia̍h-si̍t tio̍h-ài khah tsim-tsiok--leh, nā-bô, ē kan-gāi- tio̍h i tńg-tuā-lâng. (孩子的飲食要注意，否則，會影響他的成長。)
23.	跤路（kha-lōo）1.(名詞) 行進的路線。	2.(名詞) 腳力。走路的力氣。
　　例句：1. 你物件鎮甲規塗跤，揣無跤路通好過。Lí mi̍h-kiānn tìn kah kui thôo-kha, tshuē-bô kha-lōo thang-hó kuè. (你東西擱得滿地都是，找不到路可走。) 2. 這站仔跤路荏，無才調𬦰山。Tsit-tsām-á kha-lōo lám, bô tsâi-tiāu peh-suann. (這陣子腳力差，無法爬山。)
24.	尻川花（kha-tshng-hue）(名詞) 臀部扭動的樣子。
　　例句：伊心情袂䆀的時陣，會那唱歌那搖尻川花。I sim-tsîng bē-bái ê sî-tsūn, ē ná tshiùnn-kua ná iô kha-tshng-hue. (他心情不 錯的時候，會邊哼歌邊搖屁股。)
25.	欠點（khiàm-tiám）(名詞) 缺點、瑕疵。不完美之處。源自日語欠点（けってん）。
　　例句：人加減攏會有欠點，無彼號十全的。Lâng ke-kiám lóng ē ū khiàm-tiám, bô hit-lō tsa̍p-tsn̂g--ê. (人多少都會有缺點，沒有十 全十美的。)
26.	起跤踉（khí-kha-lōng）(動詞) 拔腿狂奔、落荒而逃、狂奔、飛奔。
　　例句：昨暝大地動，眾人驚甲起跤踉，干焦伊醉甲毋知人，實在真了然！Tsa-mê tuā tē-tāng, tsìng-lâng kiann kah khí-kha-lōng, kan-na i tsuì kah m̄-tsai-lâng, si̍t-tsāi tsin liáu-jiân! (昨晚發生大地震，大家驚嚇到拔腿狂奔，只有他醉到不醒人事，真是丟人！)
27.	起起（khí-khí）(形容詞) 斤兩足夠。
　　例句：這堆菝仔三斤起起，你若毋信，會使捾去磅仔遐閣秤一改。Tsit tui pua̍t-á sann kin khí-khí, lí nā m̄ sìn, ē-sái kuānn-khì pōng-á hia koh tshìn--tsi̍t-kái. (這堆番石榴足足三斤，你若不信，可以提去磅秤那裡再秤一次。)
28.	輕健（khin-kiānn）(形容詞) 輕爽靈活。精神爽快而身體硬朗，敏捷健康的樣子。通常形容病人
　　例句：或老人病好後的樣子。 看著阿公遮爾仔輕健咧運動，逐家攏真歡喜。Khuànn-tio̍h a-kong tsiah-nī-á khin-kiānn teh ūn-tōng, ta̍k-ke lóng tsin huann- hí. (看到爺爺這麼的輕爽靈活在運動，大家都很高興。)
29.	苦尾（khóo-bué/khóo-bé）(形容詞) 吃過某樣東西後，嘴裡產生苦味。
　　例句：遮的竹筍食了苦尾苦尾。Tsia-ê tik-sún tsia̍h-liáu khóo-bué-khóo-bué. (這些竹筍吃完帶點苦味。)
30.	苦痛（khóo-thàng）(形容詞) 痛苦、悲傷。
　　例句：聽著𪜶後生出車禍煞過身去的消息，伊感覺誠苦痛。Thiann-tio̍h in hāu-senn tshut tshia-hō suah kuè-sin--khì ê siau-sit, i kám-kak tsiânn khóo-thàng. (聽到他兒子出車禍竟然往生的消息，他感到很悲痛。)
31.	屈強（khut-kiông）(形容詞) 倔強。堅持己見不聽別人好言相勸。
　　例句：你毋通遐屈強，人好喙咧講，咱著愛加減聽。Lí m̄-thang hiah khut-kiông, lâng hó-tshuì teh kóng, lán tio̍h-ài ke-kiám thiann. (你不要那麼倔強，人家好言相勸，我們就要多少聽聽看。)
32.	枝骨（ki-kut）1.(名詞) 指人體的骨架。一般用於女性。	2.(名詞) 器物的骨架。
　　例句：1. 阿芬的枝骨瘦閣躼，誠適合穿旗袍呢！A-hun ê ki-kut sán koh lò, tsiânn sik-ha̍p tshīng kî-phâu--neh! (阿芬的骨架瘦又高，很適合穿旗袍呢！) 2. 你莫看這枝雨傘舊舊，枝骨猶真勇咧。Lí mài khuànn tsit ki hōo-suànn kū-kū, ki-kut iáu tsin ióng--leh. (你不要看這把 雨傘舊舊的，骨架還很堅固呢。)
33.	驚見（kiann-kìnn）(副詞) 恐怕、有可能。
　　例句：這陣的疫情閣來會變啥款袂按得，驚見湠足久的，逐家愛有心理準備。Tsit-tsūn ê i̍k-tsîng koh lâi ē piàn siánn-khuán bē-àn--tit, kiann-kìnn thuànn tsiok kú--ê, ta̍k-ke ài ū sim-lí tsún-pī. (目前的疫情接下來會變成什麼樣子很難掌握，恐怕會擴散得 很久，大家要有心理準備。)
34.	行跤到（kiânn-kha-kàu）1.(動詞) 造訪。	2.(動詞) 到來。指曾經來到、來訪。
　　例句：1. 我搬來臺中都也幾若月日矣，毋過連臺中國家歌劇院都毋捌行跤到咧。Guá puann-lâi Tâi-tiong to iā kuí-nā gue̍h-ji̍t- -ah, m̄-koh liân Tâi-tiong Kok-ka Kua-kio̍k-īnn to m̄ bat kiânn-kha-kàu--leh. (我搬來臺中都已經好幾個月了，不過連臺中國家歌劇院都還不曾造訪過。) 2. 伊生理失敗了後，進前不時來相揣的朋友煞攏無人閣行跤到。I sing-lí sit-pāi liáu-āu, tsìn-tsîng put-sî lâi sio-tshuē ê pîng-iú suah lóng bô lâng koh kiânn-kha-kàu. (他經商失敗後，之前常常來找他的朋友卻都沒有人再到他家來。)
35.	驕頭（kiau-thâu）(形容詞) 驕傲，看不起別人。
　　例句：像伊遐爾驕頭，敢揣會著真心欲佮伊交陪的朋友？Tshiūnn i hiah-nī kiau-thâu, kám tshuē ē tio̍h tsin-sim beh kah i kau- puê ê pîng-iú? (像他那麼驕傲，找得到真心跟他交往的朋友嗎？)
36.	緊猛（kín-mé/kín-mí）(副詞) 趕緊。加快動作的速度。
　　例句：時間咧過是真緊，你若無較緊猛咧，是會袂赴通交貨。Sî-kan teh kuè sī tsin kín, lí nā bô khah kín-mé--leh, sī ē bē-hù thang kau-huè. (時間過得很快，你動作要是不快點，是會來不及交貨的。)
37.	勼勼圇圇（kiu-kiu-lun-lun）1.(形容詞) 畏畏縮縮。形容膽小害怕的樣子。2.(形容詞) 不果斷。形容猶豫
　　例句：不決，無法做決定。 1. 見若上台講話，伊就驚甲勼勼圇圇。Kiàn-nā tsiūnn-tâi kóng-uē, i tō kiann kah kiu-kiu-lun-lun. (每次上台說話，他就嚇得畏畏縮縮。) 2. 做生理若勼勼圇圇，機會就會予人先提去。Tsò-sing-lí nā kiu-kiu-lun-lun, ki-huē tō ē hōo lâng sing the̍h--khì. (做生 意如果猶豫不決，就會被別人搶得先機。)
38.	光生（kng-senn/kng-sinn）1.(形容詞) 光滑細緻。	2.(形容詞) 平坦。	3.(形容詞) 乾淨。
　　例句：1. 伊的面貌、皮肉誠光生，嶄然好看。I ê bīn-māu, phuê-bah tsiânn kng-senn, tsám-jiân hó-khuànn. (他的面容、皮膚很光 滑，頗為好看。) 2. 你共這領皺襞襞的衫提去熨予較光生咧。Lí kā tsit niá jiâu-phé-phé ê sann the̍h-khì ut hōo khah kng-senn--leh.(你把這件皺巴巴的衣服拿去燙平一下。) 3. 伊的厝整理甲誠光生。I ê tshù tsíng-lí kah tsiânn kng-senn. (他的房子整理得很乾淨。)
39.	顧路（kòo-lōo）1.(動詞) 看顧路況。	2.(動詞) 因為車子拋錨或故障得停在路邊待援。
　　例句：1. 咱里長真關心里民的安全，逐工早起攏來這个路口顧路，鬥指揮交通。Lán lí-tiúnn tsin kuan-sim lí-bîn ê an-tsuân, ta̍k-kang tsá-khí lóng lâi tsit ê lōo-kháu kòo-lōo, tàu tsí-hui kau-thong. (我們里長很關心里民的安全，每天早上都來這個路口看顧路況，協助指揮交通。) 2. 阿爸駛車駛甲半中途，車煞雄雄袂行，今著暫時佇遮顧路矣。A-pah sái-tshia sái kah puànn-tiong-tôo, tshia suah hiông- hiông bē kiânn, tann tio̍h tsiām-sî tī tsia kòo-lōo--ah. (爸爸開車開到半路，車子卻突然拋錨，如今得暫時留在這裡待援了。)
40.	過運（kuè-ūn/kè-ūn）(動詞) 脫離厄運、去霉運。
　　例句：聽老大人講：「食豬跤麵線會當過運，共歹運踢甲遠遠遠」。Thiann lāu-tuā-lâng kóng, “Tsia̍h ti-kha-mī-suànn ē-tàng kuè- ūn, kā pháinn-ūn that kah hn̄g-hn̄g-hn̄g”. (聽老人家說：「吃豬腳麵線可以去霉運，把不好的運氣踢得遠遠的」。)
41.	落肉（lak-bah）(形容詞) 忘東忘西。就像連自己的肉掉了都還不知道一般，形容人粗心大意。
　　例句：你這个落肉的，功課又閣袂記得紮矣是無？Lí tsit ê lak-bah--ê, kong-khò iū-koh bē-kì-tit tsah--ah sī--bô? (你這個冒失鬼， 功課是不是又忘了帶了？)
42.	落米仔（lak-bí-á）1.(名詞) 從原本成串的穀穗、果實中脫落的穀粒或果粒。	2.(名詞) 落隊者、
　　例句：脫隊者、落伍者。 1. 荔枝規捾的一斤五十箍，落米仔俗俗仔賣，算你二十就好。Nāi-tsi kui kuānn--ê tsi̍t kin gōo-tsa̍p khoo, lak-bí-á sio̍k- sio̍k-á bē, sǹg lí jī-tsa̍p tō hó. (荔枝整串的一斤五十元，脫果的就便宜的賣，算你二十就好。) 2. 遮的落米仔，見擺都綴袂著陣。Tsia-ê lak-bí-á, kiàn-pái to tuè bē tio̍h tīn. (這些落隊的人，每次都跟不上大家。)
43.	落粽（làu-tsàng）1.(動詞) 指沒包好而快要鬆脫的粽子。	2.(形容詞) 形容人穿著邋遢，衣著
　　例句：不整齊。 1. 阿媽真𠢕縛粽，無親像阮攏縛甲落粽去，真正猶未出師。A-má tsin gâu pa̍k tsàng, bô tshin-tshiūnn guán lóng pa̍k kah làu-tsàng--khì, tsin-tsiànn iáu-buē tshut-sai. (奶奶很會包粽子，不像我們都包得鬆鬆散散，實在還沒學成。) 2. 等咧有人客欲來，咱衫著穿予撆紮，才袂看著落粽落粽。Tán--leh ū lâng-kheh beh lâi, lán sann tio̍h tshīng hōo pih- tsah, tsiah bē khuànn tio̍h làu-tsàng-làu-tsàng. (待會有客人來訪，我們的穿著必須整齊，才不會看起來很邋遢。)
44.	落坐（làu-tshe̍h）(形容詞) 丟三落四、漫不經心。指做事情落東落西，不夠謹慎或無法完整的
　　例句：把事情做好。 你實在真落坐，佮你出門定會無紮這、無紮彼。Lí si̍t-tsāi tsin làu-tshe̍h, kah lí tshut-mn̂g tiānn ē bô tsah tse, bô tsah he. (你真的很散漫，跟你出門老是會忘了帶這、忘了帶那。)
45.	流汗糝滴（lâu-kuānn-sám-tih）(熟語) 汗流浹背、滿身大汗。
　　例句：今仔日實在真翕熱，佇外口行無偌久，隨就流汗糝滴。Kin-á-ji̍t si̍t-tsāi tsin hip-jua̍h, tī guā-kháu kiânn bô-guā-kú, suî tō lâu-kuānn-sám-tih. (今天實在很悶熱，在外面走沒多久，馬上就汗流浹背。)
46.	掠外（lia̍h-guā）(動詞) 除外。
　　例句：這擺的買賣，本錢掠外，猶趁有兩成。Tsit pái ê bé-bē, pún-tsînn lia̍h-guā, iáu thàn ū nn̄g siânn. (這次的買賣，本錢除外， 還賺了兩成利潤。)
47.	鐮𠠝仔（liâm-li̍k-á）(名詞) 鐮刀。外形彎曲如鉤，一種用來割草或割稻子的工具。
　　例句：鐮𠠝仔有齒，用來割稻仔真好用。Liâm-li̍k-á ū khí, iōng-lâi kuah-tiū-á tsin hó-iōng. (鐮刀有鋸齒，用來割稻子很好用。)
48.	裂線綴（li̍h-suànn-tsuē/li̍h-suànn-tsē）(動詞) 縫合線斷裂。
　　例句：伊彼領衫的手䘼尾裂線綴去，用針線共伊紩紩咧就好矣。I hit niá sann ê tshiú-ńg-bué li̍h-suànn-tsuē--khì, īng tsiam-suànn kā i thīnn-thīnn--leh tō hó--ah. (他那件衣服的袖口縫線斷裂，用針線把它縫一縫就好了。)
49.	慄色（lik-sik）(動詞) 大驚失色。因突然的恐懼、驚訝而臉色大變。
　　例句：伊不時佇市場歹販仔，欲共人收保護費，看著警察來欲掠伊，面隨慄色。I put-sî tī tshī-tiûnn pháinn huàn-á, beh kā lâng siu pó-hōo-huì, khuànn-tio̍h kíng-tshat lâi beh lia̍h--i, bīn suî lik-sik. (他常在市場對攤販惡言相向，要跟人收保護費，看到警察要來抓他，臉立刻恐懼失色。)
50.	躼躼長（lò-lò-tn̂g）1.(形容詞) 形容時間漫長。	2.(形容詞) 形容說話或撰寫的文章過於冗長。
　　例句：3.(形容詞) 形容排隊隊伍很長。 1. 退休了後一工躼躼長，愛加減揣寡代誌來做才袂無議量。Thè-hiu liáu-āu tsi̍t kang lò-lò-tn̂g, ài ke-kiám tshuē kuá tāi- tsì lâi tsò tsiah bē bô-gī-niū. (退休以後一天好漫長，要多少找些事情來做才不會無聊。) 2. 你話講甲躼躼長，我是聽甲霧嗄嗄，捎無重點。Lí uē kóng kah lò-lò-tn̂g, guá sī thiann kah bū-sà-sà, sa-bô tiōng- tiám. (你話說得太冗長，我聽得一頭霧水，抓不到重點。) 3. 彼間麭店見都猶未開市，等欲買麭的人就佇外口排甲躼躼長，生理有影真交易。Hit king pháng-tiàm kiàn to iáu-buē khui-tshī, tán beh bé pháng ê lâng tō tī guā-kháu pâi kah lò-lò-tn̂g, sing-lí ū-iánn tsin ka-ia̍h. (那間麵包店每次都還沒 開門營業，外頭等著買麵包的人就已經大排長龍了，生意可以說是非常好。)
51.	踉（lōng）(動詞) 拔腿狂奔。慌張地奔跑、匆促地逃跑、狂奔亂竄。
　　例句：聽著空襲警報，逐家起跤走咧踉。Thiann-tio̍h khong-si̍p kíng-pò, ta̍k-ke khí-kha tsáu leh lōng. (聽到防空警報，大家起身狂 奔。)
52.	閬曠（lòng-khòng）1.(形容詞) 寬大、寬鬆。	2.(形容詞) 寬廣、寬闊。
　　例句：1. 彼軀衫媠是有媠啦！毋過我穿著傷閬曠，實在袂合軀。Hit su sann suí sī ū suí--lah! M̄-koh guá tshīng tio̍h siunn lòng-khòng, si̍t-tsāi bē ha̍h-su. (那件衣服漂亮是漂亮，不過我穿起來太寬鬆了，真不合適。) 2. 𪜶兜埕斗真閬曠，有法度停五、六台車。In tau tiânn-táu tsin lòng-khòng, ū-huat-tōo thîng gōo, la̍k tâi tshia. (他們家 庭院很寬廣，有辦法停五、六台車。)
53.	凹窩（nah-o）1.(名詞) 穴；窪地。	2.(動詞) 凹陷。
　　例句：1. 駛車若拄著凹窩，速度愛較慢咧，車較袂損著，坐的人嘛較快活。Sái-tshia nā tú-tio̍h nah-o, sok-tōo ài khah bān--leh, tshia khah bē sńg--tio̍h, tsē ê lâng mā khah khuìnn-ua̍h.(開車經過窪地，要放慢速度，車子較不受損，坐車的人也比較舒服。) 2. 麵粉佮水的比例若下無好勢，拄烘好的雞卵糕隨就會凹窩落去。Mī-hún kah tsuí ê pí-lē nā hē bô hó-sè, tú hang-hó ê ke-nn̄g-ko suî tō ē nah-o--lo̍h-khì. (如果麵粉和水的比例不恰當，剛烤好的蛋糕馬上就會凹陷下去。)
54.	若甲（nā-kah）1.(連詞) 既然。	2.(連詞) 如果、假使、要是。
　　例句：1. 頂擺你共我壘的錢若甲無才調還，無你就提你彼坵田來拄。Tíng-pái lí kā guá luí ê tsînn nā-kah bô tsâi-tiāu hîng, bô lí tō the̍h lí hit khu tshân lâi tú. (上次你跟我借的錢既然無法返還，不然你就拿你那塊田地來抵債。) 2. 生理若甲做會起來，一定袂枵飢失頓。Sing-lí nā-kah tsò ē khí--lâi, it-tīng bē iau-ki-sit-tǹg. (生意如果做得起來，肯定不 會三餐不繼。)
55.	怏頓（ǹg-tǹg）(形容詞) 形容小孩或年輕人頑固、任性或執拗而怏怏不悅。
　　例句：彼个囡仔予𪜶阿爸罵了，就佇遐怏頓規晡久毋準煞。Hit ê gín-á hōo in a-pah mē-liáu, tō tī hia ǹg-tǹg kui-poo-kú m̄ tsún suah. (那位小孩被爸爸責罵之後，就在那怏怏不悅不肯罷休。)
56.	貓仔食（niau-á-tsia̍h）(動詞) 像貓一樣吃得很少。
　　例句：伊食物件攏貓仔食，莫怪遐爾瘦。I tsia̍h mi̍h-kiānn lóng niau-á-tsia̍h, bo̍k-kuài hiah-nī sán. (他的食量小，怪不得那麼瘦。)
57.	貓毛（niau-mn̂g）(形容詞) 不乾脆；對人或事過度考慮或擔心。
　　例句：伊性地較貓毛，閣誠𠢕拖沙，代誌定定去予延著，真正袂呵咾得。I sìng-tē khah niau-mn̂g, koh tsiânn gâu thua-sua, tāi- tsì tiānn-tiānn khì hōo tshiân--tio̍h, tsin-tsiànn bē-o-ló--tit. (他個性比較不乾脆，而且很會拖拖拉拉，事情常常都被延宕很久，實在 令人不敢恭維。)
58.	軟略（nńg-lio̍h）1.(形容詞) 柔軟。	2.(形容詞) 引申為溫和。
　　例句：1. 阿公講伊這站仔有去泅水、𬦰山，筋骨並以早加真軟略。A-kong kóng i tsit-tsām-á ū khì siû-tsuí, peh-suann, kin-kut phīng í-tsá ke tsin nńg-lio̍h. (爺爺說他這陣子都在游泳、爬山，筋骨比以前柔軟很多。) 2. 下晡日花仔較軟略矣，咱會當出來去行行踅踅咧。Ē-poo ji̍t-hue-á khah nńg-lio̍h--ah, lán ē-tàng tshut-lâi-khì kiânn- kiânn se̍h-se̍h--leh. (下午陽光較為和煦，我們可以出去走走晃晃。)
59.	平坐徛（pênn-tsē-khiā/pînn-tsē-khiā）(形容詞) 平起平坐。指身分、地位平等。
　　例句：這馬是男女平等的時代，查埔查某會當平坐徛。Tsit-má sī lâm-lí pîng-tíng ê sî-tāi, tsa-poo tsa-bóo ē-tàng pênn-tsē-khiā. (現在是男女平等的時代，男女能夠平起平坐。)
60.	拍殕光（phah-phú-kng）(動詞) 黎明。早晨天剛亮的時候。
　　例句：天拄拍殕光，伊就去菜市仔排擔矣，實在誠辛苦。Thinn tú phah-phú-kng, i tō khì tshài-tshī-á pâi-tànn--ah, si̍t-tsāi tsiânn sin-khóo. (天剛亮，他就去菜市場擺攤了，實在很辛苦。)
61.	歹心行（pháinn-sim-hīng）(形容詞) 心地不良、壞心眼。
　　例句：彼个人真歹心行，弄狗相咬害人冤家。Hit ê lâng tsin pháinn-sim-hīng, lōng-káu-sio-kā hāi lâng uan-ke. (那個人心地很壞， 挑撥別人害他們吵架。)
62.	歹衝衝（pháinn-tshìng-tshìng）(形容詞) 凶巴巴、怒氣沖沖。因發脾氣所表現出的凶惡狀。
　　例句：伊一下入門就歹衝衝，毋知是咧歹啥？I tsi̍t-ē ji̍p-mn̂g tō pháinn-tshìng-tshìng, m̄ tsai sī teh pháinn siannh? (他一進門就 怒氣沖沖，不知道在生什麼氣？)
63.	癖鼻（phiah-phīnn）1.(名詞) 習性、癖性。	2.(名詞) 個性、脾氣。
　　例句：1. 伊愛咬指甲的歹癖鼻，對做囡仔到今都改袂掉。I ài kā tsíng-kah ê pháinn phiah-phīnn, uì tsò gín-á kàu-tann to kái bē tiāu. (他愛咬指甲的壞習性，從小到大都改不掉。) 2. 伊較好癖鼻，毋才逐家攏愛佮伊鬥陣做工課。I khah hó phiah-phīnn, m̄-tsiah ta̍k-ke lóng ài kah i tàu-tīn tsò khang- khuè. (他的脾氣很好，所以大家都喜歡跟他在一起工作。)
64.	僻話（phiah-uē）(名詞) 行話、黑話、秘密語。不同行業中為避免外人聽懂而使用的特殊用語。
　　例句：走江湖的人無愛予外人知影𪜶咧講啥，互相之間攏會講僻話。Tsáu-kang-ôo ê lâng bô ài hōo guā-lâng tsai-iánn in teh kóng siannh, hōo-siong tsi-kan lóng ē kóng phiah-uē. (跑江湖的人不想讓外人知道他們在說什麼，相互之間都會說隱語。)
65.	袚袚（phua̍h-phua̍h）1.(動詞) 交叉打結。	2.(形容詞) 形容腦袋不清。
　　例句：1. 這條袚鍊予阿弟仔耍甲袚袚，欲掛愛先敨開。Tsit tiâu phua̍h-liān hōo a-tī-á sńg kah phua̍h-phua̍h, beh kuà ài sing tháu--khui. (這條項鍊被弟弟玩到打結，要戴得先解開。) 2. 伊出車禍傷著頭殼，這馬頭腦定定袚袚，講話反起反倒。I tshut tshia-hō siong-tio̍h thâu-khak, tsit-má thâu-náu tiānn- tiānn phua̍h-phua̍h, kóng-uē huán-khí-huán-tó. (他出車禍傷到頭部，現在常常腦袋不清，說話反反覆覆。)
66.	胚命（phue-miā/phe-miā）1.(動詞) 拼命、盡力。	2.(動詞) 冒死。
　　例句：1. 這改的工程咱著胚命落去做，才有才調準時完工。Tsit kái ê kang-tîng lán tio̍h phue-miā lo̍h-khì tsò, tsiah ū tsâi-tiāu tsún-sî uân-kang. (這次的工程我們要拼命去做，才能夠準時完工。) 2. 毋管火燒厝的現場有偌危險，消防隊的兄弟仝款胚命咧拍火、救人。M̄-kuán hué-sio-tshù ê hiān-tiûnn ū guā guî-hiám, siau-hông-tuī ê hiann-tī kāng-khuán phue-miā teh phah-hué, kiù-lâng. (無論火災現場有多麼危險，消防隊員依然冒死滅火、救人。)
67.	配搭（phuè-tah）1.(動詞) 搭配。	2.(動詞) 配合。
　　例句：1. 伊今仔日的穿插不止仔奅，連衫仔褲的色水嘛配搭甲誠出擢。I kin-á-ji̍t ê tshīng-tshah put-tsí-á phānn, liân sann-á- khòo ê sik-tsuí mā phuè-tah kah tsiânn tshut-tioh. (他今天的穿著很時髦，連衣褲的色澤都搭配得很出色。) 2. 兩个人伨頭弄獅的時陣，獅頭愛和獅尾配搭甲真四序，才袂重耽去。Nn̄g ê lâng thīn-thâu lāng-sai ê sî-tsūn, sai-thâu ài hām sai-bué phuè-tah kah tsin sù-sī, tsiah bē tîng-tânn--khì. (兩個人搭檔舞獅的時候，負責獅頭和獅尾的人要配合得很合拍，才不會出差錯。)
68.	噼（piah/piak）1.(動詞) 指狼吞虎嚥的吃。	2.(動詞) 貪汙、偷取。
　　例句：1. 你是偌久無食矣？無哪會一睏仔就噼三碗飯。Lí sī guā-kú bô tsia̍h--ah? Bô ná ē tsi̍t-khùn-á tō piah sann uánn pn̄g.(你是多久沒吃了？不然怎麼一下子就囫圇吞了三碗飯。) 2. 伊真好膽，連公家的錢嘛敢噼噼去。I tsin hó-tánn, liân kong-ka ê tsînn mā kánn piah-piah--khì. (他實在有夠大膽，連 政府的錢都敢貪。)
69.	拚重汗（piànn-tāng-kuānn）(動詞) 汗流浹背。指汗流不停。
　　例句：伊佇工地做粗工，日頭跤舞都無三下手就拚重汗矣，有影無輕鬆。I tī kang-tē tsò tshoo-kang, ji̍t-thâu-kha bú to bô sann- ē-tshiú tō piànn-tāng-kuānn--ah, ū-iánn bô khin-sang. (他在工地做粗活，大太陽底下做不到兩三下就已汗流浹背了，著實不輕鬆。)
70.	變天（piàn-thian）(動詞) 政局有了重大改變，有時可用來稱改朝換代。
　　例句：一个政府若違背民意，變天嘛是緊縒慢的代誌。Tsi̍t ê tsìng-hú nā uî-puē bîn-ì, piàn-thian mā sī kín-tsua̍h-bān ê tāi-tsì. (一個政府若違背民意，改朝換代也是早晚的事情。)
71.	變天（piàn-thinn）(動詞) 天氣由晴轉陰雨。
　　例句：欲變天矣，出門著紮雨傘。Beh piàn-thinn--ah, tshut-mn̂g tio̍h tsah hōo-suànn. (天氣要轉壞了，出門要帶雨傘。)
72.	補所（póo-sóo）1.(名詞) 回報、善報。	2.(名詞) 效果、助益。
　　例句：1. 有孝爸母，天地就有補所。Iú-hàu pē-bú, thinn-tē tō ū póo-sóo. (孝順父母，老天爺會有所回報。) 2. 有食就有補所。Ū tsia̍h tō ū póo-sóo. (有東西吃對身體有助益。)
73.	半上路下（puànn-tsiūnn-lōo-ē）(名詞) 事情或路途的中站。
　　例句：咱生理才拄開始，你煞雄雄喝欲拆股，今半上路下是欲按怎收煞？Lán sing-lí tsiah tú khai-sí, lí suah hiông-hiông huah beh thiah-kóo, tann puànn-tsiūnn-lōo-ē sī beh án-tsuánn siu-suah? (咱們的生意才剛開始，你卻突然說要拆夥，現在做到中途該怎麼收尾？)
74.	撒體（sāi-thái）(動詞) 鬧情緒、賭氣、鬧彆扭、嘔氣。
　　例句：阮阿母再三交代，囡仔性愛改，毋通磕袂著就撒體，才袂顧人怨。Guán a-bú tsài-sann kau-tài, gín-á-sìng ài kái, m̄-thang kha̍p-bē-tio̍h tō sāi-thái, tsiah bē kòo-lâng-uàn. (我媽媽再三交代，孩子氣的壞習性要改，不可以動不動就鬧情緒，才不會惹人怨。)
75.	生菇閬殕（senn-koo-làng-phú/sinn-koo-là
ng-phú）(動詞) 發霉。
　　例句：衫仔櫥久無僥振動，內底加減攏會生菇閬殕。Sann-á-tû kú bô hiau tín-tāng, lāi-té ke-kiám lóng ē senn-koo-làng-phú. (衣 櫥久未翻動，裡面難免會發霉。)
76.	篠（siāu）(動詞) 持長形軟條狀物抽打。
　　例句：攑籐條篠尻川，尻川百面烏青凝血。Gia̍h tîn-tiâu siāu kha-tshng, kha-tshng pah-bīn oo-tshenn gîng-hueh. (拿籐條抽打屁 股，屁股保證瘀血。)
77.	乘紲（sīng-suà）(副詞) 順便。
　　例句：阿爸欲去上班，乘紲載我去學校上課。A-pah beh khì siōng-pan, sīng-suà tsài guá khì ha̍k-hāu siōng-khò. (爸爸要去上班， 順便載我去學校上課。)
78.	死炸（sí-tsuànn）(動詞) 指非事實且無根據而誇張的胡扯、吹牛。
　　例句：伊見講攏無影無跡的代誌，這馬閣佇遐咧死炸矣。I kiàn kóng lóng bô-iánn-bô-tsiah ê tāi-tsì, tsit-má koh tī hia teh sí- tsuànn--ah. (他每次說的都是沒有根據的事情，現在又在那裡鬼扯了。)
79.	相捽路（sio-sut-lōo）(動詞) 錯身而過。
　　例句：我欲去揣阮阿舅，伊拄好出去矣，兩个就按呢相捽路無相搪。Guá beh khì tshuē guán a-kū, i tú-hó tshut--khì--ah, nn̄g ê tsiū-án-ne sio-sut-lōo bô sio-tn̄g. (我要去找舅舅，他正好出門了，兩個就這樣錯身而過沒遇到對方。)
80.	損角（sńg-kak）(動詞) 損傷。像牛羊一樣折損自己的角，比喻損害到自己或引來不必要的麻
　　例句：煩。 出頭就損角。Tshut-thâu tō sńg-kak. (凡事為首者多少都會有所犧牲。)
81.	隨人（suî-lâng）1.(動詞) 分家。	2.(名詞) 各自。
　　例句：1. 彼兩兄弟隨人了後，毋知為著啥物代誌煞罕得來去。Hit nn̄g hiann-tī suî-lâng liáu-āu, m̄ tsai uī-tio̍h siánn-mih tāi-tsì suah hán-tit lâi-khì. (那兩兄弟分家以後，不知為了什麼事情卻少有往來。) 2. 日頭赤焱焱，隨人顧性命。Ji̍t-thâu tshiah-iānn-iānn, suî-lâng kòo sènn-miā. (太陽熾熱，大家各自設法保命。形容人遇到患 難，以顧全自己為先。)
82.	逐不時（ta̍k-put-sî）(副詞) 經常、常常。
　　例句：伊逐不時走來阮庄裡，揣人行棋。I ta̍k-put-sî tsáu-lâi guán tsng--lí, tshuē lâng kiânn-kî. (他經常跑到我們村子，找人下棋。)
83.	頭坎（thâu-khám）1.(名詞) 頭等。	2.(名詞) 第一。
　　例句：1. 伊送我的是今年茶葉比賽著冠軍的頭坎茶。I sàng--guá--ê sī kin-nî tê-hio̍h pí-sài tio̍h kuan-kun ê thâu-khám tê. (他送我的是今年茶葉比賽得冠軍的頭等茶。) 2. 阿翔讀冊誠拍拚閣頂真，較加伊的成績攏是排頭坎的。A-siông tha̍k-tsheh tsiânn phah-piànn koh tíng-tsin, khah-ke i ê sîng-tsik lóng sī pâi thâu-khám--ê. (阿翔讀書很認真又仔細，也難怪他的成績總是排第一的。)
84.	頭毛試火（thâu-mn̂g-tshì-hué/thâu-mn̂g-
tshì-hé）(熟語) 用頭髮來試探火的溫度。形容自找麻煩、惹禍上身。
　　例句：你食酒了後閣敢駛車，有影是頭毛試火，攏毋驚會出代誌。Lí tsia̍h-tsiú liáu-āu koh kánn sái-tshia, ū-iánn sī thâu-mn̂g- tshì-hué, lóng m̄ kiann ē tshut-tāi-tsì. (你酒後還敢開車，真的是不知死活，都不怕會出事。)
85.	頭牲仔（thâu-senn-á/thâu-sinn-á）(名詞) 牲口。家中豢養的家禽、家畜。
　　例句：以早阮兜飼足濟頭牲仔，毋但有雞仔，閣有鴨仔，阮放學轉到厝攏愛鬥飼。Í-tsá guán tau tshī tsiok tsē thâu-senn-á, m̄- nā ū ke-á, koh ū ah-á, guán pàng-o̍h tńg kàu tshù lóng ài tàu tshī. (以前我家飼養很多家禽，不只有雞，還有鴨，我們放學回 家都要幫忙餵養。)
86.	頭對（thâu-tuì）(名詞) 配偶、夫婦。
　　例句：𪜶兩人互相扶持，是人人欣羨的頭對。In nn̄g lâng hōo-siong hû-tshî, sī lâng-lâng him-siān ê thâu-tuì. (他們兩人互相扶 持，是人人稱羨的夫婦。)
87.	裼食（theh-tsia̍h）(動詞) 單吃、不摻任何佐料直接吃。
　　例句：阿媽炊的菜頭粿裼食就好，攏免搵料，滋味有夠讚的。A-má tshue ê tshài-thâu-kué theh-tsia̍h tō hó, lóng bián ùn-liāu, tsu-bī ū-kàu tsán--ê. (奶奶做的蘿蔔糕單吃就好，都不用沾醬，滋味真夠好。)
88.	拆破面（thiah-phuà-bīn）(動詞) 撕破臉。公開爭吵，不顧對方情面。
　　例句：𪜶兩兄弟仔為著小可仔代誌煞來拆破面，實在誠毋值！In nn̄g hiann-tī-á uī-tio̍h sió-khuá-á tāi-tsì suah lâi thiah-phuà-bīn, si̍t-tsāi tsiânn m̄-ta̍t! (他們兄弟倆為了一些小事竟然撕破臉，實在很不值得！)
89.	討捔（thó-ka̍k）(動詞) 丟掉。
　　例句：厝裡無愛的物件提去討捔，較袂鎮地。Tshù--lí bô ài ê mi̍h-kiānn the̍h-khì thó-ka̍k, khah bē tìn-tè. (家裡不要的東西拿去丟 掉，才不會占地方。)
90.	點陳（tiám-tîn）1.(形容詞) 謹慎、仔細。	2.(形容詞) 周到、細密、細緻。
　　例句：1. 欲扞數就愛較點陳咧，錢額千萬毋通拂重耽去。Beh huānn-siàu tō ài khah tiám-tîn--leh, tsînn-gia̍h tshian-bān m̄-thang hut tîng-tânn--khì. (要管理帳務就要仔細一點，金額千萬不要弄錯。) 2. 伊去店裡定一軀套裝，吩咐師傅著做較點陳咧，按呢穿著毋才會合軀閣撆紮。I khì tiàm--lí tiānn tsi̍t su thò-tsong, huan-hù sai-hū tio̍h tsò khah tiám-tîn--leh, án-ne tshīng tio̍h m̄-tsiah ē ha̍h-su koh pih-tsah. (他去店裡訂製一套套裝，吩 咐師傅得做得細緻一些，這樣穿起來才會合身又整齊。)
91.	頂（tiánn）(動詞) 頂撞、頂嘴。鬧意氣而大聲放話。
　　例句：恁老師講你是為你好，你也敢共伊頂。Lín lāu-su kóng--lí sī uī lí hó, lí iā kánn kā i tiánn. (你們老師批評你是為你好，你 也敢頂撞他。)
92.	窵遠（tiàu-uán）(形容詞) 偏遠。路途遙遠且交通不便。
　　例句：恁查某囝嫁去佇遐爾窵遠的所在，欲轉來一逝嘛真僫。Lín tsa-bóo-kiánn kè-khì tī hiah-nī tiàu-uán ê sóo-tsāi, beh tńg-- lâi--tsi̍t-tsuā mā tsin oh. (你女兒嫁到那麼遙遠的地方，要回來一趟也很難。)
93.	在來（tsāi-lâi）(副詞) 向來、從來。從以前到現在。
　　例句：伊在來上班都攏真準時，最近哪會定定袂赴？I tsāi-lâi siōng-pan to lóng tsin tsún-sî, tsuè-kīn ná ē tiānn-tiānn bē-hù? (他向來上班都很準時，最近為什麼常常遲到？)
94.	斬（tsánn）(動詞) 砍、剁。將條狀物一刀斬斷、橫切。
　　例句：以早甘蔗欲剉起來製糖的進前，會先共甘蔗尾的箬仔攏斬起來飼牛。Í-tsá kam-tsià beh tshò khí-lâi tsè thn̂g ê tsìn-tsîng, ē sing kā kam-tsià-bué ê ha̍h-á lóng tsánn khí-lâi tshī gû. (早期甘蔗要砍下來製糖之前，都會先將甘蔗尾端的葉子砍下來餵牛。)
95.	吵班（tshá-pan）1.(動詞) 打擾、吵鬧。	2.(名詞) 大多指吵鬧的孩子，但使用時不一定有責
　　例句：怪的意思。 1. 我後禮拜就欲考試矣，阮小弟閣不時來共我吵班，實在接載伊袂牢。Guá āu lé-pài tō beh khó-tshì--ah, guán sió-tī koh put-sî lâi kā guá tshá-pan, si̍t-tsāi tsih-tsài i bē tiâu. (我下周就要考試了，我弟弟還不時來打擾，實在受不了他。) 2. 阮厝裡彼三个吵班，逐不時都吵甲厝蓋強強欲夯去。Guán tshù--lí hit sann ê tshá-pan, ta̍k-put-sî to tshá kah tshù-kuà kiōng-kiōng beh giâ--khì. (我們家裡那三個愛吵鬧的小孩，不時吵鬧到屋頂都快被掀掉了。)
96.	田塗（tshân-thôo）(名詞) 田地的土壤。
　　例句：這站仔攏無落雨，田塗予日頭曝甲焦涸涸。Tsit-tsām-á lóng bô lo̍h-hōo, tshân-thôo hōo ji̍t-thâu pha̍k kah ta-khok-khok. (這陣子都沒有下雨，田裡的土壤被太陽曬得乾巴巴的。)
97.	藏步（tshàng-pōo）(動詞) 藏私、留一手。不將自己知道的技術或祕密傳授予他人。
　　例句：伊牽師仔透底攏袂藏步。I khan sai-á thàu-té lóng bē tshàng-pōo. (他教授徒弟一向都不會藏私。)
98.	臭尿破羶（tshàu-jiō-phuà-hiàn/tshàu-liō-
phuà-hiàn）(名詞) 指尿騷味。
　　例句：嬰仔的尿苴仔敢無換？無臭尿破羶哪會遮爾重？Enn-á ê jiō-tsū-á kám bô uānn? Bô tshàu-jiō-phuà-hiàn ná ē tsiah-nī tāng? (嬰兒的尿布難道沒換嗎？不然尿騷味怎麼會這麼濃？)
99.	生傷（tshenn-siong/tshinn-siong）(名詞) 新傷。剛受的傷、新的傷口。
　　例句：伊跋倒躄落去塗跤，額頭有生傷，愛緊消毒糊藥仔，才袂發炎。I pua̍h-tó phih lo̍h-khì thôo-kha, hia̍h-thâu ū tshenn-siong, ài kín siau-to̍k kôo io̍h-á, tsiah bē huat-iām. (他跌倒臉朝下仆倒在地，額頭有新的傷口，要趕緊消毒擦藥，才不會發炎。)
100.	車逝（tshia-tsuā）(名詞) 車班、車次。有固定路線，並按排定時間行駛的車輛。
　　例句：走這條線的公車，車逝真少。Tsáu tsit tiâu suànn ê kong-tshia, tshia-tsuā tsin tsió. (跑這條路線的公車，車班很少。)
101.	請佮辭（tshiánn-kah-sî）(熟語) 婉轉而堅定的回絕。
　　例句：旺伯仔看著里長𤆬阿雄欲來會失禮，即時共這陣人請佮辭，叫𪜶毋免入門。Ōng peh--á khuànn-tio̍h lí-tiúnn tshuā A-hiông beh lâi huē-sit-lé, tsik-sî kā tsit tīn lâng tshiánn-kah-sî, kiò in m̄-bián ji̍p-mn̂g. (旺伯看到里長帶阿雄要來道歉，立即婉轉而堅 定的拒絕他們，叫他們不用進門。)
102.	清湯（tshing-thng）(名詞) 清湯。沒有加任何菜，只有稍加調味的湯。
　　例句：我足喙焦，食麵的時湯啉了，閣請頭家𣁳寡清湯予我。Guá tsiok tshuì-ta, tsia̍h mī ê sî thng lim-liáu, koh tshiánn thâu- ke khat kuá tshing-thng hōo--guá. (我口好渴，吃麵的時候把湯喝完，又請老闆舀些清湯給我。)
103.	縱貫（tshiong-kuàn）(形容詞) 形容直線貫穿、貫通的樣子。
　　例句：臺灣西爿的縱貫公路就是人定咧講的臺一線省道。Tâi-uân sai-pîng ê tshiong-kuàn kong-lōo tō sī lâng tiānn teh kóng ê Tâi-it-suànn Síng-tō. (臺灣西邊的縱貫公路就是大家常說的臺一線省道。)
104.	手節（tshiú-tsat）(名詞) 手腕。手掌與手臂相接的部分。
　　例句：伊這站仔定定加班，電腦用傷久，手節毋但搐搐疼閣略仔腫腫。I tsit-tsām-á tiānn-tiānn ka-pan, tiān-náu iōng siunn kú, tshiú-tsat m̄-nā tiuh-tiuh thiànn koh lio̍h-á tsíng-tsíng. (他這陣子常常加班，電腦使用過久，手腕不只抽痛還稍微腫起來。)
105.	取中欄（tshú-tiong-nuâ）(動詞) 折衷。調和各方面的意見使各方都能接受。
　　例句：政策欲執行無遐簡單，有人愛東就有人愛西，有時姑不將著愛取中欄。Tsìng-tshik beh tsip-hîng bô hiah kán-tan, ū lâng ài tang tō ū lâng ài sai, ū-sî koo-put-tsiong tio̍h-ài tshú-tiong-nuâ. (政策要執行沒那麼簡單，大家各有所好，有時候不得已就得 要折衷一下。)
106.	揣空縫（tshuē-khang-phāng/tshē-khang-
phāng）(動詞) 故意挑剔，苛求責備，吹毛求疵。強調時可重疊做「揣空揣縫」。
　　例句：師傅講你是咧共你牽教，你毋通當做伊是咧揣空縫。Sai-hū kóng--lí sī teh kā lí khan-kà, lí m̄-thang tòng-tsò i sī teh tshuē-khang-phāng. (師傅說你是在牽引教導你，你不要當成他在找你麻煩。)
107.	喙饞（tshuì-sâi）(形容詞) 嘴饞、貪吃。
　　例句：囡仔人當咧大生本會喙饞，有歲的人為著健康就毋通傷枵饞。Gín-á-lâng tng-teh tuā senn-pún ē tshuì-sâi, ū-huè ê lâng uī-tio̍h kiān-khong tō m̄-thang siunn iau-sâi. (小孩子正在成長本來就會嘴饞，年長的人為了健康就別太貪吃。)
108.	喙𪁎（tshuì-tshi）1.(形容詞) 愛耍嘴皮子、愛逞口舌之快。	2.(動詞) 光說不練。
　　例句：1. 阿義就是喙𪁎，毋才定定佮厝邊咧冤家量債。A-gī tō sī tshuì-tshio, m̄-tsiah tiānn-tiānn kah tshù-pinn teh uan-ke-niû- tsè. (阿義就是饒舌多嘴，才會常常和鄰居吵架。) 2. 阿明上𠢕喙𪁎，做工課無半撇。A-bîng siōng gâu tshuì-tshio, tsò khang-khuè bô-puànn-phiat. (阿明很擅長口頭應答，做 事卻一竅不通。)
109.	接紲（tsiap-suà）1.(副詞) 連續、接連。	2.(動詞) 接手、接續。
　　例句：1. 這站仔接紲幾若日落大雨，臺灣中南部欠水的問題今解決矣。Tsit-tsām-á tsiap-suà kuí-nā ji̍t lo̍h tuā-hōo, Tâi-uân tiong- lâm-pōo khiàm tsuí ê būn-tê tann kái-kuat--ah. (這陣子接連好幾天下大雨，臺灣中南部缺水的問題現在解決了。) 2. 這間老牌的飯店欲收擔矣，向望有人通接紲。Tsit king láu-pâi ê pn̄g-tiàm beh siu-tànn--ah, ǹg-bāng ū lâng thang tsiap-suà. (這間經營多年的飯店要歇業了，希望有人能夠接手。)
110.	照品照行（tsiàu-phín-tsiàu-kiânn）(熟語) 照約定做、依約行事。
　　例句：你允人的條件愛照品照行，袂使反僥喔。Lí ín--lâng ê tiâu-kiānn ài tsiàu-phín-tsiàu-kiânn, bē-sái huán-hiau--ooh. (你答應 別人的條件要依約行事，不能反悔喔。)
111.	精傱（tsing-tsông）1.(形容詞) 積極努力、用心。	2.(形容詞) 像樣。
　　例句：1. 做代誌毋就較精傱咧，才袂三做四毋著，串做攏無彩工。Tsò tāi-tsì m̄-tō khah tsing-tsông--leh, tsiah bē sann tsò sì m̄-tio̍h, tshuàn tsò lóng bô-tshái-kang. (做事情就得積極用心，才不會錯誤連篇，老是白費工。) 2. 出外咧食人的頭路，一身軀若穿甲垃圾哩囉，會予人笑講無精傱。Tshut-guā teh tsia̍h lâng ê thâu-lōo, tsi̍t-sin-khu nā tshīng kah lah-sap-li-lo, ē hōo lâng tshiò kóng bô tsing-tsông. (出門在外上班的人，衣服穿得髒兮兮的，會被嘲笑不像個人 樣。)
112.	執死訣（tsip-sí-kuat）(熟語) 固執守舊。一意孤行、不知變通。
　　例句：做人毋通執死訣，愛綴會著時代。Tsò-lâng m̄-thang tsip-sí-kuat, ài tuè ē tio̍h sî-tāi. (做人不要固執守舊，要跟得上時代。)
113.	這久（tsit-kú）(時間詞) 現在、這當下。
　　例句：這久我當咧無閒，聽候我無閒煞才共你鬥相共。Tsit-kú guá tng-teh bô-îng, thìng-hāu guá bô-îng suah tsiah kā lí tàu- sann-kāng. (這當下我正在忙，等我忙完再幫你。)
114.	水捘仔（tsuí-tsūn-á）(名詞) 水龍頭、水閥。
　　例句：手若洗好勢，水捘仔就愛捘予絚，水才袂拍損去。Tshiú nā sé hó-sè, tsuí-tsūn-á tō ài tsūn hōo ân, tsuí tsiah bē phah- sńg--khì. (洗完手，水龍頭要鎖緊，才不會浪費水。)
115.	注神（tsù-sîn）(動詞) 注意、專心。
　　例句：咱用車床咧車物件著較注神咧，無車刀是真危險。Lán iōng tshia-tshn̂g teh tshia mi̍h-kiānn tio̍h khah tsù-sîn--leh, bô tshia-to sī tsin guî-hiám. (我們用車床車東西要全神貫注，否則車刀是很危險的。)
116.	大葩尾（tuā-pha-bué/tuā-pha-bé）(名詞) 好的結果、善終。
　　例句：伊對人客氣閣不時幫贊艱苦人，後日仔定著會大葩尾。I tuì lâng kheh-khì koh put-sî pang-tsān kan-khóo-lâng, āu-ji̍t-á tiānn-tio̍h ē tuā-pha-bué. (他對人客氣又經常幫助窮困的人，日後一定會有好晚景。)
117.	拄著仔（tú-tio̍h--á）(副詞) 偶爾。
　　例句：火鍋我是無定定食，拄著仔食一擺爾爾。Hué-ko guá sī bô tiānn-tiānn tsia̍h, tú-tio̍h--á tsia̍h--tsi̍t-pái niā-niā. (火鍋我不常 吃，偶爾吃一吃罷了。)
118.	有𦉎無捾（ū-sui-bô-kuānn）(熟語) 茶壺的出水部位為「茶罐仔𦉎」(tê-kuàn-á-sui)，即壺嘴；而手取茶壺
　　例句：之處為「捾耳」(kuānn-hīnn)，即上提把或側提把。茶壺有壺嘴卻沒提把，使用不便，用來比喻不合理、沒意義、不著邊際、不切實際或浮而不實的事情。 伊見講都講彼有𦉎無捾的代誌，哪會遐濟人閣聽甲信信信？I kiàn kóng to kóng he ū-sui-bô-kuānn ê tāi-tsì, ná ē hiah tsē lâng koh thiann kah sìn-sìn-sìn? (他老是只會說那些不切實際的事，怎麼還那麼多人聽得深信不疑？)
119.	活骨（ua̍h-kut）(形容詞) 好動。
　　例句：彼个囡仔誠活骨，規日無一時恬。Hit ê gín-á tsiânn ua̍h-kut, kui-ji̍t bô tsi̍t-sî tiām. (那個孩子非常好動，整天一刻也靜不下 來。)
120.	話鬚（uē-tshiu）(名詞) 隻字片語。話語裡的細微末節。
　　例句：伊罕得有家己的想法，干焦會曉承人的話鬚。I hán-tit ū ka-kī ê siūnn-huat, kan-na ē-hiáu sîn lâng ê uē-tshiu. (他很少有 自己的意見，只會鸚鵡學舌。)

序號	新增詞條	詞條讀音	台語例句	例句羅馬拼音	華語釋義

1.	爸仔（pâ--á）
　　例句：爸仔，你敢有欲出國去日本𨑨迌？
　　Pâ--á, lí kám ū beh tshut-kok khì Ji̍t-pún tshit-thô?
　　華語：爸爸，你有沒有要出國去日本玩呢？
2.	小盤（sió-puânn）
　　例句：阮做小盤的不比大盤的生理做遐大，愛薄利多銷才較有利純通趁
　　Guán tsò sió-puânn--ê put-pí tuā-puânn--ê sing-lí tsò hiah tuā, ài po̍h-lī to siau tsiah khah ū lī-sûn thang thàn.
　　華語：我們做零售商的不比大盤商生意做得那麼大，得薄利多銷才比較有利潤可賺
3.	死好（sí-hó）
　　例句：你死好啦！叫你莫耍股票，你就干干仔欲，今輸甲褪褲矣乎
　　Lí sí-hó--lah! Kiò lí mài sńg kóo-phiò, lí tō kan-kan-á beh, tann su kah thǹg-khòo--ah--honnh.
　　華語：你活該啦！叫你不要玩股票，你就偏偏要，現在輸到連內褲都沒了
4.	剪筊（tsián-kiáu）
　　例句：若欲和朋友佇生份所在佮無熟似的人拍麻雀，著愛斟酌是毋是會予人剪筊去
　　Nā beh hām pîng-iú tī senn-hūn sóo-tsāi kah bô si̍k-sāi ê lâng phah-muâ-tshiok, tio̍h-ài tsim-tsiok sī m̄ sī ē hōo lâng tsián-kiáu--khì.
　　華語：如果要和朋友在陌生的地方與不認識的人打麻將，要留意是否有人在設局詐賭
5.	整筊（tsíng-kiáu）
　　例句：伊少年袂曉想，整筊行歹路，佳哉這陣收跤洗手，做正當的頭路矣
　　I siàu-liân bē-hiáu siūnn, tsíng-kiáu kiânn pháinn-lōo, ka-tsài tsit-tsūn siu-kha-sé-tshiú, tsò tsìng-tong ê thâu-lōo--ah.
　　華語：他年輕時不懂事，開設賭場走偏了路，還好現在走回正途，從事正當工作了
6.	有親（ū-tshin）
　　例句：阮三叔公誠有親，定定辦桌請阮，予阮遮的序細仔足感心的。
　　Guán sann-tsik-kong tsiânn ū-tshin, tiānn-tiānn pān-toh tshiánn--guán, hōo guán tsia-ê sī-sè-á tsiok kám-sim--ê.
　　華語：我三叔公很看重親屬情誼，常常設宴請我們，讓我們這些晚輩非常感恩。
7.	跋歹筊（pua̍ h-pháinn-kiáu）
　　例句：若招親情五十來厝裡拍麻雀做議量，仙都毋通跋歹筊，才袂共親堂、朋友總得失了了。
　　Nā tsio tshin-tsiânn-gōo-tsa̍p lâi tshù--lí phah-muâ-tshiok tsò-gī-niū, sian to m̄-thang pua̍h-pháinn-kiáu, tsiah bē kā tshin-tông, pîng-iú tsóng tik-sit-liáu-liáu.
　　華語：若邀親朋好友來家裡打麻將做消遣，千萬不可設局詐賭，才不會把親戚、朋友都得罪光。
8.	食清（tsia̍h-tshing）
　　例句：老歲仔人若身體勇健、心情樂暢，手頭閣有寡，就較有才調踏入到食清、睏宮、人精英的坎站。
　　Lāu-huè-á-lâng nā sin-thé ióng-kiānn, sim-tsîng lo̍k-thiòng, tshiú-thâu koh ū--kuá, tō khah ū tsâi-tiāu ta̍h-ji̍p kàu tsia̍h-tshing, khùn-king, lâng tsing-ing ê khám-tsām.
　　華語：老人家如果能維持身體健康、心情舒暢，手頭上又富裕些，才有辦法進入到吃飯不欠人情，不必感謝他人，無憂無慮的境界。
9.	跕跤（liam-kha）
　　例句：看著𪜶阿爸坐佇客廳的膨椅盹龜，伊跕跤勻勻仔行過去，驚共𪜶阿爸吵精神。
　　Khuànn-tio̍h in a-pah tsē tī kheh-thiann ê phòng-í tuh-ku, i liam-kha ûn-ûn-á kiânn--kuè-khì, kiann kā in a-pah tshá tsing-sîn.
　　華語：看到他爸爸坐在客廳的沙發椅上打瞌睡，他踮起腳尖輕輕走過去，怕把他爸爸吵醒了。
10.	好枝骨（hó-ki-kut）
　　例句：阮牽的少年真好枝骨，可惜中年以後無咧保養，身材煞走精去。
　　Guán  khan--ê siàu-liân tsin hó-ki-kut, khó-sioh tiong-liân í-āu bô teh pó-ióng, sin-tsâi suah tsáu-tsing--khì.
　　華語：我老婆年輕時身材很好，可惜中年之後沒有保養，身材卻走樣了。
11.	烏昏（oo-hng）
　　例句：做服務業，對人客著較好笑神咧，毋通定定激一个烏昏面。
　　Tsò ho̍k-bū-gia̍p, tuì lâng-kheh tio̍h khah hó-tshiò-sîn--leh, m̄-thang tiānn-tiānn  kik tsi̍t ê oo-hng bīn.
　　華語：從事服務業，對客人得經常面帶笑容，不要常常擺出嚴肅的神色。
12.	服藥（ho̍k-io̍h）
　　例句：食抗生素治療細菌感染，的確著按時服藥，好原全才會使停藥。
　　Tsia̍h khòng-sing-sòo tī-liâu sè-khún kám-jiám, tik-khak tio̍h àn-sî ho̍k-io̍h, hó guân-tsuân tsiah ē-sái thîng io̍h.
　　華語：服用抗生素來治療細菌感染，務必得按時吃藥，痊癒後才可以停藥。
13.	掠中和（lia̍h-tiong-hô）
　　例句：咱的意見差傷濟，規氣兩爿攏退一步，掠中和敢好？
　　Lán ê ì-kiàn tsha siunn tsē, kui-khì nn̄g-pîng lóng thè tsi̍t pōo, lia̍h-tiong-hô kám hó?
　　華語：我們的意見相差太多，乾脆雙方都退讓一步，採折衷做法好嗎？
14.	纘袂牢（tsàn-bē-tiâu）
　　例句：這隻牛規工佇田裡作穡，跤骨纘袂牢，蝹佇塗跤𬦰袂起來。
　　Tsit tsiah gû kui-kang tī tshân--lí tsoh-sit, kha-kut tsàn bē tiâu, un tī thôo-kha peh bē khí--lâi.
　　華語：這頭牛整天在田裡耕作，腿支撐不住，癱在地上爬不起來。
15.	雞喙變鴨喙（ke-tshuì piàn ah-tshuì）
　　例句：我提一千箍去𥴊仔店買五十箍的物件，頭家娘找我四百五。我講伊找毋著，伊一直諍講我予伊五百箍。等錄影看了，伊隨雞喙變鴨喙。
　　Guá the̍h tsi̍t-tshing khoo khì kám-á-tiàm bé gōo-tsa̍p khoo ê mi̍h-kiānn, thâu-ke-niû tsāu guá sì-pah-gōo. Guá kóng i tsāu m̄-tio̍h, i it-ti̍t tsènn kóng guá hōo i gōo-pah khoo. Tán lo̍k-iánn khuànn-liáu, i suî ke-tshuì piàn ah-tshuì.
　　華語：我拿一千塊到雜貨店買五十塊的東西，老闆娘找我四百五。我說他找錯了，她一直爭辯說我給她五百塊。等看過錄影，她立刻啞口無言。
16.	㧣風（tu-hong）
　　例句：透早騎跤踏車去學校的時，拄好咧𬦰崎閣著㧣風，騎甲怦怦喘。
　　Thàu-tsá khiâ kha-ta̍h-tshia khì ha̍k-hāu ê sî, tú-hó teh peh-kiā koh tio̍h tu-hong, khiâ kah phēnn-phēnn-tshuán.
　　華語：早上騎腳踏車去學校的時候，正巧在爬坡又得頂著風，騎得氣喘吁吁。
17.	抱心（phō-sim）
　　例句：你若定定抱心，心臟跳了無正常，著愛緊去予醫生看！
　　Lí nā tiānn-tiānn phō-sim, sim-tsōng thiàu liáu bô tsìng-siông, tio̍h-ài kín khì hōo i-sing khuànn!
　　華語：你若常心悸，心跳不正常，得趕緊去看醫生！
18.	心適興（sim-sik-hìng）
　　例句：伊欲出國是看心情，見若心適興，飛行機票買落就出去。
　　I beh tshut-kok sī khuànn sim-tsîng, kiàn-nā sim-sik-hìng, hue-lîng-ki-phiò bé--lo̍h tō tshut--khì.
　　華語：他想出國是取決於心情，只要興起，機票買了就飛出去了。
19.	割引（kuah-ín）
　　例句：我見擺都共這間冊店交關，這擺一下手就買欲五千，結局嘛是無割引。
　　Guá kiàn-pái to kā tsit king tsheh-tiàm kau-kuan, tsit pái tsi̍t-ē-tshiú tō bé beh gōo-tshing, kiat-kio̍k mā sī bô kuah-ín.
　　華語：我每次都去這間店光顧，這次一口氣就買了近五千元，結果還是沒有折扣。
20.	大圓（tuā-înn）
　　例句：阮阿公定講日本時代的錢加真大圓。
　　Guán a-kong tiānn kóng Ji̍t-pún sî-tāi ê tsînn ke tsin tuā-înn.
　　華語：我爺爺常說日治時期的錢幣值高很多。
21.	大晡日（tuā-poo-ji̍t）
　　例句：趁今仔日大晡日，棉襀被緊挔出來曝曝咧。
　　Thàn kin-á-ji̍t tuā-poo-ji̍t, mî-tsioh-phuē kín hiannh tshut-lâi pha̍k-pha̍k--leh.
　　華語：趁今天是大晴天，棉被趕緊拿出來曬一曬。
22.	笑色（tshiò-sik）
　　例句：笑色的衫略仔沐著垃圾就看現現。
　　Tshiò-sik ê sann lio̍h-á bak-tio̍h lah-sap tō khuànn-hiān-hiān.
　　華語：淺色的衣服稍微沾了髒污就看得清清楚楚。
23.	歹鬼𤆬頭（pháinn-kuí-tshuā-thâu）
　　例句：這陣囡仔會遮挐，攏嘛是伊咧歹鬼𤆬頭。
　　Tsit tīn gín-á ē tsiah jû, lóng mā sī i teh pháinn-kuí-tshuā-thâu.
　　華語：這些孩子會這麼無理取鬧，都是他帶頭起鬨的。
24.	半身不隨（puàn-sin-put-suî）
　　例句：伊中風了後就半身不隨矣。
　　I tiòng-hong liáu-āu tō puàn-sin-put-suî--ah.
　　華語：他中風了以後就半身不遂了。
25.	交定（kau-tiānn）
　　例句：若想欲共人買較貴的物件，愛先交定才有準算。
　　Nā siūnn-beh kā lâng bé khah kuì ê mi̍h-kiānn, ài sing kau-tiānn tsiah ū tsún-sǹg.
　　華語：如果想跟別人買比較貴的東西，要先付訂金才算數。
26.	半仿仔（puànn-hóng-á）
　　例句：有人講半仿仔頭腦會較好，身體嘛會較健康。
　　Ū lâng kóng puànn-hóng-á thâu-náu ē khah hó, sin-thé mā ē khah kiān-khong.
　　華語：有人說混血兒頭腦會比較好，身體也會比較健康。
27.	仿仔（hóng-á）
　　例句：專工出國去買一跤皮包仔轉來，煞去買著仿仔，想著誠厭氣。
　　Tsuan-kang tshut-kok khì bé tsi̍t kha phuê-pau-á tńg--lâi, suah khì bé-tio̍h hóng-á, siūnn tio̍h tsiânn iàn-khì.
　　華語：專程出國去買一個皮包回來，卻買到仿冒品，想起來真是一肚子氣。
28.	淺現（tshián-hiān）
　　例句：囡仔冊攏會寫甲真淺現，若用傷深的詞，驚囡仔人較僫理解。
　　Gín-á-tsheh lóng ē siá kah tsin tshián-hiān, nā īng siunn tshim ê sû, kiann gín-á-lâng khah oh lí-kái.
　　華語：童書都會寫得淺顯易懂，若使用太艱澀的詞彙，恐怕小孩子較難理解。
29.	軟蜞（nńg-khî）
　　例句：軟蜞生活佇陰暗溼氣重的所在。
　　Nńg-khî sing-ua̍h tī im-àm sip-khì tāng ê sóo-tsāi.
　　華語：蛞蝓生活在陰暗潮溼的地方。
30.	過家（kuè-ke/kè-ke）
　　例句：較早的人感覺查某人愛過家毋是好代誌。
　　Khah-tsá ê lâng kám-kak tsa-bóo-lâng ài kuè-ke m̄ sī hó tāi-tsì.
　　華語：以前的人覺得女人喜歡串門子不是好事。
31.	老風騷（lāu-hong-so）
　　例句：伊食到六十外矣，猶閣咧蹔酒家、揣粉味，實在是老風騷。
　　I tsia̍h kàu la̍k-tsa̍p-guā--ah, iáu-koh teh tsàm tsiú-ka, tshuē hún-bī, si̍t-tsāi sī lāu-hong-so.
　　華語：他都六十幾歲了，還在上酒店、喝花酒，實在是個老風流。
32.	理家（lí-ke）
　　例句：阮新婦誠𠢕理家。
　　Guán sin-pū tsiânn gâu lí-ke.
　　華語：我媳婦很會操持家務。
33.	白直（pe̍h-ti̍t）
　　例句：伊雖然個性較白直，毋過心肝真善良，袂去害人。
　　I sui-jiân kò-sìng khah pe̍h-ti̍t, m̄-koh sim-kuann tsin siān-liông, bē khì hāi--lâng.
　　華語：他雖然個性較死心眼，但心地善良，不會做傷害人的事。
34.	乒乓（phi̋n-phóng）
　　例句：拍乒乓需要有場地佮對手。
　　Phah phi̋n-phóng su-iàu ū tiûnn-tē kah tuì-tshiú.
　　華語：打桌球需要有場地跟對手。
35.	皮皮仔（phuê-phuê-á）
　　例句：伊跟做木師傅都學猶未一冬咧，工夫皮皮仔爾爾！
　　I kin tsò-ba̍k sai-hū to o̍h iáu-buē tsi̍t tang--leh, kang-hu phuê-phuê-á niā-niā!
　　華語：他跟木工師父學不到一年，技術略知一點皮毛而已！
36.	稻草囷（tiū-tsháu-khûn）
　　例句：較早作穡人會共稻草摠做稻草囷用來燃火。
　　Khah-tsá tsoh-sit-lâng ē kā tiū-tsháu tsáng-tsò tiū-tsháu-khûn iōng-lâi hiânn-hué.
　　華語：從前農人會把稻草紮成稻草束用來生火。
37.	貓神（niau-sîn）
　　例句：伊做代誌實在傷過貓神，一點點仔缺點都袂使有。
　　I tsò tāi-tsì si̍t-tsāi siunn kuè niau-sîn, tsi̍t-tiám-tiám-á khuat-tiám to bē-sái ū.
　　華語：他做事情實在太過挑剔了，一點點缺點也不能發生。
38.	喙凊（tshuì-tshìn）
　　例句：我若喙凊，就緊含一粒鹹梅仔。
　　Guá nā tshuì-tshìn, tō kín kâm tsi̍t lia̍p kiâm-muê-á.
　　華語：我如果噁心想吐，就趕緊含一粒話梅。
39.	轉成（tńg-tsiânn）
　　例句：囡仔豚當咧轉成，莫怪一頓食幾若碗飯。
　　Gín-á-thûn tng-teh tńg-tsiânn, bo̍k-kuài tsi̍t tǹg tsia̍h kuí-nā uánn pn̄g.
　　華語：青少年正在發育，難怪一餐吃好幾碗飯。
40.	笑粉（tshiò-hún）
　　例句：伊毋但面肉媠閣笑粉。
　　I m̄-nā bīn-bah suí koh tshiò-hún.
　　華語：他不僅長得美，皮膚也很粉嫩。
41.	相換工（sio-uānn-kang）
　　例句：咧欲割稻仔矣，咱來相換工，我先共你鬥割。
　　Teh-beh kuah-tiū-á--ah, lán lâi sio-uānn-kang, guá sing kā lí tàu kuah.
　　華語：快要收割稻子了，我們來互助工作，我先幫你收割。
42.	骨目（kut-ba̍k）
　　例句：關節炎若夯起來，骨目就會痠軟疼。
　　Kuan-tsat-iām nā giâ--khí-lâi, kut-ba̍k tō ē sng-nńg-thiànn.
　　華語：關節炎如果發作，骨節就會又痠又痛。
43.	慢手（bān-tshiú）
　　例句：你跤手毋就較猛掠咧，傷慢手就做無工課。
　　Lí kha-tshiú m̄-tō khah mé-lia̍h--leh, siunn bān-tshiú tō tsò bô khang-khuè.
　　華語：你動作要敏捷一點，動作太慢工作就沒有進度。
44.	拍雄（phah-hîng）
　　例句：雞母愛予雞公拍雄過，生出來的卵孵雞仔囝才孵會出來。
　　Ke-bó ài hōo ke-kang phah-hîng--kuè, senn--tshut-lâi ê nn̄g pū ke-á-kiánn tsiah pū ē tshut--lâi.
　　華語：母雞要跟公雞交配受精過，生出來的蛋才孵得出小雞來。
45.	邊頭（pinn--thâu）
　　例句：人咧相拍，你莫徛踮邊頭較安全。
　　Lâng teh sio-phah, lí mài khiā tiàm pinn--thâu khah an-tsuân.
　　華語：人家在打架，你不要站旁邊較安全。
46.	土符仔（thóo-hû-á）
　　例句：伊宿題攏烏白寫，凊彩撇撇咧，若親像咧畫土符仔。
　　I siok-tê lóng oo-pe̍h siá, tshìn-tshái phiat-phiat--leh, ná-tshin-tshiūnn teh uē thóo-hû-á.
　　華語：他功課都胡亂寫，隨便撇一撇，好像在畫符咒。
47.	素料（sòo-liāu）
　　例句：這馬的人注重養生，所以真濟人食素，四界攏有賣素料的店頭。
　　Tsit-má ê lâng tsù-tiōng ióng-sing, sóo-í tsin tsē lâng tsia̍h-sòo, sì-kè lóng ū bē sòo-liāu ê tiàm-thâu.
　　華語：現代人重視養生，所以很多人吃素，到處都有賣素料的商店。
48.	目彩（ba̍k-tshái）
　　例句：阿美仔𠢕妝娗，目彩畫甲足有神的。
　　A-bí--á gâu tsng-thānn, ba̍k-tshái uē kah tsiok ū-sîn--ê.
　　華語：阿美很會妝扮，眼影畫得很有神采。
49.	掂篤（tìm-táu）
　　例句：囡仔的冊包攏是冊，逐跤都足掂篤。
　　Gín-á ê tsheh-pau lóng sī tsheh, ta̍k kha to tsiok tìm-táu.
　　華語：小孩子的書包都是書，每個都很重。
50.	現仔（hiān-á）
　　例句：這間店無接受信用卡，欲買物件攏愛納現仔。
　　Tsit king tiàm bô tsiap-siū sìn-iōng-khah, beh bé mi̍h-kiānn lóng ài la̍p hiān-á.
　　華語：這家店不接受信用卡，要買東西都得付現金。
51.	偷走學（thau-tsáu-o̍h）
　　例句：伊讀冊的時不時偷走學，予爸母、老師真頭疼。
　　I tha̍k-tsheh ê sî put-sî thau-tsáu-o̍h, hōo pē-bú, lāu-su tsin thâu-thiànn.
　　華語：他上學的時候經常逃學，讓父母、老師很頭痛。
52.	做鬧熱（tsò-lāu-jia̍t）
　　例句：聽講廟埕這陣當咧做鬧熱，你敢欲同齊來去看？
　　Thiann-kóng biō-tiânn tsit-tsūn tng-teh tsò-lāu-jia̍t, lí kám beh tâng-tsê lâi-khì khuànn?
　　華語：聽說廟前的大廣場現正有迎神賽會，你要一起去看嗎？
53.	現貨（hiān-huè）
　　例句：遮的是阮店裡賰的現貨，看你佮意佗一雙，我會當俗俗仔賣予你喔！
　　Tsia--ê sī guán tiàm--lí tshun ê hiān-huè, khuànn lí kah-ì tó tsi̍t siang, guá ē-tàng sio̍k-sio̍k-á bē hōo--lí--ooh!
　　華語：這些是我們店裡所剩的現貨，看你喜歡哪一雙，我可以便宜賣給你喔！
54.	細漢的（sè-hàn--ê）
　　例句：阮細漢的今年欲讀大學矣。
　　Guán sè-hàn--ê kin-nî beh tha̍k tāi-ha̍k--ah.
　　華語：我們家老么今年要上大學了。
55.	三不服（sam-put-ho̍k）
　　例句：古早人講：「蜈蚣、蛤仔、蛇，三不服。」是咧講這三種動物毋但相忌爾爾，閣會相剋。
　　Kóo-tsá-lâng kóng, “Giâ-kang, kap-á, tsuâ, sam-put-ho̍k.” Sī teh kóng tsit sann tsióng tōng-bu̍t m̄-nā sio-khī niā-niā, koh ē sio-khik.
　　華語：古人說：「蜈蚣、青蛙、蛇，是死對頭。」是指這三種動物非但相忌，還會相剋。
56.	起底（khí-té）
　　例句：伊用一百萬起底去做生理，料袂到這馬煞變做一个億來億去的好額人。
　　I īng tsi̍t-pah bān khí-té khì tsò-sing-lí, liāu-bē-kàu tsit-má suah piàn-tsò tsi̍t ê ik-lâi-ik-khì ê hó-gia̍h-lâng.
　　華語：他拿本錢一百萬去做生意，想不到現在已經成為億萬富豪。
57.	窞倕（thām-thuī）
　　例句：捾佇手裡的一袋麵粉一直窞倕落來。
　　Kuānn tī tshiú--lí ê tsi̍t tē mī-hún it-ti̍t thām-thuī--lo̍h-lâi.
　　華語：提在手裡的一袋麵粉一直往下垂落。
58.	時景（sî-kíng）
　　例句：這陣的時景佮較早袂比得矣。
　　Tsit-tsūn ê sî-kíng kah khah-tsá bē-pí--tit--ah.
　　華語：現今的景況跟先前不能相比了。
59.	鹹水貨（kiâm-tsuí-huè）
　　例句：現此時欲買鹹水貨加誠利便。
　　Hiān-tshú-sî beh bé kiâm-tsuí-huè ke tsiânn lī-piān.
　　華語：現在想要買舶來品方便多了。
60.	粗幼（tshoo-iù）
　　例句：人客有共阮品講這批甘蔗，粗幼袂使精差傷濟。
　　Lâng-kheh ū kā guán phín kóng tsit phue kam-tsià, tshoo-iù bē-sái tsing-tsha siunn tsē.
　　華語：客人跟我們約定了這批甘蔗，直徑的大小不能相差太多。
61.	偷走厝（thau-tsáu-tshù）
　　例句：囡仔偷走厝的原因真複雜，有真濟是因為家庭失能造成的。
　　Gín-á thau-tsáu-tshù ê guân-in tsin ho̍k-tsa̍p, ū tsin tsē sī in-uī ka-tîng sit-lîng tsō-sîng--ê.
　　華語：小孩子離家出走的原因很複雜，有很多是因為家庭失能造成的。
62.	款勢（khuán-sè）
　　例句：看伊攑菜刀剁肉、切菜的款勢誠熟手，對煮食應該真有經驗。
　　Khuànn i gia̍h tshài-to tok bah, tshiat tshài ê khuán-sè tsiânn si̍k-tshiú, tuì tsú-tsia̍h ing-kai tsin ū king-giām.
　　華語：看他拿菜刀剁肉、切菜的架式十分上手，對烹飪應該很有經驗。
63.	挐頭（jû-thâu）
　　例句：彼个囡仔磕袂著就挐頭使性地，實在足毋是款！
　　Hit ê gín-á kha̍p-bē-tio̍h tō jû-thâu sái-sìng-tē, si̍t-tsāi tsiok m̄-sī-khuán!
　　華語：那個孩子動不動就胡鬧耍脾氣，實在很不像樣！
64.	退悔（thè-hué）
　　例句：少年顧𨑨迌，食老顧退悔。
　　Siàu-liân kòo tshit-thô, tsia̍h-lāu kòo thè-hué.
　　華語：年少縱情玩樂，老來忙著悔恨。
65.	紲話（suà-uē）
　　例句：阿峰一下聽著組員報告煞，紲話落去補充伊拄才無講著的資料。
　　A-hong tsi̍t-ē thiann-tio̍h tsoo-uân pò-kò suah, suà-uē lo̍h-khì póo-tshiong i tú-tsiah bô kóng--tio̍h ê tsu-liāu.
　　華語：阿峰一聽到組員報告結束，接著下去補充他剛才沒提到的資料。
66.	帕尾（phè-bué/phè-bé）
　　例句：阿華痟跋筊，一四界欠數，攏嘛𪜶翁咧共伊帕尾。
　　A-huâ siáu pua̍h-kiáu, tsi̍t-sì-kè khiàm-siàu, lóng mā in ang teh kā i phè-bué.
　　華語：阿華沉迷賭博，到處欠債，都是他先生替他善後的。
67.	圇痀（lun-ku）
　　例句：雞著災了後，雖罔無死，煞圇痀去，飼攏袂大格。
　　Ke tio̍h-tse liáu-āu, sui-bóng bô sí, suah lun-ku--khì, tshī lóng bē tuā-keh.
　　華語：雞得了雞瘟後，雖然沒死，卻日漸萎縮，怎麼養都養不大。
68.	是年是節（sī-nî-sī-tseh）
　　例句：佇庄跤所在，毋管好額抑散赤，是年是節攏愛趁人的樣做粿、刣精牲仔，才袂予人看衰。
　　Tī tsng-kha sóo-tsāi, m̄-kuán hó-gia̍h ia̍h sàn-tshiah, sī-nî-sī-tseh lóng ài thàn lâng ê iūnn tsò kué, thâi tsing-senn-á, tsiah bē hōo lâng khuànn-sue.
　　華語：在鄉下地方，無論貧富，逢年過節都要照別人的樣子做糕點、殺雞鴨，才不會被鄰居看輕。
69.	紅筋（âng-kin）
　　例句：咱人的心臟佮紅筋連做伙，成做血路循環的系統，若出問題，健康就會有影響。
　　Lán-lâng ê sim-tsōng kah âng-kin liân tsò-hué, tsiânn-tsò hueh-lōo sûn-khuân ê hē-thóng, nā tshut būn-tê, kiān-khong tō ē ū íng-hióng.
　　華語：我們人的心臟與血管連結，形成血液循環系統，若出問題就會影響健康。
70.	錦痀（gìm-ku）
　　例句：阿月仔頂擺車厄了後，人就略略仔錦痀，行路嘛加較慢淡薄。
　　A-gua̍t-á tíng-pái tshia-eh liáu-āu, lâng tō lio̍h-lio̍h-á gìm-ku, kiânn-lōo mā ke khah bān--tām-po̍h.
　　華語：阿月先前出了車禍，身形就呈現些許駝背，走起路來比較慢一點。
71.	雞毛管仔（ke-moo-kóng-á）
　　例句：這種藥粉有摻黃連，共伊做成雞毛管仔，較袂食著苦苦。
　　Tsit tsióng io̍h-hún ū tsham n̂g-nî, kā i tsò-sîng ke-mn̂g-kóng-á, khah bē tsia̍h tio̍h khóo-khóo.
　　華語：這種藥粉加了黃連，把它做成膠囊，吃起來比較不會苦苦的。
72.	搭粒（tah-lia̍p）
　　例句：𪜶兩个兄弟仔自細漢就做伙食、做伙睏，感情上搭粒，予人真欣羨。
　　In nn̄g ê hiann-tī-á tsū sè-hàn tō tsò-hué tsia̍h, tsò-hué khùn, kám-tsîng siōng tah-lia̍p, hōo lâng tsin him-siān.
　　華語：他們兩人從小就一起吃飯、就寢，感情很親密，讓人非常羨慕。
73.	無時無陣（bô-sî-bô-tsūn）
　　例句：阮大家官欲來阮兜看孫攏無時無陣，我定定都袂赴通準備。
　　Guán ta-ke-kuann beh lâi guán tau khuànn sun lóng bô-sî-bô-tsūn, guá tiānn-tiānn to bē-hù thang tsún-pī.
　　華語：我公婆要到我家來看孫子都不是在固定的時間，我常常都來不及準備。
74.	襟胸（khim-hing）
　　例句：襟胸的油質較低，閣有豐富的卵白質，是真濟選手運動了後的食物選擇。
　　Khim-hing ê iû-tsit khah kē, koh ū hong-hù ê nn̄g-pe̍h-tsit, sī tsin tsē suán-tshiú ūn-tōng liáu-āu ê si̍t-bu̍t suán-ti̍k.
　　華語：雞胸肉的油質較低，且有豐富的蛋白質，是很多選手運動之後的食物選擇。
75.	閹雞行（iam-ke-kiânn）
　　例句：教練叫我佮阿明練閹雞行，阿明忝跤我忝手。
　　Kàu-liān kiò guá kah A-bîng liān iam-ke-kiânn, A-bîng thiám kha guá thiám tshiú.
　　華語：教練叫我跟阿明練老漢推車，阿明累的是腳，我累的是手。
76.	漚搭（àu-tah）
　　例句：伊做人真漚搭，人也無去得失伊，伊煞一四界去烏白呾，講人攏對伊有偌䆀。
　　I tsò-lâng tsin àu-tah, lâng iā bô khì tik-sit--i, i suah tsi̍t-sì-kè khì oo-pe̍h tànn, kóng lâng lóng tuì i ū guā bái.
　　華語：他為人很糟糕，別人也沒得罪他，他卻四處胡說，說別人都對他有多不好。
77.	鐵衫（thih-sann）
　　例句：伊車禍傷著龍骨去開刀，了後著愛穿鐵衫來固定。
　　I tshia-hō siong-tio̍h liông-kut khì khui-to, liáu-āu tio̍h-ài tshīng thih-sann lâi kòo-tīng.
　　華語：他車禍脊椎受傷開刀，之後就要穿背架來支撐。
78.	攢辦（tshuân-pān）
　　例句：伊是一个負責任的人，交代予伊的代誌攏攢辦甲足周至的。
　　I sī tsi̍t ê hū-tsik-jīm ê lâng, kau-tài hōo i ê tāi-tsì lóng tshuân-pān kah tsiok tsiu-tsì--ê.
　　華語：他是一個負責任的人，交代給他的事項都準備得很周全。
79.	攘（jiāng/giāng）
　　例句：咱來攘，贏的人會使先騎車仔。
　　Lán lâi jiāng, iânn ê lâng ē-sái sing khiâ tshia-á.
　　華語：我們來猜拳，贏的人可以先騎車。
80.	閬站（làng-tsām）
　　例句：上課若閬站，我才敲電話予你。
　　Siōng-khò nā làng-tsām, guá tsiah khà tiān-uē hōo--lí.
　　華語：上課如果有空檔的時候，我再打電話給你。
81.	璇石喙（suān-tsio̍ h-tshuì）
　　例句：有一寡相命仙璇石喙，講甲糊瘰瘰，愛細膩。
　　Ū tsi̍t-kuá siòng-miā-sian suān-tsio̍h-tshuì, kóng kah hôo-luì-luì, ài sè-jī.
　　華語：有一些算命仙能言善道，說得天花亂墜，要小心。
82.	熱底（jia̍t-té）
　　例句：阮翁熱底的，𠢕流汗、不時喝喙焦，閣定定大便祕結。
　　Guán ang jia̍t-té--ê, gâu lâu-kuānn, put-sî huah tshuì-ta, koh tiānn-tiānn tāi-piān pì-kiat.
　　華語：我老公是熱性體質，容易流汗，老是說口渴，又常常便秘。
83.	鼻刀（phīnn-to）
　　例句：這馬有的人嫌家己的鼻刀傷凹，想欲去手術。
　　Tsit-má ū ê lâng hiâm ka-kī ê phīnn-to siunn nah, siūnn-beh khì tshiú-su̍t.
　　華語：現在有些人嫌自己鼻梁不夠高，想去動手術。
84.	照原（tsiàu-guân）
　　例句：這个計畫照原就好，毋通閣改矣。
　　Tsit ê kè-uē tsiàu-guân tō hó, m̄-thang koh kái--ah.
　　華語：這個計畫就照舊就好，不要再改了。
85.	嗤噌（tshi̍h-tshn̍gh）
　　例句：進仔干焦會對厝裡的人大細聲，拄著外人攏嘛毋敢嗤噌。
　　Tsìn--á kan-na ē tuì tshù--lí ê lâng tuā-sè-siann, tú-tio̍h guā-lâng lóng mā m̄ kánn tshi̍h-tshn̍gh.
　　華語：阿進只會對家人大小聲，遇到外人就不敢吭聲。
86.	摘名摘姓（tiah-miâ-tiah-sènn）
　　例句：咱對序大袂使摘名摘姓，愛共人照輩份來稱呼才有禮貌。
　　Lán tuì sī-tuā bē-sái tiah-miâ-tiah-sènn, ài kā lâng tsiàu puè-hūn lâi tshing-hoo tsiah ū-lé-māu.
　　華語：我們對長輩不能指名道姓，要依照輩份稱呼才有禮貌。
87.	慢分（bān-hun）
　　例句：十一點上北的火車慢分，愛閣二十分鐘才會到站。
　　Tsa̍p-it tiám tsiūnn-pak ê hué-tshia bān-hun, ài koh jī-tsa̍p hun-tsing tsiah ē kàu-tsām.
　　華語：十一點北上的火車誤點，得再二十分鐘才會到站。
88.	嶄然（tsám-jiân）
　　例句：阿娟的別莊整理甲嶄然四序。
　　A-kuan ê pia̍t-tsong tsíng-lí kah tsám-jiân sù-sī.
　　華語：阿娟的別墅整理得非常整齊、清潔。
89.	過通關（kuè-thong-kuan）
　　例句：彼个囡仔真厲害，逐項比賽攏有法度過通關。
　　Hit ê gín-á tsin lī-hāi, ta̍k hāng pí-sài lóng ū-huat-tōo kuè-thong-kuan.
　　華語：那個孩子非常厲害，每項比賽都能過關斬將。
90.	詼仙（khue-sian）
　　例句：伊是一个真愛烏白共人詼的詼仙，做人閣袂正經，逐家攏誠慼伊。
　　I sī tsi̍t ê tsin ài oo-pe̍h kā lâng khue ê khue-sian, tsò-lâng koh bē tsìng-king, ta̍k-ke lóng tsiânn tsheh--i.
　　華語：他是一個很喜歡隨便嘲弄他人的人，為人又不正派，大家都很討厭他。
91.	超磅（tshiau-pōng）
　　例句：電梯一時仔櫼遐濟人入來煞超磅，門關袂起來。
　　Tiān-thui tsi̍t-sî-á tsinn hiah tsē lâng ji̍p--lâi suah tshiau-pōng, mn̂g kuainn bē khí--lâi.
　　華語：電梯一下子擠那麼多人進來，以致超載門關不起來。
92.	著吊（tio̍h-tiàu）
　　例句：詐騙案件的受害者真濟攏是因為貪心才會著吊。
　　Tsà-phiàn àn-kiānn ê siū-hāi-tsiá tsin tsē lóng sī in-uī tham-sim tsiah ē tio̍h-tiàu.
　　華語：詐騙案件的受害者很多都是因為貪心才會上當。
93.	目降鬚聳（ba̍k-kàng-tshiu-tshàng）
　　例句：𪜶兩个較早有冤仇，這馬見若相拄就目降鬚聳。
　　In nn̄g ê khah-tsá ū uan-siû, tsit-má kiàn-nā sio-tú tō ba̍k-kàng-tshiu-tshàng.
　　華語：他們兩個從前有冤仇，現在每次相遇就吹鬍子瞪眼。
94.	近兜（kīn-tau）
　　例句：佇都會區，徛家若倚捷運站近兜，厝價攏會較懸。
　　Tī too-huē-khu, khiā-ke nā uá tsia̍t-ūn-tsām kīn-tau, tshù-kè lóng ē khah kuân.
　　華語：在都會區，若住家緊鄰捷運站附近，房價會比較高。
95.	強徒（kiông-tôo）
　　例句：伊拄對銀行領錢出來，雄雄一个強徒出手共伊的皮包仔搶去。
　　I tú tuì gîn-hâng niá tsînn tshut--lâi, hiông-hiông tsi̍t ê kiông-tôo tshut-tshiú kā i ê phuê-pau-á tshiúnn--khì.
　　華語：他剛從銀行領錢出來，突然一個搶匪動手搶走了他的皮包。
96.	致心（tì-sim）
　　例句：咱做代誌著致心。
　　Lán tsò tāi-tsì tio̍h tì-sim.
　　華語：我們做事必須專心致志。
97.	路長（lōo-tn̂g）
　　例句：你著較認真學咧，後擺才會較有路長。
　　Lí tio̍h khah jīn-tsin o̍h--leh, āu-pái tsiah ē khah ū lōo-tn̂g.
　　華語：你得認真一點學，將來才比較有出息。
98.	內家（lāi-ke）
　　例句：阿英對鹿港嫁去新竹，所以伊外家佇鹿港，內家佇新竹。
　　A-ing tuì Lo̍k-káng kè-khì Sin-tik, sóo-í i guā-ke tī Lo̍k-káng, lāi-ke tī Sin-tik.
　　華語：阿英從鹿港嫁到新竹，所以他娘家在鹿港，婆家在新竹。
99.	數佻（siàu-tiáu）
　　例句：數佻別人的差錯較緊，改變家己的欠點較僫。
　　Siàu-tiáu pa̍t-lâng ê tsha-tshò khah kín, kái-piàn ka-kī ê khiàm-tiám khah oh.
　　華語：數落他人的錯誤較快，改變自己的缺失較難。
100.	無底（bô-té）
　　例句：你就照這个課程聊聊仔綴老師學，準做無底，久來嘛會熟手。
　　Lí tō tsiàu tsit ê khò-tîng liâu-liâu-á tuè lāu-su o̍h, tsún-tsò bô-té, kú--lâi mā ē si̍k-tshiú.
　　華語：你就按照這個課程慢慢的跟著老師學習，即使沒有基礎，久了也會熟練。
101.	爸公業（pē-kong-gia̍p）
　　例句：爸母過身才幾冬爾爾，𪜶兜的爸公業就予伊開了了去矣。
　　Pē-bú kuè-sin tsiah kuí tang niā-niā, in tau ê pē-kong-gia̍p tō hōo i khai-liáu-liáu--khì--ah.
　　華語：父母過世才幾年光景而已，他家的祖產就被他敗光了。
102.	曷有一个（a̍h-ū-tsi̍t-ê）
　　例句：曷有一个叫囡仔莫去讀冊的。
　　A̍h-ū-tsi̍t-ê kiò gín-á mài khì tha̍k-tsheh--ê.
　　華語：哪有叫小孩不要去讀書的。
103.	無掛（bô-khuà）
　　例句：逐工加班，厝內攏無掛摒掃。
　　Ta̍k-kang ka-pan, tshù-lāi lóng bô-khuà piànn-sàu.
　　華語：每天都加班，家裡都沒空打掃。
104.	定當（tīng-tòng）
　　例句：我看愛提寡定金較定當。
　　Guá khuànn ài the̍h kuá tiānn-kim khah tīng-tòng.
　　華語：我看要先付一點定金比較穩當。
105.	現交關（hiān-kau-kuan）
　　例句：現交關的減趁寡較贏賒數的。
　　Hiān-kau-kuan--ê kiám thàn--kuá khah iânn sia-siàu--ê.
　　華語：現金交易的少賺點勝過賒帳的。
106.	漏仔（lāu-á）
　　例句：阿媽共燃好的青草仔茶，用漏仔貯入去玻璃矸仔，冰佇冰箱予逐家啉。
　　A-má kā hiânn-hó ê tshenn-tsháu-á-tê, iōng lāu-á té ji̍p-khì po-lê kan-á, ping tī ping-siunn hōo ta̍k-ke lim.
　　華語：奶奶把煮好的青草茶，用漏斗裝進玻璃瓶中，冰在冰箱給大家喝。
107.	饒裕（jiâu-jū）
　　例句：𪜶兜的生活真饒裕，自來就免煩惱食穿。
　　In tau ê sing-ua̍h tsin jiâu-jū, tsū-lâi tō bián huân-ló tsia̍h-tshīng.
　　華語：他家的生活很富裕，從來就不愁吃穿。
108.	便貨（piān-huè）
　　例句：這馬公司在庫的便貨已經無夠，愛緊聯絡工廠隨生產來補貨。
　　Tsit-má kong-si tsāi-khòo ê piān-huè í-king bô-kàu, ài kín liân-lo̍k kang-tshiúnn suî sing-sán lâi póo huè.
　　華語：現在公司庫存的現貨已經不足，要趕快聯絡工廠馬上生產補貨。
109.	食路（tsia̍h-lōo）
　　例句：柑仔蜜的食路百百款，我上愛切做一周一周搵豆油糖。
　　Kam-á-bi̍t ê tsia̍h-lōo pah-pah-khuán, guá siōng ài tshiat-tsò tsi̍t tsiu tsi̍t tsiu ùn tāu-iû-thn̂g.
　　華語：番茄的吃法百百種，我最喜歡番茄切塊沾糖混合醬油的醬料。
110.	鼻趖（phīnn-sô）
　　例句：若講著鼻趖的工夫，無人綴伊會著，莫怪這馬食甲油洗洗。
　　Nā kóng-tio̍h phīnn-sô ê kang-hu, bô lâng tuè i ē tio̍h, bo̍k-kuài tsit-má tsia̍h kah iû-sé-sé.
　　華語：講到趁機撈油水的功夫，沒人比得過他，難怪現在口袋賺得飽飽的。
111.	線屎（suànn-sái）
　　例句：你昨昏穿的彼領褲褲跤有一寡線屎，提來予我鉸鉸咧。
　　Lí tsa-hng tshīng ê hit niá khòo khòo-kha ū tsi̍t-kuá suànn-sái, the̍h-lâi hōo guá ka-ka--leh.
　　華語：你昨天穿的那條褲子的褲腳有一些線頭，拿來我幫你剪一剪。
112.	拚汗（piànn-kuānn）
　　例句：阿宏仔等咧欲上台，緊張甲一直拚汗。
　　A-hông--á tán--leh beh tsiūnn-tâi, kín-tiunn kah it-ti̍t piànn-kuānn.
　　華語：阿宏等一下要上台，緊張得直冒冷汗。
113.	厚味（kāu-bī）
　　例句：食燒酒雞我上愛啉彼厚味的湯頭。
　　Tsia̍h sio-tsiú-ke guá siōng ài lim he kāu-bī ê thng-thâu.
　　華語：吃燒酒雞我最喜歡喝那味道濃厚的湯汁。
114.	無因無端（bô-in-bô-tuann）
　　例句：我毋知按怎去得失著伊，無伊哪會無因無端佇眾人面頭前共我罵甲遐歹聽。
　　Guá m̄ tsai án-tsuánn khì tik-sit-tio̍h i, bô i ná ē bô-in-bô-tuann tī tsìng-lâng bīn-thâu-tsîng kā guá mē kah hiah pháinn-thiann.
　　華語：我不知道怎麼得罪了他，要不然他怎會平白無故在眾人面前把我罵得那麼難聽。
115.	下日仔（ē-ji̍t-á）
　　例句：這間餐廳實在袂䆀，咱下日仔會用得𤆬阿母做伙來。
　　Tsit king tshan-thiann si̍t-tsāi bē-bái, lán ē-ji̍t-á ē-īng-tit tshuā a-bú tsò-hué lâi.
　　華語：這間餐廳真不錯，我們改天可以帶媽媽一起來。
116.	卜面（poh-bīn）
　　例句：這遍的比賽咱較有卜面。
　　Tsit piàn ê pí-sài lán khah ū poh-bīn.
　　華語：這次的競賽我們有勝算。
117.	相借喙（sio-tsioh-tshuì）
　　例句：都市的厝邊兜，就準講佇電梯間搪著，嘛無的確會相借喙。
　　Too-tshī ê tshù-pinn-tau, tō tsún-kóng tī tiān-thui-king tn̄g--tio̍h, mā bô-tik-khak ē sio-tsioh-tshuì.
　　華語：都市的鄰居之間，即便在電梯裡面不期而遇，也未必會相互打招呼。
118.	整本（tsíng-pún）
　　例句：拄著時機當好的流擺，伊整本想欲開餐廳。
　　Tú-tio̍h sî-ki tng hó ê lâu-pái, i tsíng-pún siūnn-beh khui tshan-thiann.
　　華語：碰到經濟景氣正旺的時候，他籌措資本想要開餐廳。
119.	辯話骨（piān-uē-kut）
　　例句：伊見若開講就欲佮人辯話骨，莫怪無人欲佮伊交陪。
　　I kiàn-nā khai-káng tō beh kah lâng piān-uē-kut, bo̍k-kuài bô lâng beh kah i kau-puê.
　　華語：他但凡閒聊就要挑人語病，難怪沒人要跟他交往。
120.	輕兩想（khin-niú-siúnn）
　　例句：這跤皮箱捾著輕兩想，應該無貯啥物物件才著。
　　Tsit kha phuê-siunn kuānn tio̍h khin-niú-siúnn, ing-kai bô té siánn-mih mi̍h-kiānn tsiah tio̍h.
　　華語：這只皮箱提起來輕得不得了，應該沒裝什麼東西才對。
121.	會和（ē-hô）
　　例句：一百箍通買遐大堆，算誠會和。
　　Tsi̍t-pah khoo thang bé hiah tuā tui, sǹg tsiânn ē-hô.
　　華語：一百元能買那麼多，真划算。
122.	抾風水（khioh-hong-suí）
　　例句：阿公抾風水的日仔若確定矣，就愛通知逐家轉來鬥相共。
　　A-kong khioh-hong-suí ê ji̍t-á nā khak-tīng--ah, tō ài thong-ti ta̍k-ke tńg-lâi tàu-sann-kāng.
　　華語：祖父撿骨的日子若確定了，就應通知大家回來幫忙。
123.	押尾手（ah-bué-tshiú）
　　例句：我先踏話頭，共逐家說明一下，要緊的代誌予你押尾手講。
　　Guá sing ta̍h-uē-thâu, kā ta̍k-ke sueh-bîng--tsi̍t-ē, iàu-kín ê tāi-tsì hōo lí ah-bué-tshiú kóng.
　　華語：我先講前言，跟大家說明一下，重要的事情讓你最後說。
124.	慢死趖（bān-sí-sô）
　　例句：伊咧做工課慢死趖，一屑仔工課愛做規晡久。
　　I teh tsò khang-khuè bān-sí-sô, tsi̍t-sut-á khang-khuè ài tsò kui-poo kú.
　　華語：他做工作慢吞吞的，一些些工作要做大半天。
125.	結嚾結黨（kiat-uang-kiat-tóng）
　　例句：爸母攏無希望囡仔佇外口佮人結嚾結黨。
　　Pē-bú lóng bô hi-bāng gín-á tī guā-kháu kah lâng kiat-uang-kiat-tóng.
　　華語：父母都不希望小孩在外面跟別人成群結黨。
126.	𫞼諍王（tshāi-tsènn-ông）
　　例句：伊是𫞼諍王，會當共死龜諍甲變活鱉。
　　I sī tshāi-tsènn-ông, ē-tàng kā sí ku tsènn kah piàn ua̍h pih.
　　華語：他是好辯的人，可以將死龜強辯成活鱉。
127.	弄家散宅（lōng-ke-suànn-the̍h）
　　例句：食毒毋但拍歹身體閣會舞甲弄家散宅，毒品實在袂沐得。
　　Tsia̍h-to̍k m̄-nā phah-pháinn sin-thé koh ē bú kah lōng-ke-suànn-the̍h, to̍k-phín si̍t-tsāi bē-bak--tit.
　　華語：吸毒不但弄壞身體也會搞得家庭破碎，毒品實在碰不得。
128.	死訣（sí-kuat）
　　例句：死訣的生理
　　sí-kuat ê sing-lí
　　華語：獲利低但也不致虧損的生意
129.	結果擲捒（kiat-kó-tàn-sak）
　　例句：鱸鰻萬仔早起去予職業殺手結果擲捒矣。
　　Lôo-muâ Bān--á tsá-khí khì hōo tsit-gia̍p sat-tshiú kiat-kó-tàn-sak--ah.
　　華語：流氓阿萬早上被職業殺手給解決掉了。
130.	懊嘟面（àu-tū-bīn）
　　例句：伊散學轉來，就激一个懊嘟面，看範勢是佮同學冤家的款。
　　I suànn-o̍h tńg--lâi, tō kik tsi̍t ê àu-tū-bīn, khuànn pān-sè sī kah tông-ha̍k uan-ke ê khuán.
　　華語：他放學回家，就擺著臭臉，看情形是和同學吵架了的樣子。
131.	喜事（hí-sū）
　　例句：𪜶兜今仔日鬧熱滾滾，規家伙仔閣穿甲媠噹噹，毋知有啥物喜事？
　　In tau kin-á-ji̍t lāu-jia̍t-kún-kún, kui-ke-hué-á koh tshīng kah suí-tang-tang, m̄ tsai ū siánn-mih hí-sū?
　　華語：他們家今天熱鬧異常，又全家人都穿得漂漂亮亮的，不知道有什麼喜事？
132.	花哩囉（hue-li-lo）
　　例句：你共這堵壁畫甲花哩囉，敢會看口得！
　　Lí kā tsit tóo piah uē kah hue-li-lo, kám ē-khuànn-kháu--tit!
　　華語：你把這面牆畫得花不棱登的，能看嗎！
133.	花彔彔（hue-lok-lok）
　　例句：咱是欲去共恁阿妗送山，你穿甲規身軀花彔彔，敢有合？
　　Lán sī beh khì kā lín a-kīm sàng-suann, lí tshīng kah kui-sin-khu hue-lok-lok, kám ū ha̍h?
　　華語：我們要去送舅媽出殯，你全身穿得花花綠綠，合適嗎？
134.	憶著（it-tio̍h）
　　例句：伊不時來揣你寫宿題，是憶著恁兜定定有點心通食。
　　I put-sî lâi tshuē lí siá siok-tê, sī it-tio̍h lín tau tiānn-tiānn ū tiám-sim thang tsia̍h.
　　華語：他常常來找你一起寫功課，是圖你們家時常有點心吃。
135.	起跤（khí-kha）
　　例句：伊䀐著警察對巷仔頭行來，面隨慄色，即時就起跤走甲無看見影去。
　　I siam-tio̍h kíng-tshat tuì hāng-á-thâu kiânn--lâi, bīn suî lik-sik, tsik-sî tō khí-kha tsáu kah bô khuànn-kìnn iánn--khì.
　　華語：他瞥見警察從巷子口走來，嚇得立刻臉色大變，馬上就拔腿跑得不見蹤影。
136.	輕蠓蠓（khin-báng-báng）
　　例句：這領被輕蠓蠓，毋過蓋著閣誠燒。
　　Tsit niá phuē khin-báng-báng, m̄-koh kah tio̍h koh tsiânn sio.
　　華語：這條被子非常輕，不過蓋起來很暖和。
137.	抾金（khioh-kim）
　　例句：阿公往生六冬矣，今年著愛抾金囉。
　　A-kong óng-sing la̍k tang--ah, kin-nî tio̍h-ài khioh-kim--looh.
　　華語：爺爺過世六年了，今年需要撿骨了。
138.	恐喝（khióng-hat）
　　例句：你若敢閣共我恐喝，我就叫警察來。
　　Lí nā kánn koh kā guá khióng-hat, guá tō kiò kíng-tshat lâi.
　　華語：你要是敢再恐嚇我，我就叫警察來。
139.	苦楝舅（khóo-līng-kū）
　　例句：苦楝舅春天的新葉是笑青色，開花是黃色，漸漸轉紅，結子的時閣變咖啡色，所以嘛予人叫做四色樹。
　　Khóo-līng-kū tshun-thinn ê sin hio̍h sī tshiò-tshenn-sik, khui-hue sī n̂g-sik, tsiām-tsiām tńg-âng, kiat-tsí ê sî koh piàn ka-pi-sik, sóo-í mā hōo lâng kiò-tsò sì-sik-tshiū.
　　華語：臺灣欒樹春天的新葉是嫩綠色，開花是黃色，漸漸轉紅，結果時又變成褐色，所以也被人稱為四色樹。
140.	苦衷（khóo-thiong）
　　例句：阮兄弟仔隨人攏有家己的苦衷，才會拆伙鼎輪鬮飼爸母。
　　Guán hiann-tī-á suî-lâng lóng ū ka-kī ê khóo-thiong, tsiah ē thiah-hué-tiánn lûn-khau tshī pē-bú.
　　華語：兄弟們都各有自己的隱衷，才會分家並輪流奉養父母。
141.	過風（kuè-hong）
　　例句：這種布料會過風閣會欶汗，做熱天衫真好穿。
　　Tsit tsióng pòo-liāu ē kuè-hong koh ē suh-kuānn, tsò jua̍h-thinn sann tsin hó-tshīng.
　　華語：這種布料透氣又吸汗，做夏天的衣服很適合穿著。
142.	別工（pa̍t-kang）
　　例句：你今仔日誠無閒的款，規氣我別工才閣來揣你。
　　Lí kin-á-ji̍t tsiânn bô-îng ê khuán, kui-khì guá pa̍t-kang tsiah-koh lâi tshuē--lí.
　　華語：你今天很忙的樣子，乾脆我改天再來找你。
143.	呔（thài）
　　例句：會議都欲起鼓矣，伊呔會猶未到位？
　　Huē-gī to beh khí-kóo--ah, i thài ē iáu-buē kàu-uī?
　　華語：會議就要開始了，他怎麼還沒到場？
144.	走斜（tsáu-tshua̍h）
　　例句：塗水師無下心神咧捽繩，較加壁堵嘛疊甲走斜去。
　　Thôo-tsuí-sai bô hē sim-sîn teh sut-tsîn, khah-ke piah-tóo mā thia̍p kah tsáu-tshua̍h--khì.
　　華語：泥水匠拉墨繩取直線沒有用心，這也難怪磚牆砌得歪斜不正。
145.	做得來（tsò-tit-lâi）
　　例句：都叫你毋通遐痟貪，今錢予人騙了了，攏是你家己做得來的。
　　To kiò lí m̄-thang hiah siáu-tham, tann tsînn hōo lâng phiàn-liáu-liáu, lóng sī lí ka-kī tsò-tit-lâi--ê.
　　華語：早就勸你別那麼貪心，現在錢被騙光了，都是你自找的。
146.	押尾（ah-bué）
　　例句：若欲𬦰山愛有人做頭前𤆬路，嘛著有內行的押尾，較袂出代誌。
　　Nā beh peh-suann ài ū lâng tsò thâu-tsîng tshuā-lōo, mā tio̍h ū lāi-hâng--ê ah-bué, khah bē tshut-tāi-tsì.
　　華語：若要去爬山需有人在前面領隊，也得有內行的人殿後，才比較不會出事。
147.	壓落底（ah-lo̍h-té）
　　例句：翁仔某著相體諒，毋通串想就是欲共對方壓落底。
　　Ang-á-bóo tio̍h sio-thé-liōng, m̄-thang tshuàn siūnn tō sī beh kā tuì-hong ah-lo̍h-té.
　　華語：夫妻得相互體諒才是，不要老想使對方低頭屈服。
148.	慢鈍（bān-tūn）
　　例句：你做工課跤手慢鈍，是欲按怎綴人會著咧！
　　Lí tsò khang-khuè kha-tshiú bān-tūn, sī beh án-tsuánn tuè lâng ē tio̍h--leh!
　　華語：你做事情慢吞吞的，怎麼跟得上人家呢！
149.	缺欠（khueh-khiàm）
　　例句：你若猶閣有缺欠啥，不管時攏通來共我講。
　　Lí nā iáu-koh ū khueh-khiàm siannh, put-kuán-sî lóng thang lâi kā guá kóng.
　　華語：你要是還欠缺什麼，隨時都可以來告訴我。
150.	怪奇（kuài-kî）
　　例句：伊逐工都攏笑頭笑面，拄才哪會聽著伊佮厝邊咧大細聲，真怪奇呢！
　　I ta̍k-kang to lóng tshiò-thâu-tshiò-bīn, tú-tsiah ná ē thiann-tio̍h i kah tshù-pinn teh tuā-sè-siann, tsin kuài-kî--neh!
　　華語：他每天都笑咪咪的，剛才怎麼會聽見他和鄰居爭吵不休，真是奇怪！
151.	趕狂（kuánn-kông）
　　例句：咱做代誌仙都毋通趕狂，著緊事寬辦較妥當。
　　Lán tsò tāi-tsì sian to m̄-thang kuánn-kông, tio̍h kín-sū-khuann-pān khah thò-tòng.
　　華語：我們做事情再怎麼樣都不要慌裡慌張，愈是緊急愈是得謹慎為要。
152.	懸踏（kuân-ta̍h）
　　例句：我寢頭仔穿懸踏真袂慣勢，險險仔就跋跋倒。
　　Guá tshím-thâu-á tshīng kuân-ta̍h tsin bē kuàn-sì, hiám-hiám-á tō pua̍h-pua̍h--tó.
　　華語：我起初穿高跟鞋很不習慣，差一點就跌倒了。
153.	門喙（mn̂g-tshuì）
　　例句：雨傘囥佇門喙，莫提入來，厝內才袂澹糊糊。
　　Hōo-suànn khǹg tī mn̂g-tshuì, mài the̍h--ji̍p-lâi, tshù-lāi tsiah bē tâm-kôo-kôo.
　　華語：雨傘放在門口，不用拿進來，室內才不會溼答答的。
154.	貓徙岫（niau-suá-siū）
　　例句：食人頭路著存久長心，毋通在職怨職，磕袂著就換頭路，袂輸貓徙岫咧。
　　Tsia̍h lâng thâu-lōo tio̍h tsûn kú-tn̂g-sim, m̄-thang tsāi-tsit-uàn-tsit, kha̍p-bē-tio̍h tō uānn thâu-lōo, bē-su niau-suá-siū--leh.
　　華語：受雇於人要安於工作，切勿幹一行怨一行，動不動就換工作，好像貓挪窩似的。
155.	歹星（pháinn-tshenn）
　　例句：伊正港是一个歹星，拄搬來，這个庄頭就做大水。
　　I tsiànn-káng sī tsi̍t ê pháinn-tshenn, tú puann--lâi, tsit ê tsng-thâu tō tsò-tuā-tsuí.
　　華語：他真是個掃把星，剛搬來，這個村莊就發生水災。
156.	公族仔（kong-tso̍k-á）
　　例句：阮叔伯小弟佮我仝公族仔的，伊今欲選里長，免講嘛愛共伨。
　　Guán tsik-peh-sió-tī kah guá kāng kong-tso̍k-á--ê, i tann beh suán lí-tiúnn, bián-kóng mā ài kā thīn.
　　華語：堂弟是跟我同宗族的，他現在要選里長，怎樣說都要支持他。
157.	懸低坎（kuân-kē-khám）
　　例句：這條山路有袂少懸低坎，若欲行，愛較斟酌咧。
　　Tsit tiâu suann-lōo ū bē tsió kuân-kē-khám, nā beh kiânn, ài khah tsim-tsiok--leh.
　　華語：這條山路有不少高低落差，要走的時候，得謹慎小心點。
158.	卵蛋（nn̄g-tuann）
　　例句：夜市有人咧賣規攕的卵蛋，阮阿姊上愛食。
　　Iā-tshī ū lâng teh bē kui tshiám ê nn̄g-tuann, guán a-tsí siōng ài tsia̍h.
　　華語：夜市有人賣成串母雞肚子裡的蛋黃，我姊姊最愛吃。
159.	省本（síng-pún）
　　例句：倩人來做工，有當時仔算日的比算件的較省本。
　　Tshiànn lâng lâi tsò-kang, ū-tang-sî-á sǹg ji̍t--ê pí sǹg kiānn--ê khah síng-pún.
　　華語：聘請工人，有時候日薪比按件計酬還要省成本。
160.	探（tham）
　　例句：咱佇車裡共頭殼探出去真危險。
　　Lán tī tshia--lí kā thâu-khak tham--tshut-khì tsin guî-hiám.
　　華語：我們坐在車子裡面把頭伸出去很危險。
161.	坦橫生（thán-huâinn-senn）
　　例句：恁老母就因為生恁小弟的時陣坦橫生才無去的。
　　Lín lāu-bú tō in-uī senn lín sió-tī ê sî-tsūn thán-huâinn-senn tsiah bô--khì--ê.
　　華語：你媽媽就因為生你弟弟的時候橫向難產才過世的。
162.	親戽戽（tshin-hòo-hòo）
　　例句：𪜶兩个一下見面就表現甲親戽戽，毋知是咧搬佗一齣？
　　In nn̄g ê tsi̍t-ē kìnn-bīn tō piáu-hiān kah tshin-hòo-hòo, m̄ tsai sī teh puann tó tsi̍t tshut?
　　華語：他們兩個一見面就表現得很熱絡，不知道是在演哪齣戲？
163.	出眾（tshut-tsìng）
　　例句：阮老爸牽阿明做師仔，伊也確實出眾，學都無兩冬半就出師矣。
　　Guán lāu-pē khan A-bîng tsò sai-á, i iā khak-si̍t tshut-tsìng, o̍h to bô nn̄g tang puànn tō tshut-sai--ah.
　　華語：我父親收阿明做徒弟，他也確實很出色，不到兩年半就學藝完成。
164.	大箍把（tuā-khoo-pé）
　　例句：你莫看伊大箍把，不時嘛咧破病。
　　Lí mài khuànn i tuā-khoo-pé, put-sî mā teh phuà-pēnn.
　　華語：你不要看他大塊頭，常常在生病。
165.	愛睏神（ài-khùn-sîn）
　　例句：我看你咧起愛睏神矣，無先入去䖙一下。
　　Guá khuànn lí teh khí ài-khùn-sîn--ah, bô sing ji̍p-khì the--tsi̍t-ē.
　　華語：我看你露出想睡的神情了，不然先進去躺一下。
166.	喝救人（huah-kiù-lâng）
　　例句：明其都你毋著，今你煞拍人喝救人，是咧哭予啥人聽。
　　Bîng-ki to lí m̄-tio̍h, tann lí suah phah lâng huah-kiù-lâng, sī teh khàu hōo siánn-lâng thiann.
　　華語：明明就你不對，你現在卻惡人先告狀，是想哭給誰聽。
167.	石鼓（tsio̍h-kóo）
　　例句：這間廟起甲遮爾大間，門跤口有𫞼石獅嘛有𫞼石鼓，真誠氣派。
　　Tsit king biō khí kah tsiah-nī tuā king, mn̂g-kha-kháu ū tshāi tsio̍h-sai mā ū tshāi tsio̍h-kóo, tsin-tsiânn khì-phài.
　　華語：這間廟蓋得這麼大，門口既設置了石獅子也安置了石鼓，非常氣派。
168.	掰會（pué-huē/pé-hē）
　　例句：食甲這个歲矣，無氣力通佮人掰會遮的政治問題，寧可加讀寡冊較直。
　　Tsia̍h kah tsit ê huè--ah, bô khuì-la̍t thang kah lâng pué-huē tsia-ê tsìng-tī būn-tê, lîng-khó ke tha̍k kuá tsheh khah ti̍t.
　　華語：活到這把年紀了，沒有體力能跟別人爭辯這些政治問題，寧願多讀點書還比較好。
169.	𢯾鼻（mooh-phīnn）
　　例句：伊都感覺家己𢯾鼻𢯾鼻，較無遐嫣，按算歇熱欲去美容。
　　I to kám-kak ka-kī mooh-phīnn-mooh-phīnn, khah bô hiah ian, àn-sǹg hioh-jua̍h beh khì bí-iông.
　　華語：他覺得自己鼻子塌塌的，沒那麼好看，打算暑假去整形。
170.	食鹼（tsia̍h-kinn）
　　例句：定定欲共人偏，有時陣嘛會食鹼。
　　Tiānn-tiānn beh kā lâng phinn, ū-sî-tsūn mā ē tsia̍h-kinn.
　　華語：常常佔別人的便宜，有時候也會吃到苦頭。
171.	不三時（put-sam-sî）
　　例句：伊是在地選出來的議員，不三時都有選民會來揣伊做服務選區的工課。
　　I sī tsāi-tē suán--tshut-lâi ê gī-uân, put-sam-sî to ū suán-bîn ē lâi tshuē i tsò ho̍k-bū suán-khu ê khang-khuè.
　　華語：他是本地選出的議員，經常有選民來找他做服務選區的工作。
172.	卸衰（sià-sue）
　　例句：歲頭食甲三十外，毋出去討趁，閣不時共序大人伸長手，真正卸衰。
　　Huè-thâu tsia̍h kah sann-tsa̍p-guā, m̄ tshut-khì thó-thàn, koh put-sî kā sī-tuā-lâng tshun-tn̂g-tshiú, tsin-tsiànn sià-sue.
　　華語：活到三十多歲了，不出去賺錢，還常伸手跟父母要錢，真是丟臉。
173.	呔討（thài-thó）
　　例句：看伊人都勇勇，煞雄雄入院，呔討會按呢？
　　Khuànn i lâng to ióng-ióng, suah hiông-hiông ji̍p-īnn, thài-thó ē án-ne?
　　華語：看他人很硬朗，卻突然住院，怎麼會這樣呢？
174.	制煞（tsè-suah）
　　例句：有人感覺運途袂順，會去請紅頭司公來制煞，其實認真做頭路才會有幫助。
　　Ū lâng kám-kak ūn-tôo bē sūn, ē khì tshiánn âng-thâu sai-kong lâi tsè-suah, kî-si̍t jīn-tsin tsò-thâu-lōo tsiah ē ū pang-tsōo.
　　華語：有人認為運勢不順，會去請紅頭道士來鎮煞，其實努力把工作做好才會有幫助。
175.	臭奶羶（tshàu-ling-hiàn）
　　例句：食奶嬰仔的身軀加減攏會有臭奶羶。
　　Tsia̍h ling enn-á ê sin-khu ke-kiám lóng ē ū tshàu-ling-hiàn.
　　華語：吃奶嬰兒的身上多少都會有乳臭味。
176.	厝蓋（tshù-kuà）
　　例句：恁吵甲遐大聲，厝蓋強欲予恁夯起來矣啦。
　　Lín tshá kah hiah tuā-siann, tshù-kuà kiōng-beh hōo lín giâ--khí-lâi--ah--lah.
　　華語：你們吵得這麼大聲，屋頂都快被你們掀起來了。
177.	一下手（tsi̍t-ē-tshiú）
　　例句：頭家派予伊遐濟工課，伊一下手就做甲好勢溜溜。
　　Thâu-ke phài hōo i hiah tsē khang-khuè, i tsi̍t-ē-tshiú tō tsò kah hó-sè-liu-liu.
　　華語：老闆指派給他那麼多工作，他一會兒就完成了。
178.	一半擺仔（tsi̍t-puànn-pái-á）
　　例句：糋的物件較厚油，食一半擺仔是無要緊，若傷捷食對健康會有影響喔！
　　Tsìnn ê mi̍h-kiānn khah kāu iû, tsia̍h--tsi̍t-puànn-pái-á sī bô iàu-kín, nā siunn tsia̍p tsia̍h tuì kiān-khong ē ū íng-hióng--ooh!
　　華語：油炸物吸附過多油脂，偶爾吃一兩次不礙事，如果太常吃會對健康造成影響喔！
179.	後日仔（āu-ji̍t-á）
　　例句：食頭路這號代誌定著愛想較斟酌咧，較免後日仔才來後悔。
　　Tsia̍h-thâu-lōo tsit-lō tāi-tsì tiānn-tio̍h ài siūnn khah tsim-tsiok--leh, khah bián āu-ji̍t-á tsiah lâi hiō-hué.
　　華語：找工作這種事，一定要仔細斟酌，免得將來後悔。
180.	起致（khí-tì）
　　例句：就是生理失敗起致，伊這陣毋才四界咧走路閃債。
　　Tō sī sing-lí sit-pāi khí-tì, i tsit-tsūn m̄-tsiah sì-kè teh tsáu-lōo siám-tsè.
　　華語：就是做生意失敗引起，他現在才到處跑路避債。
181.	起造（khí-tsō）
　　例句：欲起造一間電子工廠，資金掠外，猶需要真濟科技人員。
　　Beh khí-tsō tsi̍t king tiān-tsú kang-tshiúnn, tsu-kim lia̍h-guā, iáu su-iàu tsin tsē kho-ki jîn-uân.
　　華語：要興建一間電子工廠，除了資金以外，還需要很多科技人員。
182.	叨錢（lo tsînn）
　　例句：伊欲食毋討趁，攏共𪜶序大人叨錢來開。
　　I beh tsia̍h m̄ thó-thàn, lóng kā in sī-tuā-lâng lo tsînn lâi khai.
　　華語：他好逸惡勞不想工作賺錢，總是跟他的父母親要錢來花用。
183.	平素時（pîng-sòo-sî）
　　例句：伊平素時有咧食臊，是初一十五才食菜。
　　I pîng-sòo-sî ū teh tsia̍h-tsho, sī tshe-it tsa̍p-gōo tsiah tsia̍h-tshài.
　　華語：他平時吃葷食，是初一十五才吃素。
184.	半精肥（puànn-tsiann-puî）
　　例句：三層半精肥，上合我的氣口。
　　Sam-tsân puànn-tsiann-puî, siōng ha̍h guá ê khuì-kháu.
　　華語：五花肉半肥半瘦，最合我的口味。
185.	散食（sàn-tsia̍h）
　　例句：人散食免失志，拍拚才會出頭天。
　　Lâng sàn-tsia̍h bián sit-tsì, phah-piànn tsiah ē tshut-thâu-thinn.
　　華語：人貧窮不用灰心喪志，努力才能出人頭地。
186.	相向（sio-hiòng）
　　例句：𪜶兩姊妹仔坐相向，恬恬佇遐咧讀冊。
　　In nn̄g tsí-muē-á tsē sio-hiòng, tiām-tiām tī hia teh tha̍k-tsheh.
　　華語：他們兩姊妹面對面坐著，靜靜的在那邊讀書。
187.	擲捒（tàn-sak）
　　例句：伊傷過抾拾，明其都無路用的物件，嘛毋甘擲捒。
　　I siunn kuè khioh-si̍p, bîng-ki to bô-lōo-īng ê mi̍h-kiānn, mā m̄-kam tàn-sak.
　　華語：他很節儉，明明沒有用的東西，也捨不得丟棄。
188.	天跤下（thinn-kha-ē）
　　例句：天跤下敢誠實有天會落紅雨、馬會發角彼號譀古代？
　　Thinn-kha-ē kám tsiânn-si̍t ū thinn ē lo̍h âng hōo, bé ē huat-kak hit-lō hàm-kóo tāi?
　　華語：天底下真的有天會降紅雨、馬會長角那樣誇張荒誕的事嗎？
189.	著等（tio̍h-tíng）
　　例句：伊這幅圖捌佇國際比賽著等過，提著第六名。
　　I tsit pak tôo bat tī kok-tsè pí-sài tio̍h-tíng--kuè, the̍h-tio̍h tē-la̍k miâ.
　　華語：他這幅畫曾於國際比賽得過名次，獲得第六名。
190.	當當（tng-tong）
　　例句：當當伊欲過車路，雄雄一台車挵紅燈傱出來，險仔就去予挵著。
　　Tng-tong i beh kuè tshia-lōo, hiông-hiông tsi̍t tâi tshia lòng-âng-ting tsông--tshut-lâi, hiám-á tō khì hōo lòng--tio̍h.
　　華語：當他要過馬路的時候，突然一輛車闖紅燈衝出來，差一點就被它撞到。
191.	厝內人（tshù-lāi-lâng）
　　例句：人客一下入門，厝內人攏愛緊出來佮伊相借問。
　　Lâng-kheh tsi̍t-ē ji̍p-mn̂g, tshù-lāi-lâng lóng ài kín tshut-lâi kah i sio-tsioh-mn̄g.
　　華語：客人一進門，家人們都要趕緊出來向他問安。
192.	出破（tshut-phuà）
　　例句：伊做的歹代一下出破，就隨走路矣。
　　I tsò ê pháinn-tāi tsi̍t-ē tshut-phuà, tō suî tsáu-lōo--ah.
　　華語：他做的壞事一敗露，就馬上逃亡了。
193.	後回（āu-huê）
　　例句：感謝恁今仔日的招待，後回來阮遐就予我請。
　　Kám-siā lín kin-á-ji̍t ê tsiau-thāi, āu-huê lâi guán hia tō hōo guá tshiánn.
　　華語：感謝你們今日的招待，下次到我們那裡就讓我請客。
194.	後改（āu-kái）
　　例句：這改考題攏看毋捌，後改我一定欲好好仔讀冊矣！
　　Tsit kái khó-tê lóng khuànn m̄ bat, āu-kái guá it-tīng beh hó-hó-á tha̍k-tsheh--ah!
　　華語：這次考題都看不懂，下次我一定要好好讀書了！
195.	頂回（tíng-huê）
　　例句：頂回去買物件無紮錢，佳哉頭家肯予我賒。
　　Tíng-huê khì bé mi̍h-kiānn bô tsah tsînn, ka-tsài thâu-ke khíng hōo guá sia.
　　華語：上回去買東西沒帶錢，幸好老闆肯讓我賒帳。
196.	翁仔姐（ang-á-tsiá）
　　例句：𪜶兩翁仔姐感情誠好，逐暗食飯飽，就手牽咧做伙去公園散步。
　　In nn̄g ang-á-tsiá kám-tsîng tsiânn hó, ta̍k-àm tsia̍h-pn̄g pá, tō tshiú khan--leh tsò-hué khì kong-hn̂g sàn-pōo.
　　華語：他們夫妻倆感情真好，每晚吃過飯後，就牽著手一起去公園散步。
197.	好禮仔（hó-lé-á）
　　例句：遮的古董你就好禮仔提，無若落落去，仙賠你都賠袂起。
　　Tsia-ê kóo-tóng lí tō hó-lé-á the̍h, bô nā lak--lo̍h-khì, sian puê lí to puê bē khí.
　　華語：這些古董你要小心翼翼的拿，不然一掉下去，怎樣你都賠不起。
198.	喝聲（huah-siann）
　　例句：逐家毋通激恬恬，欲抑毋，恁嘛喝聲一下。
　　Ta̍k-ke m̄-thang kik-tiām-tiām, beh ia̍h m̄, lín mā huah-siann--tsi̍t-ē.
　　華語：大家不要沉默不語，要或不要，你們要做聲表態一下。
199.	會仔錢（huē-á-tsînn）
　　例句：我逐月日都愛納一萬箍的會仔錢。
　　Guá ta̍k gue̍h-ji̍t to ài la̍p tsi̍t-bān khoo ê huē-á-tsînn.
　　華語：我每個月都得繳一萬塊錢的會錢。
200.	內裾（lāi-ki/lāi-ku）
　　例句：伊的外套洗甲勼水去，內裾煞看現現。
　　I ê guā-thò sé kah kiu-tsuí--khì, lāi-ki suah khuànn-hiān-hiān.
　　華語：他的外套洗到縮水，內裡都露出來了。
201.	涼冷（liâng-líng）
　　例句：這馬天氣較涼冷矣，出門著加疊一領衫。
　　Tsit-má thinn-khì khah liâng-líng--ah, tshut-mn̂g tio̍h ke tha̍h tsi̍t niá sann.
　　華語：現在天氣比較冷了，出門得多加件衣服。
202.	軟床（nńg-tshn̂g）
　　例句：伊出車禍著傷，跤煞袂行，予人用軟床扛起去救護車送去病院。
　　I tshut tshia-hō tio̍h-siong, kha suah bē kiânn, hōo lâng iōng nńg-tshn̂g kng khí-khì kiù-hōo-tshia sàng-khì pēnn-īnn.
　　華語：他車禍受傷，腳無法行走，被人用擔架抬上救護車送往醫院。
203.	燈膋（ting-lâ）
　　例句：古早人無電，暗時愛點燈膋。
　　Kóo-tsá-lâng bô tiān, àm-sî ài tiám ting-lâ.
　　華語：古時候的人沒電，晚上要點燈油。
204.	樹箍（tshiū-khoo）
　　例句：阮學校彼欉茄苳樹，規百冬矣，樹箍是粗閣勇。
　　Guán ha̍k-hāu hit tsâng ka-tang-tshiū, kui pah tang--ah, tshiū-khoo sī tshoo koh ióng.
　　華語：我們學校的那棵茄苳樹，上百年了，樹幹又粗又大。
205.	萬不二（bān-put-jī）
　　例句：你共私奇攏囥踮厝裡，萬不二若著賊偷欲按怎？
　　Lí kā sai-khia lóng khǹg tiàm tshù--lí, bān-put-jī nā tio̍h-tsha̍t-thau beh án-tsuánn?
　　華語：你把私房錢都放在家裡，萬一遭小偷怎麼辦？
206.	虛荏（hi-lám）
　　例句：老大人身體虛荏，有時若穢著感冒就真嚴重。
　　Lāu-tuā-lâng sin-thé hi-lám, ū-sî nā uè-tio̍h kám-mōo tō tsin giâm-tiōng.
　　華語：老年人身體虛弱，有時候要是染上感冒就很嚴重。
207.	字條仔（jī-tiâu-á）
　　例句：阿母留一張字條仔予我，吩咐講愛會記得去納電火錢。
　　A-bú lâu tsi̍t tiunn jī-tiâu-á hōo--guá, huan-hù kóng ài ē-kì-tit khì la̍p tiān-hué-tsînn.
　　華語：媽媽留了一張字條給我，交代我要記得去繳電費。
208.	家私頭仔（ke-si-thâu-á）
　　例句：這台oo-tóo-bái的ia̋n-jín愛拆，你去共我遐的家私頭仔提來。
　　Tsit tâi oo-tóo-bái ê ia̋n-jín ài thiah, lí khì kā guá hia-ê ke-si-thâu-á the̍h--lâi.
　　華語：這台摩托車的引擎需要拆解，你去把我那些工具拿來。
209.	空身（khang-sin）
　　例句：這擺是欲𬦰淺山仔，咱空身來去就好。
　　Tsit pái sī beh peh tshián-suann-á, lán khang-sin lâi-khì tō hó.
　　華語：這次是要爬淺山，我們空手去就好了。
210.	公廳（kong-thiann）
　　例句：過年的時陣，𪜶家族仔攏會去公廳拜祖先。
　　Kuè-nî ê sî-tsūn, in ka-tso̍k-á lóng ē khì kong-thiann pài tsóo-sian.
　　華語：過年的時候，他們家族都會去祠堂拜祖先。
211.	麵粉粿仔（mī-hún-kué-á）
　　例句：凡若麵粉做的我攏真有路，特別是麵粉粿仔我上愛食。
　　Huān-nā mī-hún tsò--ê guá lóng tsin ū-lōo, ti̍k-pia̍t sī mī-hún-kué-á guá siōng ài tsia̍h.
　　華語：凡是麵粉做的食物都是我喜愛的類型，尤其麵疙瘩是我最愛吃的。
212.	邊仔角（pinn-á-kak）
　　例句：這塊桌仔無欲用矣，先共搬去邊仔角囥。
　　Tsit tè toh-á bô beh īng--ah, sing kā puann-khì pinn-á-kak khǹg.
　　華語：這張桌子不用了，先把它搬去角落放。
213.	得定（tik-tiānn）
　　例句：這个囡仔真孽呢，坐徛袂牢無時得定。
　　Tsit ê gín-á tsin gia̍t--neh, tsē khiā bē tiâu bô-sî tik-tiānn.
　　華語：這個小孩很皮耶，坐也不是站也不是一刻都不得安靜。
214.	臭尿破味（tshàu-jiō-phuà-bī）
　　例句：恁囡仔的尿苴仔愛換矣喔，有鼻著臭尿破味。
　　Lín gín-á ê jiō-tsū-á ài uānn--ah--ooh, ū phīnn-tio̍h tshàu-jiō-phuà-bī.
　　華語：你家小孩的尿布要換了喔，聞得到尿騷味。
215.	拄仔（tú-á）
　　例句：拄仔有人敲電話來，講欲揣你。
　　Tú-á ū lâng khà tiān-uē lâi, kóng beh tshuē--lí.
　　華語：剛剛有人打電話來，說要找你。
216.	大通（tuā-thong）
　　例句：伊的店按算欲開佇大通遐，講遐會較食市。
　　I ê tiàm àn-sǹg beh khui tī tuā-thong hia, kóng hia ē khah tsia̍h-tshī.
　　華語：他的店打算開在大馬路附近，因為那邊的人潮多，較好做生意。
217.	兄妹仔（hiann-muē-á）
　　例句：𪜶兄妹仔真會曉想，毋捌因為厝裡散食就來失志。
　　In hiann-muē-á tsin ē-hiáu siūnn, m̄ bat in-uī tshù--lí sàn-tsia̍h tō lâi sit-tsì.
　　華語：他們兄妹十分懂事，不曾因為家裡貧窮就灰心喪志。
218.	字目（jī-ba̍k）
　　例句：佮「外家」意思相仝，字目無仝的有「後頭厝」、「後頭」佮「外家厝」。
　　Kah “guā-ke” ì-sù sio-kāng, jī-ba̍k bô kāng--ê ū “āu-thâu-tshù”, “āu-thâu” kah “guā-ke-tshù”.
　　華語：和「外家」意思相同，文字不同的有「後頭厝」、「後頭」與「外家厝」。
219.	干證（kan-tsìng）
　　例句：根據犯案的時間，我人都無佇現場，這嘛是我無可能犯罪的干證。
　　Kin-kì huān-àn ê sî-kan, guá lâng to bô tī hiān-tiûnn, tse mā sī guá bô khó-lîng huān-tsuē ê kan-tsìng.
　　華語：根據犯案時間，我人又不在現場，這也是我不可能犯罪的證據。
220.	根頭（kin-thâu）
　　例句：阿媽去園裡薅番薯，我綴佇邊仔鬥共根頭的塗敲挕捒。
　　A-má khì hn̂g--lí khau han-tsî, guá tuè tī pinn--á tàu kā kin-thâu ê thôo khà hìnn-sak.
　　華語：奶奶去園裡採收番薯，我跟在旁邊幫忙將根上的土敲除。
221.	平埔族（Pênn-poo-tso̍k）
　　例句：臺灣的平埔族屬於南島語族，嘛予人稱呼做平埔族群。
　　Tâi-uân ê Pênn-poo-tso̍k sio̍k-î Lâm-tó Gí-tso̍k, mā hōo lâng tshing-hoo tsò Pênn-poo tso̍k-kûn.
　　華語：臺灣的平埔族屬於南島語族，也被人稱呼做平埔族群。
222.	透機（thàu-ki）
　　例句：我話若欲講透機，你目屎會掰袂離。
　　Guá uē nā beh kóng thàu-ki, lí ba̍k-sái ē pué bē lī.
　　華語：我要是把話都挑明說透，你會淚流不止。
223.	偷走（thau-tsáu）
　　例句：工課等一下主任會來拍派，你毋通先偷走。
　　Khang-khuè tán--tsi̍t-ē tsú-jīm ē lâi phah-phài, lí m̄-thang sing thau-tsáu.
　　華語：工作等一下主任會來分派，你別先溜了。
224.	天年（thinn-nî）
　　例句：好心的倒咧餓，歹心的戴王帽，這到底是啥物款的天年？
　　Hó-sim--ê tó leh gō, pháinn-sim--ê tì ông-bō, tse tàu-té sī siánn-mih khuán ê thinn-nî?
　　華語：好人遭殃，壞人得志，這究竟是怎樣的世道？
225.	推軟仔（thui-nńg-á）
　　例句：做人心肝愛平棒，袂使攏推軟仔，串欲欺負古意人。
　　Tsò-lâng sim-kuann ài pênn-pāng, bē-sái lóng thui-nńg-á, tshuàn beh khi-hū kóo-ì-lâng.
　　華語：做人要公平，不可都柿子挑軟的吃，總想著欺負老實人。
226.	實實（tsa̍t-tsa̍t）
　　例句：這間倉庫的貨疊甲實實，欲過連甲一个跤路都無。
　　Tsit king tshng-khòo ê huè thia̍p kah tsa̍t-tsa̍t, beh kuè liân kah tsi̍t ê kha-lōo to bô.
　　華語：這間倉庫的貨物塞得滿滿的，要過去連個可走的路都沒有。
227.	走徙（tsáu-suá）
　　例句：較早佇阮庄裡都歹討趁，姑不將才著走徙去海口拋魚罔趁食。
　　Khah-tsá tī guán tsng--lí to pháinn thó-thàn, koo-put-tsiong tsiah tio̍h tsáu-suá khì hái-kháu pha-hî bóng thàn-tsia̍h.
　　華語：以前在我們村裡因為不容易討生活，不得已才遷徙到海口捕魚過活。
228.	姐弟仔（tsiá-tē-á）
　　例句：彼對姐弟仔是雙生仔，感情真誠峇，連開店做生理都開踮相隔壁。
　　Hit tuì tsiá-tē-á sī siang-senn-á, kám-tsîng tsin-tsiânn bā, liân khui-tiàm tsò-sing-lí to khui tiàm sio-keh-piah.
　　華語：他們姊弟倆是雙胞胎，感情非常好，連開店做生意都比鄰開業。
229.	水鏡（tsuí-kiànn）
　　例句：泅水掛水鏡，毋但保護目睭，水底的物件閣會當看甲足清楚的。
　　Siû-tsuí kuà tsuí-kiànn, m̄-nā pó-hōo ba̍k-tsiu, tsuí-té ê mi̍h-kiānn koh ē-tàng khuànn kah tsiok tshing-tshó--ê.
　　華語：游泳戴蛙鏡，不只保護眼睛，水中的東西又可以看得很清楚。
230.	顫悶（tsùn-būn）
　　例句：這擺地動遐爾大，彼間規百年的舊厝講連顫悶著都無。
　　Tsit pái tē-tāng hiah-nī tuā, hit king kui pah nî ê kū-tshù kóng liân tsùn-būn--tio̍h to bô.
　　華語：這次地震那麼大，那間上百年的老屋卻絲毫沒有受損。
231.	注心（tsù-sim）
　　例句：注心去做你的穡，別人的閒仔代莫插較無魍。
　　Tsù-sim khì tsò lí ê sit, pa̍t-lâng ê îng-á-tāi mài tshap khah bô báng.
　　華語：專心去做你的事，別人的閒事別管省點心。
232.	大色貨（tuā-sik-huè）
　　例句：熱天時仔麥仔酒、汽水是𥴊仔店的大色貨。
　　Jua̍h-thinn-sî-á be̍h-á-tsiú, khì-tsuí sī kám-á-tiàm ê tuā-sik-huè.
　　華語：夏天的時候啤酒、汽水是雜貨店的主要商品。
233.	案桌（àn-toh）
　　例句：逐年媽祖生的時，阿媽攏會佇案桌頂排誠濟祭品拜拜求平安。
　　Ta̍k-nî Má-tsóo-senn ê sî, a-má lóng ē tī àn-toh-tíng pâi tsiânn tsē tsè-phín pài-pài kiû-pîng-an.
　　華語：每年媽祖誕辰時，奶奶都會在供桌上排滿祭品拜拜求平安。
234.	花血（hue-hiat）
　　例句：遐爾花血的布提來做洋裝你敢敢穿？
　　Hiah-nī hue-hiat ê pòo the̍h-lâi tsò iûnn-tsong lí kám kánn tshīng?
　　華語：這麼鮮豔的布拿來做洋裝你敢穿嗎？
235.	袂見眾（bē-kìnn-tsìng）
　　例句：你食甲七十外矣，才做這號代誌，實在袂見眾得。
　　Lí tsia̍h kah tshit-tsa̍p-guā--ah, tsiah tsò tsit-lō tāi-tsì, si̍t-tsāi bē-kìnn-tsìng--tit.
　　華語：你活到七十多歲了，才做這種事，實在見不得人。
236.	老頹（lāu-thē）
　　例句：阿媽八十外歲矣，猶誠精光，一屑仔都袂老頹。
　　A-má peh-tsa̍p-guā huè--ah, iáu tsiânn tsing-kong, tsi̍t-sut-á to bē lāu-thuē.
　　華語：祖母八十多歲了，還很精明，一點兒都不顯衰老。
237.	掠枵（lia̍h-iau）
　　例句：這陣腹肚真枵，緊叫一碗麵來掠枵。
　　Tsit-tsūn pak-tóo tsin iau, kín kiò tsi̍t uánn mī lâi lia̍h-iau.
　　華語：現在肚子很餓，趕緊叫碗麵來填飽肚子。
238.	平正（pênn-tsiànn）
　　例句：做人愛平正，袂當有私心。
　　Tsò-lâng ài pênn-tsiànn, bē-tàng ū su-sim.
　　華語：做人要公正，不能有私心。
239.	省事事省（síng-sū-sū-síng）
　　例句：我看結婚的禮數簡單就好，省事事省，才袂費氣。
　　Guá khuànn kiat-hun ê lé-sòo kán-tan tō hó, síng-sū-sū-síng, tsiah bē huì-khì.
　　華語：我看結婚的禮節簡單就好，省掉繁文縟節，才不會麻煩。
240.	新嫣（sin-ian）
　　例句：你今仔日穿甲遮新嫣，敢是欲去相親？
　　Lí kin-á-ji̍t tshīng kah tsiah sin-ian, kám-sī beh khì siòng-tshin?
　　華語：你今天穿得這麼光鮮亮麗，是要去相親嗎？
241.	惜略（sioh-lio̍h）
　　例句：這馬的囡仔傷好命，物件攏毋知好惜略。
　　Tsit-má ê gín-á siunn hó-miā, mi̍h-kiānn lóng m̄ tsai hó sioh-lio̍h.
　　華語：現在的小孩命太好了，東西都不知道要愛惜。
242.	四壯（sì-tsàng）
　　例句：伊生做誠四壯。
　　I senn-tsò tsiânn sì-tsàng.
　　華語：他長得很強壯。
243.	著味（tio̍h-bī）
　　例句：油蔥粿濫蒜茸豆油上著味。
　　Iû-tshang-kué lām suàn-jiông tāu-iû siōng tio̍h-bī.
　　華語：油蔥粿淋蒜泥醬油最對味。
244.	手肚仁（tshiú-tóo-jîn）
　　例句：阿仁佇工地縛鐵仔，較加手肚仁嘛結結結。
　　A-jîn tī kang-tē pa̍k thih-á, khah-ke tshiú-tóo-jîn mā kiat-kiat-kiat.
　　華語：阿仁在工地綁鋼筋，難怪上臂內側肌肉很結實。
245.	準若（tsún-nā）
　　例句：今年咱種的果子都攏採收矣，準若風颱來嘛無要緊。
　　Kin-nî lán tsìng ê kué-tsí to lóng tshái-siu--ah, tsún-nā hong-thai lâi mā bô iàu-kín.
　　華語：今年我們種的水果已經都採收了，倘若颱風來了也不要緊。
246.	對扴（tuì-ke̍h）
　　例句：伊這个人誠狡怪，逐項代誌都欲佮人對扴。
　　I tsit ê lâng tsiânn káu-kuài, ta̍k hāng tāi-tsì to beh kah lâng tuì-ke̍h.
　　華語：他這個人很彆扭，每樣事情都要跟人家唱反調。
247.	酸雨（sng-hōo）
　　例句：酸雨會造成農作物的損害，年久月深了後連咱的健康嘛會受著影響。
　　Sng-hōo ē tsō-sîng lông-tsok-bu̍t ê sún-hāi, nî-kú-gue̍h-tshim liáu-āu liân lán ê kiān-khong mā ē siū-tio̍h íng-hióng.
　　華語：酸雨會造成農作物的損害，久而久之連我們的健康也會受到影響。
248.	無底止（bô-tí-tsí）
　　例句：伊為著欲做生理，全世界逐跡都去，傱甲無底止。
　　I uī-tio̍h beh tsò-sing-lí, tsuân sè-kài ta̍k jiah to khì, tsông kah bô-tí-tsí.
　　華語：他為了要做生意，全世界到處去，無止境的跑。
249.	會見眾（ē-kìnn-tsìng）
　　例句：欲去予人請，你穿甲彼領破一空的褲，敢會見眾得？
　　Beh khì hōo lâng tshiánn, lí tshīng kah hit niá phuà tsi̍t khang ê khòo, kám ē-kìnn-tsìng--tit?
　　華語：要讓人請客，你穿那件破一個洞的褲子，像樣嗎？
250.	囡仔伴（gín-á-phuānn）
　　例句：伊是我的囡仔伴，我捌伊捌甲有賰矣。
　　I sī guá ê gín-á-phuānn, guá bat i bat kah ū-tshun--ah.
　　華語：他是我的童年玩伴，我跟他熟得很。
251.	合該然（ha̍p-kai-jiân）
　　例句：人阿姑有紮等路來，咱合該然嘛著攢寡伴手予伊紮轉去。
　　Lâng a-koo ū tsah tán-lōo lâi, lán ha̍p-kai-jiân mā tio̍h tshuân kuá phuānn-tshiú hōo i tsah--tńg-khì.
　　華語：人家姑姑帶了禮物來，我們理當也準備些伴手禮讓他帶回去。
252.	好頭喙（hó-thâu-tshuì）
　　例句：阿明誠好頭喙，人閣真好生張，較加人緣嘛好。
　　A-bîng tsiânn hó-thâu-tshuì, lâng koh tsin hó senn-tiunn, khah-ke lâng-iân mā hó.
　　華語：小明很善於招呼人，外型、體格又好，難怪人緣會好。
253.	牽磕（khan-kha̍p）
　　例句：這兩件代誌無牽磕，你毋通濫濫做一伙。
　　Tsit nn̄g kiānn tāi-tsì bô khan-kha̍p, lí m̄-thang lām-lām tsò-tsi̍t-hué.
　　華語：這兩件事情並無牽連，你不要混為一談。
254.	牽闔（khan-kha̍h）
　　例句：伊不時都揣空揣縫欲參人輸贏，你閃較遠咧較袂予伊牽闔著。
　　I put-sî to tshuē-khang-tshuē-phāng beh tsham lâng su-iânn, lí siám khah hn̄g--leh khah bē hōo i khan-kha̍h--tio̍h.
　　華語：他時常想盡辦法與人爭勝，你離他遠些才不會受他牽連。
255.	筋肉（kin-bah）
　　例句：伊定定咧運動，所以筋肉加真結實，人誠粗勇。
　　I tiānn-tiānn teh ūn-tōng, sóo-í kin-bah ke tsin kiat-si̍t, lâng tsiânn tshoo-ióng.
　　華語：他常運動，所以肌肉非常結實，人很健壯。
256.	斧頭銎（póo-thâu-khing）
　　例句：伊用斧頭銎共柴箱的鎖頭摃歹，才通共內底的物件提出來。
　　I iōng póo-thâu-khing kā tshâ-siunn ê só-thâu kòng pháinn, tsiah thang kā lāi-té ê mi̍h-kiānn the̍h--tshut-lâi.
　　華語：他用斧頭背把木箱子的鎖頭敲壞，才能把裡面的東西拿出來。
257.	相倚傍（sio-uá-pn̄g）
　　例句：咱逐家隨人出寡本錢，相倚傍來做生理。
　　Lán ta̍k-ke suî-lâng tshut kuá pún-tsînn, sio-uá-pn̄g lâi tsò-sing-lí.
　　華語：我們大家每人出點資本，互相倚傍來做生意。
258.	草踏（tsháu-ta̍h）
　　例句：法律著愛替守法的人主持公道，好人哪會使白白予歹人草踏去？
　　Huat-lu̍t tio̍h-ài thè siú-huat ê lâng tsú-tshî kong-tō, hó-lâng ná ē-sái pe̍h-pe̍h hōo pháinn-lâng tsháu-ta̍h--khì?
　　華語：法律應為守法的人主持公道，好人怎能平白地受壞人蹧蹋？
259.	青筋（tshenn-kin）
　　例句：人較有歲了後，皮膚會變較薄，跤腿的青筋攏看現現。
　　Lâng khah ū-huè liáu-āu, phuê-hu ē piàn khah po̍h, kha-thuí ê tshenn-kin lóng khuànn-hiān-hiān.
　　華語：人上了年紀後，皮膚會變得較薄，腿上的青筋清楚可見。
260.	精英（tsing-ing）
　　例句：我最近較捷咧運動，營養嘛加減有咧顧，人加真精英。
　　Guá tsuè-kīn khah tsia̍p teh ūn-tōng, îng-ióng mā ke-kiám ū teh kòo, lâng ke tsin tsing-ing.
　　華語：我最近比較常運動，也多少注重營養，人變得較有元氣。
261.	對千（tuì-tshian）
　　例句：破柴著對千對中央破，若無檢采柴箍會彈出去。
　　Phuà-tshâ tio̍h tuì-tshian uì tiong-ng phuà, nā-bô kiám-tshái tshâ-khoo ē tuānn--tshut-khì.
　　華語：劈柴要瞄準從中央剖開，不然木頭可能會彈出去。
262.	話關（uē-kuan）
　　例句：伊真𠢕看面色聽話意，若看著對方面捋落來，就隨知影愛轉話關，袂去得失人。
　　I tsin gâu khuànn bīn-sik thiann uē-ì, nā khuànn-tio̍h tuì-hong bīn lua̍h--lo̍h-lâi, tō suî tsai-iánn ài tńg uē-kuan, bē khì tik-sit--lâng.
　　華語：他很懂得察言觀色，若是看到對方拉下臉，就馬上知道要改變話題，不會得罪別人。
263.	暗殕（àm-phú）
　　例句：逐工天色都猶暗殕暗殕，伊就愛坐頭幫車去學校讀冊。
　　Ta̍k-kang thinn-sik to iáu àm-phú-àm-phú, i tō ài tsē thâu-pang-tshia khì ha̍k-hāu tha̍k-tsheh.
　　華語：每天天色都還灰濛濛，他就要搭首班車去學校上學。
264.	肉燥（bah-sò）
　　例句：阮阿媽見若滷滷卵，攏會佮肉燥做伙炕。
　　Guán a-má kiàn-nā lóo lóo-nn̄g, lóng ē kah bah-sò tsò-hué khòng.
　　華語：我奶奶每次滷滷蛋，都會和肉燥一起用慢火燉煮。
265.	梨仔瓜（lâi-á-kue）
　　例句：熱人的時食一粒仔芳甜的梨仔瓜，毋但止喙焦閣助消化。
　　Jua̍h--lâng ê sî tsia̍h tsi̍t-lia̍p-á phang-tinn ê lâi-á-kue, m̄-nā tsí tshuì-ta koh tsōo siau-huà.
　　華語：夏天時吃一顆香甜的香瓜，不但止渴還促進消化。
266.	焦蔫（ta-lian）
　　例句：久無落雨，門口埕彼欉桂花煞家己焦蔫去。
　　Kú bô lo̍h-hōo, mn̂g-kháu-tiânn hit tsâng kuì-hue suah ka-kī ta-lian--khì.
　　華語：太久沒下雨，前庭那棵桂花竟然自己枯萎了。
267.	幼工（iù-kang）
　　例句：若欲共窗仔子刻甲有花有草，著愛倩會曉幼工的木匠來創才會媠。
　　Nā beh kā thang-á-tsí khik kah ū hue ū tsháu, tio̍h-ài tshiànn ē-hiáu iù-kang ê ba̍k-tshiūnn lâi tshòng tsiah ē suí.
　　華語：想把窗櫺雕成有花有草的圖案，必須聘請會細工的木匠來做才會漂亮。
268.	跤肚仁（kha-tóo-jîn）
　　例句：常在運動的人跤肚仁會較結實。
　　Tshiâng-tsāi ūn-tōng ê lâng kha-tóo-jîn ē khah kiat-si̍t.
　　華語：時常運動的人小腿肌會比較結實。
269.	氣絲仔（khuì-si-á）
　　例句：伊病甲賰一屑仔氣絲仔爾爾。
　　I pēnn kah tshun tsi̍t-sut-á khuì-si-á niā-niā.
　　華語：他病得只剩下一些些微弱的氣息而已。
270.	顧更（kòo-kenn/kòo-kinn）
　　例句：阮老爸咧做義警，倚年的前後一月日常在愛佇阮這里遮鬥顧更。
　　Guán lāu-pē teh tsò gī-kíng, uá-nî ê tsîng-āu tsi̍t gue̍h-ji̍t tshiâng-tsāi ài tī guán tsit lí tsia tàu kòo-kenn.
　　華語：我父親做義警，年節前後一個月常常要在我們這一里幫忙夜間巡守。
271.	枯焦（koo-ta）
　　例句：幾若個月無落雨，山邊的花草攏枯焦去。
　　Kuí-nā kò gue̍h bô lo̍h-hōo, suann-pinn ê hue-tsháu lóng koo-ta--khì.
　　華語：好幾個月沒下雨，山邊的花花草草都枯槁了。
272.	古早味（kóo-tsá-bī）
　　例句：若欲買較有古早味的物件抑是四秀仔，去舊街仔揣上對路。
　　Nā beh bé khah ū kóo-tsá-bī ê mi̍h-kiānn ia̍h-sī sì-siù-á, khì kū-ke-á tshuē siōng tuì-lōo.
　　華語：如果要買一些較有懷舊氣息的東西或零食，去老街找最適合。
273.	媽祖生（Má-tsóo-senn）
　　例句：阿媽逐冬攏會佇媽祖生的時綴人去進香。
　　A-má ta̍k-tang lóng ē tī Má-tsóo-senn ê sî tuè lâng khì tsìn-hiunn.
　　華語：奶奶每年都會在媽祖誕辰的時候跟團去進香。
274.	補眠（póo-bîn）
　　例句：前幾工為著考試睏無飽，今仔日著愛補眠。
　　Tsîng kuí kang uī-tio̍h khó-tshì khùn bô pá, kin-á-ji̍t tio̍h-ài póo-bîn.
　　華語：前幾天為了考試而睡眠不足，今天需要補充睡眠。
275.	新娘桌（sin-niû-toh）
　　例句：母舅坐大位，所以著愛坐新娘桌。
　　Bú-kū tsē tuā-uī, sóo-í tio̍h-ài tsē sin-niû-toh.
　　華語：舅舅坐主位，所以要坐在婚宴的主桌。
276.	酸微（sng-bui）
　　例句：較早阮阿媽激的梅仔酒啉著酸微、芳閣好落喉，予我到今猶足數念。
　　Khah-tsá guán a-má kik ê muê-á-tsiú lim tio̍h sng-bui, phang koh hó lo̍h-âu, hōo guá kàu-tann iáu tsiok siàu-liām.
　　華語：以前我奶奶釀的梅子酒喝起來略有酸味、芳香又好入口，令我到現在還很懷念。
277.	銅仙（tâng-sián）
　　例句：阮阿公誠愛抾古早錢，阮厝裡猶揣會著真濟銅仙。
　　Guán a-kong tsiânn ài khioh kóo-tsá tsînn, guán tshù--lí iáu tshuē ē tio̍h tsin tsē tâng-sián.
　　華語：我爺爺很喜歡收集古代的貨幣，我家現在還找得到很多以前的銅板。
278.	倒勼（tò-kiu）
　　例句：膨紗衫過洗了後，加減會倒勼寡。
　　Phòng-se-sann kuè sé liáu-āu, ke-kiám ē tò-kiu--kuá.
　　華語：毛線衣洗過以後，多少會縮水一些。
279.	有法度（ū-huat-tōo）
　　例句：這項工課你敢有法度佇一點鐘內共做予好勢咧？
　　Tsit hāng khang-khuè lí kám ū-huat-tōo tī tsi̍t tiám-tsing lāi kā tsò hōo hó-sè--leh?
　　華語：這件事情你有辦法在一小時內做好嗎？
280.	案內（àn-nāi）
　　例句：人客到位，咱愛好好仔共案內，才袂失禮。
　　Lâng-kheh kàu-uī, lán ài hó-hó-á kā àn-nāi, tsiah bē sit-lé.
　　華語：客人到了，我們要好好招待，才不會失禮。
281.	廟口（biō-kháu）
　　例句：廟口的榕樹跤不時都有一寡人佇遐泡茶、開講。
　　Biō-kháu ê tshîng-tshiū-kha put-sî to ū tsi̍t-kuá lâng tī hia phàu tê, khai-káng.
　　華語：廟口的榕樹下經常都有一些人在那裡泡茶、聊天。
282.	無定（bô-tiānn）
　　例句：這站仔山頭攏烏陰烏陰，無定明仔早起會變天。
　　Tsit-tsām-á suann-thâu lóng oo-im-oo-im, bô-tiānn bîn-á-tsá-khí ē piàn-thinn.
　　華語：這陣子山頭都烏雲密佈，說不定明天清晨就變天了。
283.	現時（hiān-sî）
　　例句：現時時機䆀䆀，你若欲佮人學做生理著愛較綿精咧。
　　Hiān-sî sî-ki bái-bái, lí nā beh kah lâng o̍h tsò-sing-lí tio̍h-ài khah mî-tsinn--leh.
　　華語：現在時機不太好，你如果要跟人學如何經商，得要努力一點。
284.	屈勢（khut-sè）
　　例句：看阿義拍拳頭的屈勢，就知影伊的工夫底蒂有偌深。
　　Khuànn A-gī phah kûn-thâu ê khut-sè, tō tsai-iánn i ê kang-hu té-tì ū guā tshim.
　　華語：看阿義打拳的姿勢，就知道他的功夫底子有多深。
285.	破爿（phuà-pîng）
　　例句：西瓜傷大粒就破爿賣，銷路顛倒好。
　　Si-kue siunn tuā lia̍p tō phuà-pîng bē, siau-lōo tian-tò hó.
　　華語：西瓜太大顆就切成兩半來賣，銷路反而更好。
286.	臺票（Tâi-phiò）
　　例句：你月底欲去美國𨑨迌，愛會記得去銀行共臺票換做美金喔！
　　Lí gue̍h-té beh khì Bí-kok tshit-thô, ài ē-kì-tit khì gîn-hâng kā Tâi-phiò uānn-tsò Bí-kim--ooh!
　　華語：你月底要去美國旅遊，要記得去銀行將新臺幣換成美金喔！
287.	顛倒頭（tian-tò-thâu）
　　例句：搬遮的箱仔愛注意方向，毋通囥顛倒頭去。
　　Puann tsia-ê siunn-á ài tsù-ì hong-hiòng, m̄-thang khǹg tian-tò-thâu--khì.
　　華語：搬這些箱子要注意方向，別放顛倒了。
288.	吊䘥仔（tiàu-kah-á）
　　例句：阿公見若熱人，攏穿吊䘥仔四界去行踏，講按呢較涼、較爽快。
　　A-kong kiàn-nā jua̍h--lâng, lóng tshīng tiàu-kah-á sì-kè khì kiânn-ta̍h, kóng án-ne khah liâng, khah sóng-khuài.
　　華語：爺爺每當夏天，就穿汗衫到處去走動，說這樣比較涼爽。
289.	著力（tio̍h-la̍t）
　　例句：搬重的物件誠著力，有歲的人毋通搬。
　　Puann tāng ê mi̍h-kiānn tsiânn tio̍h-la̍t, ū-huè ê lâng m̄-thang puann.
　　華語：搬重的東西很費力，年長的人不要搬。
290.	欲死盪幌（beh-sí-tōng-hàinn）
　　例句：伊自頂月日失戀到今，袂輸有體無魂按呢欲死盪幌，予人看著真毋甘。
　　I tsū tíng gue̍h-ji̍t sit-luân kàu-tann, bē-su ū-thé-bô-hûn án-ne beh-sí-tōng-hàinn, hōo lâng khuànn tio̍h tsin m̄-kam.
　　華語：他從上個月失戀以後，整天像遊魂一樣要死不活，讓人看了很心疼。
291.	棺柴枋（kuann-tshâ-pang）
　　例句：架佇圳溝頂彼塊長株形的棺柴枋，暫時做橋枋。
　　Khuè tī tsùn-kau-tíng hit tè tn̂g-tu-hîng ê kuann-tshâ-pang, tsiām-sî tsò kiô-pang.
　　華語：那塊橫跨水圳長條形的棺材板，暫時當橋板。
292.	落名（lo̍h-miâ）
　　例句：這篇文章無落名，毋知影作者是啥人？
　　Tsit phinn bûn-tsiong bô lo̍h-miâ, m̄ tsai-iánn tsok-tsiá sī siánn-lâng?
　　華語：這篇文章沒署名，不曉得作者是誰？
293.	麻穎（muâ-ínn）
　　例句：番薯麻穎湯氣味讚閣滋養，毋過欲做甲會好食是足厚工的。
　　Han-tsî muâ-ínn-thng khì-bī tsán koh tsu-ióng, m̄-koh beh tsò kah ē hó-tsia̍h sī tsiok kāu-kang--ê.
　　華語：地瓜麻薏湯味美又營養，不過要煮到很好吃是很費工夫的。
294.	擘腹（peh-pak）
　　例句：濟囝濟擘腹。
　　Tsē kiánn tsē peh-pak.
　　華語：小孩多煩惱也多。
295.	平波波（pênn-pho-pho）
　　例句：山跤規大片攏是平波波的田洋。
　　Suann-kha kui tuā phiàn lóng sī pênn-pho-pho ê tshân-iûnn.
　　華語：山腳下一大片都是種稻米的平原。
296.	壁角（piah-kak）
　　例句：壁角較會卡垃儳，摒掃的時陣著愛斟酌。
　　Piah-kak khah ē kha̍h lâ-sâm, piànn-sàu ê sî-tsūn tio̍h-ài tsim-tsiok.
　　華語：牆角比較容易藏汙納垢，打掃的時候要留意。
297.	變無撚（piàn-bô-lián）
　　例句：逐家攏莫插伊，伊就變無撚。
　　Ta̍k-ke lóng mài tshap--i, i tō piàn-bô-lián.
　　華語：大家都不理他，他就沒戲唱了。
298.	跋臭（pua̍h-tshàu）
　　例句：伊見擺奕牌仔若咧欲輸矣就跋臭佮人花，莫怪無人愛佮伊奕。
　　I kiàn-pái ī pâi-á nā teh-beh su--ah tō pua̍h-tshàu kah lâng hue, bo̍k-kuài bô lâng ài kah i ī.
　　華語：他每次玩牌要是快輸了就耍賴跟人搗亂，難怪沒人要跟他玩。
299.	半病仔（puàn-pēnn-á）
　　例句：你若嫁予這號半病仔，定著一世人勞碌。
　　Lí nā kè hōo tsit-lō puàn-pēnn-á, tiānn-tio̍h tsi̍t-sì-lâng lô-lo̍k.
　　華語：你如果嫁給這種不中用的傢伙，肯定一輩子辛苦勞累。
300.	肉燥飯（bah-sò-pn̄g）
　　例句：我食肉燥飯上愛配白菜滷佮貢丸湯。
　　Guá tsia̍h bah-sò-pn̄g siōng ài phuè pe̍h-tshài-lóo kah kòng-uân-thng.
　　華語：我吃肉燥飯最愛搭配滷白菜跟貢丸湯。
